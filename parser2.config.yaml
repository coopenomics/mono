# Конфиг индексера @coopenomics/parser2 для локального dev-стека (docker-compose.yaml).
#
# Зачем отдельный сервис: controller с переходом на ParserClient читает события
# ТОЛЬКО из стрима `ce:parser2:<chain_id>:events`. Старый cooparser (components/parser)
# пишет в стрим `notifications` и остаётся в стеке не как транспорт, а ради
# explorer-API на :4000 — из него controller тянет историю действий
# (SIMPLE_EXPLORER_API в agenda/document-аггрегаторах). Поэтому парсера в стеке два.
#
# Хосты — имена сервисов из docker-compose.yaml.

ship:
  # state_history_plugin ноды: порт 8070 внутри сети compose (наружу проброшен
  # как NODE_HISTORY_PORT). Тот же адрес, что у components/parser/.env → SHIP.
  url: ws://node:8070
  timeoutMs: 15000

chain:
  # Chain API нужен для abiFallback: rpc-current — если ABI контракта нет
  # в истории Redis, парсер добирает текущую версию через /v1/chain/get_abi.
  url: http://node:8888

redis:
  # dev-redis поднят без requirepass, поэтому URL без пароля.
  # На проде пароль подставляется через ${REDIS_PASSWORD} — хардкод секрета
  # парсер отвергает на старте (ConfigSecurityError).
  url: redis://monoredis:6379

abiFallback: rpc-current

start:
  # Локальный стенд поднимается с чистой цепи и живёт сотни блоков, поэтому
  # читаем её с начала — иначе после reboot узел не увидит boot-события.
  # На проде эта настройка не ставится: там умолчание `head`, а история
  # исчисляется десятками миллионов блоков и уже лежит в базе узла.
  from: first

publish:
  # Список повторяет `subscribedContracts` из components/parser/src/config.ts —
  # тот же набор, что парсер1 писал в стрим `notifications`. Без него в стрим
  # уходит вся цепь: `eosio::onblock` и дельты `eosio::global`/`eosio::emission`
  # на каждом блоке, которые controller разбирает и выбрасывает как «wrong coopname».
  #
  # Добавляя контракт в стек, вписывать его сюда обязательно: не перечисленный
  # контракт не попадёт в стрим, и его сущности молча перестанут синхронизироваться.
  contracts:
    - draft
    - meet
    - soviet
    - branch
    - registrator
    - eosio.token
    - capital
    - wallet
    - ledger
    - ledger2
    - marketplace
    - expense

xtrim:
  # Обрезка стрима по самому старому неподтверждённому pending всех групп.
  # При пустом pending парсер не режет вовсе — непрочитанное потерять нельзя.
  enabled: true
  intervalMs: 60000

backpressure:
  # Пауза чтения SHiP, когда backlog стрима упирается в highWater: защищает
  # Redis от неограниченного роста на репарсинге.
  enabled: true
  highWater: 100000
  lowWater: 50000
  pollMs: 200

logger:
  level: info
  # pretty — только для разработки: человекочитаемый вывод в docker logs.
  pretty: true

health:
  enabled: true
  port: 8081

metrics:
  enabled: true
  port: 9090
