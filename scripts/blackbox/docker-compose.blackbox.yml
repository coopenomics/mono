# Надстройка стенда для раннера CI (внешний слой тестов, C28-80).
# Подключается через COMPOSE_FILE в .github/workflows/blackbox.yaml.
#
# Код монтируется с хоста, а на раннере его владелец — пользователь раннера,
# не uid 1000 dev-машины: под чужим uid контейнер не прочитал бы секреты и не
# смог бы писать логи. Контроллер стартует из собранного dist — ts-node
# типизировал бы проект заново при каждом подъёме.
services:
  coopback:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: pnpm --filter @coopenomics/controller run start
  parser2:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # MinIO больше не отдаёт образы ни на Docker Hub, ни (с 24.09.2026) на
  # quay.io: dev-машины берут тег из локального кеша, чистый раннер получает
  # «unauthorized». Публично остался образ Chainguard (только latest). Он без
  # оболочки и curl и работает не от root: проверка здоровья compose снята,
  # готовность проверяет scripts/blackbox/stack.sh с хоста по порту.
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    healthcheck:
      disable: true
