# Надстройка стенда для раннера CI (внешний слой тестов, C28-80).
# Подключается через COMPOSE_FILE в .github/workflows/blackbox.yaml.
#
# Код монтируется с хоста, а на раннере его владелец — пользователь раннера,
# не uid 1000 dev-машины: под чужим uid контейнер не прочитал бы секреты и не
# смог бы писать логи. Контроллер стартует из собранного dist — ts-node
# типизировал бы проект заново при каждом подъёме.
services:
  coopback:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: pnpm --filter @coopenomics/controller run start
  parser2:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # Журнал запросов к базе: после прогона по нему видно, какие таблицы внешний
  # слой читал и писал (scripts/blackbox/db-coverage.mjs) — карта готовности
  # к уходу с TypeORM (C28-81). На dev-стендах не включается.
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=20000
  # Перехватчик почты: письма контроллера (коды подтверждения, ссылки
  # восстановления) внешний слой читает через API Mailpit, как пайщик читает
  # свою почту, а не из журнала контроллера. На dev-стендах Mailpit свой.
  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:8025:8025"

