feature: edubridge.contract
title: Образовательный мост — контракт edubridge, документы 3000–3011, проводки

# E3 (задача 7DD-4). Конвертация паевого в членский по заявлению (o.edu.conv,
# зеркало marketplace::convert), подписки (opensub/extendsub/expiresub — только
# ключом кооператива, запись живёт в RAM пока активна), взнос РИД
# (submitrid → решение совета → acceptrid либо returnrid; o.edu.rid Дт 04 / Кт 08 и
# o.edu.ridshr Дт 76 / Кт 80 на паевой кошелёк программы w.edu.share; в Цифровой
# Кошелёк взнос переводит wthshare). Документы 3000–3015 — рыбы.

# 02.11.2026 (99D-18): в стандартах переименованы операции учёта — название
# операции теперь действие («Внесение…», «Резервирование…», «Конвертация…»).
# Проверки не меняются: названия читает только человек, коды операций прежние.


# Правка 17.11.2026 (слово владельца): заявление по гарантийным условиям
# (warrclaim) и заявление о РИД (submitrid) публикуются в реестр документов
# один раз — повесткой совета, итог ставит решение совета. Прежде контракт
# публиковал заявление ещё и сам, сразу с итогом «решено» до решения совета.
# Движения, статусы и обратные вызовы не менялись, случаи прежние.

sources:
  contract:
    - components/contracts/cpp/edubridge/**
    - components/contracts/cpp/lib/domain/table_edubridge_*.hpp
    - components/contracts/cpp/lib/core/edubridge/**
  backend:
    - components/cooptypes/src/contracts/edubridge/**
    - components/cooptypes/src/interfaces/edubridge.ts
    - C9S/docs-factory:src/Templates/30*.ts
    - C9S/docs-factory:src/Actions/30*.ts

cases:
  - id: edu.contract.happy.01
    level: contract
    kind: happy
    scenario: Пайщик с достаточным паевым подписал заявление о конвертации; кооператив вызывает convert.
    expect: TRANSFER w.wal.share → w.edu.member на сумму, проводка o.edu.conv, документ в реестре.
    test: ~
    status: missing
  - id: edu.contract.break.01
    level: contract
    kind: break
    scenario: convert с суммой больше available на w.wal.share.
    expect: assert «Недостаточно паевых средств».
    test: ~
    status: missing
  - id: edu.contract.break.02
    level: contract
    kind: break
    scenario: convert с заявлением без подписи пайщика.
    expect: assert «Не найдена подпись от обязательного подписанта».
    test: ~
    status: missing
  - id: edu.contract.happy.02
    level: contract
    kind: happy
    scenario: opensub → extendsub → expiresub по одному sub_hash.
    expect: запись появляется, paid_until растёт, после expiresub записи нет.
    test: ~
    status: missing
  - id: edu.contract.side.01
    level: contract
    kind: side
    scenario: opensub с уже занятым sub_hash; extendsub с paid_until не больше прежнего.
    expect: оба отклонены assert'ом.
    test: ~
    status: missing
  - id: edu.contract.happy.03
    level: contract
    kind: happy
    scenario: submitrid → acceptrid с протоколом и актом, подписанным преподавателем.
    expect: Сумма с w.edu.hold переходит на w.edu.share преподавателя (o.edu.ridshr, Дт 76 / Кт 80), проводка o.edu.rid (Дт 04 / Кт 08), запись edurids стёрта, оба документа в реестре пакетом rid_hash.
    test: ~
    status: missing
  - id: edu.contract.break.03
    level: contract
    kind: break
    scenario: acceptrid с актом без подписи преподавателя.
    expect: assert подписи; средства не выпущены.
    test: ~
    status: missing
  - id: edu.contract.happy.04
    level: contract
    kind: happy
    scenario: "returnrid после отказа: материалы возвращены на доработку; holdrid с тем же hash и новым актом; submitrid заново."
    expect: "returnrid — o.edu.retrid (Дт 76 / Кт 08), запись материалов жива, акт хранения и заявление сняты, подписки и условия группы не меняются; holdrid — o.edu.hold на прежнюю сумму без записи занятия; submitrid проходит и ставит вопрос в повестку совета."
    test: ~
    status: missing
  - id: edu.contract.happy.05
    level: backend
    kind: happy
    scenario: Фабрика рендерит каждый из 12 документов 3000–3011 на exampleData.
    expect: PDF генерируется, AJV-схема проходит, registry_id совпадает с cooptypes.
    test: ~
    status: missing
  - id: edu.doc.happy.05
    level: backend
    kind: happy
    scenario: Положение о ЦПП «Образование» (3000) генерируется утверждённым текстом.
    expect: Шесть разделов на месте, условия подписки и возвратов дословны, наименование Общества и председатель подставлены.
    test: C9S/docs-factory:test/education-program.test.ts
    api: components/api-tests/src/edubridge/admin.test.ts
    status: passing
  - id: edu.doc.side.04
    level: backend
    kind: side
    scenario: В шаблоне 3000 не осталось прежней рыбы и незаполненных подстановок.
    expect: Текста рыбы нет, шаблонных скобок и «undefined» в готовом документе нет.
    test: C9S/docs-factory:test/education-program.test.ts
    api: components/api-tests/src/edubridge/admin.test.ts
    status: passing

  # 25.11.2026 (решение владельца): расчёт с преподавателем подписки участников
  # не затрагивает. refundlesson (02.11.2026) приложение больше не вызывает;
  # действие оставлено на один выпуск для прежнего приложения.
  - id: edu.contract.side.06
    level: contract
    kind: side
    scenario: "Прежнее приложение: совет отказал по взносу результатом занятия; до recallrid вызывается refundlesson с подписками группы"
    expect: "Подпискам, где занятие рассчитано, оплата занятия возвращена в резерв (часть из кошелька программы — o.edu.allot), минуты занятия не проведены, удержание выровнено; номер и минуты занятия освобождены в условиях группы; повторный вызов отклоняется; подписки, которых нет, пропускаются; следующий за ним recallrid резерв курса не освобождает — сумму освобождает закрытие подписок."
    test: ~
    status: missing
