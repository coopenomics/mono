feature: wallet.realtime
title: Кошелёк пайщика — событийное обновление остатка

# Остаток кошелька живёт в цепи; узел узнаёт об изменении из дельты таблицы
# `ledger2::userwallets` и публикует сигнал в персональный топик пайщика.
# Клиент по сигналу дочитывает остаток запросом — payload сумм не несёт.
#
# До этого карточка пайщика перечитывала кошелёк только по собственному поводу,
# и пополнение появлялось позже уведомления о приёме платежа.

#
# Правка 2026-09-23 (7DD-22): вкладка в фоне, токен истёк, сервер отказал в
# переподключении — операция подписки кошелька умерла, но считала себя живой:
# признак «сокет открыт» общий, и его подняла чужая переоткрытая подписка.
# Канал не переоткрывался, пополнение приходило опросом через 20 секунд. Хэндл
# подписки SDK получил isActive() — операция мертва после ошибки или
# завершения, чужое открытие сокета её не оживляет; каналы кошелька, узла и
# Стола заказов считают себя живыми, только пока жива их операция.
#
# Правка 2026-09-23 (7DD-22), вторая: сама подписка кошелька не открывалась ни
# разу с момента появления. Резолвер читал `user.username`, а graphql-ws клал в
# контекст соединения только `sub` — каждое открытие отклонялось 403 «Подписка
# доступна только пайщику», сигнал с дельты публиковался в пустой топик. Чинится
# на уровне соединения: ws-контекст несёт ту же учётную запись, что HTTP
# (фича auth.ws-connection), резолвер читает её как любой другой.

# Правка 24.09.2026 (C28-83): стол больше не открывает отдельную подписку
# walletEvents — кошелёк перечитывается по общей ленте изменений (chainChanges)
# с таблицами ledger2::userwallets, gateway::incomes/outcomes, soviet::agreements3,
# soviet::progwallets, soviet::programs, wallet::users (walletLive.ts). Серверный
# резолвер walletEvents и его случаи не менялись. Сняты оптимистичные патчи
# кошелька (не использовались) и отметка «недавно подписано»: подпись отвечает
# после разбора своего блока, перечитанный кошелёк уже её содержит.

sources:
  backend:
    - components/controller/src/application/wallet/services/wallet-events.service.ts
    - components/controller/src/application/wallet/dto/wallet-event.dto.ts
    - components/controller/src/application/wallet/resolvers/wallet.resolver.ts
  ui:
    - components/desktop/src/entities/Wallet/model/walletLive.ts
    - components/desktop/src/entities/System/model/nodeSyncSubscription.ts
    - components/desktop/src/widgets/Marketplace/OnsiteSignatureGate/model/marketplaceEventsSubscription.ts
    - components/sdk/src/utils/wsSubscription.ts

cases:
  - id: wallet.realtime.happy.01
    level: backend
    kind: happy
    scenario: >
      Пришла дельта таблицы кошельков своего кооператива с именем пайщика.
    expect: >
      сигнал уходит в персональный топик пайщика и несёт только адресные поля
      (кооператив, пайщик, имя кошелька)
    test: components/controller/tests/unit/wallet/wallet-events.service.test.ts
    status: passing

  - id: wallet.realtime.side.01
    level: backend
    kind: side
    scenario: Сумм в сигнале нет.
    expect: >
      payload не содержит остатка и блокировки — клиент дочитывает
      авторитетное состояние запросом, иначе две дороги к одному числу разойдутся
    test: components/controller/tests/unit/wallet/wallet-events.service.test.ts
    status: passing

  - id: wallet.realtime.side.02
    level: backend
    kind: side
    scenario: Дельта пришла по чужому кооперативу.
    expect: сигнал не публикуется
    test: components/controller/tests/unit/wallet/wallet-events.service.test.ts
    status: passing

  - id: wallet.realtime.side.03
    level: backend
    kind: side
    scenario: Строка кошелька снята (present = false).
    expect: >
      сигнал не публикуется — остаток нулевой и его покажет обычная дочитка,
      а `value` у снятой строки пуст
    test: components/controller/tests/unit/wallet/wallet-events.service.test.ts
    status: passing

  - id: wallet.realtime.side.04
    level: backend
    kind: side
    scenario: В дельте нет имени пайщика.
    expect: сигнал не публикуется — адресовать его некому
    test: components/controller/tests/unit/wallet/wallet-events.service.test.ts
    status: passing

  - id: wallet.realtime.break.01
    level: backend
    kind: break
    scenario: >
      Подписку открывает соединение без пайщика в токене либо с чужим
      кооперативом в аргументе.
    expect: >
      отказ по праву; топик выводится из токена соединения, клиент выбрать его
      не может
    decision_needed: false
    test: components/controller/tests/unit/wallet/wallet-events.resolver.test.ts
    status: passing

  - id: wallet.realtime.happy.02
    level: backend
    kind: happy
    scenario: >
      Подписку открывает пайщик: в контексте ws-соединения его учётная запись.
    expect: подписка открывается на его персональный топик
    test: components/controller/tests/unit/wallet/wallet-events.resolver.test.ts
    status: passing

  - id: wallet.realtime.side.05
    level: ui
    kind: side
    scenario: >
      Пайщик пополняет кошелёк, сокет в это время был оборван и восстановился.
    expect: >
      на реконнекте клиент дочитывает остаток и показывает актуальную сумму —
      пропущенные за время обрыва сигналы не теряются
    status: missing

  - id: wallet.realtime.side.06
    level: ui
    kind: side
    scenario: >
      Операция подписки получила ошибку (истёк токен во вкладке в фоне — сервер
      отказал в переподключении) или завершилась; затем сокет снова открыла
      другая подписка.
    expect: >
      операция считается мёртвой и слушатель «сокет открыт» у неё молчит —
      канал сообщает, что не на связи, и ядро переоткрывает его на возврате
      вкладки, появлении сети или по страховке
    test: components/sdk/test/ws-subscription.test.ts
    status: passing

