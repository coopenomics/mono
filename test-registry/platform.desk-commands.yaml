feature: platform.desk-commands
title: Команды столов — запуск из окна столов и сочетаниями клавиш

# Приложение объявляет команды своего стола в install.ts рядом с маршрутами:
# «Создать предложение» (стол поставщика, N O, страница) и «Сканировать QR»
# (стол ПВЗ, G Q, действие сканера). Команды видны в правой колонке окна после
# страниц стола и в поиске, запускаются сочетанием с любой страницы. Задача C28-86.
#
# Права команд только серверные: команда называет право стола (requires), и
# видна, если стол переведён на гранты, право выдано и шлюз стола пройден.
# На столах без грантов (Благорост, совет, председатель, пайщик) команд нет:
# роли на фронте не знают ни договоров, ни допусков. Объявления проверяет гейт
# «команды столов» в pnpm check (scripts/check-desk-commands.mjs).
#
# Сочетание — ведущая клавиша (N — создать, G — открыть или перейти) и буква.
# Одиночные буквы остаются страницам; вторая клавиша сочетания до них не доходит.

sources:
  ui:
    - components/desktop/src/shared/lib/shortcuts/**
    - components/desktop/src/entities/Command/**
    - components/desktop/src/widgets/Desktop/CommandHost/**
    - components/desktop/src/processes/init-installed-extensions/index.ts

cases:
  - id: plat.cmd.ui.01
    level: ui
    kind: happy
    scenario: одобренный поставщик открывает окно столов на столе поставщика
    expect: после страниц стола — «Команды» с «Создать предложение» и сочетанием N O; выбор открывает страницу создания предложения
    status: missing

  - id: plat.cmd.ui.02
    level: ui
    kind: happy
    scenario: одобренный поставщик на любой странице нажимает N, затем O
    expect: открывается страница создания предложения, стол переключается на стол поставщика
    status: missing

  - id: plat.cmd.ui.03
    level: ui
    kind: side
    scenario: поставщик без одобренного допуска ищет команду и нажимает N O
    expect: команды нет ни в окне, ни по сочетанию — сервер не выдал право Offer:create:own
    status: missing

  - id: plat.cmd.ui.04
    level: ui
    kind: happy
    scenario: оператор участка нажимает G, затем Q
    expect: открывается сканер QR, как из пункта меню стола ПВЗ
    status: missing

  - id: plat.cmd.ui.05
    level: ui
    kind: side
    scenario: пайщик без стола ПВЗ нажимает G Q или ищет «сканер»
    expect: команды нет, сочетание ничего не делает
    status: missing

  - id: plat.cmd.ui.06
    level: ui
    kind: side
    scenario: сочетание набрано в поле ввода или с зажатым Ctrl или ⌘
    expect: команда не запускается, ввод не теряет буквы
    status: missing

  - id: plat.cmd.ui.07
    level: ui
    kind: break
    scenario: приложение объявило команду без права requires или повторило чужое сочетание
    expect: гейт «команды столов» в pnpm check падает; на рабочем столе команда без права не регистрируется
    status: missing
