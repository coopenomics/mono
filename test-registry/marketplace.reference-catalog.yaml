feature: marketplace.reference-catalog
title: Внешний справочник категорий и витрина кооператива

# Справочник Стола заказов — дерево категорий и типы товаров по образцу
# внешнего каталога. Заполняется вне платформы: загрузчика у узла нет, у
# хранилищ справочника нет ни одного вызова записи. По справочнику кооператив
# выбирает доступные категории. Витрина по умолчанию заводится при установке
# Стола заказов.
#
# Заведено 02.10.2026 (C28-85): серверная часть жила вне реестра.
#
# Правка 2026-10-03 (C28-87): заявки на товар, характеристики, словари и чтение
# дерева справочника (23 операции первой версии Стола заказов) убраны вместе с
# сервисами и сущностями — рабочий стол их не вызывал, обёрток в SDK не было.
# Решение владельца от 03.10.2026. Случаи про них (happy.02, happy.03,
# side.01–side.04) сняты; вопрос side.04 «довести или убрать» закрыт.
sources:
  backend:
    - components/controller/src/extensions/marketplace/application/resolvers/marketplace-vitrine.resolver.ts
    - components/controller/src/extensions/marketplace/domain/services/category-tree-domain.service.ts
    - components/controller/src/extensions/marketplace/infrastructure/adapters/category-repository.adapter.ts
    - components/controller/src/extensions/marketplace/infrastructure/adapters/type-repository.adapter.ts
    - components/controller/src/extensions/marketplace/infrastructure/adapters/marketplace-vitrine-repository.adapter.ts

cases:
  - id: mkt.ref.happy.01
    level: backend
    kind: happy
    scenario: председатель читает дерево доступных категорий на кооперативе с пустым справочником
    expect: список пуст, ошибок нет
    test: components/api-tests/src/marketplace/reference-catalog.test.ts
    status: written

  - id: mkt.ref.happy.04
    level: backend
    kind: happy
    scenario: пайщик и председатель читают витрину кооператива
    expect: витрина по умолчанию одна, заведена на кооператив при установке Стола заказов
    test: components/api-tests/src/marketplace/reference-catalog.test.ts
    status: written
