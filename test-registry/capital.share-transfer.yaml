    status: written   # прогон — CI на полигоне ci/tests
  - id: cap.share-transfer.side.07
    level: backend
    kind: side
    scenario: Председатель снял роль, пока у пайщика открыта страница и подписано заявление.
    expect: Трансляция отклоняется (KIT_INSUFFICIENT_RIGHTS), остаток в Благоросте не меняется.
    test: components/api-tests/src/capital/share-transfer.test.ts
    status: written   # прогон — внешний слой на полигоне
  - id: cap.share-transfer.contract.01
    level: contract
    kind: side
    scenario: Контракт сам сверяет остаток, подпись пайщика и членство, фиксирует начисления программы до списания; пайщик, импортированный до настройки программы, транслирует без фиксации.
    expect: Отказы с кодами CAPITAL_SHARE_*; o.cap.wthcap под хэшем заявления; заявление в реестре документов.
    status: missing   # сценарий стандарта p.cap.wthcap не заведён; путь пройден на стенде mono-ai-5
  - id: cap.share-transfer.ui.01
    level: ui
    kind: happy
    scenario: Пайщик с ролью открывает страницу, видит остаток, транслирует сумму, строка появляется в истории.
    expect: Пункт меню есть только у председателя и держателей роли; поле суммы не пускает больше остатка.
    status: missing   # сценарий harness не написан; на стенде mono-ai-5 Благорост не установлен
