feature: expenses.counterparties
title: Реестр контрагентов шасси расходов — организации и ИП для оплаты по реквизитам

# Задача 99D-35, решение владельца 11.11.2026. Контрагент — организация или
# ИП, которым кооператив платит по реквизитам. Совет (председатель и члены
# совета) ведёт всех контрагентов на столе совета; председатель участка и его
# доверенные лица видят всех и добавляют контрагентов с пометкой своего
# участка прямо из поля выбора получателя. Реквизиты проверяются правилами
# страны кооператива из пакета юрисдикций (длины, контрольные суммы ИНН, ОГРН,
# ключ счёта по БИК); заполнение по ИНН — через DaData, где расширение
# подключено. Записка шасси берёт наименование и реквизиты организации из
# карточки и сверяет их с текстом подписанной записки.

