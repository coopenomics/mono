feature: platform.schema-migrations
title: Схема базы контроллера — только миграциями

# До C28-79 таблицы 139 сущностей (ядро и девять расширений) создавал и менял
# synchronize при каждом старте. Он молча удалял колонку, которой нет в
# сущности, превращал переименование в «удалить + добавить» (потеря данных), а
# в blue-green выкатке новая версия правила общую базу, пока старая работала.
#
# Теперь схему меняют миграции TypeORM (таблица учёта schema_migrations): ядро
# держит свои в src/infrastructure/database/migrations, расширение — в своём
# каталоге migrations/database и объявляет их в записи реестра
# (databaseMigrations). Стартовые миграции идемпотентны: пустую базу создают,
# базу, которую вёл synchronize, дотягивают и ничего не удаляют. Мигратор
# данных (V-файлы) остаётся для данных и цепи; новые его файлы — с меткой
# времени в имени.
#
# Гейты: pnpm check (нет synchronize: true, у расширения с таблицами есть
# миграции) и CI-шаг pnpm schema:check (база из миграций = сущности).

sources:
  backend:
    - components/controller/src/infrastructure/database/schema/idempotent-ddl.ts
    - components/controller/src/infrastructure/database/schema/schema-migrations.ts
    - components/controller/src/infrastructure/auth-v2/coop-domain-schema.ts
    - components/controller/src/infrastructure/auth-v2/coop-domain-migrations/*.ts
    - components/controller/src/infrastructure/database/kysely/kysely.provider.ts
    - components/controller/src/infrastructure/database/kysely/data-source.options.ts
    - components/controller/src/infrastructure/database/migrations/*.ts
    - components/controller/src/migrator/database-migrations.ts
    - components/controller/src/migrator/fresh-node-migrations.ts
    - components/controller/src/migrator/migration-filename.ts
    - components/controller/src/migrator/migrationManager.ts
    - components/controller/scripts/schema-*.ts
    - components/extension-kit/src/registry/installed-database-migrations.ts
    - scripts/check-schema-migrations.mjs

cases:
  - id: platform.schema.happy.01
    level: backend
    kind: happy
    scenario: пустая база — применяются все миграции ядра и расширений
    expect: схема совпадает с сущностями (TypeORM не видит ни одного отличия)
    test: .github/workflows/test.yaml
    external: unreachable
    external_reason: "миграции схемы проверяются шагом CI на пустой базе (schema:check) и стартом стенда; через API состояние схемы не наблюдается"
    status: passing

  - id: platform.schema.side.01
    level: backend
    kind: side
    scenario: повторный прогон миграций на той же базе
    expect: ничего не применяется — учёт в schema_migrations
    test: .github/workflows/test.yaml
    external: unreachable
    external_reason: "миграции схемы проверяются шагом CI на пустой базе (schema:check) и стартом стенда; через API состояние схемы не наблюдается"
    status: passing

  - id: platform.schema.side.02
    level: backend
    kind: side
    scenario: база, которую раньше вёл synchronize, с живыми строками и отставшая на релиз
    expect: стартовые миграции добавляют недостающие таблицы и колонки, первичные ключи и данные не трогают
    test: components/controller/tests/unit/database/idempotent-ddl.test.ts
    external: unreachable
    external_reason: "база прежней версии (после synchronize, с полным индексом) на стенде не воспроизводится — стенд поднимается с пустой базы"
    status: passing

  - id: platform.schema.break.01
    level: backend
    kind: break
    scenario: перестройка первичного ключа из прохода «таблицы без колонок» попала бы на живую таблицу
    expect: не берётся в стартовую миграцию
    test: components/controller/tests/unit/database/idempotent-ddl.test.ts
    external: unreachable
    external_reason: "база прежней версии (после synchronize, с полным индексом) на стенде не воспроизводится — стенд поднимается с пустой базы"
    status: passing

  - id: platform.schema.break.02
    level: backend
    kind: break
    scenario: частичный уникальный индекс на старой базе построен полным
    expect: пересоздаётся частичным один раз, вместо службы-подпорки на каждом старте
    test: components/controller/tests/unit/database/idempotent-ddl.test.ts
    external: unreachable
    external_reason: "база прежней версии (после synchronize, с полным индексом) на стенде не воспроизводится — стенд поднимается с пустой базы"
    status: passing

  - id: platform.schema.break.03
    level: backend
    kind: break
    scenario: колонка добавлена в сущность без миграции
    expect: CI-шаг schema:check падает со списком SQL, которого не хватает
    test: .github/workflows/test.yaml
    external: unreachable
    external_reason: "миграции схемы проверяются шагом CI на пустой базе (schema:check) и стартом стенда; через API состояние схемы не наблюдается"
    status: passing

  - id: platform.schema.break.04
    level: backend
    kind: break
    scenario: "в код вернули synchronize: true"
    expect: pnpm check падает с указанием файла и строки
    test: scripts/check-schema-migrations.mjs
    external: unreachable
    external_reason: "гейт исходников (pnpm check) и порядок имён файлов миграций — свойства кода, а не поведения стенда"
    status: passing

  - id: platform.schema.side.03
    level: backend
    kind: side
    scenario: имя файла миграции данных — прежний V-формат и метка времени
    expect: прежние идут первыми по версии, новые — по метке; метка, не являющаяся датой, отклоняется
    test: components/controller/tests/unit/migrations/migration-filename.test.ts
    external: unreachable
    external_reason: "гейт исходников (pnpm check) и порядок имён файлов миграций — свойства кода, а не поведения стенда"
    status: passing

  - id: platform.schema.break.05
    level: backend
    kind: break
    scenario: ветка изменила схему сущности (колонку, индекс, новую таблицу), а миграцию владельца не завела — ни у расширения, ни у ядра
    expect: pnpm check падает и называет владельца, файлы сущностей и каталог, где ждёт миграцию; список миграций ядра (index.ts) миграцией не считается; посреди слияния dev его собственные миграции правкой ветки не считаются
    test: scripts/check-schema-migrations.mjs
    external: unreachable
    external_reason: "гейт сборки (pnpm check) над исходниками ветки, а не поведение узла: у поднятого стенда проверять нечего"
    status: passing

  # Тестнет, 20.10.2026, установка 11743: контроллер при старте (пул основной
  # базы) и мигратор применяли схему одновременно, второй падал на
  # «type capital_cycles already exists».
  - id: platform.schema.break.06
    level: backend
    kind: break
    scenario: два процесса применяют схему одной базы одновременно (старт контроллера и мигратор)
    expect: >
      схема применяется под advisory-блокировкой Postgres, список применённых
      читается уже под ней; второй процесс ждёт и не повторяет миграции первого;
      блокировка снимается и при упавшей миграции
    test: components/controller/tests/unit/database/schema-migrations.test.ts
    external: unreachable
    external_reason: "гонка двух процессов над одной базой при старте узла; через API поднятого стенда не воспроизводится"
    status: passing

  # Тестнет, 20.10.2026: таблицы CoopID (coop_domain_db) создавали миграции
  # данных, а они на узле идут только с выпуском — узел после первой установки
  # стоял без них, пароль по приглашению не задавался. Перенесены в миграции
  # схемы со своим учётом в coop_domain_db.
  - id: platform.schema.happy.02
    level: backend
    kind: happy
    scenario: чистый узел — контроллер стартует, учёта миграций данных ещё нет
    expect: все миграции схемы coop_domain_db выполняются при старте под своей блокировкой, повторный старт ничего не применяет
    test: components/controller/tests/unit/database/coop-domain-schema.test.ts
    external: unreachable
    external_reason: "схема применяется при старте узла до приёма запросов; через API стенда не наблюдается"
    status: passing

  - id: platform.schema.break.07
    level: backend
    kind: break
    scenario: узел, где таблицы CoopID уже создали прежние миграции данных (версия отмечена успешной в учёте migrations)
    expect: миграция схемы получает отметку в своём учёте и НЕ выполняется повторно; не отмеченные выполняются
    test: components/controller/tests/unit/database/coop-domain-schema.test.ts
    external: unreachable
    external_reason: "перенос учёта при старте узла; через API стенда не наблюдается"
    status: passing

  - id: platform.schema.break.08
    level: backend
    kind: break
    scenario: в каталоге миграций данных появилась миграция, которая трогает coop_domain_db
    expect: тест-сторож падает — таблицы CoopID ведут только миграции схемы, иначе новый узел снова встанет без них
    test: components/controller/tests/unit/database/coop-domain-schema.test.ts
    external: unreachable
    external_reason: "сторож над исходниками, а не поведение узла"
    status: passing

  # Тестнет, 20.10.2026: новый узел вставал без миграций данных — реестр
  # шаблонов документов пуст, бланк не собирался («Шаблон 1 не найден»).
  - id: platform.schema.happy.03
    level: backend
    kind: happy
    scenario: первый старт контроллера на новом узле — учёта миграций данных нет либо он пуст
    expect: контроллер проводит все миграции (схема, CoopID, данные) до приёма запросов, как AUTO_MIGRATE на стенде
    test: components/controller/tests/unit/database/fresh-node-migrations.test.ts
    external: unreachable
    external_reason: "первый старт узла; через API поднятого стенда не наблюдается"
    status: passing

  - id: platform.schema.break.09
    level: backend
    kind: break
    scenario: рестарт живого узла — в учёте миграций данных есть записи
    expect: миграции данных при старте НЕ проводятся — их раскатывает выпуск
    test: components/controller/tests/unit/database/fresh-node-migrations.test.ts
    external: unreachable
    external_reason: "старт узла; через API поднятого стенда не наблюдается"
    status: passing

