    api: components/api-tests/src/soviet/robot.test.ts
    status: passing

  # ── Порт для других расширений (Стол заказов, компонент 68) ──────────────

  - id: sov.rob.happy.91
    level: backend
    kind: happy
    scenario: >
      Стол заказов зовёт робота напрямую по номеру решения сразу после
      постановки повестки (`SOVIET_ROBOT_PORT.requestDecision`).
    expect: >
      запись журнала одна (та же, что от события повестки); голоса и протокол
      дожимаются повторными проходами без ожидания тика сторожа; ответ
