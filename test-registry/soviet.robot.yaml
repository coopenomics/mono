      Робот выключен, кворума делегировавших нет, председатель не делегировал
      протокол либо попытки исчерпаны.
    expect: >
      ответ «manual» / «pending» / «failed» с причиной; инициатор уходит в
      режим ожидания решения людей, у стойки не ждёт
    test: components/controller/tests/unit/soviet-robot/soviet-robot-innercoop.adapter.test.ts
    api: components/api-tests/src/marketplace/issuance-council.test.ts
    status: passing


  - id: sov.rob.side.92
