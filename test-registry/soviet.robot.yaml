      Робот только что отдал голоса, протокол собирается раньше, чем парсер
      положил их в историю действий: фабрика отвечает «голоса за решение не
      найдены». Та же ошибка не проходит за отведённые сборки; иная ошибка генерации.
    expect: >
      протокол пересобирается в том же проходе с короткой паузой и решение
      исполняется без отсрочки и без ответа «pending» инициатору; если индекс не
      догнал или ошибка другая — обычная ошибка с отсрочкой повтора
    test: components/controller/tests/unit/soviet-robot/robot-decision.service.test.ts
    external: unreachable
    external_reason: "отставание индекса действий от голосов робота — гонка внутри узла, снаружи не ставится"
    status: written   # прогон не подтверждён локально — гоняет CI
  - id: soviet.robot.side.fact-01
    level: backend
    kind: side
    scenario: "Робот голосует изнутри разбора цепи и сразу собирает протокол."
    expect: "Его транзакции не ждут разбора блока (иначе взаимная блокировка), сборка протокола повторяется только на отказе «голосов нет в индексе»."
