feature: core.account-rights
title: Ядро — права учётных записей, вступления, кошелька, платежей, участков и настроек по таблице прав

# Остаток ядра переведён с `@AuthRoles` на таблицу прав ядра (C28-87, кусок 2;
# согласовано владельцем 05.10.2026): 87 операций в 22 резолверах стоят под
# общим гардом каркаса расширений (`RightsGuard`) над `CoreRights`.
#
# Прежний гард ролей пропускал любого вошедшего, когда в запросе названо его
# имя, а совет — с любым именем. Теперь «своё» — явное право с охватом: имя в
# запросе сверяется с вошедшим (источник `owner`), запрос без имени охват
# «своё» не подтверждает. За другого на узле не действует никто; совет читает
# данные любого пайщика и собирает документы своих решений на имя заявителя.
# Кандидат и вышедший пайщик сохраняют вступление и свои данные; возврат, взнос
# и заявление на выход — права принятого пайщика.
#
# Чек платежа читают плательщик и совет: сверку ведёт гард по справочнику
# объектов ядра, проверка роли из сервиса файлов убрана. Страницы столов
# председателя и пайщика получают права из той же таблицы; страницы без входа
# называют право «для всех».

