feature: capital.program-invest
title: Паевой взнос в программу «Благорост»

# Пайщик переводит часть паевого взноса с главного кошелька на кошелёк программы
# «Благорост» (capital::createpinv). Средства сразу попадают в пул программы и
# доступны для последующего направления в проекты.
#
# Допуск к операции: пайщик подписал оферту программы «Благорост» (иначе нет
# кошелька программы) и подписал договор об участии в хозяйственной деятельности.
# Одобрение этого договора председателем здесь НЕ требуется — юридических
# ограничений на взнос в программу до одобрения нет, а требование одобрения
# заставляло пайщика ждать председателя сразу после регистрации. На прочих
# операциях (проекты, коммиты РИД, имущество) требование одобренного договора
# сохраняется.
# Мердж dev 2026-08-12 (FC1-7): в файлах фичи изменились только строки импорта —
# пагинация, базовый DTO, порт документов и тип аккаунта переехали в
# `@coopenomics/extension-kit` и `@coopenomics/innercoop`. Поведение операций,
# правила доступа и набор случаев прежние.

# Правка 2026-09-21 (C28-78): плательщик за оперативную память строк
# выбирается хелпером RamPayer::of по классу таблицы (lib/core/ram_payer.hpp),
# а не именем, переданным вручную в emplace/modify. Меняется только то, с кого
# цепь списывает память; содержимое строк, проверки и поведение действий
# прежние, набор случаев этой фичи не менялся. Правило плательщика покрыто
# отдельно — test-registry/contracts.ram-payer.yaml.

#
# Правка 2026-09-23 (7DD-22): взнос отвечает после факта из цепи (ADR-009) —
# сервис ждёт дельты ledger2::userwallets и capital::contributors пайщика из
# блока транзакции; стол перечитывает кошельки и взносы сразу, без паузы
# POST_CHAIN_REFETCH_MS и без «оптимистичного» патча баланса.

sources:
  contract:
    - components/contracts/cpp/capital/app/invests_managment/invest_in_program/invest_to_program/createpinv.cpp
    - components/contracts/cpp/capital/domain/entities/contributors.hpp
  backend:
    - components/controller/src/extensions/capital/application/services/invests-management.service.ts
    - components/controller/src/extensions/capital/application/use-cases/invests-management.interactor.ts
  ui:
    - components/desktop/extensions/capital/features/ProgramInvest/**

cases:
  # ── Уровень контракта ─────────────────────────────────────────────────────

  - id: cap.pinv.happy.01
    level: contract
    kind: happy
    scenario: >
      Пайщик с одобренным договором об участии в хозяйственной деятельности и
      подписанной офертой «Благорост» вносит в программу сумму в пределах
      доступного остатка главного кошелька.
    expect: >
      сумма списана с доступного остатка главного кошелька и зачислена на
      кошелёк программы, пул программы вырос на ту же сумму, накопительный
      показатель инвестора увеличен, заявление зафиксировано в реестре
      документов
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.side.01
    level: contract
    kind: side
    scenario: >
      Пайщик только что завершил регистрацию: договор об участии подписан им,
      но председатель его ещё не одобрил (статус ожидания). Оферта «Благорост»
      подписана.
    expect: >
      взнос проходит наравне с одобренным договором. Прежде операция
      отклонялась с «Договор УХД с пайщиком не активен», и пайщик не мог внести
      средства, пока председатель не дошёл до одобрения
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.side.02
    level: contract
    kind: side
    scenario: >
      Пайщик, импортированный с балансом и не завершивший регистрацию
      (статус импорта).
    expect: взнос проходит — статус импорта операции не мешает
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.side.03
    level: contract
    kind: side
    scenario: Пайщик вовсе не подписывал договор об участии в хозяйственной деятельности
    expect: >
      отказ «Исполнитель не подписывал договор УХД» — снятие требования
      одобрения не снимает требования самой подписи
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.side.04
    level: contract
    kind: side
    scenario: Пайщик не подписывал оферту программы «Благорост»
    expect: отказ «У пайщика нет кошелька в программе благороста»
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.side.05
    level: contract
    kind: side
    scenario: Сумма взноса превышает доступный остаток главного кошелька
    expect: отказ, ни средства, ни пул программы не двигаются
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.side.06
    level: contract
    kind: side
    scenario: Нулевая, отрицательная сумма или чужая валюта
    expect: отказ на проверке суммы
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.side.07
    level: contract
    kind: side
    scenario: >
      Требование одобренного договора об участии сохраняется на соседних
      операциях: взнос в проект, коммит РИД, внесение имущества — от пайщика с
      неодобренным договором.
    expect: >
      все три отклоняются. Послабление касается только взноса в программу
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  - id: cap.pinv.break.01
    level: contract
    kind: break
    scenario: >
      Повторная отправка того же заявления (двойной клик, повтор транзакции).
    expect: второй взнос не проходит — заявление уже зафиксировано в реестре
    test: components/boot/src/tests/capital-program-invest.test.ts
    status: passing

  # ── Уровень бэкенда ───────────────────────────────────────────────────────

  - id: cap.pinv.side.08
    level: backend
    kind: side
    scenario: >
      Подписанное заявление расходится с суммой в запросе (подменили сумму
      после генерации черновика).
    expect: отказ до обращения к цепи
    test: ~
    status: missing

  # ── Уровень UI ────────────────────────────────────────────────────────────

  - id: cap.pinv.side.09
    level: ui
    kind: side
    scenario: >
      Пайщик сразу после регистрации, до одобрения договора председателем,
      открывает рабочий стол «Благорост» и вносит взнос в программу.
    expect: >
      кнопка взноса доступна, взнос проходит, баланс кошелька программы
      обновляется без ожидания председателя
    test: ~
    status: missing

  - id: cap.pinv.ui.01
    level: ui
    kind: side
    scenario: >
      Пайщик открывает «Профиль» Благороста на телефоне (экран уже 600px), где
      кнопка «Инвестировать» вынесена в шапку и её текстовая подпись скрывается
      каноном.
    expect: >
      кнопка показывает иконку и остаётся узнаваемой, а не выглядит пустым
      прямоугольником; нажатие открывает диалог взноса
    test: ~
    status: missing

  - id: cap.pginv.sign.01
    level: contract
    kind: break
    scenario: >
      Документ подан с подписью, где рядом с именем пайщика стоит чужой ключ
      (вложение в программу).
    expect: >
      отказ «Public key does not belong to account»: подпись сверяется с ключом
      аккаунта подписанта. Транзакции шлёт кооператив, поэтому до 17.09.2026
      любой ключ рядом с чужим именем проходил как подпись этого человека.
      Механизм общий для всех контрактов (`verify_signer_keys_or_fail`) и
      проверен на самом коротком пути — заявлении о вступлении
    test: components/boot/src/tests/document-signature.test.ts
    status: passing

# 2026-09-23 (EEA-6…EEA-9): тексты интерфейса, отказов и уведомлений фичи вынесены из
# кода в словари i18n, отказы бэкенда переведены на DomainError с кодом — текст
# и HTTP-статус ответа прежние. Сценарии фичи и её проверки не менялись.
  - id: cap.pinv.side.10
    level: backend
    kind: side
    scenario: "Пайщик вносит паевой взнос в программу; стол сразу после ответа перечитывает кошельки и взносы."
    expect: "Ответ уходит после дельт ledger2::userwallets и capital::contributors этого пайщика из блока транзакции; без порта ожидания — сразу, как раньше."
    test: components/controller/tests/unit/capital/program-invest-wait.test.ts
    status: passing
  - id: cap.pinv.ui.02
    level: ui
    kind: happy
    scenario: "«Инвестировать» в программу несколько раз подряд."
    expect: "После каждого взноса баланс Благороста и главного кошелька и «Взносы по ролям → Инвестор» обновлены сразу по ответу, без паузы и без отката подменённого значения."
    test: ~
    status: missing

