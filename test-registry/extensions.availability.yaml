feature: extensions.availability
title: Доступность расширений в зависимости от сети узла

# Приложение обкатывают на тестовом контуре раньше, чем открывают в основной
# сети. Признак контура берётся из CHAIN_ID: NODE_ENV для этого не годится —
# в шаблоне docker-compose плейбука он выставлен в `production` на обоих узлах.
#
# Переключатель — поле `availability` записи реестра: EVERYWHERE /
# NON_MAINNET_ONLY / NOWHERE. Наружу (GraphQL, рабочие столы) уходит уже
# вычисленный под текущую сеть `is_available`.
#
# Переименование 2026-08-09 (FC1-3): в записи реестра поле `pluginClass`
# стало `extensionClass`, классы расширений `<X>Plugin`/`<X>PluginModule` —
# `<X>Extension`/`<X>ExtensionModule`. Только имена; поведение, набор полей
# и набор случаев не менялись. Поле внутреннее, в GraphQL не экспонируется.
sources:
  backend:
    - components/controller/src/extensions/extensions.registry.ts
    - components/controller/src/domain/extension/services/extension-listing-domain.service.ts
    - components/controller/src/application/appstore/services/extension.service.ts

cases:
  - id: ext.avail.happy.01
    level: backend
    kind: happy
    scenario: >
      Расширение помечено доступным в любой сети, узел работает в основной сети.
    expect: >
      расширение отдаётся как доступное и ставится без отказа
    test: components/controller/tests/unit/extension/extension-availability.test.ts
    status: passing

  - id: ext.avail.side.01
    level: backend
    kind: side
    scenario: >
      Расширение открыто только вне основной сети, узел работает в основной сети.
    expect: >
      расширение отдаётся как недоступное — карточка не кликабельна, рабочий
      стол расширения в состав столов не попадает
    test: components/controller/tests/unit/extension/extension-availability.test.ts
    status: passing

  - id: ext.avail.side.02
    level: backend
    kind: side
    scenario: >
      То же расширение на тестовом или локальном контуре.
    expect: >
      расширение доступно к установке
    test: components/controller/tests/unit/extension/extension-availability.test.ts
    status: passing

  - id: ext.avail.side.03
    level: backend
    kind: side
    scenario: >
      Расширение закрыто везде (ещё не открыто для установки), узел вне основной сети.
    expect: >
      расширение остаётся недоступным — тестовый контур не является послаблением
    test: components/controller/tests/unit/extension/extension-install-gate.test.ts
    status: passing

  - id: ext.avail.break.01
    level: backend
    kind: break
    scenario: >
      Пайщик вызывает мутацию установки расширения напрямую, минуя интерфейс,
      для приложения, закрытого в этой сети.
    expect: >
      сервер отказывает в установке; скрытая карточка не является защитой
    test: components/controller/tests/unit/extension/extension-install-gate.test.ts
    status: passing

  - id: ext.avail.break.02
    level: backend
    kind: break
    scenario: >
      В мутацию установки передано имя, которого нет в реестре.
    expect: >
      сервер отказывает с сообщением о ненайденном приложении
    test: components/controller/tests/unit/extension/extension-install-gate.test.ts
    status: passing

  # Открытые вопросы, требующие решения человека:
  #
  # Установленное ранее расширение, которое затем закрыли в этой сети, сейчас
  # продолжает работать (runApps смотрит только на enabled), но пропадает из
  # списка установленных и из состава рабочих столов. Останавливать ли его
  # принудительно — решения нет, поведение оставлено как есть.
  - id: ext.avail.side.04
    level: backend
    kind: side
    scenario: >
      Расширение было установлено, когда оно было открыто, после чего в реестре
      его закрыли для этой сети.
    expect: >
      уже установленное расширение продолжает работать: закрытие в реестре
      сторожит только УСТАНОВКУ. Останавливается расширение лишь при удалении.
      Решение владельца, зафиксировано 2026-08-20
    test: components/controller/tests/unit/extension/extension-install-gate.test.ts
    status: passing

  - id: ext.avail.side.05
    level: backend
    kind: side
    scenario: >
      Расширение «Карта кооператора» заведено в реестре: сеть карт обкатывается на
      тестовом контуре раньше, чем открывается в основной.
    expect: >
      запись помечена NON_MAINNET_ONLY — в основной сети расширение к установке
      закрыто, вне её доступно
    test: components/controller/tests/unit/extension/extension-availability.test.ts
    status: passing
