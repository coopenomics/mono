feature: coopid.critical-actions
title: Критические действия совета и отзыв ключа пайщика

# Критическое действие (исключение пайщика, смена ролей совета,
# принудительное восстановление доступа, смена видов проверки) начинает
# председатель, а подтверждает другой член совета: одним лицом оно не
# проводится, окно подтверждения — сутки. След действий по пайщику читает
# совет. Ключ пайщика председатель отзывает сам, с обоснованием: сессии
# пайщика закрываются, пайщик обязан восстановить доступ.
#
# Заведено 02.10.2026 (C28-85): фича жила вне реестра, таблицы
# pending_critical_actions и revoked_keys трогала только матрица прав (карта
# готовности к уходу с TypeORM, C28-81).
sources:
  backend:
    - components/controller/src/application/auth-v2/critical-actions/critical-actions.resolver.ts
    - components/controller/src/application/auth-v2/critical-actions/critical-actions.service.ts
    - components/controller/src/application/auth-v2/critical-actions/dto/**
    - components/controller/src/application/auth-v2/key-revocation/key-revocation.service.ts
    - components/controller/src/domain/auth-v2/ports/pending-critical-actions.port.ts
    - components/controller/src/domain/auth-v2/ports/key-revocation.port.ts
    - components/controller/src/infrastructure/auth-v2/postgres-pending-critical-actions.repository.ts
    - components/controller/src/infrastructure/auth-v2/postgres-key-revocation.repository.ts

cases:
  - id: coopid.crit.happy.01
    level: backend
    kind: happy
    scenario: председатель начинает критическое действие над пайщиком
    expect: действие ждёт подтверждения, первая подпись — начавшего, окно подтверждения сутки; действие видно в следе
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written

  - id: coopid.crit.happy.02
    level: backend
    kind: happy
    scenario: другой член совета подтверждает действие
    expect: действие проведено, время проведения записано; в следе — начавший, подтвердивший и хеш содержания
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written

  - id: coopid.crit.side.01
    level: backend
    kind: side
    scenario: начавший действие подтверждает его сам
    expect: отказ AUTH_V2_CRITICAL_ACTION_SELF_CONFIRM_FORBIDDEN, действие ждёт дальше
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written

  - id: coopid.crit.side.02
    level: backend
    kind: side
    scenario: подтверждение уже проведённого действия; подтверждение действия, которого нет
    expect: отказ «уже не ждёт» и «не найдено» своими кодами
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written

  - id: coopid.crit.side.03
    level: backend
    kind: side
    scenario: действие начинает член совета, пайщик, гость; пайщик подтверждает и читает след
    expect: отказ по правам (гостю — отказ входа), действие не меняется
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written

  - id: coopid.crit.side.04
    level: backend
    kind: side
    scenario: действие не подтверждено за сутки
    expect: действие истекает — при попытке подтвердить и ночным обходом; истечение записано в журнал
    test: components/controller/src/application/auth-v2/critical-actions/critical-actions.service.spec.ts
    status: written
    external: unreachable
    external_reason: окно подтверждения — сутки, время стенда через API не перемотать

  - id: coopid.crit.side.05
    level: backend
    kind: side
    scenario: проведённое критическое действие и его последствия
    expect: >
      не решено. Сейчас проведённое действие ничего не меняет: исключение
      пайщика, смена ролей и видов проверки остаются записью в следе, само
      действие никто не исполняет
    test: ~
    status: missing
    decision_needed: true

  - id: coopid.revoke.happy.01
    level: backend
    kind: happy
    scenario: председатель отзывает ключ пайщика с обоснованием
    expect: ответ «отозван», сессии пайщика закрыты, пайщик обязан восстановить доступ
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written

  - id: coopid.revoke.side.01
    level: backend
    kind: side
    scenario: ключ отзывает член совета, пайщик, гость
    expect: отказ по правам (гостю — отказ входа)
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written

  - id: coopid.revoke.side.02
    level: backend
    kind: side
    scenario: пайщик с отозванным ключом входит тем же ключом заново
    expect: >
      вход отозванным ключом отклонён (AUTH_KEY_REVOKED_RECOVERY_REQUIRED) на
      обоих контурах входа; после смены ключа отзыв закрыт — вход новым ключом
      открыт, прежний ключ не подходит
    # До 02.10.2026 отзыв только закрывал сессии и оставлял запись, признак отзыва
    # никто не читал (C28-85, находка 61).
    test: components/api-tests/src/coopid/critical-actions.test.ts
    status: written
