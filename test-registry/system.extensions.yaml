feature: system.extensions
title: Система и расширения — сводка системы, настройки кооператива, каталог и установка расширений, журнал, рабочие столы

# Таблицы ядра settings, system_status, extensions, extensions_logs и
# mutation_logs ходят через TypeORM-репозитории. Внешний тест читает сводку
# системы гостем, меняет настройку председателем (и возвращает её), ставит и
# снимает расширение без defaults («Кооперативный участок») и сверяет состав
# рабочих столов, который собирается из каталога.

# Правка 25.09.2026 (C28-80): деловые отказы (не найдено, нет прав, уже есть,
# неверный ввод) отвечают своим статусом — 404, 403, 409, 400, — а не 500
# «внутренняя ошибка»: коды и тексты прежние, меняется только статус ответа, и
# такие отказы больше не попадают в журнал ошибок сервера как поломки.

