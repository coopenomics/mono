feature: marketplace.order
title: Заказ пайщика — оформление, приём и отказ поставщиком, отмена заказчиком

# Слайс от оформления заказа по опубликованному предложению до его приёма
# или отказа поставщиком и отмены заказчиком. Подготовка отгрузки и партии
# (cycle) — соседний слайс marketplace.supply: там другая точка входа
# (поставщик собирает партию) и другие инварианты.

#
# Правка 2026-08-09 (FC1-4): сервисы слайса получают журнал через `ILoggerPort`
# из `@coopenomics/innercoop` вместо прямого `WinstonLoggerService` ядра —
# расширение не должно знать, чем именно пишется лог. Сменились только тип
# параметра и его DI-токен; поведение сервисов и набор случаев не менялись.

# Правка 2026-09-23 (C28-42): процент, который прибавляется к цене поставщика,
# в интерфейсе называется «Целевой членский взнос» вместо «Наценка» (решение
# владельца). Сменились только подписи; расчёт и случаи слайса не менялись.

# Правка 2026-09-15 (C28-42): корзина оформляется одной транзакцией — перевод
# по заявлению 1110 и заказы всех строк проходят или откатываются вместе.
# Сервисы создания заказа и заказа из остатка разделены на подготовку
# (проверки, бронь остатка), отправку и завершение; оформление собирает
# подготовленные строки в одну транзакцию через порт цепи `checkout`.

# Правка 2026-08-20 (верификация личности, 105-28): display-сервис заказов
# опционально подмешивает вердикт верификации получателя
# (withOrdererVerification → orderer_verification_passed) для лент выдачи.
# Существующие поля и набор случаев этого слайса не менялись.

# Правка 24.09.2026 (C28-83): экраны Стола заказов живут по общей ленте
# изменений (chainChanges), отдельная подписка marketplaceEvents снята вместе с
# серверным мостом и резолвером. Таблицы расширения объявлены в ленте через
# CHAIN_CHANGES_PORT (MarketplaceLiveFeedSubscriber на базе marketplace), стол
# перечитывает экран по сигналу их изменений (useLiveReload + marketLiveTables).
# Серверные сценарии и их случаи не менялись.

# Правка 2026-09-24 (C28-82): дельта создания заказа приходит раньше записи
# create-flow (транзакция ждёт свой блок, 7DD-22) и прежде терялась — заказ
# жил без членского взноса и привязки к цепи до следующего действия. Теперь
# она откладывается и применяется при записи. Заодно в базу начали писаться
# зеркала цепи accepted_cost / payout_status / markdown_cost, которых не было
# в патче репозитория. Слайс расширен синхронизацией и репозиторием заказа.

# Правка 2026-09-25 (C28-80): тело строки заказа и докладки считается тем же
# расчётом стоимости, что контракт (calcCostMinor): дробная мера по весу
# (1,5 кг) больше не роняет превью и оформление ошибкой 500. Набор случаев
# не менялся.
#
# Правка 2026-09-25 (C28-80): заказ упаковками записывается с упаковкой
# (package_id терялся в persistAfterBlock).
#
# Правка 2026-09-25 (C28-80): позиция, которую не удалось оформить, приходит
# заказчику с кодом причины, а не одним текстом: клиент отличает «кончился
# остаток» от «предложение сняли» и «товар не возят на этот пункт выдачи».

# Правка 30.10.2026 (5A8-11): шаблоны документов импортируются из пакета
# @coopenomics/docs-templates (`Registry`) вместо `Cooperative.Registry` из
# cooptypes. Поведение не менялось: тот же реестр шаблонов, другой пакет.

# Правка 31.10.2026 (99D-18): членский взнос при заказе заменён обеспечительной
# частью паевого взноса. Трансляция по заявлению 1110, обеспечительная часть,
# её возвраты и удержание при отказе остаются на счёте 80; на выдаче факт
# обеспечительной части ложится на кошелёк пайщика к списанию w.mkt.due, а
# членским взносом участка (Дт 80 / Кт 86) она становится только при списании
# по условиям ЦПП по окончании периода конца гарантийного срока (с 09.11.2026 —
# chargeperiod по строке счётчика пайщика, задача 99D-33).
# Членский кошелёк программы w.mkt.member и ожидание довнесения при
# гарантийном возврате (feepend, payretfee) сняты. Случаи слайса,
# описывавшие прежнюю модель, переписаны.

# Правка 2026-10-10 (598-61, профиль поставщика и отзывы): страница заказа заказчика получила карточку «Отзыв»: по полученному
# заказу заказчик оставляет и правит отзыв. Оформление, отмена и статусы заказа не менялись, набор случаев
# прежний. Случаи отзывов — в marketplace.reviews.

