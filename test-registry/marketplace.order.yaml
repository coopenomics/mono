      участок и период, суммы — из строки счётчика.
    expect: >
      одной транзакцией в нитке p.mkt.due с хэшем строки: o.mkt.charge на сумму
      участку + фонды + инициаторам (+ удержания), o.brn.common участку (Дт 80 / Кт 86),
      o.fnd.indiv / o.fnd.resrv / o.fnd.devel по проценту каждого фонда с остатком
      округления у последнего, o.mkt.repay инициаторам либо участку, o.mkt.retdue
      пайщику на свободный паевой; в нитке заказа списания нет; кошелёк к списанию
