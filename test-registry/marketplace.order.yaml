  # ── Коэффициент экономического участия (задачи 99D-19, 99D-20, 99D-21, 99D-33) ──
  # Документ модели — требование компонента 68 «Коэффициент экономического
  # участия». Контракты: fund (w.fnd.accum, fund::accrue), branch (резерв
  # обеспечения по получателям, потолок, предел материальной помощи),
  # marketplace (процесс p.mkt.due: счётчики kudues/kucounters, closeperiod,
  # chargeperiod, exitdue, delperiod, migratedue, setshares, setinitiator).
  #
  # Правка 09.11.2026 (99D-33): суммы для итога и списания контракт берёт из
  # своих счётчиков, узел передаёт только участок, пайщика, период и факты о
  # расходах. Списание идёт одной транзакцией на строку пайщика за период в
  # нитке p.mkt.due; действие chargedue снято. Случаи math.* и growth.*
  # (итог по пяти числам без заказов) сняты вместе с тестами: контракту суммы
  # извне больше не передать, арифметику итога держат keu.model.* (эталон) и
  # keu.cycle.* (узел поверх подставной цепи).

  - id: mkt.order.keu.01
    level: contract
    kind: happy
    scenario: >
      По окончании периода кооператив просит контракт рассчитать итог участка и
      передаёт три факта о расходах: плановые расходы, служебные записки,
      выплаченную материальную помощь. Стоимость заказов и собранную
      обеспечительную часть контракт берёт из своего счётчика участка.
    expect: >
      строка итога записана один раз, счётчик участка стёрт: расходы = планы +
      записки + резерв обеспечения − невыплаченная часть прошлого резерва; участку =
      min(собрано, расходы), дефицит = расходы − участку; фонды = (собрано − участку)
      × проценты фондов; экономия = собрано − участку − фонды делится между
      инициатором и пайщиками; три ставки сходятся по формулам документа; повтор —
      MARKETPLACE_PERIOD_EXISTS; период ещё идёт — MARKETPLACE_PERIOD_OPEN; период
      без заказов — MARKETPLACE_PERIOD_EMPTY; отрицательный факт, чужая валюта,
      период ноль — MARKETPLACE_PERIOD_AMOUNT_INVALID
    test: components/boot/src/tests/marketplace-period.test.ts
    status: written

