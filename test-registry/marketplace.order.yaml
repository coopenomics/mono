cases:

  # ── Инвестиционный этап участка (99D-27) ──────────────────────────────
  - id: mkt.order.invest.exp.01
    level: contract
    kind: happy
    scenario: >
      Председатель участка подаёт служебную записку больше остатка общего кошелька участка; у инициаторов участка есть свободные деньги.
    expect: >
      источник записки — средства инициаторов (w.mkt.ipool): выделение o.mkt.ipool под хэш записки, резерв участка вырос на сумму, общий кошелёк не тронут, шасси расходов получило пул инициаторов источником
    test: components/boot/src/tests/marketplace-invest-expense.test.ts
    status: passing

  - id: mkt.order.invest.exp.02
    level: contract
    kind: break
    scenario: >
      Записка больше и общего кошелька участка, и свободных средств инициаторов.
    expect: BRANCH_EXPENSE_NO_FUNDS, записка не создаётся
    test: components/boot/src/tests/marketplace-invest-expense.test.ts
    status: passing

  - id: mkt.order.invest.exp.03
    level: contract
    kind: happy
    scenario: >
      Записка из средств инициаторов проходит совет, оплачивается организации по реквизитам и закрывается.
    expect: >
      проводка Дт 08 / Кт 51 (o.mkt.idir); общий кошелёк участка не тронут; по закрытию оплаченное снято с выделенного, неизрасходованное уменьшилось и вошло в базу возврата паевых взносов (spentipool)
    test: components/boot/src/tests/marketplace-invest-expense.test.ts
    status: written

  - id: mkt.order.invest.aid.01
    level: contract
    kind: happy
    scenario: >
      Совет одобряет материальную помощь доверенному при пустом персональном кошельке; у инициаторов есть свободные деньги; кассир выплачивает.
    expect: >
      источник помощи — средства инициаторов, выбран и выделен при подаче заявления (резерв участка вырос до решения совета): налог Дт 08 / Кт 68 на w.sov.ndfl (o.mkt.iaidtx), на руки Дт 08 / Кт 51 (o.mkt.iaid), вся сумма заявления входит в базу возврата паевых взносов; предел резерва получателя действует как прежде
    test: components/boot/src/tests/marketplace-invest-expense.test.ts
    status: written

  - id: mkt.order.invest.aid.02
    level: contract
    kind: side
    scenario: >
      Совет отказывает в материальной помощи, которая при подаче взята из средств инициаторов.
    expect: >
      при подаче резерв участка вырос на сумму заявления; после отказа совета заявление стёрто, резерв участка вернулся к прежнему, персональный кошелёк не тронут
    test: components/boot/src/tests/marketplace-invest-expense.test.ts
    status: written

  - id: mkt.order.invest.aid.03
    level: contract
    kind: happy
    scenario: >
      Персонального кошелька доверенного хватает на заявление; затем совет отказывает.
    expect: >
      при подаче o.brn.aidreq переводит сумму с w.brn.person на w.brn.aidreq, источник заявления w.brn.aidreq, средства инициаторов не тронуты; отказ совета (o.brn.aidret) возвращает сумму на персональный кошелёк, кошелёк заявлений — к прежнему остатку
    test: components/boot/src/tests/marketplace-invest-expense.test.ts
    status: written

  - id: mkt.order.invest.aid.04
    level: contract
    kind: break
    scenario: >
      Заявление больше и персонального кошелька, и свободных средств инициаторов.
    expect: BRANCH_AID_INSUFFICIENT, заявление не создаётся
    test: components/boot/src/tests/marketplace-invest-expense.test.ts
    status: written

  - id: mkt.order.invest.01
    level: contract
    kind: break
    scenario: >
      Пайщик без договора участия вносит деньги; председатель участка подписывает договор второй раз.
    expect: >
      без договора — MARKETPLACE_INVAGR_REQUIRED; повтор договора — MARKETPLACE_INVAGR_EXISTS
    test: components/boot/src/tests/marketplace-invest.test.ts
    status: passing

  - id: mkt.order.invest.02
    level: contract
    kind: happy
    scenario: >
      Председатель участка вносит деньги в участок заявлением о трансляции паевого взноса в договор участия.
    expect: >
      с главного паевого и на кошелёк договора участия — ровно сумма; деньги в подушке пула участка, база возврата не меняется; паевой инициатора на счёте 80 не меняется
    test: components/boot/src/tests/marketplace-invest.test.ts
    status: passing

  - id: mkt.order.invest.03
    level: contract
    kind: break
    scenario: >
      Паевой взнос деньгами от пайщика без роли оператора участка, с подписью другого пайщика, больше паевого и с нулевой суммой.
    expect: >
      MARKETPLACE_INVEST_NOT_OPERATOR; отказ подписи обязательного подписанта; MARKETPLACE_INVEST_INSUFFICIENT; MARKETPLACE_INVEST_AMOUNT_INVALID
    test: components/boot/src/tests/marketplace-invest.test.ts
    status: passing

  - id: mkt.order.invest.04
    level: contract
    kind: happy
    scenario: >
      Доверенное лицо вносит имущество: заявление, одобрение председателя участка, решение совета голосами, акт вносящего — запрос одобрения председателю совета; попытка отказа председателя совета; подтверждение одобрения; попытки акта до решения и одобрения не председателем участка.
    expect: >
      подпись вносящего создаёт одобрение с обратным вызовом apprvipact; отказ в подписи акта — MARKETPLACE_IPROP_ACT_DECLINE_FORBIDDEN, одобрение остаётся; подтверждение председателем совета — имущество по цене приёма на кошелёк договора участия (o.mkt.iprop, Дт 10 / Кт 80), сразу в базе возмещения; заявление стёрто; акт до решения — MARKETPLACE_IPROP_STATUS_INVALID; одобрение не председателем участка — отказ подписи
    test: components/boot/src/tests/marketplace-invest.test.ts
    status: passing

  - id: mkt.order.invest.05
    level: contract
    kind: side
    scenario: >
      Председатель участка отклоняет заявление на имущество до передачи в совет: без причины и с причиной.
    expect: >
      без причины — MARKETPLACE_IPROP_REASON_REQUIRED; с причиной заявление стёрто, движений нет
    test: components/boot/src/tests/marketplace-invest.test.ts
    status: passing

  - id: mkt.order.invest.06
    level: contract
    kind: happy
    scenario: >
      Месяц с экономией у участка с использованным паевым взносом: прогон, списание заказа, заявление инициатора о трансляции обратно и повтор.
    expect: >
      доля инициаторов — o.mkt.repay на кошелёк возмещения участка, счётчик возврата равен эталону PeriodModel.crpsRoute; погашение 26 (o.mkt.icover) — доля денег эталона crpsRoute.cover; на главный паевой — сумма эталона crpsClaimable (и прежние начисления); строка инициатора после заявления остаётся, внесено деньгами всего (money_in) не меняется; повтор — MARKETPLACE_INVEST_NOTHING_TO_CLAIM
    test: components/boot/src/tests/marketplace-invest.test.ts
    status: written

  - id: mkt.order.invest.07
    level: contract
    kind: break
    scenario: >
      Кооператив зовёт выделение, возврат и расход пула и снятие инициатора при выходе напрямую.
    expect: >
      пул — только контракт branch, выход — только registrator: отказ авторизации
    test: components/boot/src/tests/marketplace-invest.test.ts
    status: passing

  - id: mkt.order.invest.istok.01
    level: backend
    kind: happy
    scenario: >
      Два инициатора внесли имущество 600 000 и 400 000 ₽, участок возместил 100 000 ₽; инициатор открывает «Доступно для трансляции».
    expect: >
      предпросмотр 60 000 и 40 000 ₽ — ровно эталон контракта PeriodModel.crpsReturned на тех же строках
    test: components/controller/tests/unit/marketplace/marketplace-investment.test.ts
    api: components/api-tests/src/marketplace/invest-cycle.test.ts
    status: passing

  - id: mkt.order.invest.istok.02
    level: backend
    kind: side
    scenario: >
      На кошельке договора участия лежат прежние начисления доли инициатора сверх строк паевых взносов.
    expect: остаток сверх строк прибавляется к доступному (60 000 + 5 000 ₽)
    test: components/controller/tests/unit/marketplace/marketplace-investment.test.ts
    external: unreachable
    external_reason: "прежние начисления доли инициатора на кошелёк договора участия сверх строк паевых взносов остались от модели до 99D-27; новый стенд их не создаёт, а через API их не завести"
    status: passing

  - id: mkt.order.invest.istok.03
    level: backend
    kind: side
    scenario: >
      Фаза участка: строки участка нет; паевые взносы есть без возмещения; возмещение идёт; база погашена после возмещения.
    expect: NONE, FUNDING, RETURNING с остатком 900 000 ₽, RETURNED
    test: components/controller/tests/unit/marketplace/marketplace-investment.test.ts
    api: components/api-tests/src/marketplace/invest.test.ts
    status: passing

  - id: mkt.order.invest.istok.04
    level: backend
    kind: break
    scenario: >
      Пайщик, который не председатель и не доверенное лицо участка, вносит деньги в участок.
    expect: MARKETPLACE_INVEST_NOT_OPERATOR до обращения в цепь, действие контракта не вызывается
    test: components/controller/tests/unit/marketplace/marketplace-investment.test.ts
    api: components/api-tests/src/marketplace/invest.test.ts
    status: passing

  - id: mkt.order.invest.istok.05
    level: backend
    kind: break
    scenario: >
      Пайщик без договора участия просит заявление о паевом взносе деньгами.
    expect: MARKETPLACE_INVAGR_REQUIRED, документ не формируется
    test: components/controller/tests/unit/marketplace/marketplace-investment.test.ts
    api: components/api-tests/src/marketplace/invest.test.ts
    status: passing

  - id: mkt.order.invest.istok.06
