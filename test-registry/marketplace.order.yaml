feature: marketplace.order
title: Заказ пайщика — оформление, приём и отказ поставщиком, отмена заказчиком

# Слайс от оформления заказа по опубликованному предложению до его приёма
# или отказа поставщиком и отмены заказчиком. Подготовка отгрузки и партии
# (cycle) — соседний слайс marketplace.supply: там другая точка входа
# (поставщик собирает партию) и другие инварианты.

#
# Правка 2026-08-09 (FC1-4): сервисы слайса получают журнал через `ILoggerPort`
# из `@coopenomics/innercoop` вместо прямого `WinstonLoggerService` ядра —
# расширение не должно знать, чем именно пишется лог. Сменились только тип
# параметра и его DI-токен; поведение сервисов и набор случаев не менялись.

# Правка 2026-08-20 (верификация личности, 105-28): display-сервис заказов
# опционально подмешивает вердикт верификации получателя
# (withOrdererVerification → orderer_verification_passed) для лент выдачи.
# Существующие поля и набор случаев этого слайса не менялись.

sources:
  backend:
    - components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-checkout.service.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-convert.service.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-order-cancel.service.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-order-display.service.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-order-close-cron.service.ts
  ui:
    - components/desktop/src/pages/Marketplace/Cart/**
    - components/desktop/src/pages/Marketplace/OrderConfirmation/**
    - components/desktop/src/pages/Marketplace/MyOrders/**
    - components/desktop/src/pages/Marketplace/OrdererOrderDetail/**
    - components/desktop/src/pages/Marketplace/OffererIncomingOrders/**

cases:
  # ── Прямой путь ──────────────────────────────────────────────────────────
  - id: mkt.order.happy.01
    level: ui
    kind: happy
    scenario: >
      Заказчик выбирает опубликованное предложение, указывает количество и ПВЗ получения, оформляет заказ.
    expect: заказ создан, виден в «Моих заказах» со статусом ожидания поставщика
    test: components/docs-harness/scenarios/marketplace/orderer/order-create.mjs
    status: passing

  - id: mkt.order.happy.02
    level: ui
    kind: happy
    scenario: Поставщик видит заказ во «Входящих» и принимает его
    expect: статус заказа переходит в принятый, заказчик видит изменение
    test: components/docs-harness/scenarios/marketplace/offerer/incoming-orders.mjs
    status: passing

  # ── Границы данных и статусы при оформлении ─────────────────────────────
  - id: mkt.order.side.01
    level: backend
    kind: side
    scenario: Заказ по несуществующему предложению
    expect: «Предложение не найдено», заказ не создаётся
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.02
    level: backend
    kind: side
    scenario: Заказ по предложению другого кооператива
    expect: отказ доступа «Предложение принадлежит другому кооперативу»
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.03
    level: backend
    kind: side
    scenario: >
      Заказ по предложению, снятому с публикации либо отклонённому модерацией
    expect: отказ с указанием статуса предложения, заказ не создаётся
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.04
    level: backend
    kind: side
    scenario: Количество больше доступного остатка (предложение с ограничением)
    expect: отказ с указанием доступного количества
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.05
    level: backend
    kind: side
    scenario: Количество нулевое или отрицательное
    expect: «Количество должно быть больше нуля»
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.06
    level: backend
    kind: side
    scenario: Не указан ПВЗ получения
    expect: «Не указан ПВЗ получения», заказ не создаётся
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.07
    level: backend
    kind: side
    scenario: Итоговая сумма заказа получается нулевой
    expect: отказ с требованием проверить количество и цену
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.08
    level: backend
    kind: side
    scenario: >
      Заказ упаковками: количество трактуется как число упаковок, базовое количество считается через содержимое упаковки.
    expect: >
      на цепь и в счётчики предложения уходит базовое количество, в счётчик упаковки — число упаковок;
      в заказе сохраняется упаковка; цена берётся за упаковку
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.09
    level: backend
    kind: side
    scenario: >
      Заказ по предложению без ограничения количества («без ограничения»)
    expect: проверка остатка не применяется, заказ создаётся
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  # ── Приём и отказ поставщиком ───────────────────────────────────────────
  - id: mkt.order.side.10
    level: backend
    kind: side
    scenario: Приём заказа, уже присоединённого к партии либо не активного
    expect: отказ, что заказ нельзя принять в текущем состоянии
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.spec.ts
    status: passing

  - id: mkt.order.side.11
    level: backend
    kind: side
    scenario: Отказ по заказу без указания причины
    expect: «Укажите причину отказа»
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.spec.ts
    status: passing

  - id: mkt.order.side.12
    level: backend
    kind: side
    scenario: Массовое действие поставщика с пустым списком заказов
    expect: отказ «Не выбрано ни одного заказа»
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.spec.ts
    status: passing

  - id: mkt.order.side.13
    level: backend
    kind: side
    scenario: Действие по заказу, оформленному по чужому предложению
    expect: отказ «Действие доступно только поставщику-владельцу предложения»
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.spec.ts
    status: passing

  - id: mkt.order.side.14
    level: backend
    kind: side
    scenario: >
      Массовый приём, где ни один заказ не удалось принять
    expect: отказ «Не удалось принять ни одного заказа», частичного эффекта нет
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.spec.ts
    status: passing

  # Решение заказчика (2026-08-08): массовое действие атомарно.
  - id: mkt.order.side.20
    level: backend
    kind: side
    scenario: >
      Массовый приём, где один из заказов непроходной (чужой, не найден или уже не активен)
    expect: >
      отказ до первого обращения к цепи; ни один заказ не принят, партия не создаётся
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.spec.ts
    status: passing

  - id: mkt.order.side.21
    level: backend
    kind: side
    scenario: Массовый отказ, где один из заказов непроходной
    expect: отказ до первого обращения к цепи; ни один отказ не отправлен
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-supplier-action.service.spec.ts
    status: passing
    # ── Отмена заказчиком ───────────────────────────────────────────────────
  - id: mkt.order.side.15
    level: backend
    kind: side
    scenario: Отмену заказа запрашивает не его заказчик
    expect: «Отменить заказ может только его заказчик»
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-cancel.service.spec.ts
    status: passing

  - id: mkt.order.side.16
    level: backend
    kind: side
    scenario: Отмена заказа после открытия акта выдачи
    expect: отказ с указанием, что отмена закрыта после открытия акта выдачи
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-cancel.service.spec.ts
    status: passing

  - id: mkt.order.side.17
    level: backend
    kind: side
    scenario: Отмена несуществующего заказа либо заказа чужого кооператива
    expect: «Заказ не найден» либо отказ доступа
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-cancel.service.spec.ts
    status: passing

  - id: mkt.order.side.18
    level: ui
    kind: side
    scenario: Двойная отправка формы оформления заказа (двойной клик)
    expect: создаётся один заказ, второе обращение не создаёт дубль
    test: ~
    status: missing
    # Не берётся в основную цепочку сознательно: если защита от дубля не
    # сработает, на стенде появится второй заказ, и все последующие сценарии
    # (отгрузка, приёмка, выдача, возврат, списание) поедут по нему же —
    # прогон развалится, а причина будет выглядеть как поломка интерфейса.
    # Место случая — отдельная цепочка на своём заказе либо backend-проба
    # dedup'а в пуле write-мутаций.

  - id: mkt.order.side.19
    level: ui
    kind: side
    scenario: «Мои заказы» у пайщика без единого заказа
    expect: пустое состояние с пояснением, без ошибок
    test: components/docs-harness/scenarios/marketplace/orderer/orders-empty.mjs
    status: passing

  # ── Отказ инфраструктуры ────────────────────────────────────────────────
  - id: mkt.order.break.01
    level: backend
    kind: break
    scenario: Цепь не вернула хэш транзакции при создании заказа
    expect: >
      явный отказ с предложением повторить; заказ не остаётся в полусозданном состоянии
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.happy.03
    level: ui
    kind: happy
    scenario: >
      Председатель смотрит реестр всех заказов кооператива с фильтрами по стадиям жизненного цикла.
    expect: >
      заказы видны с текущими статусами; из карточки открываются документы, операции и проводки процесса
    test: components/docs-harness/scenarios/marketplace/orderer/consolidated.mjs
    status: passing

# 2026-08-18: в файлах фичи изменилась только строка импорта — чистка отказа
# цепи (`rethrowChainError`) уехала в каркас расширений, потому что в цепь
# ходит не одно расширение. Поведение операций прежнее.

  - id: mkt.order.ui.01
    level: ui
    kind: happy
    scenario: >
      Оператор (председатель КУ) открывает историю заказов участка на столе ПВЗ
    expect: >
      список заказов участка со статусами непуст после прогона цепочки заказа;
      карточка заказа открывается по клику
    test: components/docs-harness/scenarios/marketplace/operator/orders-history.mjs
    status: passing

# 2026-09-06 (паевая модель, компонент 68): оформление без документов — паевой
# резерв ставит контракт; в «Моих заказах» новые статусы выдачи ISSUE_PENDING /
# ISSUE_AUTHORIZED / ISSUE_ACT1 и обновление по событию саги. Случаи не менялись.

# Правка 2026-09-06 (99D-4/99D-7, решение владельца вечером того же дня):
# членская часть модели остаётся для взноса кооперативного участка. Заявление
# 1110 возвращено: «прошу перевести с баланса моего Цифрового кошелька на
# баланс ЦПП «Стол заказов» N, из них членский взнос M», где M — взнос за
# вычетом остатка внутреннего членского кошелька `w.mkt.member`, N — тело
# плюс M. Членские средства от отмен и возвратов идут только на взносы
# следующих заказов, тело всегда паевое, смешанных заказов нет. Перевод M —
# отдельная транзакция `convert` до заказа. Контракт: `createorder` /
# `stockorder` без документа, требуют покрытого взноса; операции
# o.mkt.conv/convp, сторно взноса — на членский кошелёк. Раскладка таблиц
# совместима со строками членской модели (акт 1115 в прежних слотах,
# заявление и протокол — binary_extension в хвосте).

  - id: mkt.order.side.30
    level: backend
    kind: side
    scenario: >
      План по строкам корзины: членского кошелька нет, хватает на часть взноса, хватает на
      весь взнос; несколько строк; ставка взноса нулевая
    expect: >
      взнос покрывается остатком кошелька в порядке проведения строк, недостающее переводится
      в членский, тело всегда с паевого; сумма заявления — тело плюс недостающая часть взноса
    test: components/controller/tests/unit/marketplace/marketplace-convert-statement.test.ts
    status: written

  - id: mkt.order.side.31
    level: backend
    kind: side
    scenario: >
      Превью формирует заявление 1110 (тело плюс взнос за вычетом остатка кошелька); членский
      кошелёк ещё не заведён у пайщика
    expect: >
      в мете — якорь, сумма, членская часть и источник, ничего лишнего; незаведённый кошелёк
      считается пустым
    test: components/controller/tests/unit/marketplace/marketplace-convert-statement.test.ts
    status: written

  - id: mkt.order.side.32
    level: backend
    kind: side
    scenario: >
      Оформление с заявлением 1110, которого нет, которое подписано на другое оформление,
      с разошедшейся недостающей суммой или членской частью (баланс кошелька изменился
      с превью), либо чужой подписью; и полностью сошедшееся
    expect: >
      отказ «обновите оформление» до отправки в цепь, с обеими суммами при расхождении;
      сошедшееся заявление превращается в document2 для действия convert
    test: components/controller/tests/unit/marketplace/marketplace-convert-statement.test.ts
    status: written

  - id: mkt.order.side.33
    level: contract
    kind: side
    scenario: >
      createorder при членском кошельке, которого не хватает на взнос участка (заявление
      о переводе не подано)
    expect: >
      контракт отвергает с подсказкой сначала подать заявление; движений по средствам нет
    test: components/boot/src/tests/marketplace-convert.test.ts
    status: written

  - id: mkt.order.side.34
    level: contract
    kind: happy
    scenario: >
      Членского кошелька на взнос не хватает: превью приносит заявление 1110 на тело плюс
      недостающую часть взноса, пайщица подписывает, оформление проводит перевод и заказ
    expect: >
      членская часть заявления — взнос за вычетом остатка кошелька, текст — только слова
      владельца; o.mkt.conv ровно на членскую часть первой операцией нитки заказа (отдельной
      нитки по хешу заявления нет); там же o.mkt.fee на весь взнос с членского кошелька и
      o.mkt.lock на всё тело паевым резервом
    test: components/boot/src/tests/marketplace-convert.test.ts
    status: written

  - id: mkt.order.side.35
    level: backend
    kind: side
    scenario: >
      Остаток по упаковкам: заказчик просит пять бутылок по 0,5 л, свободных бутылок этого
      объёма три, хотя литров у предложения хватает
    expect: >
      отказ «Доступно только 3 упак.» до счётчиков и до цепи; заказ по мере по-прежнему
      сверяется с остатком в базовых единицах
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-create.service.spec.ts
    status: passing

  - id: mkt.order.side.36
    level: backend
    kind: side
    scenario: >
      Помощники остатка по упаковкам: сумма по упаковкам в базовых единицах, нехватка по
      упаковке и по мере, упаковка заказа для счётчиков, снятие позиций склада с витрины остатка
    expect: >
      9,5 л из 3 × 0,5 и 8 × 1; нехватка считается по упаковке; заказ без упаковки до счётчика
      упаковки не доходит; снятие уменьшает упаковку по содержимому не ниже нуля
    test: components/controller/src/extensions/marketplace/application/shared/packaging.util.spec.ts
    status: passing

  - id: mkt.order.side.37
    level: backend
    kind: side
    scenario: >
      Отказ заказчика после приёмки имущества на склад кооператива (статус «принято кооперативом»):
      принято всё; принята часть; заказ до склада не дошёл; склад недоступен
    expect: >
      принятое кооперативом выбывает из предложения поставщика — оно уже оплачено и продаётся
      кооперативом; в свободное возвращается только непоставленное; принятое имущество переходит в
      обезличенный остаток КУ — ждать его больше некому. До склада заказ не дошёл или склад
      недоступен — возвращается весь объём и склад не трогается, как при обычной отмене
    test: components/controller/src/extensions/marketplace/application/services/marketplace-order-cancel.service.spec.ts
    status: passing

  - id: mkt.order.happy.04
    level: contract
    kind: happy
    scenario: >
      Пайщица оформляет заказ: если членского кошелька не хватает, превью отдаёт заявление
      1110 на недостающую сумму, она подписывает его один раз, перевод и заказ проходят
    expect: >
      перевод ровно на членскую часть (w.wal.share → w.mkt.member) идёт первой операцией
      нитки заказа — тип процесса один, значит и идентификатор один; там же взнос с членского
      кошелька (o.mkt.fee) и тело паевым резервом (o.mkt.lock), других проводок кроме
      Дт 80 / Кт 86 перевода нет; при недовыдаче излишек взноса возвращается на
      w.mkt.member, невыданное тело — на свободный паевой
    test: components/boot/src/tests/marketplace-money.test.ts
    status: written
