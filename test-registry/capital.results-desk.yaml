feature: capital.results-desk
title: >-
  Стол «Результаты»: что требуется от пайщика по его долям

# Прежде голосование и результаты были двумя разными разделами со списками
# проектов: пайщик открывал проект, искал себя среди участников и там находил
# свою кнопку. Теперь раздел один, а строка списка — это собственная доля
# пайщика: название компонента, статус, действие и голосование прямо в строке.
#
# Сам процесс приёма (заявление → акт-1 → акт-2 → конвертация) описан слайсом
# capital.result-submission, голосование по методу Водянова — контрактной
# частью capital.fund-allocation. Здесь заводится только то, как это подаётся
# пайщику: какая доля на какой вкладке, что показывается как «требуется от
# меня» и кто какие вкладки видит.
sources:
  backend:
    - components/controller/src/extensions/capital/application/dto/segments/segment.dto.ts
    - components/controller/src/extensions/capital/infrastructure/mappers/segment.mapper.ts
    - components/controller/src/extensions/capital/domain/entities/segment.entity.ts
  ui:
    - components/desktop/extensions/capital/pages/ProjectsResultsPage/**
    - components/desktop/extensions/capital/pages/ProjectsVotingPage/**
    - components/desktop/extensions/capital/widgets/ContributorResultsListWidget/**
    - components/desktop/extensions/capital/widgets/ListResultProjectsWidget/**
    - components/desktop/extensions/capital/widgets/ProjectVotingSegmentsWidget/**
    - components/desktop/extensions/capital/shared/lib/segmentStatus.ts

cases:
  # ── Уровень интерфейса: что требуется от пайщика ──────────────────────────

  - id: cap.resdesk.happy.01
    level: ui
    kind: happy
    scenario: >
      У пайщика есть доля в компоненте, по которой идёт голосование, и он ещё
      не голосовал. Он открывает «Результаты».
    expect: >
      строка компонента сразу на вкладке «На приёмке» с пометкой «Требуется
      голос», а голосование раскрывается в самой строке — заходить в проект и
      искать себя среди участников не нужно
    test: ~
    status: missing

  - id: cap.resdesk.happy.02
    level: ui
    kind: happy
    scenario: >
      Доля пайщика готова к внесению результата (голоса разнесены).
    expect: >
      в строке — состояние «Готов» и кнопка внесения результата; после отправки
      строка остаётся на месте и меняет статус на «На рассмотрении»
    test: ~
    status: missing

  - id: cap.resdesk.happy.03
    level: ui
    kind: happy
    scenario: >
      Совет принял решение, доля ждёт подписи пайщика на акте приёма-передачи.
    expect: в строке — кнопка подписи акта, без перехода внутрь проекта
    test: ~
    status: missing

  - id: cap.resdesk.happy.04
    level: ui
    kind: happy
    scenario: доля принята и ждёт получения (конвертации) пайщиком
    expect: в строке — действие получения доли в объекте авторских прав
    test: ~
    status: missing

  - id: cap.resdesk.side.01
    level: ui
    kind: side
    scenario: >
      доля ждёт хода председателя или совета (заявление на рассмотрении,
      одобрено, акт подписан пайщиком)
    expect: >
      строка остаётся на «На приёмке» со статусом ожидания и без кнопки:
      процесс идёт, но ход не за пайщиком. Счётчик вкладки такие доли не
      считает — он показывает, сколько требует действия
    test: ~
    status: missing

  - id: cap.resdesk.side.02
    level: ui
    kind: side
    scenario: доля получена (конвертация завершена)
    expect: >
      строка уходит с «На приёмке» и остаётся на «Мои результаты» — с ней
      можно свериться, но действий по ней больше нет
    test: ~
    status: missing

  - id: cap.resdesk.side.03
    level: ui
    kind: side
    scenario: >
      пайщик участвует в проекте на голосовании, но права голоса у него нет
    expect: >
      строка видна как идущий процесс, голосования в ней нет и пометки
      «требуется голос» тоже
    test: ~
    status: missing

  - id: cap.resdesk.side.04
    level: ui
    kind: side
    scenario: пайщик уже проголосовал и перезагрузил страницу
    expect: >
      голосование больше не предлагается. Прежде признак голоса жил только в
      памяти страницы: после перезагрузки форма распределения открывалась
      снова, и повторный голос отбивала уже цепь
    test: ~
    status: missing

  - id: cap.resdesk.side.12
    level: ui
    kind: side
    scenario: >
      доля в компоненте, работа по которому ещё идёт (голосование не начиналось)
    expect: >
      строки на «На приёмке» нет — доля пересчитывается на каждый коммит, и
      показывать её как ожидающую действия значит забивать вкладку шумом.
      На «Мои результаты» строка при этом видна
    test: ~
    status: missing

  - id: cap.resdesk.side.05
    level: ui
    kind: side
    scenario: у пайщика нет ни одной доли
    expect: >
      «На приёмке» показывает пустое состояние; члену совета и председателю
      при этом сразу открывается сводный список
    test: ~
    status: missing

  # ── Уровень интерфейса: права на вкладки ──────────────────────────────────

  - id: cap.resdesk.side.06
    level: ui
    kind: side
    scenario: обычный пайщик открывает «Результаты»
    expect: >
      видны только «На приёмке» и «Мои результаты». Сводный список всех
      результатов кооператива и акты на подпись ему не показываются
    test: ~
    status: missing

  - id: cap.resdesk.side.07
    level: ui
    kind: side
    scenario: член совета открывает «Результаты»
    expect: >
      добавляется вкладка со сводным списком всех результатов; актов на
      подпись нет — подписывает председатель
    test: ~
    status: missing

  - id: cap.resdesk.happy.05
    level: ui
    kind: happy
    scenario: >
      Пайщики подписали акты по нескольким компонентам, председатель открывает
      «Результаты».
    expect: >
      вкладка «На подпись» перечисляет именно эти доли — с именем пайщика и
      кнопкой подписи. Прежде председателю приходилось открывать каждый
      результат подряд, чтобы найти, где ждут его подписи
    test: ~
    status: missing

  - id: cap.resdesk.break.01
    level: ui
    kind: break
    scenario: >
      Пайщик открывает результат из сводного списка и возвращается назад.
    expect: >
      порядок строк тот же, и открытый результат стоит там же, где стоял.
      Прежде список читался из общего хранилища проектов, а заход внутрь
      подмешивал туда одиночный проект — при возврате строка оказывалась
      в другом месте списка
    test: ~
    status: missing

  - id: cap.resdesk.break.02
    level: ui
    kind: break
    scenario: >
      Список перечитывается по таймеру, пока пайщик читает строку.
    expect: >
      порядок строк не меняется: он задаётся на клиенте (сначала требующие
      действия, затем в работе, затем завершённые; внутри — по названию), а не
      порядком ответа сервера
    test: ~
    status: missing

  - id: cap.resdesk.side.08
    level: ui
    kind: side
    scenario: >
      прежние ссылки на раздел «Голосования» (закладка, письмо, история
      браузера)
    expect: >
      открывается «Результаты»; ссылка на голосование по конкретному
      компоненту по-прежнему открывает страницу голосования
    test: ~
    status: missing

  # ── Уровень бэкенда: контекст доли ────────────────────────────────────────

  - id: cap.resdesk.happy.06
    level: backend
    kind: happy
    scenario: запрос долей по имени пайщика, без указания проекта
    expect: >
      каждая доля приходит с названием компонента, названием проекта, статусом
      проекта и признаком отданного голоса — строку списка можно построить
      одним запросом
    test: ~
    status: missing

  - id: cap.resdesk.side.09
    level: backend
    kind: side
    scenario: доля относится к проекту без родителя
    expect: название проекта заполнено, название родителя пустое
    test: ~
    status: missing

  - id: cap.resdesk.side.10
    level: backend
    kind: side
    scenario: >
      пайщик голосовал в одном проекте и не голосовал в другом
    expect: >
      признак голоса выставлен только у доли того проекта, где голос отдан;
      чужие голоса на признак не влияют
    test: ~
    status: missing

  - id: cap.resdesk.side.11
    level: backend
    kind: side
    scenario: доли читаются на путях, где контекст не заполняется
    expect: >
      признак голоса приходит отрицательным, а не пустым: поле обязательное,
      и пустое значение уронило бы ответ целиком
    test: ~
    status: missing

  - id: cap.resdesk.break.03
    level: backend
    kind: break
    scenario: >
      Обычный пайщик запрашивает доли всех участников кооператива напрямую,
      минуя интерфейс.
    expect: >
      требуется решение. Вкладка со сводным списком закрыта по роли на клиенте,
      но сам запрос долей ролью не ограничен — сервер отдаёт чужие доли любому
      пайщику. Ограничивать ли выдачу ролью (и что тогда с долями участников
      своего проекта) — вопрос к правилам доступа расширения, а не к этому
      слайсу
    decision_needed: true
    test: ~
    status: missing
