feature: capital.results-desk
title: >-
  Стол «Результаты»: что требуется от пайщика по его долям

# Прежде голосование и результаты были двумя разными разделами со списками
# проектов: пайщик открывал проект, искал себя среди участников и там находил
# свою кнопку. Теперь раздел один, а строка списка — это собственная доля
# пайщика: название компонента, статус, действие и голосование прямо в строке.
#
# Сам процесс приёма (заявление → акт-1 → акт-2 → конвертация) описан слайсом
# capital.result-submission, голосование по методу Водянова — контрактной
# частью capital.fund-allocation. Здесь заводится только то, как это подаётся
# пайщику: какая доля на какой вкладке, что показывается как «требуется от
# меня» и кто какие вкладки видит.
sources:
  backend:
    - components/controller/src/extensions/capital/application/dto/segments/segment.dto.ts
    - components/controller/src/extensions/capital/infrastructure/mappers/segment.mapper.ts
    - components/controller/src/extensions/capital/domain/entities/segment.entity.ts
  ui:
    - components/desktop/extensions/capital/pages/ProjectsResultsPage/**
    - components/desktop/extensions/capital/pages/ProjectsVotingPage/**
    - components/desktop/extensions/capital/widgets/ContributorResultsListWidget/**
    - components/desktop/extensions/capital/widgets/ResultSubmissionActionsWidget/**
    - components/desktop/extensions/capital/widgets/ProjectVotingSegmentsWidget/**
    - components/desktop/extensions/capital/shared/lib/segmentStatus.ts

cases:
  # ── Уровень интерфейса: что требуется от пайщика ──────────────────────────

  - id: cap.resdesk.happy.01
    level: ui
    kind: happy
    scenario: >
      У пайщика есть доля в компоненте, по которой идёт голосование, и он ещё
      не голосовал. Он открывает «Результаты».
    expect: >
      строка компонента сразу на вкладке «На приёмке» с кнопкой «Голосовать», а
      голосование раскрывается в самой строке — заходить в проект и искать себя
      среди участников не нужно
    test: ~
    status: missing

  - id: cap.resdesk.happy.02
    level: ui
    kind: happy
    scenario: >
      Доля пайщика готова к внесению результата (голоса разнесены).
    expect: >
      в строке — состояние «Готов» и кнопка внесения результата; после отправки
      строка остаётся на месте и меняет статус на «На рассмотрении»
    test: ~
    status: missing

  - id: cap.resdesk.happy.03
    level: ui
    kind: happy
    scenario: >
      Совет принял решение, доля ждёт подписи пайщика на акте приёма-передачи.
    expect: в строке — кнопка подписи акта, без перехода внутрь проекта
    test: ~
    status: missing

  - id: cap.resdesk.happy.04
    level: ui
    kind: happy
    scenario: доля принята и ждёт получения (конвертации) пайщиком
    expect: в строке — действие получения доли в объекте авторских прав
    test: ~
    status: missing

  - id: cap.resdesk.side.01
    level: ui
    kind: side
    scenario: >
      доля ждёт хода председателя или совета (заявление на рассмотрении,
      одобрено, акт подписан пайщиком)
    expect: >
      строка остаётся на «На приёмке» со статусом ожидания и без кнопки:
      процесс идёт, но ход не за пайщиком. Счётчик вкладки такие доли не
      считает — он показывает, сколько требует действия
    test: ~
    status: missing

  - id: cap.resdesk.side.02
    level: ui
    kind: side
    scenario: доля получена (конвертация завершена)
    expect: >
      строка уходит с «На приёмке» и остаётся на «Мои результаты» — с ней
      можно свериться, но действий по ней больше нет
    test: ~
    status: missing

  - id: cap.resdesk.side.03
    level: ui
    kind: side
    scenario: >
      пайщик участвует в проекте на голосовании, но права голоса у него нет
    expect: >
      строка видна как идущий процесс, голосования в ней нет и кнопки
      «Голосовать» тоже
    test: ~
    status: missing

  - id: cap.resdesk.side.04
    level: ui
    kind: side
    scenario: пайщик уже проголосовал и перезагрузил страницу
    expect: >
      голосование больше не предлагается. Прежде признак голоса жил только в
      памяти страницы: после перезагрузки форма распределения открывалась
      снова, и повторный голос отбивала уже цепь
    test: ~
    status: missing

  - id: cap.resdesk.side.12
    level: ui
    kind: side
    scenario: >
      доля в компоненте, работа по которому ещё идёт (голосование не начиналось)
    expect: >
      строки на «На приёмке» нет — доля пересчитывается на каждый коммит, и
      показывать её как ожидающую действия значит забивать вкладку шумом.
      На «Мои результаты» строка при этом видна
    test: ~
    status: missing

  - id: cap.resdesk.break.04
    level: ui
    kind: break
    scenario: >
      Компонент, где право голоса есть только у самого пайщика: распределять
      не между кем, и цепь закрыла голосование сразу, без единой записи о голосе.
    expect: >
      кнопки «Голосовать» в строке нет. Прежде строка звала голосовать, а
      раскрытое голосование отвечало «голосование ещё идёт» и не предлагало
      ничего распределить: признак голоса читался по записям о голосах, которых
      в таком компоненте не бывает
    test: ~
    status: missing

  - id: cap.resdesk.side.21
    level: ui
    kind: side
    scenario: >
      Пайщик раскрывает строку: и голосование, и сведения о доле.
    expect: >
      раскрытие одно — панель подробностей: сначала голосование, следом
      сведения о доле, без собственных заголовков и рамок поверх них.
      Раскрывается стрелкой слева и нажатием на саму строку, кнопка
      «Голосовать» открывает ту же панель; названия компонента и проекта из
      раскрытия исключены — они ведут на свои страницы. Прежде в строке было
      два независимых раскрытия (стрелка слева и кнопка голосования), и что
      какое разворачивает, понять было нельзя
    test: ~
    status: missing

  - id: cap.resdesk.side.13
    level: ui
    kind: side
    scenario: >
      У пайщика есть доля и в компоненте, и в проекте верхнего уровня, куда
      этот компонент входит.
    expect: >
      в списке только компонент. Результат приходуется по компоненту, у проекта
      своего результата нет — он складывается из результатов компонентов, и
      пересчитать его нечем. Прежде строка проекта висела в списке с нулевой
      долей и кнопкой пересчёта, которая ничего не меняла
    test: ~
    status: missing

  - id: cap.resdesk.side.14
    level: ui
    kind: side
    scenario: пайщик нажимает на название компонента и на название проекта
    expect: >
      открывается страница соответствующего компонента и соответствующего
      проекта — из списка долей видно, куда идти за подробностями работы
    test: ~
    status: missing

  - id: cap.resdesk.side.15
    level: ui
    kind: side
    scenario: >
      Одна и та же доля видна и в строке стола, и в списке участников
      компонента.
    expect: >
      состояние подписано одними и теми же словами: «Расчёт», «Готов»,
      «На рассмотрении», «Одобрен», «Подпись пайщика», «Подпись председателя»,
      «Принят», «Завершён», «Получен». Подписи берутся из одного места, полная
      формулировка — во всплывающей подсказке. Свой набор слов на столе читался
      бы как другое состояние доли
    test: ~
    status: missing

  - id: cap.resdesk.side.22
    level: ui
    kind: side
    scenario: >
      Пайщик пересчитывает стоимость доли, вносит результат или подписывает акт
      прямо из строки списка.
    expect: >
      строка перечитывается сразу и показывает новую стоимость и новый статус.
      Прежде действия обновляли только общее хранилище, а список держит
      собственные строки — на экране оставалось прежнее, и пересчёт выглядел
      несработавшим
    test: ~
    status: missing

  - id: cap.resdesk.side.23
    level: ui
    kind: side
    scenario: >
      Название компонента длиннее, чем помещается в строку.
    expect: >
      состояние и действия остаются на правом краю строки, название
      укорачивается. Прежде состояние стояло рядом с названием и уезжало вместе
      с ним
    test: ~
    status: missing

  - id: cap.resdesk.side.17
    level: ui
    kind: side
    scenario: >
      Пайщик открывает компонент из строки и возвращается кнопкой «назад».
    expect: >
      возврат на ту же вкладку стола и с тем же раскрытием строк. Прежде
      «назад» уводило вверх по дереву — на проект компонента, а вкладка
      сбрасывалась на первую: вкладка не была отражена в адресе
    test: ~
    status: missing

  - id: cap.resdesk.side.18
    level: ui
    kind: side
    scenario: >
      адрес стола содержит вкладку, недоступную этому пайщику (сводный список
      или акты на подпись)
    expect: >
      открывается «На приёмке», а не пустой экран
    test: ~
    status: missing

  - id: cap.resdesk.side.19
    level: ui
    kind: side
    scenario: пересчёт стоимости доли в строке списка
    expect: >
      пересчёт доступен кнопкой-иконкой в любой момент, пока доля не получена,
      и не спорит по весу с основным действием строки. Прежде он показывался
      крупной основной кнопкой и только в стадии расчёта
    test: ~
    status: missing

  - id: cap.resdesk.side.20
    level: ui
    kind: side
    scenario: строка списка на узком экране
    expect: >
      название с состоянием, суммы и действия раскладываются в столбик и
      помещаются по ширине; на широком экране строка остаётся в один ряд
    test: ~
    status: missing

  - id: cap.resdesk.side.05
    level: ui
    kind: side
    scenario: у пайщика нет ни одной доли
    expect: >
      «На приёмке» показывает пустое состояние; члену совета и председателю
      при этом сразу открывается сводный список
    test: ~
    status: missing

  # ── Уровень интерфейса: права на вкладки ──────────────────────────────────

  - id: cap.resdesk.side.06
    level: ui
    kind: side
    scenario: обычный пайщик открывает «Результаты»
    expect: >
      видны только «На приёмке» и «Мои результаты». Сводный список всех
      результатов кооператива и акты на подпись ему не показываются
    test: ~
    status: missing

  - id: cap.resdesk.side.07
    level: ui
    kind: side
    scenario: член совета открывает «Результаты»
    expect: >
      добавляется вкладка со сводным списком всех результатов; актов на
      подпись нет — подписывает председатель
    test: ~
    status: missing

  - id: cap.resdesk.side.24
    level: ui
    kind: side
    scenario: >
      Член совета сверяет долю по сводному списку и по вкладке пайщика.
    expect: >
      сводный список — такие же строки долей по компонентам, с теми же
      статусами и с именем участника. Прежде на этой вкладке лежал список
      проектов со своими словами состояния («Приёмка») — сверить долю с тем,
      что видит пайщик, было нельзя
    test: ~
    status: missing

  - id: cap.resdesk.happy.05
    level: ui
    kind: happy
    scenario: >
      Пайщики подписали акты по нескольким компонентам, председатель открывает
      «Результаты».
    expect: >
      вкладка «На подпись» перечисляет именно эти доли — с именем пайщика и
      кнопкой подписи. Прежде председателю приходилось открывать каждый
      результат подряд, чтобы найти, где ждут его подписи
    test: ~
    status: missing

  - id: cap.resdesk.break.01
    level: ui
    kind: break
    scenario: >
      Пайщик открывает компонент из строки списка и возвращается назад.
    expect: >
      порядок строк тот же, и открытая строка стоит там же, где стояла.
      Прежде список читался из общего хранилища проектов, а заход внутрь
      подмешивал туда одиночный проект — при возврате строка оказывалась
      в другом месте списка
    test: ~
    status: missing

  - id: cap.resdesk.break.02
    level: ui
    kind: break
    scenario: >
      Список перечитывается по таймеру, пока пайщик читает строку.
    expect: >
      порядок строк не меняется: он задаётся на клиенте (сначала требующие
      действия, затем в работе, затем завершённые; внутри — по названию), а не
      порядком ответа сервера
    test: ~
    status: missing

  - id: cap.resdesk.side.08
    level: ui
    kind: side
    scenario: >
      прежние ссылки на раздел «Голосования» (закладка, письмо, история
      браузера)
    expect: >
      открывается «Результаты»; ссылка на голосование по конкретному
      компоненту по-прежнему открывает страницу голосования
    test: ~
    status: missing

  # ── Уровень бэкенда: контекст доли ────────────────────────────────────────

  - id: cap.resdesk.happy.06
    level: backend
    kind: happy
    scenario: запрос долей по имени пайщика, без указания проекта
    expect: >
      каждая доля приходит с названием компонента, названием проекта, статусом
      проекта и признаком отданного голоса — строку списка можно построить
      одним запросом
    test: ~
    status: missing

  - id: cap.resdesk.side.09
    level: backend
    kind: side
    scenario: доля относится к проекту без родителя
    expect: >
      название проекта заполнено, название и хэш родителя пустые — по ним
      и отличается компонент от проекта верхнего уровня
    test: ~
    status: missing

  - id: cap.resdesk.side.10
    level: backend
    kind: side
    scenario: >
      пайщик голосовал в одном проекте и не голосовал в другом
    expect: >
      признак голоса выставлен только у доли того проекта, где голос отдан;
      чужие голоса на признак не влияют
    test: ~
    status: missing

  - id: cap.resdesk.side.11
    level: backend
    kind: side
    scenario: доли читаются на путях, где контекст не заполняется
    expect: >
      признак голоса приходит отрицательным, а не пустым: поле обязательное,
      и пустое значение уронило бы ответ целиком
    test: ~
    status: missing

  - id: cap.resdesk.side.16
    level: backend
    kind: side
    scenario: >
      запрос долей с отбором «только компоненты» и «только проекты верхнего
      уровня»
    expect: >
      в первом случае возвращаются доли проектов с непустым родителем, во
      втором — доли проектов, у которых родителя нет: и когда родитель пустой
      хэш, и когда он не заполнен вовсе
    test: ~
    status: missing

  - id: cap.resdesk.break.03
    level: backend
    kind: break
    scenario: >
      Обычный пайщик запрашивает доли всех участников кооператива напрямую,
      минуя интерфейс.
    expect: >
      требуется решение. Вкладка со сводным списком закрыта по роли на клиенте,
      но сам запрос долей ролью не ограничен — сервер отдаёт чужие доли любому
      пайщику. Ограничивать ли выдачу ролью (и что тогда с долями участников
      своего проекта) — вопрос к правилам доступа расширения, а не к этому
      слайсу
    decision_needed: true
    test: ~
    status: missing
