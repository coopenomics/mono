feature: capital.favorites
title: Личное избранное — проекты, компоненты, задачи, артефакты

# Пайщик помечает звёздочкой проекты, компоненты, задачи (и в перспективе
# артефакты); избранное хранится офчейн на бэкенде по (кооператив, пользователь,
# тип, хеш) и показывается звёздочками в списках/шапках и суб-пунктами левого
# меню под «Проекты» / «Компоненты» / «Задачи».
#
# Правила: избранное строго личное — чужое не читает и не правит даже
# председатель; добавление идёт только на существующую цель; повторное
# добавление идемпотентно (уникальный индекс + upsert); выдача join'ом берёт
# живое наименование цели и отфильтровывает записи удалённых сущностей.
#
# Удаление сущности снимает её с избранного у всех пайщиков — иначе запись
# висит: проекция проекта и компонента при удалении не пропадает, а остаётся
# с `present = false`, и без этого условия удалённая цель продолжала
# показываться звёздочкой и вести на страницу, которая грузится бесконечно.

sources:
  backend:
    - components/controller/src/extensions/capital/application/resolvers/favorites.resolver.ts
    - components/controller/src/extensions/capital/application/services/favorites.service.ts
    - components/controller/src/extensions/capital/infrastructure/repositories/favorite.typeorm-repository.ts
    - components/controller/src/extensions/capital/infrastructure/entities/favorite.typeorm-entity.ts
    - components/controller/src/extensions/capital/domain/repositories/favorite.repository.ts
    - components/controller/src/extensions/capital/domain/enums/favorite-target-type.enum.ts
  ui:
    - components/desktop/extensions/capital/entities/Favorite/**
    - components/desktop/extensions/capital/features/Project/DeleteProject/model/**
    - components/desktop/extensions/capital/features/Issue/DeleteIssue/model/**
    - components/desktop/extensions/capital/features/Story/DeleteStory/model/**
    - components/desktop/extensions/capital/features/Favorite/**
    - components/desktop/extensions/capital/pages/ArtifactsListPage/**
    - components/desktop/src/shared/hooks/useMenuSubItems.ts

cases:
  - id: cap.fav.happy.01
    level: backend
    kind: happy
    scenario: пользователь добавляет существующий проект в избранное
    expect: запись создана, ответ содержит обновлённый список с живым наименованием
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.side.01
    level: backend
    kind: side
    scenario: добавление цели, которой нет ни в одной таблице (опечатка/удалена)
    expect: BadRequest, запись не создаётся
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.side.02
    level: backend
    kind: side
    scenario: повторное добавление той же четвёрки (двойной клик)
    expect: идемпотентно — дубль гасится уникальным индексом (insert orIgnore)
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.side.03
    level: backend
    kind: side
    scenario: снятие звёздочки с уже удалённой сущности
    expect: удаление проходит без проверки существования цели
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.break.01
    level: backend
    kind: break
    scenario: председатель запрашивает или правит избранное другого пайщика
    expect: отказ «Избранное доступно только своему владельцу», сервис не вызывается
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.side.04
    level: backend
    kind: side
    scenario: в избранном есть запись, чья цель удалена из своей таблицы
    expect: выдача отфильтровывает её (join не нашёл цели), список не падает
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.ui.01
    level: ui
    kind: happy
    scenario: звёздочка в строке списка и в шапке сущности добавляет/снимает избранное, суб-пункт появляется/исчезает в меню под своим разделом
    expect: состояние синхронно во всех трёх точках без перезагрузки
    status: missing

  - id: cap.fav.ui.02
    level: ui
    kind: happy
    scenario: страница «Артефакты» показывает только доступные пайщику артефакты (границы допуска считает бэкенд), звёздочка помечает артефакт и он появляется в меню под «Артефакты»
    expect: чужие артефакты в списке не видны; избранный артефакт — суб-пунктом в левой панели
    status: missing

  - id: cap.fav.side.05
    level: backend
    kind: side
    scenario: цель удалена, но её строка осталась в проекции с present = false
    expect: за целями идёт запрос только за живыми (present = true), запись в выдачу не попадает
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.side.09
    level: backend
    kind: side
    scenario: в избранном задача и артефакт — офчейн-сущности, у которых present никто не выставляет
    expect: фильтр по present к ним не применяется, обе записи возвращаются с актуальными наименованиями
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.side.06
    level: backend
    kind: side
    scenario: снятие цели с избранного у всех пайщиков по хэшу в верхнем регистре
    expect: удаление идёт по хэшу, приведённому к нижнему регистру (канон хранения)
    test: components/controller/tests/unit/capital/favorites.service.test.ts
    status: written

  - id: cap.fav.side.07
    level: backend
    kind: side
    scenario: удаляется проект или компонент — персональный (мягко) и из цепи
    expect: обе ветки снимают цель с избранного у всех пайщиков
    test: components/controller/tests/unit/capital/favorites-cascade-on-delete.test.ts
    status: written

  - id: cap.fav.side.08
    level: backend
    kind: side
    scenario: удаляется задача или артефакт
    expect: цель снимается с избранного у всех пайщиков
    test: components/controller/tests/unit/capital/favorites-cascade-on-delete.test.ts
    status: written

  - id: cap.fav.ui.03
    level: ui
    kind: side
    scenario: пайщик удаляет проект, компонент, задачу или артефакт, отмеченные звёздочкой
    expect: суб-пункт исчезает из левого меню сразу, без перезагрузки; после перезагрузки не возвращается
    status: missing

  - id: cap.fav.ui.04
    level: ui
    kind: break
    scenario: открыть прямую ссылку на удалённый проект, компонент или задачу
    expect: страница показывает «недоступен» вместо бесконечного скелетона загрузки
    status: missing

  - id: cap.fav.ui.05
    level: ui
    kind: side
    scenario: >
      Артефакт из избранного или списка открыт оверлеем (?story= в адресе),
      пайщик жмёт «назад» браузера
    expect: >
      оверлей закрывается, страница под ним остаётся той же — со скроллом и
      загруженной лентой; F5 с открытым оверлеем восстанавливает его
    status: missing
