feature: marketplace.onboarding
title: Онбординг Стола заказов — приём ЦПП кооперативом (L1) и гейт первого входа пайщика (L3)

# Слайс подключения расширения: кооператив принимает ЦПП «Стол заказов»
# (L1) и пайщик подписывает программную оферту при первом входе на стол (L3).
# L2 — выбор ЦПП в регистрационном потоке ядра — сюда не входит: это core
# registration-flow, у него своя точка входа и свои акторы.
#
# Важная особенность источника правды (см. комментарий в
# marketplace-onboarding.service.ts): подпись пайщика по ЦПП — это ПРОГРАММА
# (`wallet::signagree` → `wallet::users.programs[]`), а не `soviet::agreements3`.
# Чтение состояния идёт из UserAgreementRepository. Тест, читающий агримент из
# AgreementRepository, зафиксировал бы ровно тот баг, из-за которого гейт
# оставался поднятым навсегда после подписи.
#
# Переименование 2026-08-09 (FC1-3): `MarketplacePlugin`/`MarketplacePluginModule`
# стали `MarketplaceExtension`/`MarketplaceExtensionModule`, локальные `plugin*`
# — `extension*`. Только имена; поведение и набор случаев не менялись.
#
# Фабрика утверждений документов 2026-09-16 (A3D-3, компонент 66 проекта 13):
# рядом с шагами онбординга расширение объявляет свои документы в реестре
# шаблонов кооператива (`register-marketplace-documents.ts`). Шаги и их
# случаи не менялись; случаи деклараций — в реестре documents.approvals.

# Правка 24.09.2026 (C28-83): экраны Стола заказов живут по общей ленте
# изменений (chainChanges), отдельная подписка marketplaceEvents снята вместе с
# серверным мостом и резолвером. Таблицы расширения объявлены в ленте через
# CHAIN_CHANGES_PORT (MarketplaceLiveFeedSubscriber на базе marketplace), стол
# перечитывает экран по сигналу их изменений (useLiveReload + marketLiveTables).
# Серверные сценарии и их случаи не менялись.
# Гейт подписи на месте перечитывает ожидающие подписи по ленте (onsiteGateLive.ts).

# Правка 24.09.2026 (C28-83, второй проход): на ленту переведены и экраны
# Стола заказов, которые раньше не слушали marketplaceEvents, — реестры
# председателя, экономика стола и участка, выплаты, претензии поставщику,
# склад участка, онбординг кооператива и поставщика, пункты выдачи, карточки
# реестров и виджеты процессов. Сбор с оборота (marketplace::config) объявлен в
# ленте таблицей цепи. Онбординг пайщика ждёт подписи по ленте, а не циклом с
# паузой. Серверные сценарии и набор случаев прежние.
# Правка 29.09.2026 (C28-86): в install.ts стол поставщика объявляет команду
# «Создать предложение» (окно столов и сочетание N O). Команда ведёт на ту же
# страницу создания предложения и закрыта тем же правом Offer:create:own —
# шлюз онбординга и его случаи не меняются.
# Правка 29.09.2026 (C28-86, второй проход): стол ПВЗ объявляет команду
# «Сканировать QR» (G Q) с тем же правом Warehouse:read:own-KU и тем же
# действием сканера, что у пункта меню. Команды видны только после шлюза стола.

# Правка 2026-10-04 (C28-87): права операций сверяются с единой таблицей прав
# Стола заказов вместе с условием строки (кооператив подключён, заказчик
# подключён, хранение включено); декоратор операции — общий `@RequireRight` из
# каркаса расширений. Случаи про условия — в marketplace.rights-table; набор
# случаев этой фичи прежний.

# Правка 2026-10-05 (C28-87, пункт 1а): операции подключения названы источником
# «сам пайщик» (`SELF`) в `@RequireRight`: объекта сверки у них нет, имя берётся
# из входа. Поведение и набор случаев прежние.

sources:
  backend:
    - components/controller/src/extensions/marketplace/application/onboarding/**
    - components/controller/src/extensions/marketplace/application/coop-acceptance/**
    - components/controller/src/extensions/marketplace/application/desktop/marketplace-desktop-grants.provider.ts
    - components/controller/src/extensions/marketplace/application/resolvers/marketplace-onboarding.resolver.ts
    - components/controller/src/extensions/marketplace/application/resolvers/marketplace-coop-acceptance.resolver.ts
    - components/controller/src/extensions/marketplace/application/dto/marketplace-onboarding-state.dto.ts
    - components/controller/src/extensions/marketplace/application/dto/marketplace-sign-onboarding-offer-input.dto.ts
    - components/controller/src/extensions/marketplace/constants/marketplace-agreement-ids.ts
    - components/controller/src/infrastructure/blockchain/adapters/soviet-blockchain.adapter.ts
  ui:
    - components/desktop/src/pages/Marketplace/OnboardingCoopAcceptCpp/**
    - components/desktop/src/pages/Marketplace/OnboardingMemberPickCpp/**
    # Объявление страниц-шлюзов столов (`gate`) — какая страница перехватывает
    # заход пайщика без допуска. Сама механика перехвата — платформенная,
    # см. реестр extensions.workspace-gating.
    - components/desktop/extensions/market/install.ts

cases:
  # ── L1: кооператив принимает ЦПП ─────────────────────────────────────────
  - id: mkt.onb.happy.01
    level: ui
    kind: happy
    scenario: >
      Председатель устанавливает расширение «Стол заказов» из каталога приложений кооператива.
    expect: расширение появляется установленным, столы Стола заказов доступны в меню
    test: components/docs-harness/scenarios/marketplace/onboarding/install-market.mjs
    status: passing

  # Уровень backend, а не ui, и это вынужденно. Приём ЦПП — решение совета:
  # председатель выносит вопрос, три члена совета голосуют, председатель
  # подписывает протокол и исполняет решение. Пока это не сделано, у него нет
  # ни одного admin-права расширения и ВСЕ остальные экраны Стола заказов
  # отдают «Недостаточно прав доступа», поэтому приём выполняет фаза
  # подготовки `marketplace:01-l1-accept`. Фазы раннер выполняет один раз до
  # всех сценариев — к моменту открытия экрана ЦПП уже принята, и нажать
  # «Принять» через интерфейс нельзя в принципе. Сам экран документируется
  # сценарием onboarding/coop-accept-cpp, но случая он не закрывает.
  - id: mkt.onb.happy.02
    level: backend
    kind: happy
    scenario: Кооператив принимает ЦПП «Стол заказов» решением совета (L1)
    expect: >
      статус ЦПП становится «принята», в конфигурации расширения сохраняются решение совета и дата принятия
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    api: components/api-tests/src/marketplace/onboarding.test.ts
    status: passing

  # Самоинициализация программы ЦПП в цепи. Механика общая с Благоростом —
  # расширение при старте открывает свою программу, если кооператив её не имеет.
  - id: mkt.onb.happy.04
    level: backend
    kind: happy
    scenario: >
      Расширение стартует в кооперативе, где программа ЦПП ещё не открыта
    expect: >
      программа открывается автоматически ключом кооператива; шаблон оферты назначает контракт, а не вызывающая сторона
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    api: components/api-tests/src/marketplace/onboarding.test.ts
    status: passing

  - id: mkt.onb.side.13
    level: backend
    kind: side
    scenario: Повторный старт расширения, когда программа ЦПП уже открыта
    expect: транзакция не отправляется, ключ кооператива не запрашивается, старт продолжается
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    external: unreachable
    external_reason: "повторный старт расширения снаружи виден только отсутствием транзакции — наблюдать нечем; правило проверяет юнит-тест"
    status: passing

  - id: mkt.onb.side.14
    level: backend
    kind: side
    scenario: В кооперативе открыта другая ЦПП, своей нет
    expect: чужая программа не засчитывается за свою — открывается собственная
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    external: unreachable
    external_reason: "в кооперативе стенда своя программа открыта при загрузке; состояние «открыта только чужая ЦПП» через API не создать"
    status: passing

  - id: mkt.onb.break.04
    level: backend
    kind: break
    scenario: Цепь недоступна либо нет ключа кооператива в момент старта расширения
    expect: >
      расширение всё равно поднимается, ошибка уходит в лог, следующий старт повторяет попытку; на столе пайщик видит, что подключение ЦПП не завершено
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    api: components/api-tests/src/faults/chain-down.test.ts
    status: passing

  - id: mkt.onb.side.01
    level: backend
    kind: side
    scenario: Запрос статуса ЦПП, когда расширение не установлено в кооперативе
    expect: NotFound с указанием, что расширение не установлено
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    external: unreachable
    external_reason: "расширение Стола заказов на стенде установлено и нужно остальным наборам; состояние «не установлено» не воспроизводится"
    status: passing

  - id: mkt.onb.side.02
    level: backend
    kind: side
    scenario: Приём ЦПП с датой принятия в будущем (более чем на минуту вперёд)
    expect: BadRequest, приём не выполняется
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    external: unreachable
    external_reason: "дата принятия ЦПП во вход API не входит — её ставит сервер; неверную дату через API не передать"
    status: passing

  - id: mkt.onb.side.03
    level: backend
    kind: side
    scenario: Приём ЦПП с неразбираемой датой принятия
    expect: BadRequest, приём не выполняется
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    external: unreachable
    external_reason: "дата принятия ЦПП во вход API не входит — её ставит сервер; неверную дату через API не передать"
    status: passing

  - id: mkt.onb.side.04
    level: backend
    kind: side
    scenario: Повторный приём уже принятой ЦПП тем же кооперативом
    expect: >
      не отказ: ЦПП остаётся принятой, реквизиты нового решения совета перезаписывают прежние, дубликата записи не появляется
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    api: components/api-tests/src/marketplace/onboarding.test.ts
    status: passing
    # Решение заказчика (2026-08-08): текущее поведение (перезапись) устраивает.
    # Из кода не выводится: повторный accept не отбивается явной проверкой.
    # Зафиксировать текущее поведение тестом — значит узаконить возможную
    # двойную регистрацию оферты.

    # ── L3: гейт первого входа пайщика ───────────────────────────────────────
  - id: mkt.onb.happy.03
    level: ui
    kind: happy
    scenario: >
      Пайщик, не подписавший ЦПП, впервые заходит на Стол заказов и видит гейт с офертой; после подписания попадает на стол.
    expect: >
      до подписи заход на рабочую страницу стола уводит на страницу подключения (не на «Недостаточно прав доступа»), после подписи гейт не показывается ни при переходе, ни после перезагрузки страницы
    test: components/docs-harness/scenarios/marketplace/onboarding/extension-gate.mjs
    status: passing

  - id: mkt.onb.side.05
    level: backend
    kind: side
    scenario: Пайщик уже подписал программную оферту ЦПП
    expect: гейт не требуется, источник «подписано», проставлена дата подписи
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    api: components/api-tests/src/marketplace/onboarding.test.ts
    status: passing

  - id: mkt.onb.side.06
    level: backend
    kind: side
    scenario: В кооперативе не настроено соглашение типа «Стол заказов»
    expect: >
      чтение состояния — гейт не требуется, источник «не настроено»; попытка подписать — BadRequest
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    external: unreachable
    external_reason: "стенд загружается с настроенным соглашением, программой, кошельком и шаблоном оферты; сломанную настройку ЦПП через API не создать"
    status: passing

  - id: mkt.onb.side.07
    level: backend
    kind: side
    scenario: Соглашение ЦПП настроено, но у него нет программного кошелька
    expect: подписание отклоняется с BadRequest, on-chain действие не отправляется
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    external: unreachable
    external_reason: "стенд загружается с настроенным соглашением, программой, кошельком и шаблоном оферты; сломанную настройку ЦПП через API не создать"
    status: passing

  - id: mkt.onb.side.08
    level: backend
    kind: side
    scenario: Шаблон оферты ЦПП не заведён в реестре документов
    expect: >
      чтение состояния — гейт не требуется, источник «не настроено»; попытка подписать — BadRequest
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    external: unreachable
    external_reason: "стенд загружается с настроенным соглашением, программой, кошельком и шаблоном оферты; сломанную настройку ЦПП через API не создать"
    status: passing

  - id: mkt.onb.side.09
    level: backend
    kind: side
    scenario: >
      Запись пайщика в кошельке помечена как отсутствующая (удалена в цепи), хотя программа в ней когда-то была.
    expect: гейт снова требуется — подпись не засчитывается
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    external: unreachable
    external_reason: "запись пайщика в кошельке помечается отсутствующей только удалением строки в цепи контрактом; действия для этого у стенда нет"
    status: passing

  - id: mkt.onb.side.10
    level: backend
    kind: side
    scenario: Подпись оферты запрашивается не пайщиком этого кооператива
    expect: отказ доступа, on-chain действие не отправляется
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-offer-access.test.ts
    api: components/api-tests/src/marketplace/onboarding.test.ts
    status: passing

  - id: mkt.onb.break.01
    level: backend
    kind: break
    scenario: Цепь недоступна в момент подписания оферты
    expect: >
      пайщику показывается ошибка, состояние не считается подписанным, повторная попытка возможна
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    api: components/api-tests/src/faults/chain-down.test.ts
    status: passing

  # ── Незавершённое подключение ЦПП кооперативом (инцидент 2026-08-10) ──────
  # Кооператив утвердил оба документа решениями совета, но программа ЦПП в
  # кооперативе так и не была открыта. Отсутствие подписи в этом состоянии
  # выдавалось за состоявшуюся подпись — и в правах, и в тексте на экране.
  - id: mkt.onb.break.02
    level: backend
    kind: break
    scenario: >
      Кооператив не завершил подключение ЦПП (программа не открыта), пайщик выбрал пункт выдачи
    expect: >
      права заказчика НЕ выдаются — остаётся страница подключения; выбор пункта выдачи сам по себе стол не открывает
    test: components/controller/tests/unit/marketplace/marketplace-desktop-grants-provider.test.ts
    external: unreachable
    external_reason: "стенд загружается с настроенным соглашением, программой, кошельком и шаблоном оферты; сломанную настройку ЦПП через API не создать"
    status: passing

  - id: mkt.onb.break.03
    level: backend
    kind: break
    scenario: >
      Пайщик подписывает оферту Стола заказов, когда кооператив не завершил подключение ЦПП
    expect: >
      отказ с указанием, чего не хватает; подпись на цепь не отправляется и оферта не объявляется подписанной
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    external: unreachable
    external_reason: "стенд загружается с настроенным соглашением, программой, кошельком и шаблоном оферты; сломанную настройку ЦПП через API не создать"
    status: passing
    # Переведён с ui на backend по той же причине, что и mkt.onb.happy.02:
    # фазы подготовки принимают ЦПП один раз до всех сценариев, поэтому
    # состояния «кооператив не завершил подключение» на стенде не бывает —
    # экран с недоступным «Продолжить» в одном прогоне с рабочей цепочкой
    # непредставим. Правило живёт на сервере и проверено там: нет соглашения,
    # нет программного кошелька, нет самой программы — три отдельных отказа,
    # и ни один не доходит до wallet::signagree.

  - id: mkt.onb.side.11
    level: backend
    kind: side
    scenario: >
      Шаблон оферты у программы отличается от шаблона, записанного в соглашении (программу правили после создания)
    expect: >
      подписывается шаблон программы — иначе цепь отклоняет подпись как несовпадающую с программой
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    external: unreachable
    external_reason: "стенд загружается с настроенным соглашением, программой, кошельком и шаблоном оферты; сломанную настройку ЦПП через API не создать"
    status: passing

  - id: mkt.onb.side.12
    level: backend
    kind: side
    scenario: Соглашение ЦПП есть, но самой программы в кооперативе не существует
    expect: подписание отклоняется с BadRequest, on-chain действие не отправляется
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    external: unreachable
    external_reason: "стенд загружается с настроенным соглашением, программой, кошельком и шаблоном оферты; сломанную настройку ЦПП через API не создать"
    status: passing

  - id: mkt.onb.side.20
    level: backend
    kind: side
    scenario: член совета или председатель со статусом учётной записи «зарегистрирован» открывает Стол заказов
    expect: >
      гард стола пропускает его по роли, права стола выдаются — то же правило,
      что в ядре: совет проходит по роли в любом статусе (C28-87, решение
      владельца от 17.09.2026 для RolesGuard). Пайщик без статуса «принят»
      по-прежнему получает отказ и пустой набор прав
    test: components/controller/tests/unit/marketplace/marketplace-membership-guard.test.ts
    external: unreachable
    external_reason: "совет стенда заводится сразу со статусом «принят»; учётную запись совета в статусе «зарегистрирован» через API не создать"
    status: written

  - id: mkt.onb.ui.01
    level: ui
    kind: happy
    scenario: >
