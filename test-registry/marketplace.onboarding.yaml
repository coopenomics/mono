feature: marketplace.onboarding
title: Онбординг Стола заказов — приём ЦПП кооперативом (L1) и гейт первого входа пайщика (L3)

# Слайс подключения расширения: кооператив принимает ЦПП «Стол заказов»
# (L1) и пайщик подписывает программную оферту при первом входе на стол (L3).
# L2 — выбор ЦПП в регистрационном потоке ядра — сюда не входит: это core
# registration-flow, у него своя точка входа и свои акторы.
#
# Важная особенность источника правды (см. комментарий в
# marketplace-onboarding.service.ts): подпись пайщика по ЦПП — это ПРОГРАММА
# (`wallet::signagree` → `wallet::users.programs[]`), а не `soviet::agreements3`.
# Чтение состояния идёт из UserAgreementRepository. Тест, читающий агримент из
# AgreementRepository, зафиксировал бы ровно тот баг, из-за которого гейт
# оставался поднятым навсегда после подписи.
#
# Переименование 2026-08-09 (FC1-3): `MarketplacePlugin`/`MarketplacePluginModule`
# стали `MarketplaceExtension`/`MarketplaceExtensionModule`, локальные `plugin*`
# — `extension*`. Только имена; поведение и набор случаев не менялись.

sources:
  backend:
    - components/controller/src/extensions/marketplace/application/onboarding/**
    - components/controller/src/extensions/marketplace/application/coop-acceptance/**
    - components/controller/src/extensions/marketplace/application/desktop/marketplace-desktop-grants.provider.ts
    - components/controller/src/extensions/marketplace/application/resolvers/marketplace-onboarding.resolver.ts
    - components/controller/src/extensions/marketplace/application/resolvers/marketplace-coop-acceptance.resolver.ts
    - components/controller/src/extensions/marketplace/application/dto/marketplace-onboarding-state.dto.ts
    - components/controller/src/extensions/marketplace/application/dto/marketplace-sign-onboarding-offer-input.dto.ts
    - components/controller/src/extensions/marketplace/constants/marketplace-agreement-ids.ts
    - components/controller/src/infrastructure/blockchain/adapters/soviet-blockchain.adapter.ts
  ui:
    - components/desktop/src/pages/Marketplace/OnboardingCoopAcceptCpp/**
    - components/desktop/src/pages/Marketplace/OnboardingMemberPickCpp/**
    # Объявление страниц-шлюзов столов (`gate`) — какая страница перехватывает
    # заход пайщика без допуска. Сама механика перехвата — платформенная,
    # см. реестр extensions.workspace-gating.
    - components/desktop/extensions/market/install.ts

cases:
  # ── L1: кооператив принимает ЦПП ─────────────────────────────────────────
  - id: mkt.onb.happy.01
    level: ui
    kind: happy
    scenario: >
      Председатель устанавливает расширение «Стол заказов» из каталога приложений кооператива.
    expect: расширение появляется установленным, столы Стола заказов доступны в меню
    test: components/docs-harness/scenarios/marketplace/onboarding/install-market.mjs
    status: passing

  # Уровень backend, а не ui, и это вынужденно. Приём ЦПП — решение совета:
  # председатель выносит вопрос, три члена совета голосуют, председатель
  # подписывает протокол и исполняет решение. Пока это не сделано, у него нет
  # ни одного admin-права расширения и ВСЕ остальные экраны Стола заказов
  # отдают «Недостаточно прав доступа», поэтому приём выполняет фаза
  # подготовки `marketplace:01-l1-accept`. Фазы раннер выполняет один раз до
  # всех сценариев — к моменту открытия экрана ЦПП уже принята, и нажать
  # «Принять» через интерфейс нельзя в принципе. Сам экран документируется
  # сценарием onboarding/coop-accept-cpp, но случая он не закрывает.
  - id: mkt.onb.happy.02
    level: backend
    kind: happy
    scenario: Кооператив принимает ЦПП «Стол заказов» решением совета (L1)
    expect: >
      статус ЦПП становится «принята», в конфигурации расширения сохраняются решение совета и дата принятия
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    status: passing

  # Самоинициализация программы ЦПП в цепи. Механика общая с Благоростом —
  # расширение при старте открывает свою программу, если кооператив её не имеет.
  - id: mkt.onb.happy.04
    level: backend
    kind: happy
    scenario: >
      Расширение стартует в кооперативе, где программа ЦПП ещё не открыта
    expect: >
      программа открывается автоматически ключом кооператива; шаблон оферты
      назначает контракт, а не вызывающая сторона
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    status: passing

  - id: mkt.onb.side.13
    level: backend
    kind: side
    scenario: Повторный старт расширения, когда программа ЦПП уже открыта
    expect: транзакция не отправляется, ключ кооператива не запрашивается, старт продолжается
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    status: passing

  - id: mkt.onb.side.14
    level: backend
    kind: side
    scenario: В кооперативе открыта другая ЦПП, своей нет
    expect: чужая программа не засчитывается за свою — открывается собственная
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    status: passing

  - id: mkt.onb.break.04
    level: backend
    kind: break
    scenario: Цепь недоступна либо нет ключа кооператива в момент старта расширения
    expect: >
      расширение всё равно поднимается, ошибка уходит в лог, следующий старт
      повторяет попытку; на столе пайщик видит, что подключение ЦПП не завершено
    test: components/controller/tests/unit/blockchain/soviet-ensure-program.test.ts
    status: passing

  - id: mkt.onb.side.01
    level: backend
    kind: side
    scenario: Запрос статуса ЦПП, когда расширение не установлено в кооперативе
    expect: NotFound с указанием, что расширение не установлено
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    status: passing

  - id: mkt.onb.side.02
    level: backend
    kind: side
    scenario: Приём ЦПП с датой принятия в будущем (более чем на минуту вперёд)
    expect: BadRequest, приём не выполняется
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    status: passing

  - id: mkt.onb.side.03
    level: backend
    kind: side
    scenario: Приём ЦПП с неразбираемой датой принятия
    expect: BadRequest, приём не выполняется
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    status: passing

  - id: mkt.onb.side.04
    level: backend
    kind: side
    scenario: Повторный приём уже принятой ЦПП тем же кооперативом
    expect: >
      не отказ: ЦПП остаётся принятой, реквизиты нового решения совета перезаписывают прежние, дубликата записи не появляется
    test: components/controller/tests/unit/marketplace/marketplace-coop-acceptance-service.test.ts
    status: passing
    # Решение заказчика (2026-08-08): текущее поведение (перезапись) устраивает.
    # Из кода не выводится: повторный accept не отбивается явной проверкой.
    # Зафиксировать текущее поведение тестом — значит узаконить возможную
    # двойную регистрацию оферты.

    # ── L3: гейт первого входа пайщика ───────────────────────────────────────
  - id: mkt.onb.happy.03
    level: ui
    kind: happy
    scenario: >
      Пайщик, не подписавший ЦПП, впервые заходит на Стол заказов и видит гейт с офертой; после подписания попадает на стол.
    expect: >
      до подписи заход на рабочую страницу стола уводит на страницу подключения
      (не на «Недостаточно прав доступа»), после подписи гейт не показывается ни
      при переходе, ни после перезагрузки страницы
    test: components/docs-harness/scenarios/marketplace/onboarding/extension-gate.mjs
    status: passing

  - id: mkt.onb.side.05
    level: backend
    kind: side
    scenario: Пайщик уже подписал программную оферту ЦПП
    expect: гейт не требуется, источник «подписано», проставлена дата подписи
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing

  - id: mkt.onb.side.06
    level: backend
    kind: side
    scenario: В кооперативе не настроено соглашение типа «Стол заказов»
    expect: >
      чтение состояния — гейт не требуется, источник «не настроено»; попытка подписать — BadRequest
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing

  - id: mkt.onb.side.07
    level: backend
    kind: side
    scenario: Соглашение ЦПП настроено, но у него нет программного кошелька
    expect: подписание отклоняется с BadRequest, on-chain действие не отправляется
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing

  - id: mkt.onb.side.08
    level: backend
    kind: side
    scenario: Шаблон оферты ЦПП не заведён в реестре документов
    expect: >
      чтение состояния — гейт не требуется, источник «не настроено»; попытка подписать — BadRequest
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing

  - id: mkt.onb.side.09
    level: backend
    kind: side
    scenario: >
      Запись пайщика в кошельке помечена как отсутствующая (удалена в цепи), хотя программа в ней когда-то была.
    expect: гейт снова требуется — подпись не засчитывается
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing

  - id: mkt.onb.side.10
    level: backend
    kind: side
    scenario: Подпись оферты запрашивается не пайщиком этого кооператива
    expect: отказ доступа, on-chain действие не отправляется
    test: ~
    status: missing

  - id: mkt.onb.break.01
    level: backend
    kind: break
    scenario: Цепь недоступна в момент подписания оферты
    expect: >
      пайщику показывается ошибка, состояние не считается подписанным, повторная попытка возможна
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing

  # ── Незавершённое подключение ЦПП кооперативом (инцидент 2026-08-10) ──────
  # Кооператив утвердил оба документа решениями совета, но программа ЦПП в
  # кооперативе так и не была открыта. Отсутствие подписи в этом состоянии
  # выдавалось за состоявшуюся подпись — и в правах, и в тексте на экране.
  - id: mkt.onb.break.02
    level: backend
    kind: break
    scenario: >
      Кооператив не завершил подключение ЦПП (программа не открыта), пайщик выбрал пункт выдачи
    expect: >
      права заказчика НЕ выдаются — остаётся страница подключения; выбор пункта
      выдачи сам по себе стол не открывает
    test: components/controller/tests/unit/marketplace/marketplace-desktop-grants-provider.test.ts
    status: passing

  - id: mkt.onb.break.03
    level: ui
    kind: break
    scenario: >
      Пайщик открывает подключение к Столу заказов, когда кооператив не завершил подключение ЦПП
    expect: >
      экран сообщает, что подключение ЦПП кооперативом не завершено и подписать
      оферту нельзя; «Продолжить» недоступно. Оферта НЕ объявляется подписанной
    test: ~
    status: missing

  - id: mkt.onb.side.11
    level: backend
    kind: side
    scenario: >
      Шаблон оферты у программы отличается от шаблона, записанного в соглашении
      (программу правили после создания)
    expect: >
      подписывается шаблон программы — иначе цепь отклоняет подпись как
      несовпадающую с программой
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing

  - id: mkt.onb.side.12
    level: backend
    kind: side
    scenario: Соглашение ЦПП есть, но самой программы в кооперативе не существует
    expect: подписание отклоняется с BadRequest, on-chain действие не отправляется
    test: components/controller/tests/unit/marketplace/marketplace-onboarding-service.test.ts
    status: passing
