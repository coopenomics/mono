cases:
  - id: rt.cc.happy.01
    level: backend
    kind: happy
    scenario: Изменилась строка таблицы, открытой всем пайщикам.
    expect: сигнал в общий канал кооператива, без данных строки
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.happy.02
    level: backend
    kind: happy
    scenario: Изменилась строка личной таблицы (кошелёк, пайщик программы).
    expect: сигнал владельцу строки и совету; в общий канал — нет
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.side.01
    level: backend
    kind: side
    scenario: Строка личной таблицы снята (present = false), владельца в ней нет.
    expect: сигнал только совету
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.side.02
    level: backend
    kind: side
    scenario: Дельта необъявленной таблицы или чужого кооператива.
    expect: сигнала нет
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.side.03
    level: backend
    kind: side
    scenario: Шина сигналов отказала при публикации.
    expect: предупреждение в журнал, разбор цепи продолжается
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    external: unreachable
    external_reason: "отказ шины сигналов через API и паузой сервиса не вызвать: шина живёт внутри узла"
    status: passing

  - id: rt.cc.side.04
    level: backend
    kind: side
    scenario: Потребитель разобрал дельту объявленной таблицы.
    expect: >
      сигнал уходит после слушателей дельты и после пробуждения мутаций — по нему
      читается уже записанное
    test: components/controller/tests/unit/blockchain/blockchain-consumer.processFork.test.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.happy.03
    level: backend
    kind: happy
    scenario: Пайщик и член совета открывают подписку на ленту.
    expect: >
      каналы выбирает сервер: пайщику — общие таблицы и свои строки личных,
      совету — все строки личных; перечень таблиц сужает каналы
    test: components/controller/tests/unit/chain-changes/chain-changes.resolver.test.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.break.01
    level: backend
    kind: break
    scenario: Подписка на необъявленную таблицу, чужой кооператив, соединение без пайщика.
    expect: отказ по праву
    test: components/controller/tests/unit/chain-changes/chain-changes.resolver.test.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.ui.01
    level: ui
    kind: happy
    scenario: >
      Пайщик на профиле Благороста совершает взнос; профиль открыт у него и у
      председателя в другой вкладке.
    expect: >
      у обоих суммы профиля обновляются сами, без перезагрузки и без опроса по
      таймеру
    status: missing

  - id: rt.cc.ui.02
    level: ui
    kind: side
    scenario: >
      За время полёта перечитывания пришли ещё сигналы того же и следующего
      блока; экран сам перечитал после мутации.
    expect: >
      одно перечитывание в полёте, повторы сливаются в одно хвостовое; сигнал
      блока, уже прочитанного завершённым перечитыванием, пропускается
    decision_needed: false
    status: missing

  - id: rt.cc.ui.03
    level: ui
    kind: side
    scenario: Канал жив, срабатывает страховочная дочитка раз в минуту.
    expect: >
      экраны не перечитываются — страховка нужна только мёртвому каналу; при
      переподключении и возврате вкладки перечитываются
    decision_needed: false
    status: missing

  - id: rt.cc.happy.04
    level: backend
    kind: happy
    scenario: Запись в объявленную таблицу базы узла внутри транзакции.
    expect: >
      сигнал с блоком 0 уходит после фиксации — со строкой (владелец) и ключом;
      откат транзакции сигнала не даёт; запись вне транзакции — сигнал сразу
    test: components/controller/tests/unit/chain-changes/kysely-local-changes.plugin.test.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing

  - id: rt.cc.happy.09
    level: backend
    kind: happy
    scenario: Запись в объявленную таблицу базы узла через Kysely (вставка, правка, удаление).
    expect: >
      сигнал несёт ключ строки и саму строку: запросу без RETURNING он добавляется,
      свой RETURNING не подменяется; составной ключ — через двоеточие; чтение и
      ненаблюдаемая таблица сигнала не дают
    test: components/controller/tests/unit/chain-changes/kysely-local-changes.plugin.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: written

  - id: rt.cc.happy.05
    level: backend
    kind: happy
    scenario: Личная и служебная таблица базы узла расширения.
    expect: >
      личная — владельцу строки и персоналу; служебная — только персоналу;
      персонал — совет всегда и назначенные расширением только в своём расширении;
      несколько владельцев строки (участники звонка) — сигнал каждому, повторы и
      пустые имена отброшены
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    external: unreachable
    external_reason: "служебные таблицы и назначенный персонал есть только у расширения образования; в ветке dev оно не установлено"
    status: written   # прогон — CI на полигоне ci/tests

  - id: rt.cc.side.05
    level: backend
    kind: side
    scenario: Подписку открывает администратор образования вне совета и обычный пайщик.
    expect: >
      администратору — канал персонала служебной таблицы, пайщику — ничего
    test: components/controller/tests/unit/chain-changes/chain-changes.resolver.test.ts
    external: unreachable
    external_reason: "служебные таблицы и назначенный персонал есть только у расширения образования; в ветке dev оно не установлено"
    status: passing

  - id: rt.cc.ui.04
    level: ui
    kind: happy
    scenario: >
      Председатель подписывает договор преподавателя; у администратора открыт
      реестр преподавателей, у преподавателя — профиль; ученик записывается на
      курс, выдача доступа отрабатывает в фоне.
    expect: >
      карточка преподавателя, список одобрений, бейджи меню, профиль
      преподавателя, реестр учеников и подписки ученика обновляются сами, без
      перезагрузки и опросов
    status: missing

  - id: rt.cc.happy.06
    level: backend
    kind: happy
    scenario: Запись в таблицу Стола заказов — в его собственной базе и сырым UPDATE счётчиков предложения.
    expect: >
      подписчик базы расширения объявляет таблицы (корзина — личная по заказчику)
      и шлёт сигнал через порт после фиксации; таблица вне списка и узел без порта —
      тишина без ошибки; сырой UPDATE даёт сигнал по предложению, только если строка изменилась
    test: components/controller/tests/unit/marketplace/marketplace-live-feed.test.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: passing
    # До 25.09.2026 корзина менялась частичным update: сигнал терял владельца
    # и заказчику не приходил (тест единицы — cart-live-feed-owner.test.ts).

  - id: rt.cc.happy.07
    level: backend
    kind: happy
    scenario: Запись мимо подписчика базы узла — patchConfig расширения и запись в генератор (MongoDB).
    expect: >
      patchConfig — сигнал по extensions с именем расширения; личные данные, способы
      оплаты и пользовательские данные — сигнал по своей таблице владельцу и совету,
      переменные кооператива — всем; прочие коллекции и узел без ленты — тишина без ошибок
    test: components/controller/tests/unit/chain-changes/raw-writes-feed.test.ts
    api: components/api-tests/src/platform/realtime.chain-changes.test.ts
    status: written   # прогон — CI на полигоне ci/tests

  - id: rt.cc.happy.08
    level: backend
    kind: happy
    scenario: >
      Выплата через шлюз ждёт кассира — например, председатель отправил
      удержанный налог на перечисление.
    expect: >
      сигнал ленты по таблице выплат шлюза приходит совету с ключом строки;
      индексер публикует контракт gateway (parser2.config.yaml, в том числе в
      шаблоне раскатки). Приход шлюза создаётся и закрывается в одном блоке,
      дельты по нему нет — сигнал о нём несёт кошелёк пайщика
    test: components/api-tests/src/reports/withheld-tax.test.ts
    api: components/api-tests/src/reports/withheld-tax.test.ts
    status: passing

  - id: rt.cc.side.15
    level: backend
    kind: side
    scenario: >
      личная таблица расширения, переведённого на Kysely: учётная запись Matrix
      пайщика; транскрипция звонка с участниками по идентификаторам чата
    expect: >
      владелец строки объявлен по имени колонки базы (`coop_username`), иначе
      сигнал ушёл бы только совету; сигнал о транскрипции уходит участникам по
      именам пайщиков; сбой ленты запись расшифровки не роняет
    test: components/controller/tests/unit/chatcoop/chatcoop-live-feed.test.ts
    external: unreachable
    external_reason: "на стенде нет сервера чата с настоящими учётными записями Matrix: подставной узел отвечает за него, а строки matrix_users заводит только живой вход"
    status: written

  - id: rt.cc.side.16
    level: backend
    kind: side
    scenario: >
      транзакция каркаса расширения с записью в таблицу ленты: транзакция
      завершается; транзакция откатывается; запись вне транзакции
    expect: >
      сигнал уходит только после фиксации; откаченная запись сигнала не даёт;
      вне транзакции изменение публикуется сразу
    test: components/controller/tests/unit/chain-changes/kysely-local-changes.plugin.test.ts
    external: unreachable
    external_reason: "момент публикации сигнала относительно фиксации снаружи не различить; живое обновление столов покрыто случаями rt.cc.happy.*"
    status: written

  - id: rt.cc.side.17
    level: backend
    kind: side
    scenario: >
      Стол заказов объявляет свои таблицы в ленте, а сигналы о записи шлёт слой
      базы: состав объявленных таблиц, узел без порта ленты, резерв счётчиков
      предложения готовым запросом
    expect: >
      каждая объявленная таблица — таблица расширения (слой базы знает её ключ),
      корзина личная; без порта объявление молчит; после состоявшегося резерва
      сигнал публикует хранилище, после несостоявшегося сигнала нет
    test: components/controller/tests/unit/marketplace/marketplace-live-feed.test.ts
    external: unreachable
    external_reason: "состав объявления и момент сигнала снаружи не видны; живое обновление стола заказов покрыто случаями rt.cc.happy.*"
    status: written

# 2026-10-05 (C28-81): файлы и классы хранилищ переименованы после ухода с TypeORM
# (typeorm-repository → kysely-repository, typeorm-entity → record); частичная правка
# полей собрана помощником pickDefined. Сценарии фичи и её проверки не менялись.
