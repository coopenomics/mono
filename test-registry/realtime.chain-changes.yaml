feature: realtime.chain-changes
title: Лента изменений цепи — живое обновление экранов по факту из цепи

# Решение владельца 23.09.2026 (7DD-22). У каждого экрана, который загружает
# данные при открытии, — ws-зеркало: узел после разбора дельты шлёт сигнал «в
# таблице изменилась строка», экран перечитывает свои данные. Данных строки в
# сигнале нет. В ленту попадают только объявленные таблицы (ядро — свои,
# расширения — через CHAIN_CHANGES_PORT). Личные таблицы (кошельки, пайщики
# программ) доставляются только владельцу строки и совету.
#
# До этого живое обновление было у трёх подписок, а экраны держались на
# загрузке при открытии, опросах по таймеру и паузах после мутаций.
#
# Правка 23.09.2026 (7DD-22): в ленту идут и таблицы базы узла — данные
# расширений вне цепи. Расширение объявляет их (declareLocalTables), подписчик
# TypeORM публикует сигнал после фиксации записи — вызовы после каждого
# сохранения не нужны. Личные и служебные таблицы получает персонал: совет и
# назначенные расширением (setStaff — список, не проверка). Первым переведён
# стол образования целиком: администратор, ученик, преподаватель, бейджи меню,
# одобрения председателя; подключение ЦПП — в общем composable ядра.
#
# Правка 24.09.2026 (C28-83): в ленте ядра объявлены таблицы стола совета —
# soviet::decisions (личная по username: вопрос пайщика ему и совету) и
# soviet::boards (служебная). Повестка живёт по ним; маршрутизация сигналов
# и набор случаев прежние.
#
# Правка 24.09.2026 (C28-83): Стол заказов переведён на ленту целиком, его
# отдельная подписка marketplaceEvents снята. У расширения своя база, поэтому
# общая часть подписчика TypeORM вынесена в каркас (LocalChangesCollector), а
# расширение наблюдает свою базу само и публикует через порт (publishLocal).
# Сырой UPDATE счётчиков предложения публикует его репозиторий.

# Правка 24.09.2026 (C28-83, второй проход): подписчик Стола заказов объявляет
# и таблицу цепи marketplace::config (сбор с оборота); расширение расходов —
# плановые расходы (expense_plans, открыто). Снимок процесса перечитывается по
# таблицам шагов процесса (useLiveProcessSnapshot): у журнала действий своего
# сигнала нет.

# Правка 24.09.2026 (C28-83, третий проход): таблица extensions открыта всем
# пайщикам — установка и подключение расширения меняют рабочий стол каждого
# (сигнал данных строки не несёт); рабочий стол, столы и гранты живут по ленте
# (desktopLive). В ленте ядра — план счетов ledger2::accounts (совету);
# стол бухгалтера объявляет свои таблицы и soviet::taxes (служебные).

# Правка 24.09.2026 (C28-83, четвёртый проход): у строки может быть несколько
# владельцев — поле владельца со списком имён, сигнал каждому. Так живёт чат
# кооператива: транскрипцию получают участники звонка (идентификаторы Matrix
# переводятся в имена пайщиков в ChatcoopLiveFeedService), календарь — все,
# комнаты секретаря — совет, учётную запись Matrix — владелец. В ленте ядра —
# назначения наборов прав (participant_capability_sets) и журнал расширений.

# Правка 24.09.2026 (C28-83, пятый проход): закрыты записи мимо ленты.
# patchConfig расширений (шаги онбординга) пишет сырым SQL — сигнал по
# extensions шлёт репозиторий. Личные данные пайщика, способы оплаты,
# пользовательские данные и переменные кооператива живут в генераторе
# (MongoDB) — сигнал шлёт его сервис после save/del (private_accounts,
# payment_methods, user_data — владельцу и совету; coop_vars — всем).

#
# Правка 2026-09-25 (C28-85): корзина Стола заказов сохраняется целой строкой —
# сигнал ленты приходит заказчику с ключом строки; индексер публикует контракт
# gateway — лента по приходам и выплатам шлюза больше не молчит.
