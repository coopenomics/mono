feature: realtime.chain-changes
title: Лента изменений цепи — живое обновление экранов по факту из цепи

# Решение владельца 23.09.2026 (7DD-22). У каждого экрана, который загружает
# данные при открытии, — ws-зеркало: узел после разбора дельты шлёт сигнал «в
# таблице изменилась строка», экран перечитывает свои данные. Данных строки в
# сигнале нет. В ленту попадают только объявленные таблицы (ядро — свои,
# расширения — через CHAIN_CHANGES_PORT). Личные таблицы (кошельки, пайщики
# программ) доставляются только владельцу строки и совету.
#
# До этого живое обновление было у трёх подписок, а экраны держались на
# загрузке при открытии, опросах по таймеру и паузах после мутаций.
#
# Правка 23.09.2026 (7DD-22): в ленту идут и таблицы базы узла — данные
# расширений вне цепи. Расширение объявляет их (declareLocalTables), подписчик
# TypeORM публикует сигнал после фиксации записи — вызовы после каждого
# сохранения не нужны. Личные и служебные таблицы получает персонал: совет и
# назначенные расширением (setStaff — список, не проверка). Первым переведён
# стол образования целиком: администратор, ученик, преподаватель, бейджи меню,
# одобрения председателя; подключение ЦПП — в общем composable ядра.

sources:
  backend:
    - components/controller/src/infrastructure/blockchain/chain-changes.service.ts
    - components/controller/src/application/chain-changes/**
    - components/innercoop/src/core-ports/chain-changes.port.ts
    - components/controller/src/infrastructure/blockchain/local-changes.subscriber.ts
    - components/controller/src/extensions/edubridge/application/services/edubridge-live-feed.service.ts
  ui:
    - components/desktop/src/shared/lib/realtime/live-reload.ts
    - components/desktop/src/entities/System/model/chainChangesSubscription.ts
    - components/sdk/src/subscriptions/chain/**
    - components/desktop/extensions/edubridge/shared/lib/live.ts

cases:
  - id: rt.cc.happy.01
    level: backend
    kind: happy
    scenario: Изменилась строка таблицы, открытой всем пайщикам.
    expect: сигнал в общий канал кооператива, без данных строки
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    status: passing

  - id: rt.cc.happy.02
    level: backend
    kind: happy
    scenario: Изменилась строка личной таблицы (кошелёк, пайщик программы).
    expect: сигнал владельцу строки и совету; в общий канал — нет
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    status: passing

  - id: rt.cc.side.01
    level: backend
    kind: side
    scenario: Строка личной таблицы снята (present = false), владельца в ней нет.
    expect: сигнал только совету
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    status: passing

  - id: rt.cc.side.02
    level: backend
    kind: side
    scenario: Дельта необъявленной таблицы или чужого кооператива.
    expect: сигнала нет
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    status: passing

  - id: rt.cc.side.03
    level: backend
    kind: side
    scenario: Шина сигналов отказала при публикации.
    expect: предупреждение в журнал, разбор цепи продолжается
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    status: passing

  - id: rt.cc.side.04
    level: backend
    kind: side
    scenario: Потребитель разобрал дельту объявленной таблицы.
    expect: >
      сигнал уходит после слушателей дельты и после пробуждения мутаций — по нему
      читается уже записанное
    test: components/controller/tests/unit/blockchain/blockchain-consumer.processFork.test.ts
    status: passing

  - id: rt.cc.happy.03
    level: backend
    kind: happy
    scenario: Пайщик и член совета открывают подписку на ленту.
    expect: >
      каналы выбирает сервер: пайщику — общие таблицы и свои строки личных,
      совету — все строки личных; перечень таблиц сужает каналы
    test: components/controller/tests/unit/chain-changes/chain-changes.resolver.test.ts
    status: passing

  - id: rt.cc.break.01
    level: backend
    kind: break
    scenario: Подписка на необъявленную таблицу, чужой кооператив, соединение без пайщика.
    expect: отказ по праву
    test: components/controller/tests/unit/chain-changes/chain-changes.resolver.test.ts
    status: passing

  - id: rt.cc.ui.01
    level: ui
    kind: happy
    scenario: >
      Пайщик на профиле Благороста совершает взнос; профиль открыт у него и у
      председателя в другой вкладке.
    expect: >
      у обоих суммы профиля обновляются сами, без перезагрузки и без опроса по
      таймеру
    status: missing

  - id: rt.cc.ui.02
    level: ui
    kind: side
    scenario: >
      За время полёта перечитывания пришли ещё сигналы того же и следующего
      блока; экран сам перечитал после мутации.
    expect: >
      одно перечитывание в полёте, повторы сливаются в одно хвостовое; сигнал
      блока, уже прочитанного завершённым перечитыванием, пропускается
    decision_needed: false
    status: missing

  - id: rt.cc.ui.03
    level: ui
    kind: side
    scenario: Канал жив, срабатывает страховочная дочитка раз в минуту.
    expect: >
      экраны не перечитываются — страховка нужна только мёртвому каналу; при
      переподключении и возврате вкладки перечитываются
    decision_needed: false
    status: missing

  - id: rt.cc.happy.04
    level: backend
    kind: happy
    scenario: Запись в объявленную таблицу базы узла внутри транзакции.
    expect: >
      сигнал с блоком 0 уходит после фиксации — со строкой (владелец) и ключом;
      откат транзакции сигнала не даёт; запись вне транзакции — сигнал сразу
    test: components/controller/tests/unit/chain-changes/local-changes.subscriber.test.ts
    status: passing

  - id: rt.cc.happy.05
    level: backend
    kind: happy
    scenario: Личная и служебная таблица базы узла расширения.
    expect: >
      личная — владельцу строки и персоналу; служебная — только персоналу;
      персонал — совет всегда и назначенные расширением только в своём расширении
    test: components/controller/src/infrastructure/blockchain/chain-changes.service.spec.ts
    status: passing

  - id: rt.cc.side.05
    level: backend
    kind: side
    scenario: Подписку открывает администратор образования вне совета и обычный пайщик.
    expect: >
      администратору — канал персонала служебной таблицы, пайщику — ничего
    test: components/controller/tests/unit/chain-changes/chain-changes.resolver.test.ts
    status: passing

  - id: rt.cc.side.06
    level: backend
    kind: side
    scenario: >
      Образование объявляет свои таблицы в ленте, а стол слушает их по имени;
      в одном из трёх мест (сущность, объявление, стол) имя или поле владельца
      разошлось.
    expect: >
      объявленная таблица — таблица сущности образования, поле владельца —
      её колонка, стол слушает только объявленное сервером; расхождение
      роняет тест, а не выключает молча живое обновление экрана
    test: components/controller/tests/unit/edubridge/live-feed.test.ts
    status: passing

  - id: rt.cc.ui.04
    level: ui
    kind: happy
    scenario: >
      Председатель подписывает договор преподавателя; у администратора открыт
      реестр преподавателей, у преподавателя — профиль; ученик записывается на
      курс, выдача доступа отрабатывает в фоне.
    expect: >
      карточка преподавателя, список одобрений, бейджи меню, профиль
      преподавателя, реестр учеников и подписки ученика обновляются сами, без
      перезагрузки и опросов
    status: missing

