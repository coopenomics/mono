feature: edubridge.teacher
title: Образовательный мост — договор УХД, назначения, взнос РИД, решение совета, расчёт

# E8 (задача 7DD-9). Преподаватель после оферты подписывает ДУХД (3006) — без
# действующего договора ни отчитаться по занятию, ни взнос подать. Допуск к
# курсу — назначение без документа: действует с момента, когда администратор
# поставил преподавателя на курс. Взнос: заявление 3008 → submitrid →
# проект свободного решения совета с правилом отслеживания → DecisionTrackedEvent
# → COUNCIL_APPROVED → акт 3010 подписывает преподаватель → acceptrid с
# протоколом 3009 (Дт 04 / Кт 08 и Дт 76 / Кт 80 с переводом w.edu.hold →
# w.wal.share). Отклонение — declinerid с причиной.
#
# Материалы занятия до заявления лежат на ответственном хранении: акт 3012 →
# holdrid (Дт 08 / Кт 76, w.edu.hold). Рекламация внутри срока — recallrid
# (Дт 76 / Кт 08). Расчёт: сумма принятых и доступное в кошельке;
# возврат — штатным механизмом платформы.
#
# Правка 24.09.2026 (7DD-22), решение владельца: преподаватель, добавленный в
# курс, получает назначение сам — иначе курс стоял в «Курс ведут», а на столе
# преподавателя было пусто.
#
# Правка 01.10.2026 (7DD-22), решение владельца: приложение к договору на курс
# (3007) выведено целиком — юридически оно лишнее, условия участия определяет
# договор. Допуск остаётся рабочим назначением: действует сразу, подписей и
# одобрения председателя не требует, в цепь не уходит; список «Курс ведут» и
# действующие назначения — одно и то же.
#
# Правка 02.10.2026 (7DD-22), решение владельца: подключение преподавателя
# начинается со ставки за час и рассказа о себе — отдельным первым шагом, до
# оферты и договора (раньше ставку спрашивали под текстом договора, а сведений
# о преподавателе не было вовсе). Рассказ живёт в профиле преподавателя, его
# видит администратор в карточке; ставка после подписи договора закреплена.
sources:
  contract:
    - components/contracts/cpp/edubridge/src/p.edu.teach/**
    - components/contracts/cpp/edubridge/src/p.edu.rid/**
    - components/contracts/cpp/lib/domain/table_edubridge_rids.hpp
    - components/contracts/cpp/lib/domain/table_edubridge_contracts.hpp
  backend:
    - components/controller/src/extensions/edubridge/application/services/edubridge-teacher.service.ts
    - components/controller/src/extensions/edubridge/application/listeners/edubridge-approval.listener.ts
    - components/controller/src/extensions/edubridge/infrastructure/repositories/edubridge-teacher.kysely-repository.ts
    - components/controller/src/extensions/edubridge/infrastructure/entities/edubridge-teacher-contract.record.ts
    - components/controller/src/extensions/edubridge/infrastructure/entities/edubridge-teacher-assignment.record.ts
    - components/controller/src/extensions/edubridge/infrastructure/entities/edubridge-teacher-profile.record.ts
    - components/controller/src/extensions/edubridge/application/resolvers/edubridge-teacher.resolver.ts
    - components/controller/src/extensions/edubridge/application/dto/edu-teacher.dto.ts
    - components/factory/test/education-contract.test.ts
    - components/cooptypes/src/cooperative/registry/3006.EducationParticipationContract/**
    - components/factory/src/Actions/3006.EducationParticipationContract.ts
    - components/cooptypes/src/cooperative/registry/3012.EducationRidStorageAct/**
    - components/factory/src/Actions/3012.EducationRidStorageAct.ts
    - components/controller/src/extensions/edubridge/domain/lib/lesson-dates.ts
    - components/controller/src/extensions/edubridge/application/onboarding/register-edubridge-documents.ts
    - components/controller/src/extensions/edubridge/application/listeners/edubridge-membership-exit.listener.ts
    - components/controller/src/extensions/edubridge/application/services/edubridge-exit-blockers.service.ts
  ui:
    - components/desktop/extensions/edubridge/pages/AdminTeachersPage/**
    - components/desktop/extensions/edubridge/pages/AdminContributionsPage/**
    - components/desktop/extensions/edubridge/pages/TeacherAssignmentsPage/**
    - components/desktop/extensions/edubridge/pages/TeacherContributionsPage/**
    - components/desktop/extensions/edubridge/pages/TeacherSettlementPage/**
    - components/desktop/extensions/edubridge/entities/Teacher/**

cases:
  - id: edu.teach.happy.06
    level: backend
    kind: happy
    scenario: Стол администратора открывает список преподавателей кооператива.
    expect: Каждый подписавший договор виден с именем и фотографией из ядра, номером договора и числом назначений — всего и действующих.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: written
  - id: edu.teach.side.06
    level: backend
    kind: side
    scenario: Закрытое назначение; пайщик без сертификата и без фотографии; ни одного подписанного договора.
    expect: Закрытое в действующие не идёт; вместо имени пусто, фотографии нет; список пуст.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: written
  - id: edu.teach.break.01
    level: backend
    kind: break
    scenario: Взнос без подписанного ДУХД; отчёт по занятию при снятом допуске к курсу.
    expect: "BadRequest с объяснением: нужен действующий договор; допуск к курсу снят."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.01
    level: backend
    kind: happy
    scenario: Подача взноса РИД.
    expect: submitrid в цепь, проект решения совета опубликован, правило отслеживания с rid_hash, статус SUBMITTED.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.02
    level: backend
    kind: happy
    scenario: Совет принял решение; преподаватель подписал акт.
    expect: COUNCIL_APPROVED с номером решения → acceptrid с протоколом 3009 и актом → ACCEPTED; акт до решения недоступен; чужие решения игнорируются.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.03
    level: backend
    kind: happy
    scenario: Отклонение взноса.
    expect: declinerid, DECLINED, причина сохранена.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.04
    level: backend
    kind: happy
    scenario: Расчёт преподавателя.
    expect: Сумма принятых взносов и доступное в главном кошельке.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.01
    level: backend
    kind: side
    scenario: Акт двухподписный — преподаватель подписал (ACT_SIGNED), председатель подписывает тот же документ (агрегат по хэшу, signatureId=2) → acceptrid.
    expect: Перегенерации акта нет; без обеих подписей или с другим хэшем приём отклоняется; acceptrid требует подпись teacher и chairman совета.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.05
    level: ui
    kind: happy
    scenario: Преподаватель подписывает ДУХД, видит курс в назначениях без подписей, подаёт взнос, после решения совета подписывает акт, видит расчёт.
    expect: Статусы меняются по шагам; кнопки показываются только в допустимом состоянии.
    test: ~
    status: missing
  - id: edu.teach.side.02
    level: backend
    kind: side
    scenario: "Договор УХД двухподписный через одобрение председателя: преподаватель подписывает (signcontract в цепь, PENDING_APPROVAL), пока председатель не подписал — отчёт по занятию и взнос недоступны, хотя допуск к курсу уже есть; коллбэк apprvcontr → ACTIVE, dclinecontr → DECLINED с причиной и повторная подпись; действующий договор повторно не подписывается; документ без подписи преподавателя в цепь не уходит."
    expect: "Статусы переводит только слушатель коллбэков совета; повторная подпись отклонённого договора создаёт новую запись в цепи."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: written
  - id: edu.teach.side.03
    level: backend
    kind: side
    scenario: "Допуск к курсу без документа: назначение создаётся действующим, в цепь ничего не уходит, преподаватель попадает в список «Курс ведут»; снятие допуска закрывает назначение и убирает преподавателя из курса; несуществующее назначение — отказ."
    expect: "Подписи преподавателя и одобрения председателя допуск не требует; действий приложения к договору у расширения нет; снятый допуск сверка по курсу заново не выдаёт."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.04
    level: backend
    kind: side
    scenario: "Документ (договор, заявление РИД) уходит в контракт через адаптер цепи: meta-объект сериализуется в строку JSON, строковая meta не трогается, отсутствующая → «{}»; без ключа кооператива в хранилище транзакция не отправляется; действия для приложения к договору у адаптера нет."
    expect: "В таблице approvals совета meta документа — валидный JSON; синхронизатор одобрений записывает запрос, и он виден на столе председателя (инцидент 02.09.2026: «[object Object]» → запрос не доходил)."
    test: components/controller/tests/unit/edubridge/chain.adapter.test.ts
    status: written
  - id: edu.teach.contract.01
    level: contract
    kind: happy
    scenario: "edubridge::signcontract → Soviet::create_approval; soviet::confirmapprv → edubridge::apprvcontr публикует двухподписный договор (make_complete_document) и переводит educontracts в active; submitrid требует active-договор; действий и таблицы приложения к договору на курс в контракте нет."
    expect: "Стандарт p.edu.teach; отказ dclinecontr стирает ожидающую запись; допуск к курсу в цепи не хранится."
    test: components/contracts/cpp/edubridge/p.edu.teach.standard.yaml
    status: written
  - id: edu.teach.ui.02
    level: ui
    kind: happy
    scenario: "Стол преподавателя показывает договор «ждёт подписи председателя» / «действует» / «отклонён: причина»; курсы, к которым он допущен, видны в назначениях сразу, без подписей; стол председателя показывает запрос «Договор УХД преподавателя» и подписывает его второй подписью."
    expect: "После подписи председателя без перезагрузки статусы обновляются по данным сервера."
    test: ~
    status: missing
  - id: edu.teacher.doc.01
    level: backend
    kind: happy
    scenario: "Бланк договора УХД для совета и экземпляр для пайщика (3006) генерируются фабрикой по редакции владельца «Договор УХД_Преподаватели_ПВ»: 9 разделов, 12 терминов, реквизиты сторон и Дополнительные условия по ответственному хранению Имущества."
    expect: "Текст разделов 1–9 и Дополнительных условий в бланке и экземпляре совпадает дословно; экземпляр подставляет номер, дату, протокол утверждения и пайщика без незаполненных мест; бланк — прочерками; повторная генерация даёт тот же хэш."
    test: components/factory/test/education-contract.test.ts
    status: written

  - id: edu.teach.happy.07
    level: backend
    kind: happy
    scenario: Преподаватель отчитывается о проведённом занятии материалами.
    expect: Взнос равен часам занятия по ставке преподавателя; заявление держится гарантийный срок курса.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.break.04
    level: backend
    kind: break
    scenario: Отчёт по занятию вне плана курса и повторный отчёт по тому же занятию.
    expect: Отказ в обоих случаях — журнал ведётся по программе курса.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.07
    level: backend
    kind: side
    scenario: Подписанное заявление в гарантийный срок.
    expect: В совет не уходит, держится расширением; по истечении срока отправляется очередью само.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.08
    level: backend
    kind: side
    scenario: Подтверждённая рекламация в гарантийный срок.
    expect: Материалы снимаются с ответственного хранения проводкой Дт 76 / Кт 08, заявление закрывается с причиной, взнос не оформляется.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.08
    level: backend
    kind: happy
    scenario: Преподаватель подписывает акт передачи материалов занятия на ответственное хранение.
    expect: В цепь уходит holdrid с датой окончания гарантийного срока, взнос переходит в состояние «на ответственном хранении», акт сохранён.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.break.05
    level: backend
    kind: break
    scenario: Повторная передача тех же материалов; заявление по материалам, не принятым на хранение.
    expect: Отказ в обоих случаях — хранение открывается один раз и предшествует заявлению.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.09
    level: backend
    kind: side
    scenario: Рекламация по материалам, которые на ответственное хранение не передавались.
    expect: Взнос закрывается без проводок — снимать с хранения нечего.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.10
    level: backend
    kind: side
    scenario: Отчёт о занятии задним числом и курс с нулевой гарантией — срок хранения в прошлом.
    expect: Материалы принимаются на ответственное хранение, заявление уходит в совет сразу.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.10
    level: backend
    kind: happy
    scenario: Расширение объявляет свои документы в реестре шаблонов кооператива.
    expect: Объявлены положение, обе оферты, договор участия, бланки (включая акт хранения 3012) и протокол совета; шаблоны-двойники не объявляются, прежние декларации снимаются.
    test: components/controller/tests/unit/edubridge/document-declarations.test.ts
    status: passing
  - id: edu.teach.happy.09
    level: backend
    kind: happy
    scenario: Акт передачи материалов на ответственное хранение (3012) формируется по отчёту о занятии.
    expect: В акте названы курс, номер и тема занятия, состав материалов, оценка и дата окончания срока хранения; сказано, что паевым взносом материалы становятся по решению совета.
    test: components/factory/test/education-rid-storage-act.test.ts
    status: passing
  - id: edu.teach.ui.03
    level: ui
    kind: happy
    scenario: "Стол преподавателя — страница «Занятия»: отчёт с материалами, журнал проведённых; на странице взносов виден гарантийный срок."
    expect: Произвольная сумма взноса недоступна, номер занятия подставляется следующим.
    test: ~
    status: missing
  - id: edu.teach.side.11
    level: backend
    kind: side
    scenario: "Совет решения по заявлению не принял, председатель отказывает в приёме."
    expect: "Протокол не собирается; материалы снимаются с хранения recallrid с основанием, взнос отклонён."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.12
    level: backend
    kind: side
    scenario: "Решение совета есть, приём не состоялся — председатель закрывает заявление."
    expect: "declinerid с протоколом 3009 по номеру принятого решения; recallrid не вызывается."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.break.08
    level: backend
    kind: break
    scenario: "Сбой после submitrid: проект решения совета не создан."
    expect: "Статус SUBMITTED и подписанное заявление сохранены сразу; очередь доводит взнос до совета без повторной подачи в цепь."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.break.06
    level: backend
    kind: break
    scenario: "Цепь отвечает «уже подано» на повторный submitrid."
    expect: "Подача продолжается с проекта решения; иная ошибка цепи статус не меняет."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.13
    level: backend
    kind: side
    scenario: "Отчёт о занятии задним числом при гарантийном сроке курса."
    expect: "Срок хранения идёт от приёма материалов (акт 3012), а не от даты занятия; акт и цепь называют одну дату; устаревший акт не подписывается."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.break.07
    level: backend
    kind: break
    scenario: "Дата занятия в будущем либо раньше периода назначения; длительность больше сдвоенного занятия курса."
    expect: "Отчёт отклоняется до записи в журнал."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.14
    level: backend
    kind: side
    scenario: "Материалы занятия сняты с хранения — занятие проводится и отчитывается заново."
    expect: "Строка журнала та же, взнос новый с другим ключом."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.happy.11
    level: backend
    kind: happy
    scenario: "Прекращение договора УХД: выход преподавателя из кооператива либо соглашение сторон."
    expect: "termcontract в цепь, статус «прекращён»; договор подписывается заново, в том числе с новой ставкой."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.15
    level: backend
    kind: side
    scenario: "Прекращение договора при действующих назначениях либо незакрытых взносах; без основания; повторно."
    expect: "Отказ до обращения к цепи; прекращённый и отсутствующий договор в цепь не идут."
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.teach.side.16
    level: backend
    kind: side
    scenario: "Заявление о выходе из кооператива подано преподавателем."
    expect: "Подписки закрываются, договор УХД прекращается; сбой прекращения выход не роняет."
    test: components/controller/tests/unit/edubridge/membership-exit.listener.test.ts
    status: passing
  - id: edu.teach.side.17
    level: backend
    kind: side
    scenario: "Материалы на хранении без подписанного заявления держат выход."
    expect: "Причина называет действие преподавателя — подписать заявление, а не ожидание."
    test: components/controller/tests/unit/edubridge/exit-blockers.test.ts
    status: passing
  - id: edu.teach.contract.07
    level: contract
