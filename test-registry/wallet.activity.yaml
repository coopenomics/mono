feature: wallet.activity
title: Кошелёк пайщика — движения по кошелькам и заявки в работе

# Решение владельца 04.11.2026: на странице кошелька под карточками кошельков —
# блок «В работе» (заявки на выплату до решения совета, выплаты у кассира,
# неоплаченные пополнения) и история «Движения» по всем кошелькам пайщика.
# Нажатие на карточку кошелька отбирает историю по этому кошельку, строка
# открывает справа сумму, состояние и документы процесса — операции и проводки
# учёта пайщику не показываются (их читает совет).
#
# Кошелёк и направление строки выводятся из реестра операций по коду: учётная
# книга хранит операцию, а не то, чей это кошелёк. Операция пайщика, которая
# не трогает его кошельки (выплата возврата из резерва кооператива, выплата
# матпомощи из фонда), показывается шагом процесса без знака суммы.

sources:
  backend:
    - components/controller/src/application/wallet/services/wallet-activity.service.ts
    - components/controller/src/application/wallet/dto/wallet-activity.dto.ts
  ui:
    - components/desktop/src/widgets/Wallet/WalletActivity/**
    - components/desktop/src/entities/Wallet/api/activity.ts
    - components/desktop/src/entities/Wallet/model/movementsFilter.ts

cases:
  - id: wallet.activity.happy.01
    level: backend
    kind: happy
    scenario: >
      Пайщик открывает историю движений по своим кошелькам без отбора
    expect: >
      все операции пайщика, свежие сверху, по страницам; пополнение —
      поступление на паевой кошелёк, резерв под возврат — списание, выплата
      возврата из резерва — шаг процесса; строка несёт хэш процесса
    test: components/controller/tests/unit/wallet/wallet-activity.service.test.ts
    external: unreachable
    external_reason: "история строится по операциям цепи пайщика — снаружи проверяется сценарием docs-harness страницы кошелька"
    status: written

  - id: wallet.activity.side.01
    level: backend
    kind: side
    scenario: >
      Отбор истории по одному кошельку; перевод между своими кошельками с
      отбором и без
    expect: >
      с отбором — только операции этого кошелька, перевод показан
      поступлением или списанием относительно выбранного; без отбора — переводом
    test: components/controller/tests/unit/wallet/wallet-activity.service.test.ts
    external: unreachable
    external_reason: "отбор — свойство запроса истории, снаружи проверяется сценарием docs-harness"
    status: written

  - id: wallet.activity.happy.02
    level: backend
    kind: happy
    scenario: >
      Блок «В работе»: заявка на выплату до решения совета, выплата у кассира,
      неоплаченное пополнение, исполненный платёж
    expect: >
      заявка — «на рассмотрении совета», выплата — «ожидает кассира»,
      пополнение — «ожидает оплаты»; исполненное не показывается; новые сверху;
      вид словами и реквизиты заявки
    test: components/controller/tests/unit/wallet/wallet-activity.service.test.ts
    external: unreachable
    external_reason: "заявка до решения совета заводится подачей и голосованием — снаружи сценарием docs-harness"
    status: written

  - id: wallet.activity.ui.01
    level: ui
    kind: happy
    scenario: >
      Пайщик открывает «Кошелёк», нажимает на карточку кошелька и на строку
      движения
    expect: >
      под карточками — «Движения» (и «В работе», когда есть заявки); нажатие
      на карточку отбирает историю, «Все кошельки» снимает отбор; строка
      открывает справа сумму, состояние и документы процесса без операций и
      проводок учёта
    test: components/docs-harness/scenarios/participant/wallet.mjs
    status: written
