feature: platform.access-roles
title: Платформа — назначаемые роли приложений и управление доступом

# Председатель выдаёт пайщику доступ к отдельным страницам ролью (C28-90).
# Роль объявляет приложение: её права записаны в таблице прав приложения, а
# ядро ведёт только связь «роль — пайщик» — кто назначил и когда, кто снял —
# и показывает объявленные роли на странице управления доступом стола
# председателя. Роли: кассир — реестр платежей стола совета, бухгалтер — стол
# бухгалтера целиком; каждую объявляет своё приложение. Ключ роли
# уникален среди всех приложений, повтор останавливает запуск узла.

sources:
  backend:
    - components/controller/src/application/access-roles/**
    - components/controller/src/domain/access-roles/**
    - components/controller/src/infrastructure/database/kysely/repositories/role-assignment.kysely-repository.ts
    - components/innercoop/src/core-ports/role-assignments.port.ts
    - components/controller/src/extensions/reports/application/access/**
    - components/desktop/extensions/reports/shared/lib/rights.ts
    - components/controller/src/extensions/innercoop-bridge.module.ts
  ui:
    - components/desktop/extensions/chairman/pages/AccessRolesPage/**
    - components/desktop/extensions/chairman/entities/AccessRole/**

cases:
  - id: access.roles.happy.01
    level: backend
    kind: happy
    scenario: приложения объявляют свои назначаемые роли при запуске
    expect: роли складываются в один перечень, у каждой названо приложение
    test: components/controller/tests/unit/access-roles/role-assignments-registry.test.ts
    api: components/api-tests/src/platform/access-roles.test.ts
    status: written   # прогон — CI на полигоне ci/tests

  - id: access.roles.happy.02
    level: backend
    kind: happy
    scenario: приложение спрашивает роли пайщика
    expect: получает только свои назначенные роли
    test: components/controller/tests/unit/access-roles/role-assignments-registry.test.ts
    api: components/api-tests/src/platform/access-roles.test.ts
    status: written   # прогон — CI на полигоне ci/tests

  - id: access.roles.happy.03
    level: backend
    kind: happy
    scenario: председатель назначает роль действующему пайщику
    expect: назначение записано с именем назначившего, пайщик уведомлён, роль показывает держателя
    test: components/controller/tests/unit/access-roles/access-roles.service.test.ts
    api: components/api-tests/src/platform/access-roles.test.ts
    status: written   # прогон — CI на полигоне ci/tests

