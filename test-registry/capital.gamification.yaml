feature: capital.gamification
title: Уровень и энергия участника программы «Благорост»

# Энергия измеряется в процентах пути до следующего уровня: вклад размером
# level_depth_base закрывает уровень целиком, при 100 энергии уровень растёт,
# остаток переносится. Энергия убывает со временем (energy_decay_rate_per_day).
#
# Единственный источник энергии — денежная инвестиция в программу
# (capital::createpinv). Коммиты РИД и приём результата энергию не начисляют.
# Вызовы ledger2::apply в этих операциях передают имя нитки процесса
# (см. test-registry/ledger2.process-naming.yaml) — поведение самой фичи
# не меняется.
#
# Допуск к самому взносу описан отдельным слайсом
# (test-registry/capital.program-invest.yaml): взнос в программу больше не
# требует одобренного председателем договора об участии в хозяйственной
# деятельности, достаточно подписи пайщика. На начисление энергии это не влияет —
# формула считается от суммы взноса, а не от статуса договора.
sources:
  contract:
    - components/contracts/cpp/capital/domain/core/gamification/**
    - components/contracts/cpp/capital/app/invests_managment/invest_in_program/invest_to_program/createpinv.cpp
  ui:
    - components/desktop/extensions/capital/widgets/ContributorGamificationWidget/**

cases:
  # ── Уровень контракта ─────────────────────────────────────────────────────

  - id: cap.gam.happy.01
    level: contract
    kind: happy
    scenario: >
      Участник первого уровня вносит в программу сумму, равную базовой сумме
      уровня (level_depth_base, по умолчанию 10 000 ₽) при коэффициенте
      прироста 1.
    expect: >
      начисляется ровно 100 энергии — участник переходит на второй уровень,
      остаток энергии обнуляется
    test: ~
    status: missing

  - id: cap.gam.break.01
    level: contract
    kind: break
    scenario: >
      Доля вклада от требования уровня не переводится в проценты: начисление
      считается как доля (0..1), а порог уровня — 100.
    expect: >
      начисление занижено ровно в сто раз, и уровень требует миллиона рублей
      вместо десяти тысяч. Интерфейс при этом подсказывает сумму по верной
      формуле, поэтому пайщик вносит ровно столько, сколько показано, и не
      видит никакого движения. Проверять на паре «сумма из подсказки →
      уровень вырос»
    test: ~
    status: missing

  - id: cap.gam.side.01
    level: contract
    kind: side
    scenario: вклад, кратно перекрывающий требование уровня
    expect: >
      уровень растёт сразу на несколько ступеней, остаток энергии — дробная
      часть сверх последнего перехода
    test: ~
    status: missing

  - id: cap.gam.side.02
    level: contract
    kind: side
    scenario: нулевая или отрицательная сумма вклада
    expect: энергия не начисляется, уровень не меняется
    test: ~
    status: missing

  - id: cap.gam.side.03
    level: contract
    kind: side
    scenario: >
      требование растёт с уровнем (level_growth_coefficient): тот же вклад на
      втором уровне
    expect: >
      начисление меньше, чем на первом, ровно во столько раз, во сколько
      выросло требование
    test: ~
    status: missing

  - id: cap.gam.side.04
    level: contract
    kind: side
    scenario: инвестиция участника, у которого нет кошелька в программе
    expect: отказ до начисления энергии
    test: ~
    status: missing

  - id: cap.gam.side.08
    level: contract
    kind: side
    scenario: >
      вклад пайщика, чей договор об участии в хозяйственной деятельности
      подписан, но ещё не одобрен председателем
    expect: >
      энергия и уровень начисляются так же, как одобренному: статус договора
      в формулу не входит
    test: ~
    status: missing

  - id: cap.gam.side.07
    level: contract
    kind: side
    scenario: >
      кооператив, которому конфигурацию не задавали явно — работает на
      значениях по умолчанию
    expect: >
      вклад размером level_depth_base даёт ровно один уровень. Прежде дефолт
      множителя в контракте (10.0) расходился с дефолтом бэкенда (1.0), и
      кооператив без явной настройки набирал уровни в десять раз быстрее
      настроенного
    test: ~
    status: missing

  # ── Уровень UI ────────────────────────────────────────────────────────────

  - id: cap.gam.side.05
    level: ui
    kind: side
    scenario: подсказка «до следующего уровня» и фактическое начисление
    expect: >
      сумма из подсказки, внесённая в программу, действительно закрывает
      уровень — формулы интерфейса и цепи совпадают
    test: ~
    status: missing

  - id: cap.gam.side.06
    level: ui
    kind: side
    scenario: мелкое начисление энергии (доли процента)
    expect: >
      изменение видно пайщику. Сейчас энергия округляется до целых процентов,
      поэтому небольшой вклад не меняет показания вовсе
    test: ~
    status: missing
