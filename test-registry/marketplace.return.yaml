feature: marketplace.return
title: Гарантийный возврат имущества — заявление заказчика и обработка на участке

# Право на возврат задаёт председатель при одобрении предложения: гарантийный
# срок в днях. Нулевой срок означает, что возврат по такому предложению не
# предусмотрен вовсе, и заявление подать нельзя — это не отказ в правах, а
# отсутствие самой возможности.
#
# Заявление подаётся из карточки полученного заказа; отдельной страницы
# возвратов у заказчика нет. Обработка — на столе пункта выдачи.
#
# Фото к заявлению о возврате хранятся через порт файлового хранилища
# (`FILE_STORAGE_PORT` из `@coopenomics/innercoop/core-ports`, ранее
# `INTER_FILE_STORAGE` из `@coopenomics/inter`). Переименование 2026-08-09 —
# только имена, поведение и набор случаев не менялись.

# Паевая модель (компонент 68, 2026-09-06; уточнение 08.09.2026, 99D-12):
# пайщик подаёт рекламацию 1106; у стойки оператор принимает имущество и
# подписывает своё заявление в совет об отмене сделки 1116, которое уходит на
# повестку; деньги двигаются только по решению совета (onmktrtauth — все
# движения по заказу откатываются одной транзакцией, протокол 1117), при
# отказе имущество ждёт пайщика на участке, оператор выдаёт его обратно.

sources:
  contract:
    - components/contracts/cpp/marketplace/src/p.mkt.return/accretrn.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.return/onmktrtauth.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.return/onmktrtdecl.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.return/handback.cpp
    - components/contracts/cpp/branch/src/retfee.cpp
  backend:
    - components/controller/src/extensions/marketplace/application/services/marketplace-return*.ts
  ui:
    - components/desktop/src/pages/Marketplace/OrdererReturnClaims/**
    - components/desktop/src/pages/Marketplace/OrdererOrderDetail/**
    - components/desktop/src/pages/Marketplace/OperatorReturnClaims/**
    - components/desktop/src/pages/Marketplace/OperatorReturnClaimDetail/**

cases:
  # Уровень backend, а не ui: на стенде предложение одобряется с ненулевым
  # гарантийным сроком (иначе вся ветка возврата недостижима — срок снимается
  # в заказ при оформлении и на выдаче замораживается, задним числом его не
  # поднять). Нулевой срок в одном и том же прогоне воспроизвести нельзя, а
  # само правило живёт в сервисе и проверяется там.
  - id: mkt.ret.side.01
    level: backend
    kind: side
    scenario: >
      Заявление на возврат по заказу, у предложения которого гарантийный срок нулевой.
    expect: отказ — по такому заказу гарантия не предусмотрена, заявление не заводится
    test: components/controller/tests/unit/marketplace/marketplace-return-claim-validation.test.ts
    status: passing

  - id: mkt.ret.happy.01
    level: ui
    kind: happy
    scenario: >
      Заказчик подаёт заявление на гарантийный возврат по заказу, у которого гарантийный срок не истёк.
    expect: заявление создано и видно оператору участка
    test: components/docs-harness/scenarios/marketplace/orderer/returns.mjs
    status: passing

  - id: mkt.ret.happy.02
    level: ui
    kind: happy
    scenario: Оператор участка принимает возвращаемое имущество по заявлению
    expect: >
      заявление уходит на решение совета; после решения «за» имущество в остатке,
      паевой взнос восстановлен заказчику; после «против» имущество ждёт пайщика
    test: ~ # было: components/docs-harness/scenarios/marketplace/operator/return-accept.mjs
    status: missing
    # Паевая модель (2026-09-06): приём у стойки больше не восстанавливает
    # средства — решает совет. Сценарий harness переписать (голосование совета
    # на стенде); до этого — pending.
    # ЗАБЛОКИРОВАН ДЕФЕКТОМ КОНТРАКТА (подтверждён прогоном 2026-08-09).
    # Сценарий доходит до последнего шага: удалённое одобрение проходит,
    # заявление получает APPROVED_FOR_VISIT, очный осмотр подписывается — и
    # цепь отбивает `accretrn`:
    #   assertion failure with message: memo не должен превышать 255 символов
    #
    # Причина в длине служебного описания проводки. `memo.size()` в контракте
    # считает БАЙТЫ, а кириллица в UTF-8 занимает по два. Строка
    # `get_return_fee_from_common_memo` (lib/core/marketplace/memo.hpp) при
    # однозначных идентификаторах весит 266 байт при пределе 255 — то есть не
    # помещается НИКОГДА, при любых номерах заявления и заказа.
    #
    # Срабатывает на ветке `fee_refund.amount > 0` (accretrn.cpp): то есть при
    # возврате любого заказа, за который уплачен членский взнос. На стенде
    # заказ 250 ₽ + взнос 75 ₽ — ветка обязательная, обойти её нельзя.
    # Соседнее `get_return_fee_to_member_memo` весит 239 байт: сейчас проходит,
    # но запас всего 16 байт.
    #
    # Следствие: принять гарантийный возврат невозможно — средства пайщику не
    # возвращаются, имущество на склад не зачисляется.
    # Не чиню: правка в C++ требует пересборки контракта и деплоя на цепь,
    # а деплой без отдельного согласования запрещён.

  - id: mkt.ret.side.02
    level: backend
    kind: side
    scenario: Заявление подано после истечения гарантийного срока
    expect: отказ с указанием, что срок истёк
    test: components/controller/tests/unit/marketplace/marketplace-return-claim-validation.test.ts
    status: passing

  - id: mkt.ret.side.03
    level: backend
    kind: side
    scenario: Заявление на возврат по чужому заказу
    expect: отказ доступа
    test: components/controller/tests/unit/marketplace/marketplace-return-claim-validation.test.ts
    status: passing

  - id: mkt.ret.side.04
    level: backend
    kind: side
    scenario: Возвращается больше единиц, чем было получено
    expect: отказ — вернуть больше полученного нельзя
    test: components/controller/tests/unit/marketplace/marketplace-return-claim-validation.test.ts
    status: passing

  # Решение заказчика (2026-08-08): частичный возврат серией заявлений
  # допустим — заявление не закрывает позицию целиком.
  - id: mkt.ret.side.05
    level: backend
    kind: side
    scenario: Новое заявление по заказу, у которого прежнее уже закрыто
    expect: >
      заявление принимается, пока по заказу остаётся невозвращённый остаток; одновременно открытым может быть только одно заявление
    test: components/controller/tests/unit/marketplace/marketplace-return-claim-validation.test.ts
    status: passing

  - id: mkt.ret.side.19
    level: backend
    kind: break
    scenario: >
      Серия заявлений, суммарно превышающая выданное количество: выдано 10, первое заявление на 6 принято на визите, второе подаётся ещё на 10
    expect: >
      отказ — суммарно нельзя вернуть больше выданного; остаток к возврату считается за вычетом уже принятых возвратов
    test: ~
    status: missing
    # ДЕФЕКТ ПРОДУКТА, подтверждён чтением кода (2026-08-08).
    # `resolveActualQuantity` сверяет запрошенное количество с полным выданным
    # (`issuance_fact.actual_quantity ?? quantity`) и НЕ вычитает уже
    # возвращённое. Ограничение `findActiveByOrderId` смотрит только на
    # PENDING_CHAIRMAN_REVIEW / APPROVED_FOR_VISIT, поэтому после
    # ACCEPTED_AT_VISIT заказ снова свободен для нового заявления на полный
    # объём. До решения о серии дефект был недостижим — заявление де-факто
    # было одноразовым; с разрешённой серией он открывается.
    # Не чиню: заказчик вынес подачу заявления на возврат в отдельную работу.

  - id: mkt.ret.side.06
    level: ui
    kind: side
    scenario: Заявление на возврат по заказу, который ещё не получен
    expect: действие недоступно до факта выдачи
    test: components/docs-harness/scenarios/marketplace/orderer/order-no-return-yet.mjs
    status: passing

  - id: mkt.ret.side.07
    level: ui
    kind: side
    scenario: Оператор открывает раздел гарантийных возвратов участка
    expect: >
      раздел доступен, объясняет порядок (удалённое решение → очный осмотр → приём возврата) и предлагает сканер для QR из заявки пайщика
    test: components/docs-harness/scenarios/marketplace/operator/returns.mjs
    status: passing

  - id: mkt.ret.side.08
    level: backend
    kind: side
    scenario: Заявление на возврат без причины либо с причиной длиннее предела
    expect: >
      отказ с конкретным сообщением; заказ не читается, состояние не меняется
    test: components/controller/tests/unit/marketplace/marketplace-return-claim-validation.test.ts
    status: passing

  - id: mkt.ret.side.09
    level: backend
    kind: side
    scenario: >
      Заявление без фотографий либо с числом фотографий сверх предела
    expect: >
      отказ с конкретным сообщением; допустимая граница (ровно предел) проходит
    test: components/controller/tests/unit/marketplace/marketplace-return-claim-validation.test.ts
    status: passing

  # ── Контрактный уровень: денежные места гарантийного возврата (598-51) ────

  - id: mkt.ret.happy.30
    level: contract
    kind: happy
    scenario: >
      Пайщица подаёт заявление на возврат полученного заказа в течение
      гарантийного срока.
    expect: >
      заявка получает СОБСТВЕННЫЙ хэш нитки, отличный от хэша заказа, и
      фиксирует полную сумму к возврату — стоимость имущества плюс
      приходящийся на него членский взнос
    test: components/boot/src/tests/marketplace-return.test.ts
    status: passing

  - id: mkt.ret.happy.31
    level: contract
    kind: happy
    scenario: >
      Оператор участка принимает имущество и подписывает заявление в совет об
      отмене сделки (1116) по рекламации пайщицы (1106); совет решает «за».
    expect: >
      до решения совета движений по средствам нет; по решению одной
      транзакцией проходят ТРИ ноги — o.mkt.return (имущество и паевой взнос
      заказчице), o.brn.retfee (участок возвращает долю взноса в пул) и
      o.mkt.refund (пул доводит её до свободного паевого заказчицы)
    test: components/boot/src/tests/marketplace-return.test.ts
    status: passing

  - id: mkt.ret.side.30
    level: contract
    kind: side
    scenario: >
      Возврат принят; смотрим бухгалтерские проводки.
    expect: >
      возвращённое имущество ложится Дт 10 (снова на складе), паевой взнос
      пайщицы восстанавливается Кт 80
    test: components/boot/src/tests/marketplace-return.test.ts
    status: passing

  - id: mkt.ret.side.31
    level: contract
    kind: side
    scenario: >
      Взнос возвращается транзитом через пул: прямой перевод с кошелька
      участка на кошелёк пайщика невозможен — walletop держит один username на
      обе стороны.
    expect: >
      транзит даёт ровно два кошельковых хода; ход участок → пул без проводок
      (внутри 86), ход пул → свободный паевой пайщицы — Дт 86 / Кт 80: членский
      взнос возвращается в паевой
    test: components/boot/src/tests/marketplace-return.test.ts
    status: passing

  - id: mkt.ret.side.32
    level: contract
    kind: side
    scenario: >
      Возврат оформлен как compensating forward, а не как откат исходной
      выдачи.
    expect: >
      исходная o.mkt.consum в журнале не модифицируется, и проводки возврата не
      попадают в нитку поставки — у возврата своя нитка
    test: components/boot/src/tests/marketplace-return.test.ts
    status: passing

  # ── Паевая модель: совет и выдача обратно (99D-9) ────────────────────────

  - id: mkt.ret.side.40
    level: contract
    kind: side
    scenario: Совет ещё не решил по принятому имуществу
    expect: движений по средствам нет, заявление в статусе «ждём решение совета»
    test: components/boot/src/tests/marketplace-return.test.ts
    status: passing

  - id: mkt.ret.side.41
    level: backend
    kind: side
    scenario: Совет отказал по заявлению
    expect: >
      имущество ждёт пайщика на участке, оператор выдаёт его обратно (handback),
      заявление закрывается без движений по средствам
    test: ~
    status: missing

  - id: mkt.ret.side.42
    level: contract
    kind: side
    scenario: Оператор пытается выдать имущество обратно, пока совет ещё не решил (заявка в «ждём решение совета»)
    expect: >
      действие отклоняется «Совет ещё рассматривает заявление»; заявка остаётся,
      решение совета затем исполняется или снимается штатно (задача 99D-16)
    test: ~
    status: missing

  - id: mkt.ret.side.43
    level: contract
    kind: side
    scenario: >
      Таблица заявок пуста (все прежние закрыты), пайщик подаёт заявление, затем
      другой заказ получает заявку с тем же освободившимся номером
    expect: >
      первая заявка получает номер не меньше 1 (0 в заказе — «возврата не было»),
      повторный возврат по тому же заказу отклоняется; закрытие заказа не
      блокируется чужой заявкой с тем же номером
    test: ~
    status: missing

  - id: mkt.ret.side.44
    level: contract
    kind: side
    scenario: Пайщик, подавший заявление на выход, подаёт заявление на гарантийный возврат
    expect: заявление отклоняется «новые действия недоступны до рассмотрения выхода»
    test: ~
    status: missing

  # ── Претензия поставщику (99D-13) ────────────────────────────────────────

  - id: mkt.ret.happy.50
    level: contract
    kind: happy
    scenario: >
      По решению совета об отмене сделки поставщику выставлена гарантийная
      претензия на стоимость возвращённого имущества (рекламация в две подписи);
      поставщик признаёт её со своего стола.
    expect: >
      на нитке претензии o.mkt.claim на сумму возврата по поставщику; претензия
      видна поставщику в статусе «ждёт ответа» с рекламацией, подписанной
      пайщицей и оператором; после признания o.mkt.admit и сводка признанного
      долга равна сумме претензии
    test: components/boot/src/tests/marketplace-return.test.ts
    status: passing

  - id: mkt.ret.side.50
    level: backend
    kind: side
    scenario: С претензией пытается согласиться не тот поставщик, либо согласие даётся повторно
    expect: отказ до обращения к цепи; по заказу из остатка кооператива претензия не заводится
    test: components/controller/tests/unit/marketplace/marketplace-supplier-claim.test.ts
    status: passing

  - id: mkt.ret.side.51
    level: backend
    kind: side
    scenario: Сводка поставщика по двум кошелькам претензий
    expect: >
      непризнанное — с кошелька непризнанных претензий, признанный долг — с
      кошелька долга; пустой кошелёк даёт ноль; несогласие в цепь не пишется,
      автоматических решений нет
    test: components/controller/tests/unit/marketplace/marketplace-supplier-claim.test.ts
    status: passing

  - id: mkt.ret.side.52
    level: contract
    kind: side
    scenario: Следующая выплата поставщику при признанном долге
    expect: >
      выплата уменьшается на остаток долга (o.mkt.deduct в нитке заказа, перевод
      на разницу); при долге больше выплаты перевода нет и выплата завершена сразу
    test: ~
    status: missing
    # Требует второй поставки того же поставщика после признания претензии на
    # стенде — сценарий добавить в boot-тест выплат после первого прогона.

# 2026-09-10 (задача 99D-15): возвращённое имущество ложится в остаток по цене
# выдачи — контракт возвращает его на счёт 10 по сумме выдачи, и остаток по
# цене прибытия списывал бы уценку второй раз при следующей выдаче.

  - id: mkt.ret.side.53
    level: backend
    kind: side
    scenario: Гарантийный возврат имущества, выданного со снижением цены.
    expect: >
      позиция остатка создаётся по цене выдачи из снапшота заказа; без снапшота
      — по цене прибытия исходной партии
    test: components/controller/tests/unit/marketplace/marketplace-return-restock.test.ts
    status: written   # прогон не подтверждён локально — гоняет CI

# 2026-09-10 (задача 99D-15, решение владельца): решение совета не падает
# из-за распределённого общего кошелька участка — имущество и паевой
# возвращаются сразу, взнос ждёт пополнения (feepend) и доводится действием
# payretfee по расписанию.

  - id: mkt.ret.side.54
    level: contract
    kind: side
    scenario: >
      Совет отменил сделку, а общий кошелёк участка к этому моменту уже
      распределён и взнос вернуть не из чего.
    expect: >
      решение совета исполняется: имущество на складе, паевой заказчика
      восстановлен (o.mkt.return); заявка остаётся на цепи в состоянии
      «взнос ждёт пополнения»; после пополнения кошелька участка payretfee
      проводит o.brn.retfee и o.mkt.refund и стирает заявку; повторный
      payretfee отклоняется
    test: ~
    status: missing   # сценарий на живой цепи — нужен участок с распределённым кошельком

  - id: mkt.ret.side.55
    level: backend
    kind: side
    scenario: После обратного вызова совета заявка на цепи осталась в состоянии «взнос ждёт пополнения».
    expect: >
      проекция заявления получает отметку ожидания и запись в журнал решений;
      крон повторяет payretfee, пока участок не пополнил кошелёк; отказ
      «не ожидает довнесения» снимает отметку без повтора
    test: components/controller/tests/unit/marketplace/marketplace-chain-retry-cron.test.ts
    status: written   # прогон не подтверждён локально — гоняет CI

  - id: mkt.ret.side.56
    level: backend
    kind: side
    scenario: >
      В проекции остались заявления на гарантийный возврат со статусом
      ACCEPTED_AT_VISIT, снятым при переходе на решение совета; оператор
      открывает «Гарантийные возвраты».
    expect: >
      миграция v22 переводит их в ACCEPTED_BY_COUNCIL, список заявлений отдаётся
      целиком; повторный запуск миграции ничего не меняет
    test: components/controller/tests/unit/marketplace/marketplace-bootstrap-v22.migration.test.ts
    status: written   # прогон не подтверждён локально — гоняет CI
