feature: cashier.desk
title: Стол кассира — касса, реестр платежей кассира и авансы пайщика

# Стол кассира — встроенное приложение, оно ставится каждому кооперативу само
# (запись `cashier` в реестре приложений с `defaults`; действующему кооперативу
# узел доустанавливает его при запуске). Совет и ревизор стол кассира читают,
# правят его председатель и кассир (решение владельца 16.10.2026): страницы
# открываются правом чтения, кнопки правки — правом правки.
#
# Касса показывает служебные записки кооператива по этапам выплаты (к оплате,
# ждут отчёта, на утверждении, закрытые); строка открывает записку. Реестр
# платежей — тот же, что на столе совета: на столе кассира подтверждение
# оплаты берётся из прав этого стола.
#
# Роль «Кассир» числится за столом кассира (до 16.10.2026 — за столом совета):
# её страницы ядро выводит только на этом столе, расходы дополняют роль
# чтением служебных записок и их файлов (касса), загрузка в чужую записку
# кассиру закрыта.
#
# «Авансы» стола кассира — выданные авансы под отчёт по кооперативу с отбором
# по состоянию (`expenseAdvancesByCooperative`, случаи exp.adv.* в
# expenses.proposals.yaml). Задачи кассы — уведомления «подтвердите платёж» о
# заявках на взносы и выплатах Стола заказов — получают председатель и кассиры,
# ссылка ведёт в реестр платежей стола кассира (случаи cashier.notify.*).
#
# Заведено 16.10.2026 (7DD-25).

