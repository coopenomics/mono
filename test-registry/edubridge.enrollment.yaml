feature: edubridge.enrollment
title: Образовательный мост — обучающиеся, подписки, «Получить доступ»

# E6 (задача 7DD-7). Прямого платежа как членского взноса нет: паевой пополняется
# средствами ядра, затем по кнопке «Получить доступ» пайщик подписывает
# заявление о конвертации (3011), кооператив одной транзакцией проводит
# convert (w.wal.share → w.edu.member) и opensub/extendsub. Период ведётся
# раздельно по связке «обучающийся + курс» (sub_hash детерминирован парой).

sources:
  backend:
    - components/controller/src/extensions/edubridge/application/services/edubridge-enrollment.service.ts
    - components/controller/src/extensions/edubridge/application/services/edubridge-learner.service.ts
    - components/controller/src/extensions/edubridge/application/resolvers/edubridge-member.resolver.ts
    - components/controller/src/extensions/edubridge/infrastructure/adapters/edubridge-chain.adapter.ts
    - components/controller/src/extensions/edubridge/infrastructure/repositories/edubridge-enrollment.repository.ts
    - components/controller/src/extensions/edubridge/infrastructure/repositories/edubridge-learner.repository.ts
  ui:
    - components/desktop/extensions/edubridge/pages/MemberLearnersPage/**
    - components/desktop/extensions/edubridge/pages/MemberSubscriptionsPage/**
    - components/desktop/extensions/edubridge/pages/CourseCardPage/**
    - components/desktop/extensions/edubridge/features/Subscribe/**
    - components/desktop/extensions/edubridge/widgets/LearnerForm/**
    - components/desktop/extensions/edubridge/entities/Learner/**

cases:
  - id: edu.enr.happy.01
    level: backend
    kind: happy
    scenario: Котировка по периоду; паевого не хватает.
    expect: amount по взносу за период, месяцев оплачено — один, enough=false, shortfall = разница, sub_hash детерминирован.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enr.break.01
    level: backend
    kind: break
    scenario: Подписка при нехватке паевого.
    expect: BadRequest с подсказкой пополнить главный кошелёк; транзакции нет.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enr.happy.02
    level: backend
    kind: happy
    scenario: Новая подписка.
    expect: convert + opensub одной транзакцией, статус ACTIVE, доступ PENDING, событие enrollment.opened с trx_id.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enr.happy.03
    level: backend
    kind: happy
    scenario: Продление действующей подписки.
    expect: extendsub от текущего paid_until, доступ не трогается, событие enrollment.extended.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enr.side.01
    level: backend
    kind: side
    scenario: Повторный вызов subscribe с тем же заявлением после успеха.
    expect: Цепь отклоняет повторную конвертацию/opensub (sub_hash занят); запись не дублируется.
    test: ~
    status: missing
  - id: edu.enr.side.02
    level: backend
    kind: side
    scenario: Правка почты обучающегося при активной подписке.
    expect: Событие learner.recipient_changed → очередь переоформляет доступ без повторной оплаты.
    test: ~
    status: missing
  - id: edu.enr.break.02
    level: backend
    kind: break
    scenario: Пайщик правит чужого обучающегося / удаляет обучающегося с активной подпиской.
    expect: Forbidden / BadRequest.
    test: ~
    status: missing
  - id: edu.enr.happy.04
    level: ui
    kind: happy
    scenario: Пайщик добавляет обучающегося, нажимает «Получить доступ», видит котировку; при нехватке — ссылка на пополнение; при достатке — подписывает заявление.
    expect: После подписи строка подписки появляется в таблице со статусом «Действует» и доступом «Выдаётся».
    test: ~
    status: missing
  - id: edu.enr.ui.01
    level: ui
    kind: happy
    scenario: "Подписка оформляется в карточке курса: «Получить доступ» открывает диалог на месте, курс закреплён, обучающийся по умолчанию — сам пайщик (is_self); плюсик у поля заводит нового обучающегося прямо в диалоге, и он сразу выбран."
    expect: "Со стола ученика кнопка «Получить доступ» убрана; после подписи человек уходит на «Мои подписки», новый обучающийся виден и на странице «Обучающиеся»."
    test: ~
    status: missing
  - id: edu.enr.ui.02
    level: ui
    kind: side
    scenario: "Пайщик без подписанной оферты родителя-слушателя жмёт «Получить доступ» в карточке курса (право Onboarding:learner ещё выдано)."
    expect: "Уводится на страницу подключения, а не в диалог подписки, который бэкенд всё равно отклонит; после подписи оферты гейт возвращает в каталог."
    test: ~
    status: missing
  - id: edu.enr.ui.03
    level: ui
    kind: happy
    scenario: "Стол ученика разделён: «Обучающиеся» — состав и адреса доставки, «Мои подписки» — курс, период, оплачено до, состояние доступа и «Продлить»."
    expect: "Пустые подписки предлагают перейти в каталог; продление открывает тот же диалог с закреплённым курсом."
    test: ~
    status: missing
  - id: edu.enr.ui.04
    level: ui
    kind: happy
    scenario: "Диалог «Получить доступ» без галочки согласия и без показа бланка: человек видит сумму, доступный паевой и срок, жмёт зелёную кнопку — заявление генерируется и подписывается под капотом."
    expect: "Одно нажатие = заявление 3011 + convert + opensub|extendsub; отдельного шага «прочитать и согласиться» нет."
    test: ~
    status: missing
  - id: edu.enr.side.05
    level: backend
    kind: side
    scenario: "Текст заявления о конвертации (3011): сумма и название программы, без курса и периода; сумма приведена канонным formatAsset."
    expect: "«Прошу конвертировать мой паевой взнос в размере 1000.00 RUB в членский взнос по Целевой Потребительской Программе «Образование».» — 1-в-1 с 1110; в цепь по-прежнему уходит сырой asset 1000.0000 RUB."
    test: ~
    status: missing

  - id: edu.enroll.happy.06
    level: backend
    kind: happy
    scenario: Ученик отменяет подписку до даты активации курса.
    expect: Полная стоимость возвращается на кошелёк программы, подписка закрывается, доступ отзывается.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.break.03
    level: backend
    kind: break
    scenario: Отмена чужой подписки и повторная отмена уже отменённой.
    expect: Отказ до обращения в цепь в обоих случаях.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.happy.07
    level: backend
    kind: happy
    scenario: Администратор отменяет курс по недобору.
    expect: Подписки участников закрываются, взносы возвращаются сразу на паевой без заявлений.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.side.05
    level: backend
    kind: side
    scenario: Отмена по недобору после начала занятий.
    expect: Отказ — есть отказ от подписки, а не отмена набора.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.happy.08
    level: backend
    kind: happy
    scenario: Отказ в ходе подписки — половина остаточной стоимости по числу проведённых занятий.
    expect: Граница проходит по дате активации; после последнего занятия возврат нулевой.
    test: components/controller/tests/unit/edubridge/refund.test.ts
    status: passing
  - id: edu.enroll.ui.03
    level: ui
    kind: happy
    scenario: Ученик видит сумму возврата до отмены; администратор отменяет курс по недобору со страницы курса.
    expect: Суммы через форматтер, основание возврата подписано словами.
    test: ~
    status: missing
  - id: edu.enroll.happy.09
    level: backend
    kind: happy
    scenario: Взнос за весь курс разом до начала занятий.
    expect: "Одной транзакцией convert + opensub(period=course) + chargefee на сумму помесячных со скидкой; у подписки сохранено число оплаченных месяцев."
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.side.06
    level: backend
    kind: side
    scenario: Участник приходит в середине курса либо переходит с помесячного взноса на взнос за курс.
    expect: Взнос — за оставшиеся месяцы с той же скидкой, оплаченный месяц засчитан, срок — до конца курса.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.break.05
    level: backend
    kind: break
    scenario: "Взнос за курс: курс оплачен до конца, кооператив принимает только помесячный, у курса нет программы, выбран год."
    expect: Отказ с понятной причиной в каждом случае; год для новых подписок закрыт.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.side.07
    level: backend
    kind: side
    scenario: Отказ от подписки у пришедшего в середине курса.
    expect: Занятия до его взноса не засчитываются — возврат считается от начала оплаченного срока.
    test: components/controller/tests/unit/edubridge/refund.test.ts
    status: passing
  - id: edu.enroll.happy.10
    level: backend
    kind: happy
    scenario: Остаток кошелька членских взносов программы покрывает взнос целиком.
    expect: Конвертации с паевого нет, в фонд программы уходит полная стоимость подписки.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.happy.11
    level: backend
    kind: happy
    scenario: Остаток кошелька программы покрывает часть взноса.
    expect: С паевого конвертируется только недостача; заявление 3011 называет зачёт, конвертацию и полную стоимость.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.enroll.ui.04
    level: ui
    kind: happy
    scenario: "Диалог подписки при ненулевом остатке кошелька программы."
    expect: Показаны обе части взноса — зачёт с кошелька программы и конвертация с паевого.
    test: ~
    status: missing
  - id: edu.enroll.side.08
    level: backend
    kind: side
    scenario: "Продление до конца оплаченного срока, затем отмена либо недобор."
    expect: "Взносы складываются: возврат считается от всего оплаченного, при недоборе возвращаются оба взноса."
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: written
  - id: edu.enroll.side.09
    level: backend
    kind: side
    scenario: "Оплата после истечения срока, пока подписка ещё числится действующей."
    expect: "extendsub от сегодняшнего дня вместо opensub; счёт оплаченного начинается заново."
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: written
  - id: edu.enroll.break.04
    level: backend
    kind: break
    scenario: "Заявление 3011 подписано при другой раскладке оплаты либо по другой подписке."
    expect: "Отказ с просьбой сформировать заявление заново, в цепь не ходим."
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: written
  - id: edu.enroll.side.10
    level: backend
    kind: side
    scenario: "Курс снят с публикации при действующих подписках."
    expect: "Действующая подписка продлевается, новая не открывается."
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: written
  - id: edu.enroll.side.11
    level: backend
    kind: side
    scenario: "Отмена курса по недобору: сбой по одной из подписок."
    expect: "Курс снимается с публикации первым; остальные подписки отменяются; ответ называет, сколько возвращено и сколько осталось."
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: written
  - id: edu.enroll.contract.05
    level: contract
    kind: break
    scenario: "Заявление о конвертации либо о возврате в паевой подписано чужим ключом."
    expect: "convert и retshare отклоняются."
    test: ~
    status: missing
