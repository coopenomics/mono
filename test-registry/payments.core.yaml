    test: ~
    status: missing

  - id: pay.core.happy.08
    level: backend
    kind: happy
    scenario: владелец удаляет свои реквизиты
    expect: реквизиты пропадают из списка (до 25.09.2026 deletePaymentMethod отвергал любой вызов — method_id строкового поля проверялся как число, 422)
