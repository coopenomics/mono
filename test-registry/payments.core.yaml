    status: passing

  - id: pay.core.side.12
    level: backend
    kind: side
    scenario: тот же чек (то же содержимое) прикладывается второй раз
    expect: отказ GATEWAY_PAYMENT_FILE_DUPLICATE, запись одна
    test: components/api-tests/src/payments/payments.core.test.ts
    api: components/api-tests/src/payments/payments.core.test.ts
    status: passing

  - id: pay.core.side.13
    level: backend
    kind: side
    scenario: чек с хэшем или размером, не совпадающим с содержимым
    expect: отказ GATEWAY_PAYMENT_FILE_CHECKSUM_MISMATCH / GATEWAY_PAYMENT_FILE_SIZE_MISMATCH
