    scenario: чужой пайщик читает, добавляет, меняет и удаляет реквизиты пайщика; гость читает реквизиты
    expect: отказ KIT_INSUFFICIENT_RIGHTS на каждую операцию, 401 гостю; реквизиты пайщика не изменились (59d8b7349bc)
