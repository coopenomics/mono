    expect: отказ GATEWAY_PAYMENT_NOT_FOUND_BY_HASH / GATEWAY_PAYMENT_FILE_NOT_FOUND
    test: components/api-tests/src/payments/payments.core.test.ts
    api: components/api-tests/src/payments/payments.core.test.ts
    status: passing

  - id: pay.core.happy.05
    level: backend
    kind: happy
    scenario: пайщик добавляет свои реквизиты СБП
    expect: реквизиты записаны на пайщика и видны ему в списке
