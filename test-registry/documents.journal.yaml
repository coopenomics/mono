cases:
  - id: documents.journal.01
    level: backend
    kind: happy
    scenario: Совет открывает реестр документов в пакетном и в плоском виде
    expect: пакетный вид — строки заявлений; плоский — каждый подписанный документ, включая решения, акты и связи
    test: components/controller/tests/unit/document/signed-document-journal.test.ts
    api: components/api-tests/src/documents/journal.test.ts
    status: passing

  - id: documents.journal.02
    level: backend
    kind: happy
    scenario: Строки реестра показывают название и дату
    expect: название по типу документа из реестра шаблонов (незнакомый тип — название из документа); дата подписи — время блока
    test: components/controller/tests/unit/document/signed-document-journal.test.ts
    api: components/api-tests/src/documents/journal.test.ts
    status: passing

  - id: documents.journal.03
    level: backend
    kind: side
    scenario: Совет задаёт период по дате подписи
    expect: выдача только документов, подписанных в периоде; период в будущем — пусто
    test: components/api-tests/src/documents/journal.test.ts
    api: components/api-tests/src/documents/journal.test.ts
    status: passing

  - id: documents.journal.04
    level: backend
    kind: side
    scenario: Совет выбирает тип документа
    expect: выдача только документов этого типа
    test: components/api-tests/src/documents/journal.test.ts
    api: components/api-tests/src/documents/journal.test.ts
    status: passing

  - id: documents.journal.05
    level: backend
    kind: break
    scenario: Пайщик открывает реестр своих документов в пакетном и плоском виде
    expect: только его документы — субъект либо подписант; чужие строки не выдаются ни в одном виде
    test: components/api-tests/src/documents/journal.test.ts
    api: components/api-tests/src/documents/journal.test.ts
    status: passing

  - id: documents.journal.06
    level: backend
    kind: side
    scenario: Вступление — заявление перечисляет соглашения в meta.links; события заявления и соглашений идут в любом порядке
    expect: соглашения в пакете заявления с ролью «соглашение», отдельных пакетов нет; соглашение действующего пайщика без заявления — свой пакет
    test: components/controller/tests/unit/document/signed-document-journal.test.ts
    api: components/api-tests/src/documents/journal.test.ts
    status: passing

  - id: documents.journal.07
    level: backend
    kind: side
    scenario: Акт или связь процесса — тот же документ, что заявление другого процесса; повтор события той же версии
    expect: строка заявления не перетирается; повтор не меняет строку
    test: components/controller/tests/unit/document/signed-document-journal.test.ts
    api: components/api-tests/src/documents/journal.test.ts
    status: passing

  - id: documents.journal.08
    level: ui
    kind: happy
    scenario: Совет переключает «Пакеты / Документы», задаёт период подписи и тип документа
    expect: реестр перечитывается с первой страницы; у строки — название по типу и дата подписи; на реестре пайщика панели нет, вид — пакеты
    status: missing
    decision_needed: false
