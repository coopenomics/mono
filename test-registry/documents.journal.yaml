feature: documents.journal
title: Журнал документов — строка на каждый подписанный документ

# Решение владельца 18.11.2026: реестр документов узла строится не только по
# событиям make_complete_document. Узел пишет строку на каждый подписанный
# документ — заявление, решение совета, акт, связанный документ, соглашение — с
# ролью, пакетом процесса и датой подписи (время блока). Пакетный вид узел строит
# по строкам заявлений, плоский показывает каждый документ. Соглашение, которое
# заявление перечисляет в meta.links (вступление), реестр записывает в пакет
# заявления при любом порядке событий; соглашение, подписанное действующим
# пайщиком отдельно, остаётся своим пакетом. Название строки — по типу документа
# из реестра шаблонов фабрики. Пакеты строк, записанных раньше, не меняются.

