feature: apps.rights-consent
title: Согласие председателя на права ядра приложения каталога — при установке и при обновлении

# 27.11.2026 (487-37, решение владельца: «делай задачу 487-37 … установка
# приложений вот эти вот все разрешения — часть процесса установки»).
#
# Приложение каталога просит у ядра права: порты ядра и действия цепи из
# манифеста версии. Прежде ключ приложению ядро выдавало по манифесту само:
# права одобрял только модератор каталога, председатель кооператива-установщика
# перечня не видел, обновление с новыми правами расширяло ключ без вопроса.
#
# Правило: ключ выдаётся только в пределах согласия председателя.
#   - установка: без согласия ядро отказывает в ключе, узел приложение не ставит;
#   - обновление с новым правом: узел прежнюю версию не трогает, запрос новых
#     прав ждёт ответа председателя на странице приложения;
#   - отказ и отложенное решение ничего не ломают: работает прежняя версия;
#   - новое право — только новый порт ядра или новое действие цепи;
#   - переключатель «Принимать новые права» снимает вопрос для доверенного издателя.
#
# Приложения, установленные до правила, перенесены как согласованные.

sources:
