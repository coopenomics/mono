    - components/controller/src/extensions/apps-catalog-proxy/application/dto/catalog-app-rights.dto.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/node-apps.service.ts
    - components/controller/src/extensions/apps-catalog-proxy/infrastructure/records/app-rights-consent.record.ts
    - components/controller/src/extensions/apps-catalog-proxy/migrations/database/1795780000000-create-apps-rights-consents.ts
    - components/orchestrator/src/orchestrator/app-grants.impl.ts
    - components/orchestrator/src/orchestrator/internal-secret.middleware.ts
    - components/orchestrator/src/orchestrator/ports.ts
    - components/orchestrator/src/watcher/app-rights.controller.ts
