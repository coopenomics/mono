    - components/desktop/src/pages/ExtensionStore/ExtensionPage/**

cases:
  # ── Согласие и допуск версии ─────────────────────────────────────────────
  - id: apps.consent.happy.01
    level: backend
    kind: happy
    scenario: >
      Председатель согласился с правами приложения; узел просит у ядра ключ для версии с этими правами.
    expect: >
      версия допущена, запроса новых прав нет; приложение без прав допущено без согласия;
      версия, которая просит меньше согласованного, допущена
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора: установить приложение каталога через API стенда нельзя"

  - id: apps.consent.break.01
    level: backend
    kind: break
    scenario: >
      Узел просит ключ для приложения без согласия председателя либо для обновления с новым портом и новым действием цепи.
    expect: >
      версия не допущена; запрос записан: при первой установке — права целиком, при обновлении — только новое;
      согласованное не меняется; приложение числится среди тех, что ждут согласия
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  - id: apps.consent.happy.02
    level: backend
    kind: happy
    scenario: >
      Председатель отвечает на запрос новых прав: соглашается со всем запросом либо с частью.
    expect: >
      согласие на весь запрос закрывает его, та же версия допущена; согласие на часть оставляет остаток запроса,
      версия не допущена
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  - id: apps.consent.side.01
    level: backend
    kind: side
    scenario: >
      Пока запрос ждал, издатель выпустил версию без новых прав; узел повторил запрос той же версии;
      в согласие передан неизвестный порт и действие в неверной записи; подписка отменена.
    expect: >
      устаревший запрос снят; повтор время запроса не сдвигает; неизвестное в согласие не попадает;
      отмена подписки стирает согласие, и прежние права по новой подписке не действуют
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  - id: apps.consent.happy.03
    level: backend
    kind: happy
    scenario: >
      Председатель включил переключатель «Принимать новые права»; издатель выпустил обновление с новым правом.
    expect: >
      обновление допущено, согласие отмечено переключателем; включение при запросе, который ждёт, принимает его сразу;
      после выключения следующее новое право снова ждёт согласия
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  - id: apps.consent.happy.04
    level: backend
    kind: happy
    scenario: >
      Стол запрашивает права приложения; председатель даёт согласие и переключает автоприём.
    expect: >
      стол получает, что просит версия, что разрешено и что ждёт согласия; без оркестратора перечень версии пуст,
      согласие отдаётся; согласие и включение переключателя просят оркестратор повторить установку
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  # ── Уведомление председателю ─────────────────────────────────────────────
  - id: apps.consent.happy.06
    level: backend
    kind: happy
    scenario: >
      Узел записал запрос новых прав приложения; оркестратор повторяет запрос ключа по расписанию;
      издатель выпускает следующую версию с тем же запросом.
    expect: >
      председатель получает одно уведомление на версию со ссылкой на страницу приложения; повтор той же версии
      второго уведомления не даёт; версия в пределах согласия и приём переключателем уведомление о запросе не шлют
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  - id: apps.consent.break.05
    level: backend
    kind: break
    scenario: >
      У кооператива нет председателя либо центр уведомлений отказал в отправке.
    expect: >
      запрос новых прав записан и ждёт ответа: отказ уведомления выдачу ключа и запись запроса не роняет
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  # ── Вход выдачи ключа ────────────────────────────────────────────────────
  - id: apps.consent.break.02
    level: backend
    kind: break
    scenario: >
      Оркестратор просит ключ для приложения без согласия председателя и для обновления с новым правом.
    expect: >
      отказ APPS_CATALOG_PROXY_APP_CONSENT_REQUIRED; ключ не выдан и не заменён: прежний ключ действует
      в прежних пределах, новый порт для него закрыт
    test: components/controller/tests/unit/apps-catalog-proxy/app-ports.test.ts
    status: written
    external: unreachable
    external_reason: "вход выдачи ключа принимает только межсервисный секрет узла из docker-сети, внешний слой работает через публичный API"

  - id: apps.consent.happy.05
    level: backend
    kind: happy
    scenario: >
      После согласия председателя оркестратор повторяет запрос ключа для того же обновления.
    expect: >
      ключ выдан с новым правом, запрос новых прав закрыт
    test: components/controller/tests/unit/apps-catalog-proxy/app-ports.test.ts
    status: written
    external: unreachable
    external_reason: "вход выдачи ключа принимает только межсервисный секрет узла из docker-сети"

  - id: apps.consent.side.02
    level: backend
    kind: side
    scenario: >
      Витрина узла собирает список приложений; у одного запрос новых прав ждёт ответа. Председатель отменяет подписку.
    expect: >
      приложение помечено как ждущее согласия; отмена подписки стирает согласие
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и провайдера подписок на приложения"

  # ── Оркестратор ──────────────────────────────────────────────────────────
  - id: apps.consent.break.03
    level: backend
    kind: break
    scenario: >
      Ядро отказало оркестратору в ключе: согласия нет. Первый случай — новая установка, второй — обновление работающего приложения.
    expect: >
      исход установки consent-required; контейнер не запускается; при обновлении прежний контейнер не снят и не заменён,
      заявка не стёрта
    test: components/orchestrator/src/orchestrator/install-orchestrator.service.spec.ts
    status: written
    external: unreachable
    external_reason: "оркестратор управляет контейнерами узла через docker, внешний слой работает только через API"

  - id: apps.consent.break.04
    level: backend
    kind: break
    scenario: >
      Установка и обновление ждут согласия председателя.
    expect: >
      обработчик сообщает ожидание согласия отдельным исключением; фронт приложения не кэшируется:
      фронт новой версии к прежнему бэкенду не подключается; после установки фронт обновляется вслед за бэкендом
    test: components/orchestrator/src/watcher/on-chain-watcher.service.spec.ts
    status: written
    external: unreachable
    external_reason: "оркестратор управляет контейнерами узла через docker, внешний слой работает только через API"

  - id: apps.consent.side.03
    level: backend
    kind: side
    scenario: >
      Обновление не установилось; ядро после согласия председателя шлёт оркестратору сигнал повторной установки.
    expect: >
      версия возвращается к прежней, следующий опрос выпусков повторяет обновление; сигнал сверяет версии
      ближайшим опросом и снимает паузу после неудачной установки; сигнал разовый
    test: components/orchestrator/src/watcher/catalog-delivery-event-stream.impl.spec.ts
    status: written
    external: unreachable
    external_reason: "оркестратор опрашивает каталог приложений, которого у стенда внешнего слоя нет"

  # ── Закрытая сеть контейнеров приложений ─────────────────────────────────
  # Контейнер приложения стоял в общей сети узла и открывал соединение к базе,
  # ядру, узлу цепи и хранилищу файлов (проверка 27.11.2026). Теперь приложения
  # стоят в отдельной сети: в ней только оркестратор и вход портов ядра.
  - id: apps.consent.happy.07
    level: backend
    kind: happy
    scenario: >
      Узел перевёл приложения в закрытую сеть; оркестратор сверяет работающий контейнер приложения.
    expect: >
      контейнер вне сети приложений пересоздаётся в ней с новым ключом; контейнер в сети приложений оставлен,
      ключ не перевыпущен
    test: components/orchestrator/src/orchestrator/install-orchestrator.service.spec.ts
    status: written
    external: unreachable
    external_reason: "оркестратор управляет контейнерами узла через docker, внешний слой работает только через API"

  - id: apps.consent.side.06
    level: backend
    kind: side
    scenario: >
      Оркестратор просит у ядра ключ приложения и называет контейнеру адрес входа портов.
    expect: >
      запрос несёт секрет узла, права и версию; 409 — ожидание согласия, прочий отказ — ошибка установки;
      на узле с закрытой сетью контейнер получает адрес шлюза портов, заявки по-прежнему идут в ядро
    test: components/orchestrator/src/orchestrator/app-grants.impl.spec.ts
    status: written
    external: unreachable
    external_reason: "оркестратор обращается к ядру из docker-сети узла межсервисным секретом"

  - id: apps.consent.break.06
    level: backend
    kind: break
    scenario: >
      Служебный маршрут оркестратора вызывают без секрета узла, с чужим секретом, с секретом другой длины.
    expect: >
      отказ 401: оркестратор виден из сети приложений, и без секрета приложение вызывало бы установку и снятие
      чужих приложений; на узле без секрета маршруты открыты, как до правила
    test: components/orchestrator/src/orchestrator/internal-secret.middleware.spec.ts
    status: written
    external: unreachable
    external_reason: "служебные маршруты оркестратора доступны только из docker-сети узла"

  - id: apps.consent.side.07
    level: backend
    kind: side
    scenario: >
      Контейнер в сети приложений пробует соединиться с базой, ядром, узлом цепи, хранилищем файлов,
      входом портов ядра и интернетом.
    expect: >
      Не решено: проверено руками на стенде 4 пробным контейнером (база, ядро, узел цепи, хранилище закрыты;
      вход портов отвечает, прочие адреса ядра через него — 404; интернет открыт). Автотест требует docker
      и поднятого стенда — вносить ли пробу в тест стенда двух кооперативов
    test: ~
    status: missing
    decision_needed: true

  # ── Не решено ────────────────────────────────────────────────────────────
  # ── Новые права без подтверждения председателя (слово владельца 28.11.2026:
  #    «поставим всем… и в интерфейсе скроем») ─────────────────────────────
  - id: apps.consent.happy.20
    level: backend
    kind: happy
    scenario: >
      Председатель согласился на права; обновление просит новый порт и новое действие цепи.
    expect: >
      Обновление допущено само, права добавлены к согласованным, запроса нет
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора: согласие на права проверено на стенде разработки 4"

  - id: apps.consent.break.20
    level: backend
    kind: break
    scenario: >
      Первая установка без согласия председателя; оркестратор повторяет установку.
    expect: >
      Установка не допущена и на повторе: строка первой установки приём новых прав не включает
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора: согласие на права проверено на стенде разработки 4"

  - id: apps.consent.happy.21
    level: backend
    kind: happy
    scenario: >
      Председатель согласился на весь запрос первой установки.
    expect: >
      Приём новых прав включается; следующее обновление с новым правом допущено само
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора: согласие на права проверено на стенде разработки 4"

  - id: apps.consent.side.20
    level: backend
    kind: side
    scenario: >
      Председатель согласился на часть запроса первой установки.
    expect: >
      Приём новых прав не включается, остаток запроса ждёт председателя
    test: components/controller/tests/unit/apps-catalog-proxy/app-rights-consent.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора: согласие на права проверено на стенде разработки 4"

  # 28.11.2026, слово владельца: «согласие — это вообще за пределами установки,
  # это до установки». Согласие даётся на экране подписки шагом «Права ядра» до
  # оформления; шаг согласия из хода установки убран.
  - id: apps.consent.happy.30
    level: backend
    kind: happy
    scenario: >
      Председатель открывает экран подписки на приложение, на которое кооператив ещё не подписан:
      оркестратор версии не знает.
    expect: >
      Узел отдаёт права действующей версии из каталога (запрос по токену кооператива, без подписки):
      версия, порты и действия цепи; согласованного нет. После подписки права берутся у оркестратора,
      каталог не спрашивается
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений и оркестратора"

  - id: apps.consent.side.04
    level: ui
    kind: side
    scenario: >
      Председатель нажимает «Подписаться»: экран приложения сменяется шагами «Права ядра» → «Итог»;
      «Разрешить» ведёт к итогу со стоимостью, «Подписаться» записывает согласие и оформляет подписку;
      ход установки шага согласия не имеет; запрос новых прав при обновлении — на странице приложения.
    expect: >
      Не решено: сценарий через интерфейс требует стенда с каталогом приложений и оркестратором, которых
      у набора UI нет — вносить ли каталог в стенд набора UI
    test: ~
    status: missing
    decision_needed: true

  # 28.11.2026, стенд: председатель разрешил права на экране подписки, экран
  # упёрся в нехватку остатка и согласие не записал. После оплаты долга хаб
  # оживил прежнюю подписку, страница снова запрашивала согласие, а ход установки
  # показывал движение на шаге «Приложение получено узлом».
  - id: apps.consent.side.05
    level: ui
    kind: side
    scenario: >
      Возобновление неоплаченной подписки при нехватке остатка: «Возобновить подписку» записывает согласие
      на права; подписка без согласия показывает в ходе установки шаг «Согласие на права ядра» без полосы хода.
    expect: >
      Не решено: сценарий через интерфейс требует стенда с каталогом приложений и оркестратором, которых
      у набора UI нет — вносить ли каталог в стенд набора UI
    test: ~
    status: missing
    decision_needed: true
