feature: debt.loan
title: Беспроцентный заём пайщику под обеспечение паевым взносом

# Компонент 73 «Беспроцентные займы» (проект «Благорост»), эпик 367-1.
#
# Контракт debt — единый реестр беспроцентных займов. Заём под паевой взнос
# программы «Благорост» контракт выдаёт сам: пайщик подписывает заявление и
# договор, сумма обеспечения переходит на кошелёк обеспечения и в программе
# не участвует, совет принимает решение, председатель подписывает договор,
# кассир выплачивает деньги через транзитный кошелёк «к выдаче». Возврат — с
# главного кошелька, целиком или частями, обеспечение возвращается на ту же
# сумму. После срока — просрочка, через пять дней — обращение обеспечения.
# Займы других приложений (Генерация) регистрируются источником при выдаче.
#
# Решения владельца — PRD компонента 73 (Р1–Р41). Односторонний акт при
# невозврате не формируется (Р41). Возврат деньгами займов Генерации — позже
# (Р37): контракт отвечает отказом.

sources:
  contract:
    - components/contracts/cpp/debt/**
    - components/contracts/cpp/lib/core/debt/**
    - components/contracts/cpp/lib/domain/table_debt_debts.hpp
    - components/contracts/cpp/lib/domain/table_debt_summaries.hpp
    - components/contracts/cpp/capital/app/debt_managment/**
    - components/contracts/cpp/capital/domain/entities/debts.hpp
    - components/contracts/cpp/lib/core/ledger2/operations.hpp
    - components/contracts/cpp/lib/core/ledger2/wallets.hpp
    - components/contracts/cpp/lib/core/registrator/exit.hpp
    - components/cooptypes/src/contracts/debt/**
    - components/cooptypes/src/debt/**
    - components/cooptypes/scripts/gen-from-cpp.ts
  backend:
    - components/controller/src/extensions/debt/**
    - components/controller/src/extensions/capital/application/services/debt-management.service.ts
    - components/controller/src/extensions/capital/application/services/debt-payments.listener.ts
    - components/controller/src/extensions/capital/application/services/debt-notifications.listener.ts
    - components/api-tests/src/debt/**
    - components/controller/src/application/gateway/interactors/gateway.interactor.ts
    - components/notifications/src/workflows/loan-*/**
  ui:
    - components/desktop/extensions/debt/**

standard: components/contracts/cpp/debt/p.dbt.loan.standard.yaml

cases:
  # ── Уровень контракта ──────────────────────────────────────────────────

  - id: dbt.loan.happy.01
    level: contract
    kind: happy
    scenario: >
      Пайщик с одобренным договором об участии и средствами в «Благоросте»
      подаёт заявление на заём меньше остатка в программе; совет разрешает,
      председатель подписывает договор, кассир подтверждает выплату; затем
      пайщик возвращает заём с главного кошелька двумя частями.
    expect: >
      после заявления сумма обеспечения ушла с кошелька программы на кошелёк
      обеспечения; после решения совета договор ждёт председателя; после его
      подписи сумма начислена к выдаче; после кассира заём выдан, числится в
      выданных и в сводке долга пайщика; частичный возврат уменьшает остаток,
      сводку, выданное и обеспечение на ту же сумму и списывает главный
      кошелёк; возврат остатка удаляет запись и сводку, обеспечение целиком в
      программе
    test: components/boot/src/tests/debt-loan.test.ts
    status: written   # на стенде пропущен: шаги совета и председателя подписываются за ant стендовым ключом, а ключ ant сменён входом владельца; прогон — на чистой цепи

  - id: dbt.loan.side.01
    level: contract
    kind: side
    scenario: Сумма займа больше остатка пайщика в программе.
    expect: заявление отклонено, обеспечение не тронуто
    test: components/boot/src/tests/debt-loan.test.ts
    status: passing

  - id: dbt.loan.side.02
    level: contract
    kind: side
    scenario: Ключ обеспечения, которого нет в реестре.
    expect: заявление отклонено с «не предусмотрено»
    test: components/boot/src/tests/debt-loan.test.ts
    status: passing

  - id: dbt.loan.side.03
    level: contract
    kind: side
    scenario: Договор об участии с пайщиком не заключён.
    expect: заявление отклонено — средств в программе нет и основания нет (Р32)
    test: components/boot/src/tests/debt-loan.test.ts
    status: passing

  - id: dbt.loan.side.04
    level: contract
    kind: side
    scenario: Кооператив отменяет выдачу до решения совета.
    expect: обеспечение вернулось в программу, запись удалена
    test: components/boot/src/tests/debt-loan.test.ts
    status: passing

  - id: dbt.loan.side.05
    level: contract
    kind: side
    scenario: Кассир отклонил платёж по реквизитам, кооператив отправил платёж повторно.
    expect: >
      решение совета и подпись в силе, причина сохранена, начисление к выдаче
      осталось; после повтора и подтверждения кассира заём выдан, причина
      очищена
    test: components/boot/src/tests/debt-loan.test.ts
    status: written   # на стенде пропущен: шаги совета и председателя подписываются за ant стендовым ключом, а ключ ant сменён входом владельца; прогон — на чистой цепи

  - id: dbt.loan.side.06
    level: contract
    kind: side
    scenario: Возврат больше остатка; возврат займа другим пайщиком.
    expect: оба отклонены
    test: components/boot/src/tests/debt-loan.test.ts
    status: written   # на стенде пропущен: шаги совета и председателя подписываются за ant стендовым ключом, а ключ ant сменён входом владельца; прогон — на чистой цепи

  - id: dbt.loan.side.07
    level: contract
    kind: side
    scenario: >
      Срок займа прошёл; сверка сроков; повторная сверка раньше пяти дней;
      заявление о продлении и подтверждение председателя.
    expect: >
      заём в просрочке; повторная сверка обеспечение не трогает; после
      подтверждения продления заём снова выдан с новым сроком
    test: components/boot/src/tests/debt-loan.test.ts
    status: written   # на стенде пропущен: шаги совета и председателя подписываются за ant стендовым ключом, а ключ ant сменён входом владельца; прогон — на чистой цепи

  - id: dbt.loan.side.08
    level: contract
    kind: side
    scenario: >
      Договор об участии подписан пайщиком, председатель его ещё не одобрил,
      средства в программе есть.
    expect: >
      заявление проходит — пайщик распоряжается паевым взносом с подписи
      договора, как и при взносе в программу (послабление cap.pinv.side.01)
    test: components/boot/src/tests/debt-loan.test.ts
    status: passing

  - id: dbt.loan.side.10
    level: contract
    kind: side
    scenario: Заём в просрочке дольше пяти дней, сверка сроков.
    expect: >
      обеспечение списано в пользу кооператива, выданное закрыто, сводка
      уменьшена, запись удалена
    test: null
    status: missing
    note: на живой цепи пять дней не промотать — проверяется на локальной цепи с управляемым временем либо вручную

  - id: dbt.loan.side.09
    level: contract
    kind: side
    scenario: Приложение регистрирует свой заём, гасит его частью и закрывает без денег.
    expect: >
      запись выдана с источником-приложением, сводка растёт; погашение
      уменьшает остаток и сводку; закрытие удаляет запись; возврат деньгами
      через контракт займов по такому займу отклоняется (Р37)
    test: components/boot/src/tests/capital.test.ts
    status: written
    note: >
      регистрацию и закрытие проходит заём Генерации (processDebt и сдача
      результата); частичное погашение приложением и отказ возврата деньгами
      отдельным шагом не проверяются

  - id: dbt.loan.break.01
    level: contract
    kind: break
    scenario: Пайщик с открытым займом подаёт заявление о выходе из кооператива.
    expect: выход отклонён до закрытия займа
    test: null
    status: missing

  - id: dbt.loan.break.02
    level: contract
    kind: break
    scenario: Заявление или договор подписаны не ключом пайщика; подписан не тот договор председателем.
    expect: отклонено проверкой подписи; отклонено сверкой хэша договора
    test: null
    status: missing

  - id: dbt.loan.gen.01
    level: contract
    kind: happy
    scenario: >
      Исполнитель проекта подаёт заявление на заём под коммиты вместе с
      договором одной транзакцией; совет разрешает, председатель подписывает
      договор, кассир подтверждает выплату.
    expect: >
      с договором заявление уходит совету; после решения совета договор ждёт
      председателя; после его подписи создан исходящий платёж; после кассира
      заём выплачен, долг пайщика и доли вырос, запись встала в общий реестр
      займов с источником capital, ссылкой на проект и остатком в сумму займа
    test: components/boot/src/tests/capital.test.ts
    status: written

  - id: dbt.loan.gen.02
    level: contract
    kind: side
    scenario: Кассир отклоняет платёж по займу под коммиты; кооператив повторяет платёж.
    expect: >
      заём ждёт повтора с сохранённой причиной, решение совета и договор на
      месте; повтор снова передаёт заём кассиру
    test: null
    status: missing

  - id: dbt.loan.gen.03
    level: backend
    kind: happy
    scenario: Председатель подписал договор займа под коммиты.
    expect: >
      кассиру заведён исходящий платёж типа «заём» с хэшем займа и назначением
      «заём по договору № …»; пайщик получил уведомления о решении совета,
      подписи договора и выдаче
    test: null
    status: missing

  # ── Уровень контроллера (эпики 367-3, 367-4) ─────────────────────────────

  - id: dbt.loan.backend.collateral.01
    level: backend
    kind: happy
    scenario: Пайщик с действующим договором об участии и взносом в программе запрашивает виды обеспечения.
    expect: >
      обеспечение «Благороста» отдано с признаком подписанного основания,
      кошельками источника и обеспечения и остатком пайщика в программе
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.create.01
    level: backend
    kind: happy
    scenario: Пайщик подаёт заявление и договор со своей подписью.
    expect: >
      зеркало отдаёт заём «на рассмотрении совета» с заявлением и договором;
      сумма обеспечения ушла с кошелька программы, главный кошелёк не тронут
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.create.02
    level: backend
    kind: side
    scenario: В документах указан ключ обеспечения, которого нет в реестре.
    expect: отказ DEBT_COLLATERAL_UNKNOWN до цепи
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.create.03
    level: backend
    kind: side
    scenario: Сумма займа больше остатка пайщика в программе.
    expect: заявление отклонено, обеспечение не тронуто
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.rights.01
    level: backend
    kind: break
    scenario: Посторонний пайщик читает чужой заём и список займов с чужим именем в отборе; совет читает реестр.
    expect: >
      чужой заём закрыт отказом охвата «своё»; список пайщика содержит только
      его займы при любом отборе; совет видит заём в реестре
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.rights.02
    level: backend
    kind: break
    scenario: Пайщик подаёт заявление, оформленное на другого пайщика.
    expect: отказ охвата «своё»
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.pay.01
    level: backend
    kind: happy
    scenario: Председатель подписал договор, зеркало получило заём «передан на выплату».
    expect: >
      заведён один исходящий платёж типа «заём» с хэшем займа, суммой займа,
      реквизитами из заявления и назначением «заём по договору № …»
    test: components/controller/src/extensions/debt/application/services/loan-payments.listener.spec.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.pay.02
    level: backend
    kind: side
    scenario: Совет разрешил выдачу, председатель договор ещё не подписал.
    expect: заём ждёт подписи председателя, платёж кассиру не заведён
    test: components/controller/src/extensions/debt/application/services/loan-payments.listener.spec.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.pay.03
    level: backend
    kind: side
    scenario: Кассир отклонил платёж, председатель повторил выплату; пайщик пробует повторить сам.
    expect: >
      прежний платёж возвращён в ожидание, второй не заведён; пайщику повтор
      закрыт правами
    test: components/controller/src/extensions/debt/application/services/loan-payments.listener.spec.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.decline.01
    level: backend
    kind: side
    scenario: Кассир отменяет платёж по займу с причиной.
    expect: >
      отказ доведён до шлюза в цепи раньше смены статуса платежа; заём ждёт
      повтора платежа с сохранённой причиной, решение совета и обеспечение на
      месте
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.issue.01
    level: backend
    kind: happy
    scenario: Кассир отмечает платёж по займу оплаченным.
    expect: >
      платёж завершён, заём выдан с остатком в сумму займа и попадает в отбор
      непогашенных; отмена выданного займа отклонена
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.repay.01
    level: backend
    kind: happy
    scenario: Пайщик возвращает часть займа с главного кошелька по подписанному заявлению.
    expect: >
      предел возврата равен свободному на главном кошельке; остаток и
      обеспечение уменьшились на сумму возврата, главный кошелёк списан,
      обеспечение на ту же сумму вернулось в программу
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.repay.02
    level: backend
    kind: side
    scenario: Возврат больше остатка; возврат чужого займа посторонним пайщиком.
    expect: оба отклонены, остаток не изменился
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.extend.01
    level: backend
    kind: happy
    scenario: Пайщик подаёт заявление о продлении срока, председатель ставит на нём подпись.
    expect: >
      до решения действует прежний срок и виден запрошенный; после подписи
      председателя действует новый срок, заявление сохранено в займе
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.status.01
    level: backend
    kind: happy
    scenario: Пайщик возвращает остаток займа.
    expect: >
      заём в зеркале закрыт и хранит документы, обеспечение целиком в
      программе, из отбора непогашенных заём ушёл
    test: components/controller/src/extensions/debt/application/services/loan-payments.listener.spec.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.cancel.01
    level: backend
    kind: side
    scenario: Пайщик отменяет своё заявление до решения совета; посторонний пробует отменить чужое.
    expect: >
      постороннему отказ охвата «своё»; после отмены заём в зеркале отклонён,
      обеспечение вернулось в программу, платёж не заведён
    test: components/api-tests/src/debt/loans.test.ts
    api: components/api-tests/src/debt/loans.test.ts
    status: passing

  - id: dbt.loan.backend.term.01
    level: backend
    kind: happy
    scenario: Суточная сверка находит заём с истёкшим сроком.
    expect: сверка цепи вызвана один раз с пределом 25
    test: components/controller/src/extensions/debt/application/services/loan-term-scheduler.service.spec.ts
    external: unreachable
    external_reason: срок займа истекает по времени цепи, а сверка идёт раз в сутки — стенд время не двигает
    status: written

  - id: dbt.loan.backend.term.02
    level: backend
    kind: side
    scenario: Заём в просрочке меньше пяти дней; заём в просрочке пять дней; просроченный заём другого приложения.
    expect: >
      до пяти дней цепь не зовётся; на пятый день зовётся для обращения
      обеспечения; заём другого приложения остаётся в просрочке
    test: components/controller/src/extensions/debt/application/services/loan-term-scheduler.service.spec.ts
    external: unreachable
    external_reason: пять дней просрочки отсчитываются по времени цепи — стенд время не двигает
    status: written

  - id: dbt.loan.backend.term.03
    level: backend
    kind: side
    scenario: Займов с истёкшим сроком больше одной пачки.
    expect: вызовов цепи — по числу пачек по 25, не больше двадцати
    test: components/controller/src/extensions/debt/application/services/loan-term-scheduler.service.spec.ts
    external: unreachable
    external_reason: нужны десятки займов с истёкшим сроком — стенд время не двигает
    status: written

  - id: dbt.loan.backend.term.04
    level: backend
    kind: happy
    scenario: До срока возврата осталось 14 дней и меньше.
    expect: >
      пайщику уходит напоминание; содержимое день ото дня не меняется, повтор
      гасит центр уведомлений; раньше 14 дней и после срока напоминания нет;
      сбой одного уведомления не останавливает остальные
    test: components/controller/src/extensions/debt/application/services/loan-term-scheduler.service.spec.ts
    external: unreachable
    external_reason: напоминание шлёт суточная сверка, снаружи её не вызвать и время не сдвинуть
    status: written

  # ── Уровень стола ────────────────────────────────────────────────────────

  - id: dbt.loan.ui.create.01
    level: ui
    kind: happy
    scenario: >
