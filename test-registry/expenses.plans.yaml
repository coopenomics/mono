feature: expenses.plans
title: Реестр плановых расходов участка — предстоящие траты с суммой, сроком и реквизитами

# Плановый расход — предстоящая трата кооперативного участка: назначение,
# сумма, срок, реквизиты и периодичность. Неоплаченные записи со сроком в
# ближайшие 30 дней образуют резерв, недоступный распределению членских
# взносов участка. Планы ведёт председатель участка или его доверенное лицо
# (состав берётся из цепи, branch::branches); записи уровня кооператива
# закрыты, пока шасси расходов их не откроет.
#
# Заведено 24.09.2026 (C28-80): внешний слой прикрывает таблицу expense_plans
# перед переводом репозитория на Kysely.
#
# Правка 25.09.2026 (C28-80): реестр с реквизитами читают совет и операторы
# участка — председатель и доверенные лица (свои участки); прежде читал любой
# пайщик. Открывать шире — по надобности (решение владельца).

sources:
  backend:
    - components/controller/src/extensions/expenses/application/resolvers/expense-plans.resolver.ts
    - components/controller/src/extensions/expenses/application/services/expense-plans.service.ts
    - components/controller/src/extensions/expenses/application/dto/expense-plan.dto.ts
    - components/controller/src/extensions/expenses/infrastructure/entities/expense-plan.entity.ts
    - components/controller/src/extensions/expenses/domain/expense-plan.types.ts

cases:
  - id: exp.plan.happy.01
    level: backend
    kind: happy
    scenario: Председатель участка заводит плановый расход участка
    expect: >
      запись возвращается с участком, суммой в валюте кооператива, сроком,
      реквизитами, автором и без привязки к расходу; та же запись читается из
      реестра участка и из общего реестра кооператива
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.happy.02
    level: backend
    kind: happy
    scenario: Регулярный расход заводится с периодичностью
    expect: периодичность сохраняется и отдаётся реестром
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.happy.03
    level: backend
    kind: happy
    scenario: Председатель участка удаляет плановый расход
    expect: мутация отвечает true, записи в реестре больше нет
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.01
    level: backend
    kind: side
    scenario: Запись уровня кооператива (без участка), даже от председателя кооператива
    expect: отказ EXPENSES_PLAN_COOP_LEVEL_NOT_SUPPORTED
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.02
    level: backend
    kind: side
    scenario: Обычный пайщик заводит план участка
    expect: отказ EXPENSES_PLAN_BRANCH_MANAGE_FORBIDDEN, запись не создаётся
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.03
    level: backend
    kind: side
    scenario: Председатель чужого участка заводит или удаляет план участка krg
    expect: оба действия — отказ EXPENSES_PLAN_BRANCH_MANAGE_FORBIDDEN, чужая запись остаётся
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.04
    level: backend
    kind: side
    scenario: План несуществующего участка
    expect: отказ EXPENSES_BRANCH_NOT_FOUND
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.05
    level: backend
    kind: side
    scenario: Нулевая или отрицательная сумма
    expect: отказ проверки входа (422), запись не создаётся
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.06
    level: backend
    kind: side
    scenario: Удаление несуществующей записи
    expect: отказ EXPENSES_PLAN_NOT_FOUND
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.07
    level: backend
    kind: side
    scenario: Гость читает реестр или заводит запись
    expect: отказ 401
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.08
    level: backend
    kind: side
    scenario: >
      Реестр плановых расходов с реквизитами получателей читают пайщик,
      председатель чужого участка, председатель своего участка и совет
    expect: >
      пайщику и чужому участку отказ EXPENSES_PLAN_BRANCH_READ_FORBIDDEN; без
      участка операторы получают только свои участки; совет видит весь
      реестр (решение владельца 25.09.2026)
    test: components/api-tests/src/expenses/plans.test.ts
    api: components/api-tests/src/expenses/plans.test.ts
    status: passing

  - id: exp.plan.side.09
    level: backend
    kind: side
    scenario: >
      Срок регулярного расхода наступил — воркер добавляет следующий
      экземпляр серии, резерв 30 дней считает неоплаченные записи
    expect: >
      следующий экземпляр появляется в реестре; снаружи не проверить — тик
      воркера шесть часов, резерв отдаётся только другим расширениям
    test: ~
    status: missing
    external: unreachable
    external_reason: "воркер серий тикает раз в шесть часов, время стенда через API не перемотать"

  - id: exp.plan.side.10
    level: backend
    kind: side
    scenario: >
      хранилище плановых расходов: выборка серий для воркера повторов и реестр
      участка
    expect: >
      воркер берёт только повторяющиеся расходы с наступившим сроком, которые
      ещё не продолжены, по порядку заведения; реестр отбирается по кооперативу
      и участку и идёт по сроку
    test: components/controller/tests/unit/expenses/expenses-kysely-stores.test.ts
    external: unreachable
    external_reason: "проверяются условия запросов к базе — снаружи они не видны; ведение реестра и повторы через API покрыты случаями exp.plan.*"
    status: written

  # Права по таблице прав расширения (C28-87, кусок 3, 05.10.2026): операции
  # стоят под общим гардом каркаса вместо `@AuthRoles`, состав исполнителей прежний.
  - id: exp.plan.side.11
    level: backend
    kind: side
    scenario: операции расширения зовут пайщик, член совета, председатель и кандидат
    expect: право есть у названных в таблице прав расширения, остальным отказ KIT_INSUFFICIENT_RIGHTS; кандидат прав пайщика не имеет
    test: components/controller/tests/unit/rights/extension-rights-tables.test.ts
    api: components/api-tests/src/rights/matrix.test.ts
    status: written
