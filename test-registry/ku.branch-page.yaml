feature: ku.branch-page
title: Страница кооперативного участка — строка роли и вкладки приложений

# Страница участка («Мой участок» и участок из реестра) называет роль пайщика:
# председатель участка, доверенное лицо либо пайщик участка. Приложения
# кооператива объявляют на странице свои вкладки через общий реестр; вкладка
# показана, когда приложение установлено и само подтвердило, что участок в нём
# участвует. Стол открывается на «Моём участке»; пайщик без участка видит
# переходы к реестру участков и к собраниям пайщиков.
#
# Заведено 25.11.2026 (решение владельца: вкладка на приложение; участок, не
# вовлечённый в приложение, его вкладку не получает; собрания пайщиков остаются
# общим реестром). Сведения участка, заявки доверенных лиц и документы
# председателя рисует прежний виджет — их случаи в ku.powers-of-attorney и
# ku.decisions.
sources:
  ui:
    - components/desktop/src/widgets/Ku/BranchPage/**
    - components/desktop/src/shared/lib/branch-tabs/**
    - components/desktop/src/pages/Ku/BranchDetails/**
    - components/desktop/extensions/ku/install.ts

cases:
  - id: ku.page.ui.01
    level: ui
    kind: happy
    scenario: Председатель участка, доверенное лицо и пайщик участка открывают страницу своего участка
    expect: над сведениями участка строка роли — «Вы председатель участка», «Вы доверенное лицо участка», «Вы пайщик участка»; у председателя названа только старшая роль
    status: missing
    decision_needed: false

  - id: ku.page.ui.02
    level: ui
    kind: side
    scenario: Пайщик открывает страницу чужого участка
    expect: строки роли нет; кнопка «Стать доверенным лицом» доступна — доверенным лицом становится любой пайщик кооператива
    status: missing
    decision_needed: false

  - id: ku.page.ui.03
    level: ui
    kind: happy
    scenario: Участок подключён как пункт выдачи Стола заказов, приложение установлено в кооперативе
    expect: на странице участка полоса с двумя вкладками — «Участок» и «Стол заказов»; выбранная вкладка записана в адресе и открывается по ссылке
    status: missing
    decision_needed: false

  - id: ku.page.ui.04
    level: ui
    kind: side
    scenario: Участок не вовлечён ни в одно приложение либо приложение отказало в чтении
    expect: полосы с вкладками нет, страница показывает сведения участка; отказ приложения страницу участка не ломает
    status: missing
    decision_needed: false

  - id: ku.page.ui.05
    level: ui
    kind: side
    scenario: Пайщик без участка открывает стол «Кооперативный участок»
    expect: стол открывается на «Моём участке» с пустым состоянием и двумя переходами — к реестру участков и к собраниям пайщиков
    status: missing
    decision_needed: false
