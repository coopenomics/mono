feature: edubridge.catalog
title: Образовательный мост — каталог курсов и карточка

# E4 (задача 7DD-5). Каталог открыт гостю: витрина показывает только
# опубликованные курсы и не раскрывает внутренние признаки (тип направления,
# привязку к площадке, состояние). Управление курсами — владелец/администратор
# (EduCourse:manage), enforcement — EdubridgeAccessGuard по матрице.

sources:
  backend:
    - components/controller/src/extensions/edubridge/application/resolvers/edubridge-catalog.resolver.ts
    - components/controller/src/extensions/edubridge/application/resolvers/edubridge-course-admin.resolver.ts
    - components/controller/src/extensions/edubridge/application/services/edubridge-course.service.ts
    - components/controller/src/extensions/edubridge/infrastructure/repositories/edubridge-course.repository.ts
    - components/controller/src/extensions/edubridge/application/dto/edu-course.dto.ts
    - components/controller/src/extensions/edubridge/application/guards/**
  ui:
    - components/desktop/extensions/edubridge/pages/CatalogPage/**
    - components/desktop/extensions/edubridge/pages/AdminCoursesPage/**
    - components/desktop/extensions/edubridge/pages/CourseCardPage/**
    - components/desktop/extensions/edubridge/widgets/CourseForm/**
    - components/desktop/extensions/edubridge/entities/Course/**

cases:
  - id: edu.catalog.happy.01
    level: backend
    kind: happy
    scenario: Гость запрашивает каталог и карточку опубликованного курса.
    expect: Список только published; в карточке нет direction/external_ref/status.
    test: ~
    status: missing
  - id: edu.catalog.side.01
    level: backend
    kind: side
    scenario: Гость запрашивает карточку черновика по прямому id.
    expect: NotFound — черновик для витрины не существует.
    test: ~
    status: missing
  - id: edu.catalog.break.01
    level: backend
    kind: break
    scenario: Пайщик без EduCourse:manage вызывает edubridgeCreateCourse.
    expect: Forbidden от EdubridgeAccessGuard.
    test: ~
    status: missing
  - id: edu.catalog.side.02
    level: backend
    kind: side
    scenario: Владелец меняет external_ref курса.
    expect: external_title_seen сбрасывается — прежняя сверка с площадкой недействительна.
    test: ~
    status: missing
  - id: edu.catalog.happy.02
    level: ui
    kind: happy
    scenario: Каталог по иерархии предмет → класс, карточка с расписанием, преподавателем, взносом и программой.
    expect: Суммы через форматтер, тип направления не показан.
    test: ~
    status: missing
  - id: edu.catalog.side.03
    level: backend
    kind: side
    scenario: Носитель доступа не соответствует направлению (онлайн-платформа + Telegram, очное + GetCourse и т.п.).
    expect: BadRequest; допустимые пары — ONLINE_PLATFORM→Skillspace/GetCourse, CLOSED_COMMUNITY→Telegram/VK, ONSITE→очно.
    test: components/controller/tests/unit/edubridge/course.service.test.ts
    status: written
  - id: edu.catalog.side.04
    level: backend
    kind: side
    scenario: Площадка (Skillspace/GetCourse) без идентификатора курса; очный курс с лишним идентификатором.
    expect: Площадка без идентификатора — BadRequest; у очного и сообществ идентификатор не сохраняется.
    test: components/controller/tests/unit/edubridge/course.service.test.ts
    status: written
  - id: edu.catalog.side.05
    level: backend
    kind: side
    scenario: В преподаватели курса записан пайщик без договора УХД; несколько преподавателей с договорами.
    expect: Без договора — BadRequest с учётным именем; с договорами — все сохраняются; edubridgeTeacherOptions отдаёт только пайщиков с договором.
    test: components/controller/tests/unit/edubridge/course.service.test.ts
    status: written
  - id: edu.catalog.happy.03
    level: ui
    kind: happy
    scenario: Конструктор курса — смена направления сужает носители, идентификатор площадки виден только у Skillspace/GetCourse, преподаватели выбираются из списка с договорами (несколько).
    expect: Носитель вне направления недоступен и сбрасывается; поле идентификатора появляется только для площадок; выбранные преподаватели показаны списком и снимаются по одному.
    test: ~
    status: missing
  - id: edu.catalog.side.06
    level: backend
    kind: side
    scenario: "Привязка к Skillspace: в external_ref не UUID курса (числовой номер из адреса конструктора, UUID модуля с опечаткой, группа не UUID); список курсов площадки для конструктора."
    expect: "BadRequest с подсказкой про реестр школы; edubridgePlatformCourses отдаёт курсы школы с их группами (для GetCourse/очного — пусто). Прецедент 2026-09-02: владелец вписал UUID из адреса конструктора модуля, выдача ушла в needs_attention."
    test: components/controller/tests/unit/edubridge/course.service.test.ts
    status: written
