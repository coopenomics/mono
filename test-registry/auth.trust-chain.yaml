feature: auth.trust-chain
title: Цепочка доверия удостоверений — заверения операторов и кооперативов с публичными названиями

# Удостоверение пайщика несёт цепочку заверений от якоря доверия (АНО) через
# оператора к кооперативу. Звенья называют аккаунты; проверяющий сверяет
# аккаунты, ключи и подписи. Человеку на экране нужны названия: узел
# кооператива о реквизитах оператора ничего не знает, и цепочка показывала
# «voskhod» вместо «ПК «Восход»» (слово владельца 26.10.2026).
#
# Решение: заверивший кладёт в заверение публичные названия обеих сторон
# (`iss_name`, `sub_name`) — своё из реквизитов кооператива, заверяемого из
# его анкеты организации. Проверка подлинности на них не опирается. Заверение
# без названий перевыпускается, как только оператор знает название кооператива.

sources:
  backend:
    - components/controller/src/application/auth-v2/certificate/endorsement.service.ts
    - components/auth/src/certificate/index.ts
  ui:
    - components/desktop/src/pages/User/ProfilePage/ui/ProfilePage.vue

cases:
  - id: trust.happy.01
    level: backend
    kind: happy
    scenario: >
      Оператор заверяет обслуживаемый кооператив; реквизиты оператора и анкета кооператива известны.
    expect: >
      В заверении есть iss_name («ПК «Восход»» из реквизитов) и sub_name (краткое или полное
      наименование из анкеты организации); проверяющий сверяет аккаунты и ключи, названия не влияют
    test: components/controller/src/application/auth-v2/certificate/endorsement-newly-served.spec.ts
    status: written
    external: unreachable
    external_reason: "подпись заверения ключом оператора — внутренняя операция узла, через API стенда её не вызвать"

  - id: trust.side.01
    level: backend
    kind: side
    scenario: >
      У кооператива есть действующее заверение без названий (выпущено до 26.10.2026); у другого — с названиями.
    expect: >
      Заверение без названий перевыпускается при ближайшем проходе, когда название кооператива
      известно; заверение с названиями не трогается. Названия неизвестны — звено остаётся без имени,
      в цепь ничего не пишется повторно
    test: components/controller/src/application/auth-v2/certificate/endorsement-newly-served.spec.ts
    status: written
    external: unreachable
    external_reason: "перевыпуск идёт по крону и при старте узла, через API стенда его не вызвать"

  - id: trust.ui.01
    level: ui
    kind: happy
    scenario: >
      Пайщик открывает «Удостоверение» на узле кооператива.
    expect: >
      Цепочка подписей показывает «АНО Кооперативная Экономика → ПК «Восход» → ПК «Партнёр-1» → Вы»;
      звенья без названий показывают имя аккаунта
    test: null
    status: missing
