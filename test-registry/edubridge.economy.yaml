feature: edubridge.economy
title: Образовательный мост — экономика курса и целевой членский взнос кооператива

# E9 (задача 7DD-12). Стоимость курса складывается снизу: часы занятий по ставке
# преподавателя дают себестоимость, кооператив добавляет целевой членский взнос — одну на весь
# кооператив, как «Стол заказов» добавляет её к цене поставщика. Взнос вносят
# помесячно либо разом за весь курс (7DD-19): курс длится столько месяцев,
# сколько занимает программа, и за взнос разом кооператив даёт скидку. Скидка
# ограничена целевым членским взносом: ниже себестоимости взнос не опускается, иначе
# обязательства перед преподавателями не покрыть.

#
# Правка 2026-09-23 (7DD-22): «наценка кооператива» переименована в «целевой
# членский взнос» во всём, что видит человек; поле в коде прежнее
# (markup_percent). По умолчанию при установке — 30%. Конструктор курса
# показывает текущий процент и ведёт к его правке в «Экономике».

sources:
  backend:
    - components/controller/src/extensions/edubridge/domain/economy/**
    - components/controller/src/extensions/edubridge/application/services/edubridge-economy.service.ts
    - components/controller/src/extensions/edubridge/application/resolvers/edubridge-economy.resolver.ts
    - components/controller/src/extensions/edubridge/application/dto/edu-economy.dto.ts
    - components/controller/src/extensions/edubridge/application/services/edubridge-expense.service.ts
    - components/controller/src/extensions/edubridge/application/dto/edu-expense.dto.ts
    - components/contracts/cpp/edubridge/src/p.edu.spend/**
    - components/contracts/cpp/edubridge/src/p.edu.access/chargefee.cpp
  ui:
    - components/desktop/extensions/edubridge/pages/AdminEconomyPage/**
    - components/desktop/extensions/edubridge/widgets/CourseForm/**

cases:
  - id: edu.econ.happy.01
    level: backend
    kind: happy
    scenario: Курс из восьми занятий по часу при ставке 1000 ₽/ч и целевом членском взносе 20%.
    expect: Себестоимость 8000, целевой членский взнос 1600, взнос за месяц 9600.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.happy.02
    level: backend
    kind: happy
    scenario: Занятие в полтора часа — часы считаются из минут расписания.
    expect: Четыре занятия по 90 минут дают шесть часов и взнос 6000.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.happy.03
    level: backend
    kind: happy
    scenario: Целевой членский взнос задаётся в разделе «Экономика» и действует на весь кооператив.
    expect: Значение уходит в настройку расширения, предельная скидка пересчитывается.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.break.01
    level: backend
    kind: break
    scenario: Скидка за взнос разом больше доли целевого членского взноса во взносе.
    expect: Отказ с предельным значением в тексте — взнос за курс иначе ниже себестоимости.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.side.01
    level: backend
    kind: side
    scenario: Скидка ровно по пределу.
    expect: Принимается, взнос за курс не ниже себестоимости курса.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.side.02
    level: backend
    kind: side
    scenario: Ставка часа назначается пайщику без договора участия в хозяйственной деятельности.
    expect: Отказ — ставка живёт в договоре преподавателя.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.break.02
    level: backend
    kind: break
    scenario: Преподаватель переподписывает договор с другой ставкой после того, как ставка уже названа.
    expect: Отказ сервера — ставку меняет администратор, а не преподаватель.
    test: components/controller/tests/unit/edubridge/teacher.service.test.ts
    status: passing
  - id: edu.econ.happy.04
    level: backend
    kind: happy
    scenario: План и факт курса по действующим назначениям с разными ставками.
    expect: Черновое назначение в факт не входит; превышение взноса отмечено признаком.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.side.03
    level: backend
    kind: side
    scenario: Курс сохраняется с параметрами занятий, сумма взноса приходит из расчёта.
    expect: Произвольная сумма во входных данных отсутствует; скидка хранится базисными пунктами.
    test: components/controller/tests/unit/edubridge/course.service.test.ts
    status: passing
  - id: edu.econ.ui.01
    level: ui
    kind: happy
    scenario: Раздел «Экономика» — целевой членский взнос и ставки часа; конструктор курса показывает расчёт взноса при вводе параметров.
    expect: Суммы через форматтер, предельная скидка подсказана, произвольный ввод взноса недоступен.
    test: ~
    status: missing
  - id: edu.econ.happy.05
    level: backend
    kind: happy
    scenario: Раздел «Экономика» показывает фонд программы, остатки на кошельках учеников и ленту движения.
    expect: Остаток фонда из кооперативного кошелька, взносы учеников — суммой долей; движения подписаны языком выписки.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.side.04
    level: backend
    kind: side
    scenario: Фонд пуст — кошелька в реестре ещё нет.
    expect: Показывается ноль, кошелёк из списка не исчезает.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.happy.06
    level: backend
    kind: happy
    scenario: Подписка на курс — конвертация, открытие подписки и списание взноса в фонд одной транзакцией.
    expect: Сумма списания равна взносу за период, привязка к ключу подписки и плательщику.
    test: components/controller/tests/unit/edubridge/enrollment.service.test.ts
    status: passing
  - id: edu.econ.happy.07
    level: backend
    kind: happy
    scenario: Председатель подаёт расход программы — реквизиты проверяются до цепи, снимок снимается после подачи.
    expect: Организация уходит на цепь без имени получателя, факт нулевой до отчёта.
    test: components/controller/tests/unit/edubridge/expense.service.test.ts
    status: passing
  - id: edu.econ.break.03
    level: backend
    kind: break
    scenario: Цепь отказала при подаче расхода (в фонде не хватает средств).
    expect: Снимок реквизитов не снимается — расход не подан.
    test: components/controller/tests/unit/edubridge/expense.service.test.ts
    status: passing
  - id: edu.econ.happy.08
    level: backend
    kind: happy
    scenario: Список расходов программы с состояниями и ФИО.
    expect: Числовые коды цепи переведены в понятия шасси, имена получателей читаются человеком.
    test: components/controller/tests/unit/edubridge/expense.service.test.ts
    status: passing
  - id: edu.econ.ui.02
    level: ui
    kind: happy
    scenario: "Раздел «Экономика» — вкладка «Расходы»: список расходов и подача служебной записки из фонда программы."
    expect: Форма и подпись — общий виджет шасси, источник средств — пул расходов программы.
    test: ~
    status: missing
  - id: edu.econ.happy.09
    level: backend
    kind: happy
    scenario: Программа из 64 занятий по восемь в месяц; 72 и 65 занятий; программа не задана.
    expect: "Длительность курса 8, 9 и 9 месяцев (неполный месяц — месяц); без программы — ноль, взноса за курс нет."
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.happy.10
    level: backend
    kind: happy
    scenario: Взнос за весь курс разом при скидке 10%.
    expect: Сумма помесячных за месяцы курса (76800), скидка 7680, взнос 69120 — не за двенадцать месяцев.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.side.05
    level: backend
    kind: side
    scenario: Кооператив принимает только помесячный взнос, в форме осталась скидка.
    expect: Скидка не проверяется и не действует; у курса она сохраняется нулём.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.break.04
    level: backend
    kind: break
    scenario: Взнос за весь курс включён, а занятий в программе нет.
    expect: Отказ — считать взнос за курс не от чего.
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing
  - id: edu.econ.happy.11
    level: backend
    kind: happy
    scenario: "Срок взноса за курс: до начала занятий, без назначенного дня, в середине курса, на границе месяца, после конца."
    expect: Курс заканчивается в один день для всех; в середине оплачиваются оставшиеся месяцы; после конца оплачивать нечего.
    test: components/controller/tests/unit/edubridge/course-period.test.ts
    status: passing
  - id: edu.econ.ui.03
    level: ui
    kind: happy
    scenario: "Форма курса: переключатель «Принимать взнос за весь курс разом» и скидка; карточка и страница курса."
    expect: Выключен — везде только помесячный взнос; включён — рядом обе полные суммы и разница в рублях.
    test: ~
    status: missing
  - id: edu.econ.side.06
    level: backend
    kind: side
    scenario: "Раздел «Экономика»: фонд и резерв выплат преподавателям."
    expect: "Свободные средства и резерв показаны раздельными кошельками; пустой резерв показывается нулём."
    test: components/controller/tests/unit/edubridge/economy.service.test.ts
    status: passing

  - id: edu.economy.side.20
    level: backend
    kind: side
    scenario: "Расширение устанавливается без настроек экономики."
    expect: "Целевой членский взнос по умолчанию 30%, а не 0."
    test: ~
    status: missing
  - id: edu.economy.ui.03
    level: ui
    kind: happy
    scenario: "Конструктор курса, шаг «Стоимость и сроки»: строка «Целевой членский взнос — N% сверх себестоимости» с кнопкой «Редактировать»."
    expect: "Кнопка открывает «Экономика → Настройки» (?tab=settings); черновик курса сохраняется; слово «наценка» нигде не показывается."
    test: ~
    status: missing
