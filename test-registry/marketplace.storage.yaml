feature: marketplace.storage
title: Адресное хранение склада участка — типы боксов, боксы и ячейки

# Типы боксов — общий справочник кооператива: габариты одинаковы на всех
# участках, по объёму считается перевозка. Справочник ведёт председатель.
# Боксы и ячейки принадлежат участку, их ведёт оператор этого участка:
# заводит боксы партией с кодами подряд, строит сетку ячеек «секция × ярус»,
# ставит бокс в ячейку своего участка и снимает с адреса. Бокс без адреса —
# штатное состояние. Вывести из оборота можно только пустую ячейку и пустой
# бокс.
#
# Заведено 02.10.2026 (C28-85): серверная часть жила вне реестра, запись в
# таблицы marketplace_container_type, marketplace_container и
# marketplace_storage_cell не трогал ни один сценарий внешнего слоя (карта
# готовности к уходу с TypeORM, C28-81). Экран оператора проверяется сценарием
# реестра marketplace.stock.

# Правка 2026-10-04 (C28-87): права операций сверяются с единой таблицей прав
# Стола заказов вместе с условием строки (кооператив подключён, заказчик
# подключён, хранение включено); декоратор операции — общий `@RequireRight` из
# каркаса расширений. Случаи про условия — в marketplace.rights-table; набор
# случаев этой фичи прежний.

