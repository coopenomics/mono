feature: platform.jurisdictions
title: Страновые справочники — реквизиты бюджета и налоговые параметры по датам

# Реквизиты, по которым платится налог, и сами налоговые параметры меняются
# приказами: КПП получателя ЕНП сменился 5 декабря 2025, назначение платежа —
# 1 апреля 2026 (приказ Минфина № 58н). Раньше такие значения лежали в коде
# сервисов, и смена приказа означала правку логики; теперь это данные с датой
# вступления в силу.
#
# Что легко сломать и потому проверяется отдельно:
#  - выбор по дате: в день вступления в силу действует уже НОВАЯ запись, а
#    отчёт или платёж за прошлый период обязан собраться по старой — иначе он
#    разойдётся с тем, что реально ушло в банк;
#  - молчание вместо догадки: для даты раньше первой записи справочник отдаёт
#    пусто, а не ближайшее значение, и для неизвестной страны — тоже;
#  - вызывающий код обязан пережить это пустое значение: заявка кассиру
#    создаётся и без реквизитов, он заполняет платёжку сам.
#
# Источники значений: реквизиты ЕНП ФНС, приказ Минфина от 16.05.2025 № 58н
# (назначение платежа с 01.04.2026), приказ ФНС от 10.09.2015 № ММВ-7-11/387@
# (коды видов доходов).

sources:
  backend:
    - components/jurisdictions/src/**
    - components/controller/src/extensions/reports/domain/services/ndfl-reference.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-tax.service.ts

cases:
  - id: plt.jur.happy.01
    level: backend
    kind: happy
    scenario: Реквизиты и налоговые параметры выбираются на дату платежа или отчётного года
    expect: >
      на 17.08.2026 назначение платежа «ЕНП», КПП получателя 770701001,
      КБК единого налогового платежа 18201061201010000510; НДФЛ — ставка 13 %,
      КБК 18210102010011000110, код материальной помощи 2710
    test: components/jurisdictions/src/index.test.ts
    status: passing

  - id: plt.jur.side.01
    level: backend
    kind: side
    scenario: День вступления в силу — граница между старой и новой записью
    expect: >
      31.03.2026 действует «Единый налоговый платеж», 01.04.2026 — уже «ЕНП»;
      порядок записей в таблице на результат не влияет
    test: components/jurisdictions/src/index.test.ts
    status: passing

  - id: plt.jur.side.02
    level: backend
    kind: side
    scenario: Дата раньше первой записи справочника
    expect: >
      возвращается пусто, а не ближайшее значение — подставлять сегодняшние
      реквизиты в прошлый период нельзя
    test: components/jurisdictions/src/index.test.ts
    status: passing

  - id: plt.jur.break.01
    level: backend
    kind: break
    scenario: Страна кооператива в справочнике отсутствует
    expect: >
      заявка на перечисление налога всё равно создаётся, но без реквизитов и с
      нейтральным назначением платежа — кассир заполняет платёжку сам
    test: components/controller/src/extensions/marketplace/application/services/marketplace-tax.service.spec.ts
    status: passing

  - id: plt.jur.break.02
    level: backend
    kind: break
    scenario: Отчёт за год, для которого налоговых параметров в справочнике нет
    expect: >
      генерация отказывает с внятной причиной (форма применяется с отчётности
      за 2025 год), а не собирает файл по сегодняшним ставкам
    test: ~
    status: missing

# 2026-08-17: налоговый пояс из справочника понадобился второму потребителю —
# стол бухгалтера определяет по нему расчётный период платежа. Разложение даты
# по поясу вынесено в общий `toTaxDateParts`, второй копии нет.
