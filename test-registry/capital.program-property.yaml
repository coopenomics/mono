feature: capital.program-property
title: Паевой взнос имуществом в программу «Благорост»

# Пайщик передаёт кооперативу имущество (одна позиция на заявление) паевым
# взносом в программу «Благорост»: заявление → одобрение председателя →
# решение совета → акт приёма-передачи (пайщик, затем председатель в запросах
# одобрений) → оценка имущества зачисляется на кошелёк программы, Дт 08 / Кт 80.
#
# Заведено 30.10.2026: процесс был в контракте без интерфейса. Решения
# владельца 30.10.2026 — вторая подпись акта через запросы одобрений (как акт
# РИД преподавателя), проводка на счёт 08, одна позиция имущества на заявление.

sources:
  contract:
    - components/contracts/cpp/capital/app/property_management/contribute_property_in_program/**
    - components/contracts/cpp/capital/domain/entities/program_properties.hpp
    - components/contracts/cpp/capital/p.cap.prop.standard.yaml
  backend:
    - components/controller/src/extensions/capital/application/use-cases/property-management.interactor.ts
    - components/controller/src/extensions/capital/application/syncers/program-property-sync.service.ts
    - components/controller/src/extensions/capital/application/documents-dto/capitalization-property-invest-document.dto.ts
    - components/controller/src/extensions/capital/application/dto/property_management/**
    - components/controller/src/extensions/capital/domain/entities/program-property.entity.ts
    - components/controller/src/extensions/capital/domain/enums/program-property-status.enum.ts
    - components/controller/src/extensions/capital/infrastructure/repositories/program-property.kysely-repository.ts
    - components/controller/src/extensions/capital/domain/repositories/program-property.repository.ts
    - components/controller/src/extensions/capital/domain/interfaces/capital-blockchain.port.ts
  ui:
    - components/desktop/extensions/capital/features/ProgramProperty/**
    - components/desktop/extensions/capital/widgets/ContributionsFeedWidget/**

cases:
  - id: cap.pgprp.happy.01
    level: contract
    kind: happy
    scenario: >
      Пайщик подаёт заявление на 10 000 RUB, председатель одобряет, совет
      принимает решение, пайщик подписывает акт, председатель подтверждает
      одобрение акта с подписями обеих сторон.
    expect: >
      кошелёк программы «Благорост» пайщика и паевой фонд выросли на оценку
      имущества, накопленная сумма взносов имуществом пайщика выросла на ту же
      сумму, запись предложения удалена
    test: components/boot/src/tests/capital.test.ts
    status: written

  - id: cap.pgprp.break.01
    level: contract
    kind: break
    scenario: >
      Совет вызывает приём акта, под которым стоит только подпись председателя
      (подписи пайщика нет).
    expect: отказ проверки документа — акт принимается только с двумя подписями
    test: components/boot/src/tests/capital.test.ts
    status: written

  - id: cap.pgprp.break.02
    level: contract
    kind: break
    scenario: Кооператив сам вызывает приём акта, минуя одобрение председателя в совете.
    expect: отказ авторизации — приём акта вызывает только контракт совета
    test: components/boot/src/tests/capital.test.ts
    status: written

  - id: cap.pgprp.side.01
    level: contract
    kind: side
    scenario: Пайщик подписывает акт до решения совета.
    expect: отказ CAPITAL_PROPERTY_NOT_AUTHORIZED
    test: components/boot/src/tests/capital.test.ts
    status: written

  - id: cap.pgprp.side.02
    level: contract
    kind: side
    scenario: Акт подписывает другой пайщик, а не автор заявления.
    expect: отказ CAPITAL_PROPERTY_NOT_OWNER
    test: ~
    status: missing

  - id: cap.pgprp.side.03
    level: contract
    kind: side
    scenario: Председатель отказывает в подписи акта в запросах одобрений.
    expect: предложение удалено, кошельки и проводки не двигались
    test: components/boot/src/tests/capital.test.ts
    status: written

  - id: cap.pgprp.side.04
    level: contract
    kind: side
    scenario: Заявление подписано не тем пайщиком, от имени которого подано.
    expect: отказ проверки документа на подписанта
    test: ~
    status: missing

  - id: cap.pgprp.side.05
    level: contract
    kind: side
    scenario: Нулевая оценка имущества или пустое описание.
    expect: отказ CAPITAL_PROPERTY_AMOUNT_INVALID либо CAPITAL_PROPERTY_DESCRIPTION_REQUIRED
    test: ~
    status: missing

  # ── Уровень бэкенда ───────────────────────────────────────────────────────

  - id: cap.pgprp.be.01
    level: backend
    kind: happy
    scenario: Пайщик подаёт подписанное заявление о паевом взносе имуществом.
    expect: >
      позиция, оценка и идентификатор взноса берутся из меты заявления, описание
      в цепи собирается одной строкой; заявление сверяется с черновиком из
      хранилища документов
    test: components/controller/tests/unit/capital/program-property.test.ts
    external: unreachable
    external_reason: "отправка в цепь подменена в модульном тесте; путь через API проверяется на стенде прогоном процесса"
    status: written

  - id: cap.pgprp.be.02
    level: backend
    kind: side
    scenario: Вместо заявления 1070 прислан другой документ, или заявление составлено на другого пайщика, или оценка в чужой валюте.
    expect: отказ CAPITAL_PROPERTY_STATEMENT_INVALID / CAPITAL_PROPERTY_STATEMENT_MISMATCH / отказ валюты до обращения к цепи
    test: components/controller/tests/unit/capital/program-property.test.ts
    external: unreachable
    external_reason: "проверки идут до цепи, их видно в модульном тесте; снаружи нужен подписанный черновик фабрики"
    status: written

  - id: cap.pgprp.be.03
    level: backend
    kind: side
    scenario: Пайщик подписывает акт до решения совета, чужой пайщик подписывает акт, акт составлен по другому взносу.
    expect: отказ CAPITAL_PROPERTY_NOT_AUTHORIZED / CAPITAL_PROPERTY_NOT_OWNER / CAPITAL_PROPERTY_ACT_MISMATCH до обращения к цепи
    test: components/controller/tests/unit/capital/program-property.test.ts
    external: unreachable
    external_reason: "нужен взнос в статусе решения совета — его даёт только прогон процесса на стенде"
    status: written

  - id: cap.pgprp.be.04
    level: backend
    kind: happy
    scenario: Пайщик запрашивает акт приёма-передачи по взносу с решением совета.
    expect: >
      акт собирается из позиции заявления и номера решения из протокола;
      тело акта сохраняется в хранилище документов для второй подписи
      председателя; без протокола акт не собирается
    test: components/controller/tests/unit/capital/program-property.test.ts
    external: unreachable
    external_reason: "нужен взнос в статусе решения совета — его даёт только прогон процесса на стенде"
    status: written

  - id: cap.pgprp.be.05
    level: backend
    kind: side
    scenario: Председатель подтвердил одобрение акта либо отказал; строка взноса в цепи удалена.
    expect: >
      итог ставится по действию цепи — «принято» на act2pgprp, «отклонено» на
      declinepgprp; уведомление получателю итог повторно не пишет; статус
      «отклонено» сохраняется при чтении из базы
    test: components/controller/tests/unit/capital/program-property.test.ts
    external: unreachable
    external_reason: "итог пишется из обработчика действий цепи — снаружи виден только через прогон процесса"
    status: written

  # ── Уровень UI ────────────────────────────────────────────────────────────

  - id: cap.pgprp.ui.01
    level: ui
    kind: happy
    scenario: >
      Пайщик нажимает «Внести имуществом», описывает одну позицию, указывает
      оценку и подписывает заявление; после решения совета нажимает «Подписать
      акт» на вкладке «Имущество».
    expect: >
      заявление появляется в ленте «Мои взносы» со статусом «На одобрении
      председателя»; после подписи акта статус «Акт у председателя»; после
      подписи председателя — «Принято», взнос появляется в истории
    test: ~
    status: missing

  - id: cap.pgprp.ui.02
    level: ui
    kind: side
    scenario: Пайщик открывает форму взноса имуществом и оставляет поле пустым или вводит нулевую оценку.
    expect: кнопка подачи заявления недоступна, под оценкой — пояснение
    test: ~
    status: missing

  - id: cap.pgprp.ui.03
    level: ui
    kind: side
    scenario: >
      Пайщик заполняет форму взноса имуществом, закрывает окно без подачи,
      открывает другую страницу и возвращается.
    expect: форма открывается заполненной; после подачи заявления черновик очищается
    test: ~
    status: missing
