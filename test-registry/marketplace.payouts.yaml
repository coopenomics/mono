feature: marketplace.payouts
title: Выплаты поставщикам — пакет за сутки, лента совета и разворот выплаты

# 19.11.2026 (решение владельца): заказы поставщика за сутки объединяются в
# один пакет выплаты — один платёж кассиру вместо платежа на каждый заказ.
# Пакет заводит обход узла в начале следующих суток (в работе — по поясу
# кооператива, на стенде — сутки STAND_DAY_SECONDS); сумму пакета и удержание
# гарантийного долга считает контракт (addpayout), после отправки (sendpayout)
# сумма не меняется. Подтверждение кассира закрывает заказы пакета по одному
# (closepayout), отказ — возвращает их в ожидание (releasepay), и они
# попадают в пакет следующих суток. Внешний набор идёт в фазе полигона со
# сжатым временем.

# Правка 19.11.2026 (ревью PR #286): что отправлять и что удалять, обход решает
# по строке пакета в цепи, а не по зеркалу узла (break.03); отказ контракта по
# одному заказу не держит остальные (break.04); подтверждение и отказ кассира не
# зависят от порядка дельты и действия одного блока (side.14); отказы
# исходящего платежа gateway получили коды (side.12, side.13).

# Слайс от заведённой выплаты до её разворота на столе совета: лента выплат по
# всему кооперативу (Payment:read:all), поиск по человеческому имени получателя
# и карточка, отвечающая на вопрос «за что заплатили» — предмет поставки,
# состояние заказа и подтверждение оплаты (запись в реестре кассира плюс
# проводка в цепи).
#
# Проведение и отказ выплаты — работа кассира в общем столе кооператива
# (расширение gateway). Здесь только чтение: marketplace отзеркаливает статусы
# из цепи и показывает их совету.

# Правка 24.09.2026 (C28-83, второй проход): на ленту переведены и экраны
# Стола заказов, которые раньше не слушали marketplaceEvents, — реестры
# председателя, экономика стола и участка, выплаты, претензии поставщику,
# склад участка, онбординг кооператива и поставщика, пункты выдачи, карточки
# реестров и виджеты процессов. Сбор с оборота (marketplace::config) объявлен в
# ленте таблицей цепи. Онбординг пайщика ждёт подписи по ленте, а не циклом с
# паузой. Серверные сценарии и набор случаев прежние.

# Правка 2026-10-04 (C28-87): права операций сверяются с единой таблицей прав
# Стола заказов вместе с условием строки (кооператив подключён, заказчик
# подключён, хранение включено); декоратор операции — общий `@RequireRight` из
# каркаса расширений. Случаи про условия — в marketplace.rights-table; набор
# случаев этой фичи прежний.

# Правка 2026-10-05 (C28-87, пункт 1а): список выплат поставщику назван
# источником «сам пайщик» (`SELF`) в `@RequireRight`: отбор идёт по имени
# вызвавшего. Поведение и набор случаев прежние.

# Правка 2026-10-05 (C28-87, общий гард): права операций сверяет общий гард
# каркаса расширений (`RightsGuard`) над описанием прав Стола заказов;
# собственный гард стола, декоратор роли и ручной провайдер прав рабочего стола
# убраны. Отказ «право не положено» отвечает кодом KIT_INSUFFICIENT_RIGHTS (был
# отказ без кода). Набор случаев прежний.

sources:
  backend:
    - components/controller/src/extensions/marketplace/application/resolvers/marketplace-outgoing-payment.resolver.ts
    - components/controller/src/extensions/marketplace/application/dto/marketplace-outgoing-payment.dto.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-supplier-payout.service.ts
    - components/controller/src/extensions/marketplace/application/shared/payout-batch.util.ts
    - components/controller/src/extensions/marketplace/infrastructure/adapters/marketplace-outgoing-payment-request-repository.adapter.ts
  contract:
    - components/contracts/cpp/marketplace/src/p.mkt.supply/addpayout.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.supply/sendpayout.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.supply/payconfirm.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.supply/paydecline.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.supply/closepayout.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.supply/releasepay.cpp
    - components/contracts/cpp/lib/domain/table_marketplace_payouts.hpp
    - components/contracts/cpp/gateway/src/outpay/createoutpay.cpp
    - components/contracts/cpp/gateway/src/outpay/outcomplete.cpp
    - components/contracts/cpp/gateway/src/outpay/outdecline.cpp
  ui:
    - components/desktop/src/pages/Marketplace/BoardPayoutsReadonly/**
    - components/desktop/src/pages/Marketplace/OffererPaymentHistory/**

cases:
  - id: mkt.payouts.happy.01
    level: backend
    kind: happy
    scenario: >
      Два заказа одного поставщика приняты кооперативом; наступили следующие
      сутки, совет открывает выплату.
    expect: >
      одна выплата и один платёж кассиру на оба заказа, сумма — принятые
      стоимости (с удержанием долга); разворот показывает оба заказа и
      кассирский платёж, найденный по хэшу выплаты
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    api: components/api-tests/src/marketplace/payouts.test.ts
    status: written   # внешний набор идёт в фазе со сжатым временем — гоняет CI

  - id: mkt.payouts.side.01
    level: backend
    kind: side
    scenario: >
      Запрошен идентификатор выплаты другого кооператива.
    expect: >
      ответ null, заказ и кассирский порт не опрашиваются — чужой идентификатор
      не должен подтверждаться ни ответом, ни отказом по праву
    test: components/controller/tests/unit/marketplace/marketplace-outgoing-payment-detail.test.ts
    external: unreachable
    external_reason: "на стенде один кооператив; выплату другого кооператива через API не завести"
    status: passing

  - id: mkt.payouts.side.02
    level: backend
    kind: side
    scenario: >
      Выплаты с таким идентификатором нет вовсе.
    expect: ответ null
    test: components/controller/tests/unit/marketplace/marketplace-outgoing-payment-detail.test.ts
    api: components/api-tests/src/marketplace/payouts.test.ts
    status: passing

  - id: mkt.payouts.side.03
    level: backend
    kind: side
    scenario: >
      Заказы выплаты не нашлись.
    expect: >
      разворот отдаётся с пустым списком заказов, число заказов выплаты
      видно — выплата и её реквизиты совету видны в любом случае
    test: components/controller/tests/unit/marketplace/marketplace-outgoing-payment-detail.test.ts
    external: unreachable
    external_reason: "заказы выплаты в базе узла не удаляются; состояние «заказы не нашлись» через API не создать"
    status: passing

  - id: mkt.payouts.break.01
    level: backend
    kind: break
    scenario: >
      Кассирский порт недоступен в момент открытия выплаты.
    expect: >
      разворот остаётся живым, core_payment пуст — marketplace-статус
      самодостаточен, отказ соседнего стола не должен гасить карточку
    test: components/controller/tests/unit/marketplace/marketplace-outgoing-payment-detail.test.ts
    external: unreachable
    external_reason: "отказ кассирского порта через API стенда не вызвать"
    status: passing

  - id: mkt.payouts.side.04
    level: backend
    kind: side
    scenario: >
      Выплата заведена, но платёж кассиру ещё не создан (core_payment_id пуст).
    expect: core_payment = null, разворот отдаётся
    test: components/controller/tests/unit/marketplace/marketplace-outgoing-payment-detail.test.ts
    external: unreachable
    external_reason: "выплата без платежа кассиру — промежуточное состояние внутри одного обхода, снаружи не наблюдается"
    status: passing

  - id: mkt.payouts.side.05
    level: ui
    kind: side
    scenario: >
      В ленте выплат совет ищет поставщика по фамилии, а у одного из получателей
      имя в профиле не заполнено.
    expect: >
      колонка показывает ФИО или наименование организации, для незаполненного
      профиля — логин аккаунта; поиск идёт по имени, не по логину
    status: missing

  - id: mkt.payouts.side.06
    level: backend
    kind: side
    scenario: >
      Кассир подтвердил выплату поставщику; поставщик получает уведомление
      (слово владельца 17.11.2026: без идентификаторов акта и транзакции).
    expect: >
      событие выплаты несёт число заказов и имущество выплаты («имущество по 2
      заказам: …», до трёх наименований и «и ещё N»); текст уведомления
      называет сумму и основание «по N заказам»; если состав не прочитан,
      уведомление отправляется с суммой
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    status: passing
    external: unreachable
    external_reason: содержание уведомления передаётся в сервис рассылок, через API стенда текст письма не читается; статусы выплаты проверяет внешний набор payouts

  - id: mkt.payouts.happy.02
    level: backend
    kind: happy
    scenario: Кассир подтвердил перевод по выплате.
    expect: >
      выплата оплачена, платёж реестра кассира проведён, заказы выплаты
      закрываются (Дт 76 / Кт 51 на заказ), поставщику уведомление; в
      следующих сутках новой выплаты с этими заказами нет
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    api: components/api-tests/src/marketplace/payouts.test.ts
    status: written   # внешний набор идёт в фазе со сжатым временем — гоняет CI

  - id: mkt.payouts.side.07
    level: backend
    kind: side
    scenario: Кассир отказал в переводе по выплате.
    expect: >
      выплата отклонена с причиной, платёж реестра отменён, заказы
      возвращаются в ожидание и попадают в новую выплату следующих суток с
      другим хэшем
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    api: components/api-tests/src/marketplace/payouts.test.ts
    status: written   # внешний набор идёт в фазе со сжатым временем — гоняет CI

  - id: mkt.payouts.side.08
    level: backend
    kind: side
    scenario: >
      Обход: заказы двух поставщиков; у одного поставщика сотня заказов; у
      другого уже открыт пакет; заказы приняты сегодня.
    expect: >
      по пакету на поставщика; сотня заказов — частями в один пакет; при
      открытом пакете новый не заводится; заказы, принятые после начала
      суток, ждут следующего обхода; назначение — по договору поставщика
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    external: unreachable
    external_reason: "состав обхода зависит от всех заказов стенда; внешний набор проверяет пакет своего поставщика (happy.01)"
    status: passing

  - id: mkt.payouts.side.09
    level: backend
    kind: side
    scenario: >
      Гарантийный долг поставщика покрыл стоимость одного заказа пакета либо
      всех заказов.
    expect: >
      покрытый заказ в пакет не входит и закрыт сразу; если покрыты все —
      пакета в цепи нет, запись удаляется, платежа кассиру нет
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    external: unreachable
    external_reason: "случай требует признанной претензии поставщику на стенде (реестр mkt.ret.side.52)"
    status: passing

  - id: mkt.payouts.break.02
    level: backend
    kind: break
    scenario: >
      Сбой части включения заказов, отправки, платежа реестра или закрытия
      заказов; два обхода одновременно.
    expect: >
      пакет отправляется с включёнными заказами, остальные ждут следующего
      обхода; следующий обход довозит недостающий шаг; второй одновременный
      обход ничего не делает; сбой одного пакета не останавливает остальные
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    external: unreachable
    external_reason: "сбой цепи посреди обхода через API стенда не вызвать"
    status: passing

  - id: mkt.payouts.side.10
    level: backend
    kind: side
    scenario: Дельта таблицы пакетов из цепи.
    expect: >
      сумма, удержание и состояние пакета берутся из цепи (sent → ждёт
      кассира); удаление строки и неизвестное состояние проекцию не меняют
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    external: unreachable
    external_reason: "дельту цепи узел получает сам; внешний набор видит её результат (happy.01)"
    status: passing

  - id: mkt.payouts.side.11
    level: contract
    kind: side
    scenario: >
      Контракт, пакет ждёт кассира: заказ пакета закрывают до подтверждения
      кассира, возвращают без отказа кассира, включают повторно в свой либо в
      другой пакет; пакет отправляют повторно; отправляют пакет, которого нет.
    expect: >
      отказы с кодами MARKETPLACE_PAYOUT_NOT_PAID,
      MARKETPLACE_PAYOUT_NOT_DECLINED, MARKETPLACE_PAYOUT_ALREADY_STARTED,
      MARKETPLACE_PAYOUT_NOT_OPEN, MARKETPLACE_PAYOUT_NOT_FOUND; строка пакета
      в цепи после отказов прежняя — состояние, число заказов и сумма
    test: components/api-tests/src/marketplace/payouts.test.ts
    status: written   # внешний набор идёт в фазе со сжатым временем — гоняет CI

  - id: mkt.payouts.side.12
    level: contract
    kind: side
    scenario: >
      Решение кассира (подтверждение либо отказ) по исходящему платежу,
      которого в gateway нет.
    expect: отказ с кодом GATEWAY_OUTCOME_NOT_FOUND
    test: components/api-tests/src/marketplace/payouts.test.ts
    status: written   # внешний набор идёт в фазе со сжатым временем — гоняет CI

  - id: mkt.payouts.side.13
    level: contract
    kind: side
    scenario: >
      Контракт: заказ включают в открытый пакет другого поставщика; отправляют
      пакет без суммы; решение кассира по уже обработанному платежу gateway;
      регистрация второго платежа gateway с тем же хэшем.
    expect: >
      отказы с кодами MARKETPLACE_PAYOUT_OFFERER_MISMATCH,
      MARKETPLACE_PAYOUT_EMPTY, GATEWAY_OUTCOME_NOT_PENDING,
      GATEWAY_OUTCOME_ALREADY_EXISTS
    # Открытый пакет живёт доли секунды между включением и отправкой, пакет без
    # суммы контракт не заводит, строка платежа gateway стирается при решении
    # кассира — через стенд эти состояния не получить; нужен контрактный тест.
    status: missing

  - id: mkt.payouts.break.03
    level: backend
    kind: break
    scenario: >
      Разбор блоков узлом отстал от транзакции включения: зеркало заказов ещё
      не видит включённых заказов либо узел цепи ещё не отдаёт строку пакета.
    expect: >
      обход сверяет число включённых заказов со счётчиком пакета в цепи; при
      расхождении пакет не отправляется и запись не удаляется — отправит
      следующий обход; запись без пакета в цепи удаляется сразу, только когда
      зеркало подтверждает закрытие выплат без перевода, иначе её удаляет довоз
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    external: unreachable
    external_reason: "отставание разбора блоков через API стенда не вызвать"
    status: passing

  - id: mkt.payouts.break.04
    level: backend
    kind: break
    scenario: >
      Контракт отклонил транзакцию с частью заказов из-за одного заказа
      (включение, закрытие либо возврат); цепь недоступна.
    expect: >
      заказы отклонённой части отправляются по одному, отказ по одному заказу
      не держит остальные; при сбое связи заказы по одному не отправляются;
      если цепь не приняла ни одного заказа, запись пакета удаляется
    test: components/controller/tests/unit/marketplace/marketplace-supplier-payout.test.ts
    external: unreachable
    external_reason: "отказ контракта по одному заказу пакета через API стенда не вызвать"
    status: passing

  - id: mkt.payouts.side.14
    level: backend
    kind: side
    scenario: >
      Дельта таблицы пакетов обработана раньше действия кассира того же блока;
      событие подтверждения либо отказа повторено.
    expect: >
      время и транзакция подтверждения и причина отказа записываются при любом
      порядке; первое подтверждение и первый отказ узнаются по записанным
      данным, повтор запись не меняет; заказы довозятся, поставщик второй раз
      не уведомляется
    test: components/controller/tests/unit/marketplace/marketplace-outgoing-payment-repository.test.ts
    external: unreachable
    external_reason: "порядок событий одного блока и повтор события узел получает от разбора цепи; снаружи виден итог (side.07, happy.02)"
    status: passing

# 2026-09-23 (EEA-6…EEA-9): тексты интерфейса, отказов и уведомлений фичи вынесены из
# кода в словари i18n, отказы бэкенда переведены на DomainError с кодом — текст
# и HTTP-статус ответа прежние. Сценарии фичи и её проверки не менялись.

# 19.11.2026: выплата — пакетом за сутки (решение владельца); прежняя выплата по
# одному заказу заменена без перехода — нигде не эксплуатировалась.
