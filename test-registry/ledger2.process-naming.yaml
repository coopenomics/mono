feature: ledger2.process-naming
title: Имя нитки процесса ledger2

# Нитка процесса — это операции, связанные общим process_hash. Имя нитки
# (process_type) называет контракт-инициатор и эмитит его в ledger2::apply,
# поэтому одна операция может идти в разных процессах: членский взнос КУ
# (o.brn.common) зачисляется внутри нитки поставки, а возвращается внутри
# нитки гарантийного возврата.
#
# До этого имя выводилось из кода операции, и у такой нитки было два
# претендента на название. Реестр процессов выбирал минимум ПО АЛФАВИТУ кода
# ('o.brn.common' < 'o.mkt.lock'), поэтому поставка подписывалась «Членские
# взносы кооперативного участка». Для блоков, записанных до эмиссии имени,
# осталась историческая карта operation_code → process_type, из которой
# исключены операции, идущие внутри чужой нитки.
# Мердж dev 2026-08-12 (FC1-7): в файлах фичи изменились только строки импорта —
# пагинация, базовый DTO, порт документов и тип аккаунта переехали в
# `@coopenomics/extension-kit` и `@coopenomics/innercoop`. Поведение операций,
# правила доступа и набор случаев прежние.

sources:
  contract:
    - components/contracts/cpp/lib/core/ledger2/processes.hpp
    - components/contracts/cpp/lib/core/ledger2/ledger2.hpp
    - components/contracts/cpp/ledger2/src/common/apply.cpp
    - components/contracts/cpp/lib/core/branch/branch.hpp
    - components/contracts/cpp/branch/src/accrue.cpp
    - components/contracts/cpp/branch/src/retfee.cpp
    - components/contracts/cpp/marketplace/src/p.mkt.return/accretrn.cpp
    - components/contracts/cpp/registrator/src/exit/exit_helpers.hpp
    - scripts/check-ledger2-processes.mjs
  backend:
    - components/controller/src/domain/process-registry/**

cases:
  # ── Уровень контракта ─────────────────────────────────────────────────────

  - id: l2.pnam.happy.01
    level: contract
    kind: happy
    scenario: >
      Контракт-инициатор вызывает операцию, передавая имя нитки процесса из
      реестра процессов.
    expect: >
      операция проходит, и в данных экшена рядом с кодом операции стоит
      переданное имя нитки
    test: ~
    status: missing

  - id: l2.pnam.break.01
    level: contract
    kind: break
    scenario: >
      Инициатор передаёт имя нитки, которого нет в реестре процессов
      (опечатка в имени).
    expect: >
      операция отклоняется с текстом «Unknown process type», а не уходит в
      историю с процессом без названия
    test: ~
    status: missing

  - id: l2.pnam.side.01
    level: contract
    kind: side
    scenario: >
      Стол заказов финализирует заказ: членский взнос участка зачисляется
      инлайн-вызовом экономики КУ по хэшу заказа.
    expect: >
      зачисление уходит с именем нитки поставки, а не экономики участка
    test: ~
    status: missing

  - id: l2.pnam.side.02
    level: contract
    kind: side
    scenario: >
      Приём гарантийного возврата: членский взнос возвращается из общего
      кошелька участка по хэшу заявки на возврат.
    expect: >
      возврат взноса уходит с именем нитки гарантийного возврата
    test: ~
    status: missing

  # ── Уровень бэкенда ───────────────────────────────────────────────────────

  - id: l2.pnam.happy.02
    level: backend
    kind: happy
    scenario: >
      В нитке есть операция с эмитированным именем процесса.
    expect: >
      имя читается дословно, историческая карта кодов операций не применяется
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.03
    level: backend
    kind: side
    scenario: >
      Историческая нитка поставки без эмитированного имени: внутри и
      операции заказа, и зачисление членского взноса участка.
    expect: >
      процесс называется поставкой, а субъектом показан заказчик, а не участок
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.04
    level: backend
    kind: side
    scenario: >
      Тот же набор операций приходит в обратном порядке блоков.
    expect: >
      имя процесса не меняется — от порядка операций и алфавита кодов оно не
      зависит
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.05
    level: backend
    kind: side
    scenario: >
      Историческая нитка гарантийного возврата с инлайновым возвратом взноса
      участка.
    expect: >
      процесс называется гарантийным возвратом
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.06
    level: backend
    kind: side
    scenario: >
      Реестр фильтруется по типу «Членские взносы кооперативного участка».
    expect: >
      в выборку попадают только нитки экономики участка; поставки, внутри
      которых взнос зачислялся в общий кошелёк, не попадают
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.07
    level: backend
    kind: side
    scenario: >
      Один и тот же процесс открывается в списке процессов и в детализации.
    expect: >
      название совпадает — список и деталь применяют одно правило
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.break.02
    level: backend
    kind: break
    scenario: >
      В нитке только незнакомые коды операций (запись старее текущего
      реестра операций).
    expect: >
      строка реестра остаётся видимой с пустым типом, а не исчезает из
      списка процессов
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.break.03
    level: backend
    kind: break
    scenario: >
      Под одним хэшем нитки эмитированы разные имена процесса (ошибка
      инициатора в контракте).
    expect: >
      берётся первое имя по блоку и global_sequence, а не минимум по алфавиту
      кода операции; в лог пишется предупреждение — процесс не теряет название
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.09
    level: backend
    kind: side
    scenario: >
      Коммит РИД: контракт эмитит имя нитки приёма РИД, а бэкенд показывает
      коммиты отдельным процессом с якорем на проекте.
    expect: >
      процесс называется жизнью коммитов проекта, и сущность проекта находится
      по якорю — бэкенд-оверрайд сильнее имени из цепи
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.10
    level: backend
    kind: side
    scenario: >
      Реестр фильтруется по типу «жизнь коммитов проекта», хотя контракт
      эмитил в эти записи имя приёма РИД.
    expect: >
      коммиты попадают в выборку по коду операции, а фильтр «Приём РИД» их,
      наоборот, не втягивает
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.11
    level: backend
    kind: side
    scenario: >
      Реестр фильтруется по типу «Поставка», а в цепи есть нитки гарантийного
      возврата, внутри которых возвращается членский взнос.
    expect: >
      нитки возврата в выборку не попадают — иначе процесс числится в списке
      поставкой, а при раскрытии называется возвратом
    test: components/controller/tests/unit/process-registry/process-registry.service.test.ts
    status: passing

  - id: l2.pnam.side.12
    level: contract
    kind: side
    scenario: >
      Пайщик выходит из кооператива, имея остатки и на минимальном паевом, и
      в ЦПП «Благорост»: оба кошелька консолидируются по одному хэшу выхода.
    expect: >
      обе консолидации уходят с именем нитки возврата паевого взноса, то есть
      у хэша выхода одно имя независимо от того, где лежали остатки
    test: ~
    status: missing

  - id: l2.pnam.break.04
    level: contract
    kind: break
    scenario: >
      Имя процесса объявлено в контракте, но забыто в перечне PROCESS_REGISTRY,
      в cooptypes или в локаторе бэкенда.
    expect: >
      гейт согласованности реестров падает до деплоя и называет конкретное имя
      и место, а не «Unknown process type» на проде
    test: scripts/check-ledger2-processes.mjs
    status: passing

  - id: l2.pnam.side.08
    level: ui
    kind: side
    scenario: >
      Бухгалтер открывает реестр процессов и раскрывает процесс поставки с
      актами приёмки и выдачи.
    expect: >
      и в строке, и в заголовке детализации стоит «Поставка и приобретение
      имущества пайщика»
    test: ~
    status: missing

  # ── Длина memo проводки (мердж ветки UI-сюиты, 2026-08-11) ────────────────
  # `apply` больше не ограничивает memo 255 байтами. Обоснование проводки —
  # человеческий текст, и в кириллице символ занимает два байта: предел резал
  # осмысленные формулировки, из-за чего падал гарантийный возврат. Проверка
  # снята во всех точках ledger2 (apply, walletop, debit, credit, walmove,
  # revert) — случай ниже страхует от её возврата «за компанию» с новой
  # валидацией.
  - id: l2.pnam.side.13
    level: contract
    kind: side
    scenario: >
      Проводка отправляется с длинным обоснованием на русском языке — заметно
      больше 255 байт.
    expect: >
      операция проходит, memo сохраняется целиком; отказа по длине нет ни в
      одной точке ledger2
    test: ~
    status: missing

