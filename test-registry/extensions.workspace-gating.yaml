feature: extensions.workspace-gating
title: Видимость столов расширений по грантам и шлюз входа в стол

# Канон авторизации столов: бэкенд решает, кто какое право получает, фронт лишь
# сверяет требование страницы (`meta.requires`) с выданным набором грантов стола.
# Здесь — фронтовая половина канона: видимость столов и страниц плюс поведение
# навигационного гарда, когда права на запрошенную страницу нет.
#
# Шлюз (`meta.gate`) — страница, на которой пайщик получает допуск в стол сам:
# подписывает оферту ЦПП, выбирает пункт выдачи, подаёт заявку поставщика. Пока
# допуска нет, бэкенд выдаёт вместо рабочих прав маркер (`Onboarding:orderer`,
# `Onboarding:offerer`), открывающий ровно эту страницу.
#
# Инцидент 2026-08-11 (testnet): заказчик подписал оферту ЦПП ещё при
# регистрации, но пункт выдачи не выбирал, поэтому `Order:create` не выдан.
# Заход на каталог давал «Недостаточно прав доступа» — тупик: подсказки, что
# нужно пройти подключение, пайщик не получал, а сам шлюз при переходе по
# ссылке или из истории браузера в обход переключателя столов не открывался.
#
# Признак шлюза объявляется в install.ts рядом с `requires`, а НЕ выводится из
# порядка маршрутов: порядок — деталь оформления, и рабочая страница, случайно
# оказавшаяся первой, увела бы пайщика мимо шлюза. Шлюзом помечается только
# страница, чьё право исчезает после прохождения, — иначе гард уводил бы туда
# с любой закрытой страницы стола вместо честного отказа.

sources:
  ui:
    - components/desktop/src/entities/Desktop/model/store.ts
    - components/desktop/src/processes/navigation-guard-setup/**
    - components/desktop/src/shared/lib/types/workspace.ts
    - components/desktop/src/widgets/Desktop/**

cases:
  - id: ext.gating.happy.01
    level: ui
    kind: happy
    scenario: >
      Пайщик без допуска в стол открывает рабочую страницу этого стола по прямой
      ссылке (из истории браузера, минуя переключатель столов).
    expect: >
      попадает на страницу подключения к столу, а не на «Недостаточно прав
      доступа»; после прохождения подключения рабочая страница открывается
    test: components/docs-harness/scenarios/marketplace/onboarding/extension-gate.mjs
    status: written

  - id: ext.gating.side.01
    level: ui
    kind: side
    scenario: >
      Пайщик открывает закрытую страницу стола, у которого страницы-шлюза нет
      вовсе (например рабочая страница стола администратора).
    expect: >
      показывается «Недостаточно прав доступа» — уводить некуда, и выдумывать
      маршрут гард не должен
    test: ~
    status: missing

  - id: ext.gating.side.02
    level: ui
    kind: side
    scenario: >
      Пайщик открывает саму страницу-шлюз, когда и она ему не выдана (например
      кооператив ещё не подключил расширение).
    expect: >
      «Недостаточно прав доступа»; перенаправления шлюза на самого себя не
      происходит — иначе переход зациклится
    test: ~
    status: missing

  - id: ext.gating.side.03
    level: ui
    kind: side
    scenario: >
      Допуск получен (маркер подключения бэкендом больше не выдаётся), пайщик
      открывает страницу стола, на которую права всё равно нет — она для другой
      роли.
    expect: >
      «Недостаточно прав доступа»; на пройденный шлюз не уводит, потому что тот
      уже не виден
    test: ~
    status: missing

  - id: ext.gating.side.04
    level: ui
    kind: side
    scenario: >
      Стол расширения работает по прежнему механизму видимости (гранты не
      выдаются вовсе, видимость по роли пайщика).
    expect: >
      поведение прежнее — доступ по роли, шлюз не ищется
    test: ~
    status: missing

  - id: ext.gating.break.01
    level: ui
    kind: break
    scenario: >
      Переход выполняется до того, как состав столов загружен с бэкенда (обрыв
      сети при старте приложения).
    expect: >
      гард не падает; страница закрыта до появления прав, повторный переход
      после загрузки столов открывает её
    test: ~
    status: missing

  - id: ext.gating.side.05
    level: ui
    kind: side
    scenario: >
      Пайщик выбирает стол в переключателе столов, не имея допуска в него.
    expect: >
      переключатель ведёт на страницу подключения этого стола, а не на его
      страницу по умолчанию
    test: ~
    status: missing
