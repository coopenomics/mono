feature: platform.i18n
title: Интернационализация — словари, формат сообщений, язык запроса, коды ошибок

# Текст, который видит пользователь, живёт в словарях, код ссылается на него
# ключами. Язык пока один — русский, поэтому любая поломка здесь видна сразу:
# на экране вместо фразы появляется ключ, в сообщении об ошибке — код,
# в форме «2 дней» вместо «2 дня».
#
# Что легко сломать и потому проверяется отдельно:
#  - формы по числу: 11–14 берут форму «дней», 21 — «день», дробь — «дня»;
#  - служебные символы в тексте: «@» в адресе почты без экранирования ломает
#    компиляцию сообщения, и вместо текста выводится ключ;
#  - два словаря с одним ключом: второй молча затёр бы первый, и текст зависел
#    бы от порядка загрузки расширений — поэтому слияние отказывает;
#  - язык запроса на сервере: он обязан пережить await внутри запроса и не
#    протечь в соседний запрос.

sources:
  backend:
    - components/i18n/src/**

cases:
  - id: plt.i18n.happy.01
    level: backend
    kind: happy
    scenario: Сообщение с именованными и позиционными параметрами и формами по числу
    expect: >
      «Привет, Мир!», «1 из 2»; 1 день, 3 дня, 25 дней, для нуля — отдельная
      форма, если она объявлена
    test: components/i18n/src/index.test.ts
    status: written

  - id: plt.i18n.side.01
    level: backend
    kind: side
    scenario: Числа на границах правил русского языка
    expect: >
      11, 12, 14, 111 — форма «дней»; 21, 101 — «день»; 22 — «дня»; 1,5 — «дня»
    test: components/i18n/src/index.test.ts
    status: written

  - id: plt.i18n.side.02
    level: backend
    kind: side
    scenario: Служебный символ и ссылка на другое сообщение
    expect: литерал {'@'} даёт «@», ссылка @:key подставляет текст другого сообщения
    test: components/i18n/src/index.test.ts
    status: written

  - id: plt.i18n.break.01
    level: backend
    kind: break
    scenario: Ключа нет в словаре
    expect: возвращается сам ключ, пропуск записывается для отчёта
    test: components/i18n/src/index.test.ts
    status: written

  - id: plt.i18n.break.02
    level: backend
    kind: break
    scenario: Два словаря объявляют одно сообщение
    expect: слияние отказывает с именем ключа, повторная регистрация того же источника игнорируется
    test: components/i18n/src/index.test.ts
    status: written

  - id: plt.i18n.side.03
    level: backend
    kind: side
    scenario: Язык запроса в асинхронном коде и неизвестный язык
    expect: >
      после await язык тот же; неподдерживаемый язык заменяется русским;
      Accept-Language «en-US,en;q=0.9,ru;q=0.5» выбирает русский
    test: components/i18n/src/index.test.ts
    status: written

  - id: plt.i18n.side.04
    level: backend
    kind: side
    scenario: Псевдолокаль
    expect: каждая форма обрамлена «[!! … !!]», плейсхолдеры и ссылки нетронуты, сообщение компилируется
    test: components/i18n/src/index.test.ts
    status: written
