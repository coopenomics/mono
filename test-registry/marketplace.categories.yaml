feature: marketplace.categories
title: Доступные категории кооператива — ограничение каталога и собственные категории

# Слайс справочника категорий: какие категории кооператив разрешает для
# публикации предложений. Пустой список ограничений = открыт весь каталог;
# как только хоть одна категория выключена, действует ограниченный список.
# Базовые категории платформы нельзя удалить — только выключить.
#
# Отдельная особенность прав: маршрут стола требует грант `Whitelist:manage`,
# а резолверы защищены ролью председателя. Токен нужно держать в матрице
# доступа — без него страница недостижима ни для кого (так и было до
# 2026-08-07).

sources:
  backend:
    - components/controller/src/extensions/marketplace/application/resolvers/available-category-admin.resolver.ts
    - components/controller/src/extensions/marketplace/application/access/marketplace-access-matrix.ts
    - components/controller/src/extensions/marketplace/application/access/marketplace-grants.ts
  ui:
    - components/desktop/src/pages/Marketplace/ChairmanCategoryWhitelist/**

cases:
  - id: mkt.cat.happy.01
    level: ui
    kind: happy
    scenario: >
      Председатель открывает «Доступные категории»: показан справочник базовых категорий, каталог открыт целиком.
    expect: список непустой, состояние «Открыт весь каталог»
    test: components/docs-harness/scenarios/marketplace/chairman/category-whitelist.mjs
    status: passing

  - id: mkt.cat.happy.02
    level: ui
    kind: happy
    scenario: Председатель выключает категорию и включает её обратно
    expect: >
      после выключения каталог перестаёт быть открытым, после включения возвращается в исходное состояние
    test: components/docs-harness/scenarios/marketplace/chairman/category-whitelist.mjs
    status: passing

  - id: mkt.cat.side.01
    level: backend
    kind: side
    scenario: Попытка удалить базовую категорию платформы
    expect: отказ «Базовую категорию удалить нельзя»
    test: components/controller/tests/unit/marketplace/marketplace-category-repository.test.ts
    status: passing

  - id: mkt.cat.side.02
    level: backend
    kind: side
    scenario: >
      Создание собственной категории с именем, которое уже есть в пределах
      кооператива (его собственная либо базовая категория платформы)
    expect: отказ «Категория с таким названием уже существует», дубликат не создаётся
    test: components/controller/tests/unit/marketplace/marketplace-category-repository.test.ts
    status: passing
    # Эта часть определена: `createCustom` сверяется с `listForCoop` —
    # базовые категории плюс собственные категории кооператива, сравнение
    # регистронезависимое и по обрезанной строке.

  - id: mkt.cat.side.07
    level: backend
    kind: side
    scenario: >
      Создание категории с именем, которое уже занял ДРУГОЙ кооператив
    expect: не определено — заказчик склоняется к глобальной уникальности
    test: ~
    status: missing
    decision_needed: true
    # Заказчик (2026-08-08): «лучше глобально, но надо подробности».
    # Развилки, без которых поведение не выводится:
    #  1) Глобальный ЗАПРЕТ или глобальное ПЕРЕИСПОЛЬЗОВАНИЕ? При запрете
    #     кооператив получает отказ «уже существует» про категорию, которой
    #     не видит (listForCoop чужие кастомные не отдаёт) — объяснить отказ
    #     в интерфейсе будет нечем.
    #  2) Кто владелец переиспользованной категории и может ли первый
    #     создатель её удалить? Сейчас `deleteCustom` бьёт по трём ключам
    #     (id, coopname, mvp_baseline=false) — при общей категории удаление
    #     первым кооперативом вынесло бы её у всех остальных.
    #  3) Нормализация имени при глобальном сравнении: сейчас trim +
    #     регистронезависимо; «Мёд» и «Мед» (е/ё) считаются разными.
    # Замечание к реализации: связка кооператив ↔ категория уже существует —
    # `available_categories` с уникальным (coopname, categoryId, typeId).
    # Поэтому переиспользование ложится на имеющуюся модель: общая строка
    # справочника плюс запись доступности у каждого кооператива.

  - id: mkt.cat.side.08
    level: backend
    kind: break
    scenario: >
      Два одновременных запроса создают категорию с одним и тем же именем
    expect: остаётся одна категория
    test: ~
    status: missing
    # ДЕФЕКТ ПРОДУКТА (2026-08-08, чтением кода): уникальность имени держится
    # только проверкой в сервисе (`createCustom` читает список и сравнивает),
    # а уникального индекса в БД нет — у `marketplace_category` объявлены лишь
    # @Index(['sort_order']) и @Index(['coopname']). Две параллельные попытки
    # проходят проверку обе. Тот же зазор делает глобальную уникальность
    # недостижимой без индекса. Не чиню: сначала нужен ответ по side.07 —
    # индекс будет разным для «в пределах кооператива» и «глобально».

  - id: mkt.cat.side.03
    level: backend
    kind: side
    scenario: Управление категориями от пайщика без роли председателя
    expect: отказ доступа, справочник не меняется
    test: ~
    status: missing

  - id: mkt.cat.side.04
    level: ui
    kind: side
    scenario: >
      Публикация предложения в категории, выключенной кооперативом
    expect: категория недоступна в форме предложения
    test: ~
    status: missing

  - id: mkt.cat.side.05
    level: backend
    kind: side
    scenario: >
      Маршрут стола требует грант, которого нет ни в одной роли матрицы
    expect: >
      расхождение обнаруживается тестом: каждый грант из meta.requires маршрутов Стола заказов выдаётся хотя бы одной ролью
    test: components/controller/tests/unit/marketplace/marketplace-route-grants-coverage.test.ts
    status: passing

  - id: mkt.cat.side.06
    level: backend
    kind: side
    scenario: >
      Роль с правом над всеми объектами открывает страницу, требующую права в
      более узком охвате (участок, свои объекты).
    expect: >
      широкое право разворачивается в подмножества охвата и покрывает узкое
      требование; узкое право роли при этом не расширяется до всех объектов
    test: components/controller/tests/unit/marketplace/marketplace-route-grants-coverage.test.ts
    status: passing
