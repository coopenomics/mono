    - components/controller/src/extensions/marketplace/application/dto/deactivate-ku-input.dto.ts
    - components/controller/src/extensions/marketplace/application/dto/ku-details.dto.ts
    - components/controller/src/extensions/marketplace/application/dto/list-marketplace-ku-input.dto.ts
    - components/controller/src/extensions/marketplace/application/dto/working-hours.dto.ts
    - components/controller/src/extensions/marketplace/application/dto/working-hours-input.dto.ts
    - components/controller/src/extensions/marketplace/domain/entities/ku-details-domain.entity.ts
    - components/controller/src/extensions/marketplace/infrastructure/adapters/ku-details-repository.adapter.ts
    - components/controller/src/extensions/marketplace/infrastructure/adapters/yandex-geocoder.adapter.ts
    - components/controller/src/extensions/marketplace/infrastructure/entities/ku-details.entity.ts
  ui:
