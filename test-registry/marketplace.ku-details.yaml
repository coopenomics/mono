feature: marketplace.ku-details
title: Пункт выдачи участка — режим работы, статус и место на карте

# Председатель описывает пункт выдачи кооперативного участка (режим работы,
# описание) и включает его; пайщики видят только включённые пункты. Место на
# карте берётся из адреса участка: платформа спрашивает геокодер и запоминает
# координаты либо причину отказа. Повтор запроса — по команде председателя;
# смена адреса участка перезапускает запрос сама.
#
# Заведено 02.10.2026 (C28-85): серверная часть жила вне реестра, запись в
# таблицу marketplace_ku_details шла только засевом стенда (карта готовности к
# уходу с TypeORM, C28-81). Геокодер на стенде играет подставной узел.

# Правка 2026-10-04 (C28-87): права операций сверяются с единой таблицей прав
# Стола заказов вместе с условием строки (кооператив подключён, заказчик
# подключён, хранение включено); декоратор операции — общий `@RequireRight` из
# каркаса расширений. Случаи про условия — в marketplace.rights-table; набор
# случаев этой фичи прежний.

sources:
  backend:
    - components/controller/src/extensions/marketplace/application/resolvers/ku-details.resolver.ts
    - components/controller/src/extensions/marketplace/application/services/ku-details.service.ts
