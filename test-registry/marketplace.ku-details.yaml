cases:
  - id: mkt.ku.happy.01
    level: backend
    kind: happy
    scenario: председатель правит режим работы и описание пункта выдачи
    expect: режим и описание сохранены и видны пайщику; день без режима — выходной; статус пункта не меняется
    test: components/api-tests/src/marketplace/ku-details.test.ts
    status: written

  - id: mkt.ku.happy.02
    level: backend
    kind: happy
    scenario: председатель выключает и включает пункт выдачи
    expect: выключенный пункт пайщик среди действующих не видит, в полном списке он остаётся; включённый — виден; описание не меняется
    test: components/api-tests/src/marketplace/ku-details.test.ts
    status: written

  - id: mkt.ku.happy.03
    level: backend
    kind: happy
    scenario: председатель повторяет запрос места на карте, геокодер отвечает координатами
    expect: геокодеру ушёл адрес участка; координаты и время записаны, статус «найдено», причина прежнего отказа снята
    test: components/api-tests/src/marketplace/ku-details.test.ts
    status: written

  - id: mkt.ku.side.01
    level: backend
    kind: side
    scenario: геокодер отвечает отказом сервера; геокодер не находит адрес
    expect: пункт помечен отказом с причиной и остаётся включённым
    test: components/api-tests/src/marketplace/ku-details.test.ts
    status: written

  - id: mkt.ku.side.02
    level: backend
    kind: side
    scenario: пункт выдачи правит, выключает или отправляет на геокодер член совета или пайщик
    expect: отказ по правам, пункт не меняется
    test: components/api-tests/src/marketplace/ku-details.test.ts
    status: written

  - id: mkt.ku.side.03
    level: backend
    kind: side
    scenario: запрос с именем чужого кооператива; участок, которого нет; участок без пункта выдачи
    expect: отказ своим кодом на каждый случай
    test: components/api-tests/src/marketplace/ku-details.test.ts
    status: written

  - id: mkt.ku.side.04
    level: backend
    kind: side
    scenario: у участка сменили адрес в реквизитах
    expect: при следующем чтении списка пунктов место на карте запрашивается заново по новому адресу
    test: components/api-tests/src/marketplace/ku-details.test.ts
    status: written

  - id: mkt.ku.side.05
    level: backend
    kind: side
    scenario: >
      хранилище реквизитов участка: перечень действующих участков кооператива
    expect: >
      отбор по кооперативу и статусу «действует», порядок — по дате заведения
    test: components/controller/tests/unit/marketplace/marketplace-kysely-queries.test.ts
    external: unreachable
    external_reason: "проверяются условия запроса к базе — снаружи они не видны; реквизиты участка через API покрыты случаями mkt.ku.*"
    status: written
