feature: capital.list-filters-sort
title: Списки Благороста — раздел «Компоненты», фильтры и сортировка

# Три списка программы устроены одинаково: проекты (дерево проект → компонент →
# задача), компоненты (то же дерево без первого уровня — все компоненты
# кооператива подряд, у каждого свои задачи) и задачи (плоский список).
#
# Правило показа одно на все три: список отдаёт всё, что пайщику доступно, а
# сужает выборку он сам — кнопками «Фильтры» и «Сортировка» в шапке. Что именно
# доступно, решает бэкенд: совет видит всё, пайщик — свою работу (постановщик,
# ответственный, исполнитель) и проекты, где он ведущий или получил допуск.
# Раньше страница задач жёстко показывала только свои задачи — это ушло в фильтр
# «только мои», выключенный по умолчанию.
#
# Каждый список фильтруется по своим сущностям и не смешивает чужие: дерево
# проектов и компонентов — по проектам и компонентам, раздел «Задачи» — по
# задачам (статус, приоритет, исполнитель). Фильтр применяется сразу при выборе,
# отдельного «Применить» нет — окно закрывается крестиком или кликом мимо.
#
# Выбранные фильтры и сортировка переживают перезагрузку: они хранятся у клиента
# по каждому списку отдельно (свои у проектов, свои у компонентов, свои у задач).
#
# Поле сортировки уходит в ORDER BY подстановкой имени, поэтому набор колонок
# закрытый — см. случаи cap.lists.break.*.

