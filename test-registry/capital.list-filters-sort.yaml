cases:
  # ── Сортировка: закрытый набор колонок ────────────────────────────────────

  - id: cap.lists.happy.01
    level: backend
    kind: happy
    scenario: список запрашивается с сортировкой по колонке сущности
    expect: сортировка применяется по этой колонке
    test: components/controller/tests/unit/capital/list-sort-column.test.ts
    status: written

  - id: cap.lists.side.01
    level: backend
    kind: side
    scenario: поле сортировки не передано
    expect: список сортируется умолчанием, отказа нет
    test: components/controller/tests/unit/capital/list-sort-column.test.ts
    status: written

  - id: cap.lists.side.02
    level: backend
    kind: side
    scenario: клиент прислал имя поля, которого у сущности нет (устаревшая ссылка, опечатка)
    expect: список отдаётся, сортировка падает на умолчание
    test: components/controller/tests/unit/capital/list-sort-column.test.ts
    status: written

  - id: cap.lists.break.01
    level: backend
    kind: break
    scenario: в поле сортировки дописан SQL
    expect: имя отвергается, применяется умолчание
    test: components/controller/tests/unit/capital/list-sort-column.test.ts
    status: written

  # ── Что попадает в списки ─────────────────────────────────────────────────

  - id: cap.lists.happy.02
    level: ui
    kind: happy
    scenario: пайщик открывает раздел «Компоненты»
    expect: показаны компоненты кооператива без уровня проектов, у каждого приписан его проект
    status: missing

  - id: cap.lists.happy.03
    level: ui
    kind: happy
    scenario: пайщик разворачивает компонент в разделе «Компоненты»
    expect: под ним тот же список задач, что и внутри проекта
    status: missing

  - id: cap.lists.happy.04
    level: ui
    kind: happy
    scenario: пайщик открывает раздел «Задачи» без фильтров
    expect: показаны все доступные ему задачи, а не только те, где он исполнитель
    status: missing

  - id: cap.lists.side.03
    level: ui
    kind: side
    scenario: пайщик включает фильтр «только мои задачи», уходит со стола и возвращается
    expect: фильтр остался включённым
    status: missing

  - id: cap.lists.side.04
    level: ui
    kind: side
    scenario: фильтры выставлены на списке задач, пайщик открывает список компонентов
    expect: у компонентов свои фильтры, чужие не применились
    status: missing

  - id: cap.lists.happy.05
    level: ui
    kind: happy
    scenario: пайщик создаёт компонент из шапки раздела «Компоненты»
    expect: в диалоге обязателен выбор проекта, в списке только проекты, где он вправе заводить компоненты
    status: missing

  - id: cap.lists.side.06
    level: ui
    kind: side
    scenario: у пайщика нет ни одного проекта с правом заводить компоненты
    expect: кнопки «Компонент» в шапке нет
    status: missing

  - id: cap.lists.side.07
    level: ui
    kind: side
    scenario: пайщик создаёт задачу из шапки раздела «Задачи»
    expect: задача создаётся без компонента и попадает в список, привязать компонент можно потом
    status: missing

  - id: cap.lists.side.08
    level: ui
    kind: side
    scenario: задача создаётся из шапки раздела «Задачи» с выбором компонента
    expect: в списке компонентов только те, где пайщик вправе вести задачи; без выбора задача остаётся свободной
    status: missing

  - id: cap.lists.side.09
    level: ui
    kind: side
    scenario: пайщик выбирает мастера в фильтрах и закрывает окно крестиком
    expect: фильтр уже применён, список перечитан
    status: missing

  - id: cap.lists.side.05
    level: backend
    kind: side
    scenario: задачи запрашиваются без указания компонента пайщиком без допуска к чужому проекту
    expect: чужие задачи не попадают в выборку и не считаются в totalCount
    test: components/controller/tests/unit/capital/artifact-and-communication-access.test.ts
    status: written
