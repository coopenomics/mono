feature: capital.content-revisions
title: История редакций и серверное слияние — проекты, компоненты, задачи, артефакты

# Каждая успешная запись title/description проекта/компонента, задачи и артефакта
# становится редакцией (capital_content_revisions, rev монотонный на сущность).
# Клиент присылает base_rev — редакцию, с которой начал; сервер под FOR UPDATE
# сливает правку с текущим текстом трёхсторонне (diff3 для markdown/mermaid,
# «изменил один» для XML-диаграмм). Чистое слияние — сохраняется и возвращается
# слитый текст; настоящий конфликт — ошибка CONTENT_CONFLICT с обеими версиями,
# ничего не записано. Откат — обычная запись с origin=RESTORE (остаётся в истории).
# Первичный снимок rev=1 сеется миграцией и лениво сервисом.
#
# Ту же историю редакций ведёт blago-cli при синхронизации файлов
# (`components/blago-cli/src/sync/{push,merge3,sync-entity-file}.ts`) — в
# sources их нет намеренно: уровни реестра это уровни тестов
# (contract/backend/ui), а сам каталог blago-cli не входит в значимые корни
# гейта, так что связать код с фичей через него всё равно не выйдет.

# Правка 25.09.2026 (C28-80): деловые отказы (не найдено, нет прав, уже есть,
# неверный ввод) отвечают своим статусом — 404, 403, 409, 400, — а не 500
# «внутренняя ошибка»: коды и тексты прежние, меняется только статус ответа, и
# такие отказы больше не попадают в журнал ошибок сервера как поломки.

sources:
  backend:
    - components/controller/src/extensions/capital/application/services/content-revision.service.ts
    # Правка проекта: редакция до editproj и откат при отказе цепи (C28-94).
    - components/controller/src/extensions/capital/application/use-cases/project-management.interactor.ts
    - components/controller/src/extensions/capital/application/services/content-revision-api.service.ts
    - components/controller/src/extensions/capital/application/resolvers/content-revision.resolver.ts
    - components/controller/src/extensions/capital/domain/utils/content-merge.util.ts
    - components/controller/src/extensions/capital/domain/errors/content-conflict.error.ts
    - components/controller/src/extensions/capital/infrastructure/entities/content-revision.record.ts
    - components/controller/migrations/V2.5.5__capital_content_revisions_backfill.ts
    # blago-cli ходит тем же API синхронизации; отдельного уровня «cli» в
    # реестре нет, маски живут в backend.
    - components/blago-cli/src/sync/push.ts
    - components/blago-cli/src/sync/merge3.ts
    - components/blago-cli/src/sync/sync-entity-file.ts
  ui:
    - components/desktop/extensions/capital/features/ContentRevisions/**
    - components/desktop/extensions/capital/pages/ProjectDescriptionPage/**
    - components/desktop/extensions/capital/pages/ComponentDescriptionPage/**

cases:
  - id: cap.rev.happy.01
    level: backend
    kind: happy
    scenario: две правки в разных местах markdown относительно одной базы
    expect: сливаются без конфликта, merged=true, обе правки в результате
    test: components/controller/tests/unit/capital/content-merge.util.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.side.01
    level: backend
    kind: side
    scenario: одна строка изменена по-разному с двух сторон
    expect: конфликт с маркерами ours/base/theirs, ничего не потеряно
    test: components/controller/tests/unit/capital/content-merge.util.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.side.02
    level: backend
    kind: side
    scenario: заголовок изменён по-разному двумя авторами
    expect: title_conflict=true
    test: components/controller/tests/unit/capital/content-merge.util.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.side.03
    level: backend
    kind: side
    scenario: BPMN/DRAWIO правлены параллельно
    expect: построчное слияние не применяется — конфликт; правил один — берётся его версия
    test: components/controller/tests/unit/capital/content-merge.util.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.side.04
    level: backend
    kind: side
    scenario: клиент прислал текст, равный текущему серверному (повторное сохранение)
    expect: редакция не создаётся, content_rev не растёт
    test: components/controller/tests/unit/capital/content-revision.service.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.side.05
    level: backend
    kind: side
    scenario: сущность с content_rev=0 (создана до фичи) получает первую запись через API
    expect: лениво сеется rev=1 из текущего текста, запись становится rev=2
    test: components/controller/tests/unit/capital/content-revision.service.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.break.01
    level: backend
    kind: break
    scenario: блокчейн-проект — транзакция editproj упала после подготовки редакции
    expect: rollbackWrite возвращает текст и content_rev к предыдущей редакции, снимок удалён
    test: components/controller/tests/unit/capital/content-revision.service.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  # Откат по содержимому строки, а не по снимку (C28-94, 23.10.2026): правка
  # завершённого проекта, отклонённая цепью, оставляла в базе текст старой
  # редакции — строку к тому времени стёрла дельта мимо сервиса редакций.
  - id: cap.rev.break.02
    level: backend
    kind: break
    scenario: цепь отклонила правку, а строка в базе до записи расходилась со снимком последней редакции
    expect: откат возвращает строке то, что лежало в ней до записи; текст старой редакции в базу не попадает
    test: components/controller/tests/unit/capital/content-revision.service.test.ts
    external: unreachable
    external_reason: строка расходится со снимком, только если её переписали мимо сервиса редакций; после C28-80 через API такую строку не создать
    status: written

  - id: cap.rev.side.10
    level: backend
    kind: side
    scenario: цепь отклонила правку, которая совпала с текущим текстом (редакция не создавалась)
    expect: откат строку и редакции не трогает
    test: components/controller/tests/unit/capital/content-revision.service.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.side.11
    level: backend
    kind: side
    scenario: пока цепь отвечала, поверх записал другой автор
    expect: откат пропускается, чужая редакция остаётся
    test: components/controller/tests/unit/capital/content-revision.service.test.ts
    external: unreachable
    external_reason: чужая запись должна лечь ровно между подготовкой редакции и отказом цепи; через API это окно не поймать
    status: written

  - id: cap.rev.break.03
    level: backend
    kind: break
    scenario: правка завершённого проекта (статус result), который контракт редактировать не даёт
    expect: отказ CAPITAL_PROJECT_EDIT_COMPLETED до записи — ни редакции, ни транзакции editproj
    test: components/controller/tests/unit/capital/edit-project-chain-refusal.test.ts
    api: components/api-tests/src/capital/result-submission.test.ts
    status: written

  - id: cap.rev.break.04
    level: backend
    kind: break
    scenario: цепь отклонила editproj после подготовки редакции
    expect: откат получает подготовленную запись целиком, синхронизации нет, вызывающий получает ошибку цепи
    test: components/controller/tests/unit/capital/edit-project-chain-refusal.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.happy.03
    level: backend
    kind: happy
    scenario: цепь приняла правку проекта
    expect: отката нет, проект синхронизируется из цепи
    test: components/controller/tests/unit/capital/edit-project-chain-refusal.test.ts
    api: components/api-tests/src/capital/content-revisions.test.ts
    status: written

  - id: cap.rev.side.06
    level: backend
    kind: side
    scenario: просмотр истории артефакта без допуска к проекту
    expect: отказ «Недостаточно прав для просмотра истории редакций»
    test: components/api-tests/src/capital/artifact-access.test.ts
    status: written

  - id: cap.rev.happy.02
    level: ui
    kind: happy
    scenario: проект/компонент — правка описания, кнопка «Сохранить», окно «Редакции» показывает новую запись
    expect: без кнопки на сервер ничего не уходит; в списке редакций появляется запись с автором
    status: missing

  - id: cap.rev.side.07
    level: ui
    kind: side
    scenario: откат к прежней редакции из окна «Редакции»
    expect: содержимое редактора заменено, в истории новая запись RESTORE со ссылкой на исходную
    status: missing

  - id: cap.rev.ui.03
    level: ui
    kind: side
    scenario: >
      Артефакт с несохранёнными правками открыт на телефоне: слева подпись
      состояния, справа «Редакции», избранное и «Сохранить».
    expect: >
      строка укладывается в ширину экрана, длинная подпись обрезается
      многоточием, горизонтальной прокрутки страницы не возникает
    status: missing


  - id: cap.rev.side.08
    level: backend
    kind: side
    scenario: >
      хранилище истории редакций: список редакций сущности; запись, откат и
      посев редакции в одной транзакции с блокировкой строки
    expect: >
      список отдаёт только редакции этой сущности, свежие первыми; запись
      текста, номера редакции и снимка идёт одним соединением транзакции
    test: components/controller/tests/unit/capital/capital-kysely-stores.test.ts
    external: unreachable
    external_reason: "проверяются запросы к базе и границы транзакции — снаружи они не видны; слияние и история через API покрыты случаями фичи"
    status: written

# 2026-09-23 (EEA-6…EEA-9): тексты интерфейса, отказов и уведомлений фичи вынесены из
# кода в словари i18n, отказы бэкенда переведены на DomainError с кодом — текст
# и HTTP-статус ответа прежние. Сценарии фичи и её проверки не менялись.

  # Права по таблице прав Благороста (C28-87, кусок 4, 05.10.2026): операции
  # стоят под общим гардом каркаса вместо `@AuthRoles`; прежние списки ролей и
  # проход «на своё имя» перенесены один в один, роль в проекте по-прежнему
  # ведёт таблица ролей проекта.
  - id: cap.rev.side.09
    level: backend
    kind: side
    scenario: операции раздела зовут кандидат, пайщик, член совета и председатель с чужим именем в запросе и со своим
    expect: "исход прежнего правила операции: по роли проходит названный в таблице прав, на своё имя — каждый вошедший, остальным отказ KIT_INSUFFICIENT_RIGHTS либо KIT_RIGHT_SCOPE_OWN"
    test: components/controller/tests/unit/capital/capital-rights.test.ts
    api: components/api-tests/src/rights/matrix.test.ts
    status: written
