feature: membership.exit
title: Выход пайщика из кооператива — заявление, подтверждение по письму, превью возврата

# Пайщик (или совет за него) подаёт подписанное заявление на выход. Оно
# ложится черновиком в membership_exit_requests и ждёт подтверждения по ссылке
# из письма; только после подтверждения уходит в цепь (registrator::exitcoop).
# До подтверждения заявление можно отменить. Превью возврата считает паевые
# кошельки пайщика тем же набором, что контракт при одобрении выхода.
#
# Заведено 24.09.2026 (C28-80): сервис выхода ходит в TypeORM напрямую —
# таблица membership_exit_requests прикрыта внешним тестом до перевода на
# Kysely (C28-81).

sources:
  backend:
    - components/controller/src/application/membership-exit/**/*.ts
    - components/controller/src/infrastructure/database/typeorm/entities/membership-exit-request.entity.ts
    - components/controller/src/application/document/documents-dto/membership-exit-*.ts

cases:
  - id: mem.exit.side.01
    level: backend
    kind: side
    scenario: пайщик без реквизитов для возврата подаёт заявление на выход
    expect: отказ MEMBERSHIP_EXIT_PAYMENT_METHOD_REQUIRED, заявления нет
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.01
    level: backend
    kind: happy
    scenario: пайщик с реквизитами подаёт подписанное заявление на выход
    expect: заявление AWAITING_CONFIRMATION с хэшем выхода, платежа возврата нет; пайщик и совет видят статус
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.02
    level: backend
    kind: side
    scenario: второе заявление, пока первое ждёт подтверждения
    expect: отказ MEMBERSHIP_EXIT_PENDING_CONFIRMATION, в силе первое
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.03
    level: backend
    kind: side
    scenario: чужой пайщик подаёт, читает и отменяет выход пайщика; гость подаёт заявление
    expect: отказы MEMBERSHIP_EXIT_SELF_ONLY / MEMBERSHIP_EXIT_STATUS_SELF_ONLY / MEMBERSHIP_EXIT_CANCEL_SELF_ONLY, 401 гостю; заявление пайщика не тронуто
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.04
    level: backend
    kind: side
    scenario: подтверждение выхода негодной ссылкой
    expect: отказ 401, заявление остаётся ожидающим
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.02
    level: backend
    kind: happy
    scenario: пайщик отменяет заявление до подтверждения
    expect: отмена подтверждена, активного выхода нет
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.05
    level: backend
    kind: side
    scenario: повторная отмена, когда заявления нет
    expect: отказ MEMBERSHIP_EXIT_NO_PENDING_REQUEST
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.03
    level: backend
    kind: happy
    scenario: председатель подаёт заявление за пайщика и отменяет его
    expect: заявление пайщика AWAITING_CONFIRMATION видно пайщику, после отмены выхода нет
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.04
    level: backend
    kind: happy
    scenario: превью возврата паевого взноса до и после пополнения паевого кошелька
    expect: итог равен сумме w.reg.minshr + w.wal.share + w.cap.blago, целевой и минимальный — остаткам своих кошельков; пополнение прибавляется к целевому и к итогу
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.06
    level: backend
    kind: side
    scenario: чужой пайщик запрашивает превью возврата пайщика; совет запрашивает его
    expect: отказ MEMBERSHIP_EXIT_CALCULATION_SELF_ONLY пайщику, совет получает тот же расчёт, что пайщик
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.05
    level: backend
    kind: happy
    scenario: пайщик подтверждает выход по ссылке из письма
    expect: заявление уходит в цепь (registrator::exitcoop), черновик и токен удаляются, статус PENDING
    test: ~
    status: missing

  - id: mem.exit.side.07
    level: backend
    kind: side
    scenario: вышедший пайщик (аккаунт blocked) подаёт заявление снова
    expect: отказ MEMBERSHIP_EXIT_ALREADY_EXITED
    test: ~
    status: missing

  - id: mem.exit.side.08
    level: backend
    kind: side
    scenario: заявление подаётся, когда выход уже в цепи
    expect: отказ MEMBERSHIP_EXIT_ALREADY_SUBMITTED
    test: ~
    status: missing
