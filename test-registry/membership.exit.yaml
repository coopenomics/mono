feature: membership.exit
title: Выход пайщика из кооператива с аннулированием соглашений ЦПП

# Компонент 69 «Управление соглашениями ЦПП». Выход собирает средства пайщика
# по всем программам и возвращает их одним платежом: заявление о выходе (200)
# и заявление об аннулировании соглашений ЦПП (190) подписываются вместе, совет
# принимает решение (201), контракт обходит таблицу политики кошельков
# EXIT_WALLET_POLICY, сводит возвратные остатки на главный паевой и платит через
# кассу, затем аннулирует соглашения программ.
#
# Что возвращается, определяет таблица политики, а не вид взноса: членский взнос
# ЦПП «Образование» возвратен по п. 4.2.5 его Положения, членский взнос «Стола
# заказов» остаётся кооперативу. Незакрытый подотчёт и резерв под заказы держат
# выход.
#
# Внешний слой (C28-80, 24.09.2026): сервис выхода ходит в TypeORM напрямую —
# таблица membership_exit_requests прикрыта внешним тестом до перевода на
# Kysely (C28-81).

sources:
  backend:
    - components/controller/src/application/membership-exit/**
    - components/controller/src/domain/account/services/member-exit-registry.service.ts
    - components/innercoop/src/core-ports/member-exit.port.ts
    - components/cooptypes/src/cooperative/registry/190.ProgramAgreementsAnnulmentStatement/**
    - components/cooptypes/src/cooperative/registry/200.ParticipantExitApplication/**
    - components/cooptypes/src/cooperative/registry/201.DecisionOfParticipantExit/**
    - components/cooptypes/src/ledger2/wallets.ts
    - components/factory/src/Actions/190.ProgramAgreementsAnnulmentStatement.ts
    - components/factory/src/Templates/190.ProgramAgreementsAnnulmentStatement.ts
    - components/controller/src/application/document/documents-dto/membership-exit-*.ts
    - components/controller/src/infrastructure/database/kysely/repositories/membership-exit-request.kysely-repository.ts
    - components/controller/src/domain/account/services/participant-status-sync.service.ts
  contract:
    - components/contracts/cpp/lib/core/ledger2/exit_policy.hpp
    - components/contracts/cpp/lib/core/registrator/exit.hpp
    - components/contracts/cpp/registrator/src/exit/**
  ui:
    - components/desktop/src/features/Membership/ExitFromCoop/**
    - components/desktop/src/pages/User/MembershipExitConfirmPage/**

cases:
  - id: exit.doc.happy.01
    level: backend
    kind: happy
    scenario: Заявление 190 у пайщика с двумя программами.
    expect: Программы печатаются таблицей с датой соглашения и остатками кошельков; итог к переводу — сумма возвратных.
    test: components/factory/test/program-agreements-annulment.test.ts
    status: passing
  - id: exit.doc.side.02
    level: backend
    kind: side
    scenario: Возврат, который выход ещё положит на кошельки программ (действующие подписки на курсы).
    expect: Расширения сообщают его реестру выхода; нулевые суммы отбрасываются, сбой расширения предрасчёт не роняет; в таблице 190 — отдельной строкой программы, в итоге — вместе с остатками.
    test: components/controller/tests/unit/membership-exit/member-exit-registry.test.ts
    status: passing
  - id: exit.doc.happy.02
    level: backend
    kind: happy
    scenario: Кошелёк возвращается либо остаётся кооперативу.
    expect: У возвратного — отметка о переводе на главный паевой, у остающегося — ссылка на Положение программы.
    test: components/factory/test/program-agreements-annulment.test.ts
    status: passing
  - id: exit.doc.side.01
    level: backend
    kind: side
    scenario: Заявление 190 подписывается без выхода из кооператива (вторая очередь).
    expect: Связи с заявлением на выход в тексте нет, просьба об аннулировании остаётся.
    test: components/factory/test/program-agreements-annulment.test.ts
    status: passing
  - id: exit.doc.happy.03
    level: backend
    kind: happy
    scenario: Оговорка об отсутствии иных требований и о сумме на день решения совета.
    expect: Обе формулировки стоят в тексте заявления.
    test: components/factory/test/program-agreements-annulment.test.ts
    status: passing
  - id: exit.wallets.happy.01
    level: backend
    kind: happy
    scenario: Таблица политики кошельков при выходе.
    expect: Возвращаются минимальный и главный паевой, Благорост, паевой Стола заказов, членский взнос и паевой взнос преподавателя «Образования»; главный паевой ровно один.
    test: components/cooptypes/test/wallets-registry.snapshot.test.ts
    status: passing
  - id: exit.wallets.break.01
    level: backend
    kind: break
    scenario: Новый пользовательский кошелёк завели без строки политики выхода.
    expect: Сборка контракта падает с указанием добавить строку; генератор cooptypes отказывается собирать зеркало.
    test: components/cooptypes/test/wallets-registry.snapshot.test.ts
    status: passing
  - id: exit.wallets.side.01
    level: backend
    kind: side
    scenario: Членский взнос «Стола заказов» и кошельки-блокеры.
    expect: Членский взнос остаётся кооперативу; резерв под заказы и незакрытый подотчёт перечислены как держащие выход.
    test: components/cooptypes/test/wallets-registry.snapshot.test.ts
    status: passing
  - id: exit.chain.happy.01
    level: contract
    kind: happy
    scenario: Совет одобрил выход пайщика с остатком на кошельке членских взносов «Образования».
    expect: "confirmexit сводит остаток на главный паевой операцией o.edu.retshr и включает его в сумму платежа."
    test: ~
    status: missing
  - id: exit.chain.happy.edu-share-01
    level: contract
    kind: happy
    scenario: Совет одобрил выход преподавателя с остатком паевого взноса по программе «Образование».
    expect: "confirmexit сводит остаток w.edu.share на главный паевой операцией o.edu.wthshr и включает его в сумму платежа."
    test: ~
    status: missing
  - id: exit.chain.break.01
    level: contract
    kind: break
    scenario: Выход при незакрытом подотчёте либо резерве под заказы.
    expect: Отказ с причиной из таблицы политики и суммой остатка.
    test: ~
    status: missing
  - id: exit.chain.happy.02
    level: contract
    kind: happy
    scenario: Приём заявления 190 к заявлению на выход и аннулирование соглашений в финале.
    expect: "exitagree сохраняет документ; confirmexit без него отказывает пайщику с программами; после completexit записи в wallet::users нет."
    test: ~
    status: missing
  - id: exit.chain.side.01
    level: contract
    kind: side
    scenario: Совет отказал либо касса отклонила платёж.
    expect: Резерв возвращается, соглашения продолжают действовать, пайщик остаётся членом.
    test: ~
    status: missing
  - id: exit.api.happy.01
    level: backend
    kind: happy
    scenario: Подача выхода с двумя документами и предрасчёт по программам.
    expect: Оба документа уходят одной транзакцией; предрасчёт делит суммы по программам и называет запреты.
    test: ~
    status: missing
  - id: exit.ui.happy.01
    level: ui
    kind: happy
    scenario: Диалог выхода и сводная страница участия в программах.
    expect: Таблица программ с суммами, два документа под одну подпись, запреты баннером с причинами.
    test: ~
    status: missing

  - id: mem.exit.side.01
    level: backend
    kind: side
    scenario: пайщик без реквизитов для возврата подаёт заявление на выход
    expect: отказ MEMBERSHIP_EXIT_PAYMENT_METHOD_REQUIRED, заявления нет
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.01
    level: backend
    kind: happy
    scenario: пайщик с реквизитами подаёт подписанное заявление на выход
    expect: заявление AWAITING_CONFIRMATION с хэшем выхода, платежа возврата нет; пайщик и совет видят статус
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.02
    level: backend
    kind: side
    scenario: второе заявление, пока первое ждёт подтверждения
    expect: отказ MEMBERSHIP_EXIT_PENDING_CONFIRMATION, в силе первое
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.03
    level: backend
    kind: side
    scenario: чужой пайщик подаёт, читает и отменяет выход пайщика; гость подаёт заявление
    expect: отказы MEMBERSHIP_EXIT_SELF_ONLY / MEMBERSHIP_EXIT_STATUS_SELF_ONLY / MEMBERSHIP_EXIT_CANCEL_SELF_ONLY, 401 гостю; заявление пайщика не тронуто
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.04
    level: backend
    kind: side
    scenario: подтверждение выхода негодной ссылкой
    expect: отказ 401, заявление остаётся ожидающим
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.02
    level: backend
    kind: happy
    scenario: пайщик отменяет заявление до подтверждения
    expect: отмена подтверждена, активного выхода нет
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.05
    level: backend
    kind: side
    scenario: повторная отмена, когда заявления нет
    expect: отказ MEMBERSHIP_EXIT_NO_PENDING_REQUEST
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.03
    level: backend
    kind: happy
    scenario: председатель подаёт заявление за пайщика и отменяет его
    expect: заявление пайщика AWAITING_CONFIRMATION видно пайщику, после отмены выхода нет
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.04
    level: backend
    kind: happy
    scenario: превью возврата паевого взноса до и после пополнения паевого кошелька
    expect: итог равен сумме w.reg.minshr + w.wal.share + w.cap.blago, целевой и минимальный — остаткам своих кошельков; пополнение прибавляется к целевому и к итогу
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.side.06
    level: backend
    kind: side
    scenario: чужой пайщик запрашивает превью возврата пайщика; совет запрашивает его
    expect: отказ MEMBERSHIP_EXIT_CALCULATION_SELF_ONLY пайщику, совет получает тот же расчёт, что пайщик
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing

  - id: mem.exit.happy.05
    level: backend
    kind: happy
    scenario: пайщик подтверждает выход по ссылке из письма
    expect: заявление уходит в цепь (registrator::exitcoop), черновик и токен удаляются, статус PENDING
    test: components/api-tests/src/membership/membership.exit.test.ts
    status: written

  - id: mem.exit.happy.06
    level: backend
    kind: happy
    scenario: пайщик подаёт заявление на выход и отменяет его; открыты подписки на ленту изменений
    expect: >
      сигнал по таблице заявлений с блоком 0 и ключом строки приходит пайщику и
      совету и при подаче, и при отмене; чужому пайщику — нет
    test: components/api-tests/src/membership/membership.exit.test.ts
    status: written

  - id: mem.exit.side.07
    level: backend
    kind: side
    scenario: вышедший пайщик (аккаунт blocked) подаёт заявление снова
    expect: отказ MEMBERSHIP_EXIT_ALREADY_EXITED
    test: components/api-tests/src/membership/membership.exit.test.ts
    status: written

  - id: mem.exit.side.08
    level: backend
    kind: side
    scenario: заявление подаётся, когда выход уже в цепи
    expect: отказ MEMBERSHIP_EXIT_ALREADY_SUBMITTED
    test: components/api-tests/src/membership/membership.exit.test.ts
    status: written

  - id: mem.exit.side.09
    level: backend
    kind: side
    scenario: выход завершён в цепи — вышедший человек обращается к данным кооператива и к своим
    expect: >
      учётная запись уходит из статуса «принят» по событию soviet::delpartcpnt:
      чтение собраний и другие права пайщика отвечают KIT_MEMBERS_ONLY; ход
      своего выхода и свои кошельки он читает как прежде. Повторный приём
      возвращает статус. Решение владельца от 03.10.2026 (C28-87): после выхода
      остаются вход и своё. Прежние выходы один раз проходит миграция данных
      202610031230 — по сохранённым действиям цепи
    test: components/controller/tests/unit/account/participant-join-date.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: written

  - id: mem.exit.break.09
    level: backend
    kind: break
    scenario: >
      заявление об аннулировании соглашений ЦПП формирует пайщик за другого
      пайщика; запрос без пайщика; учётная запись с не кооперативной ролью
    expect: >
      отказ 403 — право MembershipExit:generate из матрицы даёт пайщику только
      свой выход; член совета и председатель формируют заявление за любого;
      мутация объявлена правом матрицы, а не ролью
    test: components/controller/tests/unit/membership-exit/annulment-generation-rights.test.ts
    status: passing

  - id: mem.exit.break.10
    level: backend
    kind: break
    scenario: заявление на выход пайщика с программными соглашениями попало в цепь без заявления об их аннулировании; совет голосует за выход
    expect: решение совета не исполняется — контракт отказывает, пайщик остаётся в кооперативе, выход ждёт решения
    test: components/api-tests/src/membership/membership.exit.test.ts
    api: components/api-tests/src/membership/membership.exit.test.ts
    status: passing
