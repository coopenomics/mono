feature: marketplace.secure-due
title: Обеспечительная часть паевого взноса — учёт к списанию и списание в членский взнос первого числа месяца

# Задача 99D-18, решение владельца 31.10.2026. При заказе пайщик сверх
# стоимости имущества вносит обеспечительную часть паевого взноса по ставке
# кооператива. На выдаче её факт ложится на кошелёк пайщика к списанию
# w.mkt.due; на этот кошелёк ложится и удержание при отказе. Членским взносом
# участка она становится только при списании по условиям ЦПП: первого числа
# месяца после окончания гарантийного срока заказа, без подписи пайщика.
# Контракт не хранит, кому и когда списывать; учёт ведёт узел по операциям
# ledger2, которые провёл контракт, а контракт держит потолок остатка кошелька.

sources:
  backend:
    - components/controller/src/extensions/marketplace/application/services/marketplace-secure-due.service.ts
    - components/controller/src/extensions/marketplace/infrastructure/entities/marketplace-secure-due.entity.ts
    - components/controller/src/extensions/marketplace/migrations/database/1793440000000-secure-due.ts
  contract:
    - components/contracts/cpp/marketplace/src/p.mkt.supply/chargedue.cpp

cases:
  - id: mkt.secure.due.side.1
    level: backend
    kind: side
    scenario: Выданный заказ с гарантией и без неё — обеспечительная часть к списанию
    expect: строка учёта с остатком; созревает к концу гарантийного срока, без гарантии — в момент выдачи
    test: components/controller/tests/unit/marketplace/marketplace-secure-due.test.ts
    external: unreachable
    external_reason: "учёт к списанию — внутренняя таблица узла, через API стенда не выведена"
    status: passing

  - id: mkt.secure.due.side.2
