feature: marketplace.secure-due
title: Обеспечительная часть паевого взноса — учёт к списанию и списание в членский взнос первого числа месяца

# Задача 99D-18, решение владельца 31.10.2026. При заказе пайщик сверх
# стоимости имущества вносит обеспечительную часть паевого взноса по ставке
# кооператива. На выдаче её факт ложится на кошелёк пайщика к списанию
# w.mkt.due; на этот кошелёк ложится и удержание при отказе. Членским взносом
# участка она становится только при списании по условиям ЦПП: первого числа
# месяца после окончания гарантийного срока заказа, без подписи пайщика.
# Правка 09.11.2026 (99D-33): сколько и за какой период списывать, контракт
# знает из своих счётчиков (kudues, kucounters) — узел сумм в цепь не передаёт
# и называет только пайщика, участок и период. Зеркало узла (строка на заказ)
# остаётся для показа пайщику и закрывается операциями нитки списания p.mkt.due.


# Правка 07.11.2026 (99D-30): списание строки по итогу месяца берёт
# возмещение паевых взносов инициаторов участка разницей `invbranches.repaid_total`
# до и после `chargeperiod` и прибавляет его к итогу месяца
# (`noteCharged`, колонка `investor_repaid`); проход, который возместил
# паевые взносы, шлёт событие `marketplace.invest.repaid` для уведомления
# инициаторов. Суммы списания и возврата пайщику не менялись; случаи
# возмещения — mkt.order.invest.istok.07 и .08 в marketplace.order.
