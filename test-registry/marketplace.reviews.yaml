feature: marketplace.reviews
title: Профиль поставщика и отзывы заказчиков о полученном имуществе

# Задача 598-61. Заказчик открывает страницу поставщика с его имени на карточке
# предложения: кто поставщик, что он поставляет, что о нём говорят. Отзыв
# пишется по полученному заказу (заказ — одна позиция предложения, на заказ
# отзыв один), публикуется сразу; администратор скрывает его с причиной.
# Профиль и отзывы живут в базе узла, в цепь не пишутся. Профиль кооператива
# (имущество со склада) ведёт администратор.
#
# Модульные тесты написаны 10.10.2026 и идут в прогоне полигона ci/tests;
# сценарии через интерфейс ждут поднятого стенда.

