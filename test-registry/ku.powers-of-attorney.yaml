cases:
  - id: ku.trustee.happy.01
    level: backend
    kind: happy
    scenario: После решения совета председатель участка подписывает доверенность, председатель совета подписывает встречно
    expect: номер доверенности и номер протокола (номер решения совета) вписаны, прочерков нет; доверенность на подписи, затем действует; реестр совета показывает её
    test: components/api-tests/src/ku/decisions.test.ts
    api: components/api-tests/src/ku/decisions.test.ts
    status: written

  - id: ku.trustee.happy.02
    level: backend
    kind: happy
    scenario: Председатель участка подписывает договор о полной материальной ответственности
    expect: договор на подписи председателя совета
    test: components/api-tests/src/ku/decisions.test.ts
    api: components/api-tests/src/ku/decisions.test.ts
    status: written

  - id: ku.trustee.side.01
    level: backend
    kind: break
    scenario: Пайщик, который не председатель участка, генерирует доверенность участка или смотрит документы председателя; гость без входа
    expect: отказ KU_ACTION_BRANCH_CHAIRMAN_ONLY; гостю — отказ входа
    test: components/api-tests/src/ku/decisions.test.ts
    api: components/api-tests/src/ku/decisions.test.ts
    status: written

  - id: ku.trustee.side.02
    level: backend
    kind: side
    scenario: Срок доверенности, последний день, истечение и напоминание о продлении
    expect: срок — год со дня выдачи; в последний день действует, на следующий — истекла; напоминание — за тридцать дней и позже, только для действующей
    test: components/controller/tests/unit/ku/ku-powers-of-attorney.test.ts
    external: unreachable
    external_reason: "граница срока и окно напоминания зависят от текущей даты; сдвинуть дату узла снаружи нельзя"
    status: written

  - id: ku.trustee.side.03
    level: backend
    kind: break
    scenario: Доверенность председателя участка без решения совета об учреждении; доверенность доверенному лицу без действующей доверенности председателя
    expect: отказ KU_ESTABLISHMENT_PROTOCOL_NOT_FOUND; отказ KU_TRUSTEE_AUTHORITY_NOT_ACTIVE
    test: components/controller/tests/unit/ku/ku-powers-of-attorney.test.ts
    external: unreachable
    external_reason: "на стенде нет участка без решения совета, у которого председатель — пайщик теста; случай проверяется на правилах узла"
    status: written

  - id: ku.trustee.side.04
    level: backend
    kind: side
    scenario: Учёт по событиям цепи — подпись, встречная подпись, отказ, событие чужого кооператива
    expect: на подписи с реквизитами из документа; действует; отклонена; чужое событие учёт не меняет
    test: components/controller/tests/unit/ku/ku-powers-of-attorney.test.ts
    external: unreachable
    external_reason: "события чужого кооператива и отказ председателя совета снаружи не воспроизводятся без второй цепи"
    status: written

  - id: ku.trustee.side.05
    level: backend
    kind: side
    scenario: У председателя или доверенного лица участка истекла доверенность
    expect: Стол заказов не считает его работником участка (пункт выдачи закрыт); формальный председатель участка прежний; без учёта доверенностей и при его сбое — полномочия по составу участка
    test: components/controller/tests/unit/ku/ku-powers-of-attorney.test.ts
    external: unreachable
    external_reason: "истечение доверенности требует сдвига даты; снаружи срок в год не проходит"
    status: written

  - id: ku.trustee.side.07
    level: backend
    kind: side
    scenario: Договор председателя участка — подпись, встречная подпись председателя совета, отказ; новый договор на подписи при подписанном прежнем
    expect: учёт узла по событиям цепи меняет состояние, «Мой участок» обновляется сигналом ленты; подписанный договор действует, пока новый ждёт подписи
    test: components/controller/tests/unit/ku/ku-powers-of-attorney.test.ts
    external: unreachable
    external_reason: "отказ председателя совета и повторный договор снаружи проходят только через стол председателя; состояние учёта проверяется на событиях"
    status: written

  - id: ku.trustee.side.06
    level: backend
    kind: side
    scenario: До конца срока доверенности тридцать дней, новая не подписана
    expect: председатель участка получает одно напоминание о продлении со ссылкой на страницу участка
    test: ~
    status: missing
    note: Ежедневная задача узла по расписанию; проверка требует сдвига дат учёта на стенде.

  - id: ku.trustee.ui.01
    level: ui
    kind: happy
    scenario: Председатель участка открывает «Мой участок» после решения совета и подписывает доверенность и договор; совет открывает вкладку «Доверенности»
    expect: карточка «Документы председателя участка» с состоянием и кнопками подписи; предпросмотр документа перед подписью; строка реестра открывает доверенность в правой панели
    status: missing
    decision_needed: false
