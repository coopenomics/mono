feature: ku.powers-of-attorney
title: Доверенности кооператива — доверенность и договор председателя участка, учёт, продление, полномочия в пункте выдачи

# Решение владельца 18.11.2026. Заявление в совет об учреждении участка — один
# документ. После решения совета председатель участка на странице «Мой участок»
# подписывает доверенность (номер, протокол совета и срок вписывает узел, строки
# о банковском счёте нет) и бессрочный договор о полной материальной
# ответственности; оба документа председатель совета подписывает встречно через
# одобрения. Цепь хранит только подписи: учёт доверенностей (номер, срок,
# состояние) ведёт узел по событиям signauth/apprauth/declauth и
# reqtrusted/apprtrusted/decltrusted. Срок — год; за тридцать дней узел
# напоминает о продлении. Истёкшая доверенность закрывает пайщику работу с
# пунктом выдачи на узле; контракт по сроку не блокирует. Реестр доверенностей —
# вкладка «Доверенности» реестра документов совета.

