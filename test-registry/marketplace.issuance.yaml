cases:
  - id: mkt.iss.happy.01
    level: ui
    kind: happy
    scenario: >
      Оператор начинает выдачу по коду получателя, сверяет имущество и фиксирует факт.
    expect: >
      выдача начинается только по коду пайщика; после отправки пайщику уходит заявление на подпись
    test: ~ # было: components/docs-harness/scenarios/marketplace/operator/issuance-open.mjs
    status: missing
    # Паевая модель (компонент 68, 2026-09-06): подписи оператора при открытии
    # выдачи больше нет — пайщик подписывает заявление, совет решает, пайщик
    # подписывает акт, стол оператора закрывает выдачу сам. Сценарий harness
    # переписать под новый путь; до этого — pending.


  - id: mkt.iss.happy.02
    level: ui
    kind: happy
    scenario: >
      Заказчик видит выданный заказ в «Моих заказах» после закрывающей подписи оператора
    expect: статус «Получен», сохранены количество, сумма и пункт выдачи
    test: ~ # было: components/docs-harness/scenarios/marketplace/orderer/ready-to-receive.mjs
    status: missing
    # Паевая модель (компонент 68, 2026-09-06): подписи оператора при открытии
    # выдачи больше нет — пайщик подписывает заявление, совет решает, пайщик
    # подписывает акт, стол оператора закрывает выдачу сам. Сценарий harness
    # переписать под новый путь; до этого — pending.


  - id: mkt.iss.side.01
    level: ui
    kind: side
    scenario: Оператор пытается начать выдачу без кода получателя
    expect: выдача не начинается
    test: components/docs-harness/scenarios/marketplace/operator/issuance-no-code.mjs
    status: passing

  - id: mkt.iss.side.02
    level: backend
    kind: side
    scenario: Заявление или акт по заказу подписывает другой пайщик, а не его владелец
    expect: отказ — чужую выдачу двигать нельзя, на цепь ничего не уходит
    test: components/controller/tests/unit/marketplace/marketplace-issuance-ownership.test.ts
    status: passing

  - id: mkt.iss.side.03
    level: backend
    kind: side
    scenario: Оператор фиксирует к выдаче больше единиц, чем принято на складе
    expect: отказ — выдать больше принятого нельзя, сага не рождается
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.side.04
    level: backend
    kind: side
    scenario: Заказчик забирает не всё принятое по его заказу
    expect: >
      невыданное отделяется в обезличенный остаток кооператива по выданному количеству, к оплате идёт только выданное
    test: components/controller/tests/unit/marketplace/marketplace-issuance-remainder.test.ts
    status: passing
    # Денежная сторона недовыдачи закрыта отдельно
    # (marketplace-discrepancy-matrix), здесь — имущественная: остаток обязан
    # перестать быть адресным, иначе имущество числится за пайщиком, который
    # его не получал, и не попадает ни в перепубликацию, ни в списание.
    # В цепочке сюиты недовыдача проходит целиком (принято 9, выдано 8) —
    # см. operator/issuance-open и operator/stock-republish.

  - id: mkt.iss.side.05
    level: backend
    kind: side
    scenario: Повторная фиксация факта по заказу, выдача которого уже идёт
    expect: отказ — вторая сага не рождается; закрытие уже закрытой выдачи — no-op
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.side.06
    level: backend
    kind: side
    scenario: Заказчик подписывает акт, который ему не адресован
    expect: отказ доступа
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.side.07
    level: ui
    kind: side
    scenario: >
      Оператор правит факт выдачи — количество и цену — и сверяет пересчёт денег
    expect: >
      снижение цены уменьшает итог к оплате, повышение увеличивает; количество сверх принятого обрезается до принятого; снятая позиция даёт нулевой итог без возврата (остаётся на складе), а нулевое количество у оставленной позиции показывает всю сумму как возврат в кошелёк Стола заказов
    test: ~ # было: components/docs-harness/scenarios/marketplace/operator/issuance-correction.mjs
    status: missing
    # Паевая модель (компонент 68, 2026-09-06): подписи оператора при открытии
    # выдачи больше нет — пайщик подписывает заявление, совет решает, пайщик
    # подписывает акт, стол оператора закрывает выдачу сам. Сценарий harness
    # переписать под новый путь; до этого — pending.

    # Сценарий уходит из диалога без подписи: подписанный акт переопределил бы
    # количество и сумму заказа, а от них считаются возврат и остаток склада —
    # вся ветка после выдачи поехала бы на других числах. Проверяется расчёт,
    # который показывают оператору до подписи; проводки закрывает mkt.iss.side.04.
    #
    # Разница снятой позиции и нулевого количества существенна — расчёт
    # возврата идёт только по включённым позициям, поэтому снятая позиция это
    # отложенная выдача (деньги остаются в резерве заказа), а не возврат.
    # Настоящая частичная выдача идёт в цепочке сюиты отдельно: заказ на
    # десять единиц, принято девять, выдано восемь.

  - id: mkt.iss.break.01
    level: backend
    kind: break
    scenario: Цепь недоступна в момент подписи заявления или закрывающей подписи акта
    expect: сага не двигается, причина сохранена, повторная попытка возможна; имущество не передаётся
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.happy.03
    level: ui
    kind: happy
    scenario: >
      После выдачи оператор видит заказ в истории участка, а поток выдач пуст.
    expect: >
      выданный заказ сохранён в истории с составом и суммой; очередь выдач не содержит завершённых
    test: ~ # было: components/docs-harness/scenarios/marketplace/operator/issuance-finalize.mjs
    status: missing
    # Паевая модель (компонент 68, 2026-09-06): подписи оператора при открытии
    # выдачи больше нет — пайщик подписывает заявление, совет решает, пайщик
    # подписывает акт, стол оператора закрывает выдачу сам. Сценарий harness
    # переписать под новый путь; до этого — pending.


  - id: mkt.iss.ui.01
    level: ui
    kind: happy
    scenario: >
      Заказчица открывает «Показать QR» — пропуск на выдачу для сканирования оператором ПВЗ
    expect: >
      QR-код отображается, когда заказ готов к получению
    test: components/docs-harness/scenarios/marketplace/orderer/receive-code.mjs
    status: passing

  # ── Контрактный уровень: денежные места выдачи (задача 598-51) ────────────

  - id: mkt.iss.happy.30
    level: contract
    kind: happy
    scenario: >
      Оператор фиксирует факт бандлом, пайщица подписывает заявление, совет
      решает, пайщица подписывает акт, оператор закрывает выдачу.
    expect: >
      выданное списывается по ЦЕНЕ ПРИБЫТИЯ (o.mkt.consum, Дт 80 / Кт 10 —
      возврат паевого взноса имуществом), а не по цене продажи
    test: components/boot/src/tests/marketplace-money.test.ts
    status: passing

  - id: mkt.iss.side.30
    level: contract
    kind: side
    scenario: >
      Выдано меньше заказанного (три единицы из четырёх).
    expect: >
      невыданный остаток резерва возвращается заказчице на свободный паевой
      «Стола заказов» (o.mkt.unlock → w.mkt.share) ровно на разницу заказа и факта
    test: components/boot/src/tests/marketplace-money.test.ts
    status: passing

  - id: mkt.iss.side.31
    level: contract
    kind: side
    scenario: >
      Недовыдача закрыта; сводим резерв заказа.
    expect: >
      выданное и разблокированное вместе закрывают весь резерв — резерв не
      уходит дважды и не зависает частью
    test: components/boot/src/tests/marketplace-money.test.ts
    status: passing

  - id: mkt.iss.side.32
    level: contract
    kind: side
    scenario: >
      Членский взнос пересчитывается по факту выдачи, факт меньше заказа.
    expect: >
      неиспользованная часть взноса возвращается заказчице (o.mkt.refund)
      пропорционально факту — той же пропорцией, что применяется при
      гарантийном возврате
    test: components/boot/src/tests/marketplace-money.test.ts
    status: passing

  - id: mkt.iss.side.33
    level: contract
    kind: side
    scenario: >
      Фактический взнос зачисляется экономике кооперативного участка
      инлайн-вызовом при финализации.
    expect: >
      участку уходит взнос, приходящийся на фактически выданное (o.brn.common,
      разрез — имя участка), и физически он уходит с пула взносов «Стола
      заказов» на общий кошелёк участка
    test: components/boot/src/tests/marketplace-money.test.ts
    status: passing

  - id: mkt.iss.side.34
    level: contract
    kind: side
    scenario: >
      Выдача закрыта; сводим членский взнос.
    expect: >
      зачисленное участку плюс возвращённое пайщице ровно равны сумме,
      заблокированной при оформлении — взнос не раздваивается
    test: components/boot/src/tests/marketplace-money.test.ts
    status: passing

  - id: mkt.iss.side.35
    level: contract
    kind: side
    scenario: >
      Заказ прошёл весь путь от оформления до получения.
    expect: >
      в нитке заказа нет посторонних денежных кодов — ровно семь ожидаемых
      проводок и ни одной лишней
    test: components/boot/src/tests/marketplace-money.test.ts
    status: passing

  # ── Паевая модель: сага выдачи и режим ожидания решения совета (99D-7) ───

  - id: mkt.iss.happy.40
    level: backend
    kind: happy
    scenario: >
      Пайщик подписал заявление; робот решений совета настроен и решает у стойки
    expect: >
      заявление в цепи, номер решения дочитан, робот вызван напрямую по номеру
      решения; обратный вызов совета доводит сагу до акта в том же ответе —
      пайщик подписывает акт без второго нажатия
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.side.40
    level: backend
    kind: side
    scenario: >
      Робот не настроен либо ответил «вручную» (нет кворума, крупная сумма)
    expect: >
      сага остаётся в ожидании решения без блокировки ответа; пайщик в спокойном
      режиме — ничего подписывать не нужно; решение людей приходит обратным
      вызовом совета, акт формируется, уходит push «подпишите акт»
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.side.41
    level: backend
    kind: side
    scenario: Совет отказал по заявлению
    expect: >
      сага закрыта отказом, заказ снова «готов к выдаче», паевой взнос остаётся
      на месте — движений по средствам нет
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.side.42
    level: backend
    kind: side
    scenario: Оператор снимает выдачу, пока совет рассматривает заявление
    expect: отказ — снять можно до заявления или после ответа совета
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

  - id: mkt.iss.side.43
    level: backend
    kind: side
    scenario: >
      Оператор закрывает выдачу актом, в котором подпись заказчика утеряна или
      подменена, либо без своей подписи
    expect: отказ — закрывающая подпись ставится поверх подписи заказчика
    test: components/controller/tests/unit/marketplace/marketplace-issuance-saga.test.ts
    status: passing

# Правка 2026-09-06 (99D-7, вечернее решение владельца): довзнос членского
# взноса при факте больше заказа берётся с внутреннего членского кошелька;
# если его не хватает, пайщик подписывает заявление 1110 на недостающее
# (недостающая часть довзноса), перевод идёт отдельной транзакцией convert
# до заявления о выдаче; доплата тела — со свободного паевого без заявления.

  - id: mkt.iss.side.44
    level: backend
    kind: side
    scenario: >
      Факт меньше или равен заказу; факт больше заказа при достаточном членском кошельке;
      факт больше заказа при пустом кошельке — с заявлением 1110 и без него
    expect: >
      заявление к подписи только в последнем случае — на недостающую часть довзноса по
      пропорции контракта; без него подача отвергается до цепи; с ним сначала convert со
      свободного паевого, затем issuestmt без документа
    test: components/controller/tests/unit/marketplace/marketplace-convert-statement.test.ts
    status: written

  # ── Счётчики предложения на выдаче (08.09.2026) ─────────────────────────
  # До этого заблокированное заказом висело в предложении вечно, а выданное
  # оставалось нулём: предложение показывало выданное как «в заказах», а у
  # заказа из остатка освобождённый резерв не возвращался в каталог.
  - id: mkt.iss.side.45
    level: backend
    kind: side
    scenario: >
      Закрытие выдачи по заказу поставщика: заказано 10, привезли 9, выдано 8 — одна единица
      ушла в обезличенный остаток кооператива, одну поставщик не привёз
    expect: >
      из предложения поставщика выбывает принятое кооперативом (9): ушедшее в остаток уже оплачено
      и продаётся кооперативом; недопоставка (1) возвращается поставщику в свободное — этот товар
      остался у него. Полная поставка не возвращает ничего
    test: components/controller/tests/unit/marketplace/marketplace-issuance-remainder.test.ts
    status: passing

  - id: mkt.iss.side.46
    level: backend
    kind: side
    scenario: >
      Закрытие выдачи по заказу из остатка кооператива: зарезервировано 10, выдано 7,
      3 освобождены обратно на склад
    expect: >
      выданное становится выданным (7), освобождённый резерв возвращается в свободное того же
      предложения (3) — позиции остались опубликованными
    test: components/controller/tests/unit/marketplace/marketplace-issuance-remainder.test.ts
    status: passing

  - id: mkt.iss.side.47
    level: backend
    kind: side
    scenario: Закрытие выдачи при отпуске упаковкой и сбой счётчика предложения
    expect: >
      движение идёт и по упаковке заказа целыми упаковками; сбой счётчика пишется в лог
      и выдачу не роняет — закрывающий акт уже принят цепью
    test: components/controller/tests/unit/marketplace/marketplace-issuance-remainder.test.ts
    status: passing

# 2026-09-08: остаток по упаковкам — в докладке со склада (`marketplace-stock-proposal.service.ts`)
# нехватка сверяется по выбранной упаковке, а не по базовым единицам предложения остатка;
# набор случаев выдачи не менялся, гард докладки — mkt.stock.side.10.
# 2026-09-08: счётчики предложения на выдаче — `marketplace-issuance.service.ts`
# (`settleOfferCounters`) переводит заблокированное в выданное, у заказа из остатка
# возвращает освобождённый резерв в свободное.

# 2026-09-10 (решение владельца): цену при выдаче можно только снизить. Потолок
# за единицу отпуска — цена прибытия из акта приёмки (у заказа из остатка — цена
# заказа); снижение по заказу поставщика выбывает уценкой `markdown`
