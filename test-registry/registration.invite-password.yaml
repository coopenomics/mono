feature: registration.invite-password
title: Приглашение пайщика ведёт на установку пароля, а не на показ ключа

# Председатель добавляет пайщика либо мастер установки заводит членов совета —
# приглашённому уходит письмо со ссылкой. Страница приглашения по токену из
# ссылки узнаёт почту приглашённого и просит задать пароль. Ключ подписи
# создаётся в браузере, ставится в цепь, шифруется паролем и уходит в
# хранилище кооператива; на экран он не выводится. После этого приглашённый
# сразу входит в кабинет паролем. Ссылка приглашения гаснет при смене ключа.

sources:
  backend:
    - components/controller/src/application/auth/dto/invite-recipient.dto.ts
    - components/controller/src/application/auth/interactors/auth.interactor.ts
    - components/controller/src/application/auth/resolvers/auth.resolver.ts
  ui:
    - components/desktop/src/widgets/Registrator/Invite/**
    - components/desktop/src/features/User/ResetKey/**
    - components/desktop/src/features/User/LoginUser/model/useEnterDesktop.ts

cases:
  - id: reg.invite.happy.01
    level: backend
    kind: happy
    scenario: приглашённый открывает ссылку из письма, задаёт пароль
    expect: >
      по токену отдаётся его почта (токен при этом не расходуется), новый ключ
      встаёт в цепь, пароль ставится в хранилище; после смены ключа ссылка гаснет
    test: components/controller/tests/unit/auth/invite-password.test.ts
    api: components/api-tests/src/registration/invite-password.test.ts
    status: written

  - id: reg.invite.break.01
    level: backend
    kind: break
    scenario: чужой, истёкший или уже использованный токен
    expect: отказ AUTH_INVITE_TOKEN_INVALID, почта не раскрывается
    test: components/controller/tests/unit/auth/invite-password.test.ts
    api: components/api-tests/src/registration/invite-password.test.ts
    status: written

  - id: reg.invite.side.01
    level: backend
    kind: side
    scenario: повторная смена ключа по той же ссылке приглашения
    expect: >
      отказ AUTH_KEY_RESET_ERROR — смена ключа гасит токен того вида, по
      которому пришли (до 19.10.2026 приглашение жило до истечения срока)
    test: components/controller/tests/unit/auth/invite-password.test.ts
    api: components/api-tests/src/registration/invite-password.test.ts
    status: written

  - id: reg.invite.side.02
    level: ui
    kind: side
    scenario: сбой установки пароля после того, как ключ уже встал в цепь
    expect: >
      повтор не ставит ключ снова, а только доводит пароль тем же ключом
      (установка пароля идемпотентна)
    status: missing
