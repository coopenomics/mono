feature: marketplace.economy
title: Экономика кооперативного участка — членские взносы на балансе и распределение по доверенным

# 09.11.2026 (99D-33): набор economy.test.ts списывает обеспечительную часть по итогу
# периода и потому идёт в фазе полигона со сжатым временем (stack.sh cmd_keu,
# BLACKBOX_STAND_MONTH_SECONDS); в настоящем времени набор пропускается.

# Членский взнос с каждого исполненного заказа оседает в общем кошельке
# участка (`w.brn.common`). Председатель участка распределяет его между
# доверенными по сетке весов: доля каждого = вес / Σ весов, деньги уходят в
# персональные кошельки (`w.brn.person`). Часть общего кошелька заморожена
# плановым резервом расходов ближайших 30 дней — распределить её нельзя.
#
# Дальше персональные средства доверенный либо переводит в «Стол заказов»
# (o.brn.conv), либо получает деньгами через заявление на материальную помощь
# (o.brn.aid) — оно идёт на решение совета, платит кассир.
#
# Источник истины конфигурации — цепь: marketplace::config (ставка взноса),
# branch::weights / branch::weighttotals (сетка), ledger2::userwallets
# (балансы). Плановые расходы — общесистемный реестр расширения `expenses`.

# 2026-08-18: перечисление удержанного налога целиком уехало на стол бухгалтера
# (reports.withheld-tax) — вместе с чтением кошелька, заявкой на цепи и
# слушателем кассира. Долг перед бюджетом общекооперативный: в один кошелёк
# стекаются удержания любой программы, поэтому распоряжаться им Стол заказов не
# вправе. Здесь остался только расчёт удержания в момент выплаты, а ставка для
# него берётся из справочника юрисдикций — того же, откуда её берут формы.
#
# Мердж dev 2026-08-12 (FC1-7): в файлах фичи изменились только строки импорта —
# пагинация, базовый DTO, порт документов и тип аккаунта переехали в
# `@coopenomics/extension-kit` и `@coopenomics/innercoop`. Поведение операций,
# правила доступа и набор случаев прежние.

# Правка 24.09.2026 (C28-83, второй проход): на ленту переведены и экраны
# Стола заказов, которые раньше не слушали marketplaceEvents, — реестры
# председателя, экономика стола и участка, выплаты, претензии поставщику,
# склад участка, онбординг кооператива и поставщика, пункты выдачи, карточки
# реестров и виджеты процессов. Сбор с оборота (marketplace::config) объявлен в
# ленте таблицей цепи. Онбординг пайщика ждёт подписи по ленте, а не циклом с
# паузой. Серверные сценарии и набор случаев прежние.

# Правка 2026-10-04 (C28-87): права операций сверяются с единой таблицей прав
# Стола заказов вместе с условием строки (кооператив подключён, заказчик
# подключён, хранение включено); декоратор операции — общий `@RequireRight` из
# каркаса расширений. Случаи про условия — в marketplace.rights-table; набор
# случаев этой фичи прежний.

# Правка 2026-10-05 (C28-87, пункт 1а): распределение средств участка, веса
# доверенных и подача расхода на решение совета идут под правом с охватом
# `chaired-KU` (`Economy:configure:chaired-KU`,
# `Economy:propose-expense:chaired-KU`): председателя участка сверяет общий
# гард, отказ — KIT_RIGHT_SCOPE_CHAIRED_KU. Чтение экономики участка сверяется
# по участку запроса (KIT_RIGHT_SCOPE_OWN_KU). Набор случаев прежний.

# Правка 2026-10-05 (C28-87, общий гард): права операций сверяет общий гард
# каркаса расширений (`RightsGuard`) над описанием прав Стола заказов;
# собственный гард стола, декоратор роли и ручной провайдер прав рабочего стола
# убраны. Отказ «право не положено» отвечает кодом KIT_INSUFFICIENT_RIGHTS (был
# отказ без кода). Набор случаев прежний.

# Правка 30.10.2026 (5A8-11): шаблоны документов импортируются из пакета
# @coopenomics/docs-templates (`Registry`) вместо `Cooperative.Registry` из
# cooptypes. Поведение не менялось: тот же реестр шаблонов, другой пакет.


# Правка 07.11.2026 (99D-30): резолвер экономики переводит сгенерированный
# документ в ответ общим помощником `application/shared/generated-document.util.ts`.
# Поведение и случаи не менялись.
sources:
  backend:
    - components/controller/src/extensions/marketplace/application/services/marketplace-economy.service.ts
    - components/controller/src/extensions/marketplace/application/resolvers/marketplace-economy.resolver.ts
    - components/controller/src/extensions/marketplace/application/dto/marketplace-economy.dto.ts
    - components/controller/src/extensions/marketplace/application/shared/ndfl.util.ts
    - components/controller/src/extensions/marketplace/application/services/marketplace-aid-council-sync.service.ts
  ui:
    - components/desktop/src/pages/Marketplace/**Economy**/**

cases:
  - id: mkt.eco.happy.01
    level: backend
    kind: happy
    scenario: >
      Экономика участка показывает общий кошелёк, плановый резерв и доступную к распределению сумму раздельно
    expect: >
      доступно = общий кошелёк минус резерв ближайших 30 дней; резерв неприкосновенен
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.happy.02
    level: backend
    kind: happy
    scenario: >
      Доли доверенных считаются по сетке весов, рядом видны их персональные кошельки
    expect: >
      доля = вес / Σ весов в процентах; персональный баланс каждого доверенного показан рядом с долей
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.happy.03
    level: backend
    kind: happy
    scenario: Председатель участка распределяет доступную сумму по сетке
    expect: >
      распределение уходит на цепь с источником «marketplace» и запрошенной суммой
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.01
    level: backend
    kind: side
    scenario: Распределение затрагивает плановый резерв расходов участка
    expect: отказ с указанием остатка, резерва и доступной суммы; на цепь ничего не уходит
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.02
    level: backend
    kind: side
    scenario: Распределение запрашивает не председатель этого участка
    expect: отказ доступа, сетка и кошельки не меняются
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.03
    level: backend
    kind: side
    scenario: Распределение при ненастроенной сетке весов
    expect: отказ — распределять некому, пока веса не заданы
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.04
    level: backend
    kind: side
    scenario: Сумма распределения нулевая или отрицательная
    expect: отказ, на цепь ничего не уходит
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.05
    level: backend
    kind: side
    scenario: >
      В реестре весов есть записи другого участка и другого контракта-источника
    expect: в сетку участка попадают только его собственные веса по «marketplace»
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.06
    level: backend
    kind: side
    scenario: Вес доверенного дробный, нулевой или задаётся чужим председателем
    expect: отказ; сетка не меняется ни при задании веса, ни при исключении участника
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.07
    level: backend
    kind: side
    scenario: >
      Кооператив не задавал ставку членского взноса, либо задаёт её вне диапазона 0…100 процентов
    expect: >
      без своей ставки действует умолчание 30%; ставка вне диапазона на цепь не уходит
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing
    # Умолчание обязано совпадать с DEFAULT_MEMBERSHIP_FEE_PERCENT контракта:
    # пока кооператив не вызвал setfee, сумма в чекауте считается бэкендом, а
    # списывается контрактом — разойдутся ставки, разойдутся и деньги.

  - id: mkt.eco.side.08
    level: backend
    kind: side
    scenario: Плановый резерв больше остатка общего кошелька
    expect: доступно к распределению ноль, а не отрицательная сумма
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.ui.01
    level: ui
    kind: happy
    scenario: >
      После исполненных заказов председатель участка видит накопленные членские взносы на балансе участка
    expect: >
      общий кошелёк участка вырос ровно на сумму взносов по исполненным заказам
    test: components/docs-harness/scenarios/marketplace/operator/branch-economy.mjs
    status: passing
    # Пункт плана заказчика «экономика показывает членские взносы на балансе
    # после операций». Требует прогона цепочки заказов до выдачи, поэтому
    # ставится после сценария выдачи и читает баланс на экране участка.

  - id: mkt.eco.side.09
    level: ui
    kind: side
    scenario: >
      Председатель кооперативного участка открывает «Распределение» на своём столе ПВЗ
    expect: >
      он вправе задать веса и распределить средства своего участка — сервер это разрешает, проверяя председательство по данным участка
    test: components/docs-harness/scenarios/marketplace/operator/branch-economy.mjs
    status: passing
    # Дефект прав (прогон 2026-08-12) устранён: поле объекта открывается его
    # владельцу — председатель участка читает `trustee`/`trusted` своего КУ и
    # видит управление. Зелёный прогон от чистой цепи 2026-08-15.

  - id: mkt.eco.ui.02
    level: ui
    kind: happy
    scenario: >
      Председатель распределяет накопленные взносы, и они появляются в персональных кошельках доверенных согласно сетке
    expect: >
      каждый доверенный получает долю по своему весу; общий кошелёк уменьшается на распределённую сумму
    test: components/docs-harness/scenarios/marketplace/operator/branch-economy.mjs
    status: passing
    # Пункт плана заказчика «экономика распределяет членские взносы по
    # доверенным согласно сетке».

  # --- Удержание НДФЛ при выплате материальной помощи ---
  # Кооператив — налоговый агент: заявление подаётся на сумму до налога,
  # получатель получает её за вычетом ставки, разница становится долгом перед
  # бюджетом. Здесь остаётся только расчёт удержания в момент выплаты —
  # перечислением долга распоряжается стол бухгалтера (reports.withheld-tax):
  # в один кошелёк стекаются удержания любой программы, и владеть ими Стол
  # заказов не может.

  - id: mkt.eco.happy.04
    level: backend
    kind: happy
    scenario: >
      Заявление на материальную помощь подано на сумму до удержания налога
    expect: >
      до решения совета у получателя заявка на выплату за вычетом налога, платежа
      у кассира нет; платёж кассиру создаёт решение совета (решение владельца
      04.11.2026); вся сумма заявления переходит с персонального кошелька на
      кошелёк заявлений уже при подаче (решение владельца 08.11.2026) — свободный
      остаток меньше на сумму заявления до решения совета
    test: components/controller/tests/unit/marketplace/marketplace-branch-economy.test.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing

  - id: mkt.eco.side.10
    level: backend
    kind: side
    scenario: Налог считается от суммы, не кратной рублю
    expect: >
      налог округляется до целого рубля по правилам налогового кодекса, и
      контракт с бэкендом округляют одинаково
    test: components/controller/src/extensions/marketplace/application/shared/ndfl.util.spec.ts
    api: components/api-tests/src/marketplace/economy.test.ts
    status: passing
    # Расхождение округления развело бы платёжку кассира и проводку контракта.
    # До 25.09.2026 снаружи не проходило: сумма платежа хранилась целым, и
    # выплата с копейками не регистрировалась.

  - id: mkt.eco.ui.03
    level: ui
    kind: happy
    scenario: >
      Администратор открывает «Экономику» — единый целевой членский взнос
      кооператива с пояснением и кнопкой изменения
    expect: >
      текущий целевой членский взнос отображается в процентах; пояснение говорит,
      что взнос единый для всех участков и действует на новые заказы
    test: components/docs-harness/scenarios/marketplace/chairman/economy.mjs
    status: passing

# 2026-09-06 (паевая модель, компонент 68): перевод персональных средств в Стол
# заказов (`convertBranchFunds`) снят вместе с членским кошельком; вместо него —
# отзыв свободного паевого в Кошелёк (`marketplaceRecallShare`). Экран «Получить
# средства» — только материальная помощь. Случаи распределения не менялись.

# 2026-09-23 (EEA-6…EEA-9): тексты интерфейса, отказов и уведомлений фичи вынесены из
# кода в словари i18n, отказы бэкенда переведены на DomainError с кодом — текст
# и HTTP-статус ответа прежние. Сценарии фичи и её проверки не менялись.

# 2026-10-28 (C28-32): строка расхода принимает необязательное recipient_name —
# название организации-получателя; сервис передаёт его в снимок реквизитов шасси
# (recipientName), и реестр с кассой видят организацию по названию вместо
# прочерка. Поведение фичи проверяют случаи exp.prop.side.recipient-org в
# expenses.proposals.yaml; сценарии этой фичи не менялись.

# 2026-11-03 (99D-22, коэффициент экономического участия): ставка
# обеспечительной части по умолчанию 38 % (DEFAULT 380 000 в шкале контракта);
# заявление на материальную помощь проверяется на предел резерва
# социально-экономического обеспечения пайщиков до обращения в цепь.
# Сценарии распределения по доверенным не менялись.

  - id: mkt.eco.side.11
    level: backend
    kind: break
    scenario: >
      Заявление на материальную помощь сверх резерва получателя за месяц или без
      строки резерва при включённом потолке администратора
    expect: >
      отказ до цепи с кодом MARKETPLACE_AID_OVER_RESERVE или
      MARKETPLACE_AID_NO_RESERVE; при потолке ноль заявление проходит без предела
    test: components/controller/tests/unit/marketplace/marketplace-branch-reserve.service.test.ts
    external: unreachable
    external_reason: "API стенда проверяется сценарием КЭУ-5 после экранов"
    status: written

# 2026-11-04 (99D-20, замечание владельца): заявления на материальную помощь на
# «Моих средствах» — строки таблицы на всю ширину; строка открывает панель
# процесса справа: сумма, налог и сумма на счёт, лента вех (подача, решение
# совета, платёж у кассира). 05.11.2026 документы процесса из панели убраны,
# вехи — шагами с датами: процесс читает только совет.
# Налог и сумму на счёт считает ИСТОК (показ, деление как в контракте), вехи —
# из зеркала заявлений, протокола совета и платежа ядра.

  - id: mkt.eco.happy.05
    level: backend
    kind: happy
    scenario: >
      Список заявлений на материальную помощь отдаёт по каждому заявлению налог,
      сумму на счёт и вехи процесса
    expect: >
      налог и сумма на счёт — по правилу округления контракта; дата подачи — из
      зеркала заявлений, решение — по подписи протокола совета, вехи платежа — из
      платежа ядра; без платежа или строки зеркала заявление показывается без вех;
      фильтр получателя отсекает чужие заявления
    test: components/controller/tests/unit/marketplace/marketplace-aid-view.test.ts
    external: unreachable
    external_reason: "вехи процесса появляются после решения совета и платежа кассира — снаружи проверяется сценарием docs-harness экономики участка"
    status: written

  - id: mkt.eco.ui.04
    level: ui
    kind: happy
    scenario: >
      Доверенный участка открывает «Мои средства» и нажимает строку заявления на
      материальную помощь
    expect: >
      строка — дата, сумма, на счёт, реквизиты и состояние бейджем; справа
      открывается панель с суммой крупно, налогом и ходом заявления по шагам
      (подано → решение совета → выплата кассиром → деньги получены, у
      пройденных — дата); документов процесса в панели нет — свои документы
      пайщик смотрит в разделе «Документы» (решение владельца 05.11.2026)
    test: components/docs-harness/scenarios/marketplace/branch-chairman/economy-reserve-periods.mjs
    status: written

# 2026-11-04 (решение владельца): платёж кассиру по материальной помощи
# создаёт решение совета. При подаче сохраняется заявка на выплату с
# реквизитами (в цепь они не попадают), onaidauth создаёт из неё платёж,
# onaiddecl закрывает заявку. Подача, не дошедшая до повестки, снимает заявку.

  - id: mkt.eco.side.12
    level: backend
    kind: side
    scenario: >
      Совет решает заявление на материальную помощь: одобрение, отказ, повтор
      события, платёж «ожидает решения совета», заведённый до заявок
