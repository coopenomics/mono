feature: registration.organization-lookup
title: Анкеты организации и ИП при вступлении заполняются по ИНН из реестра страны

# Организация вводит ИНН первым полем анкеты. Если для страны анкеты встал
# коннектор реестра организаций (для России — расширение DaData с ключом
# кооператива), сервер получает сведения и заполняет ими поля анкеты:
# наименования, тип, ОГРН, КПП, юридический адрес, город, руководителя и
# должность. Эти поля закрыты для правки, остальное пайщик заполняет сам.
# Без коннектора, при сбое сервиса или если организация не найдена, анкета
# заполняется вручную. Задача C28-92.
#
# Анкета ИП устроена так же: ФИО, город и ОГРНИП из реестра закрыты для
# правки. Адрес реестр ИП публикует только городом, поэтому его пайщик
# вводит сам. Анкета организации ищет только юрлица, анкета ИП — только ИП.

sources:
  backend:
    - components/innercoop/src/hooks/organization-lookup.hook.ts
    - components/controller/src/application/organization-lookup/**
    - components/controller/src/extensions/dadata/**
  ui:
    - components/desktop/src/shared/ui/UserDataForm/OrganizationDataForm/**
    - components/desktop/src/shared/ui/UserDataForm/EntrepreneurDataForm/**
    - components/desktop/src/shared/ui/UserDataForm/useRegistryLookup.ts

cases:
