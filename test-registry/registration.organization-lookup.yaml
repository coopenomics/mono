    level: backend
    kind: happy
    scenario: коннектор России стоит, пайщик ищет организацию по ИНН
    expect: сведения коннектора приходят анкете, страна с коннектором видна в списке
    test: components/controller/tests/unit/registration/organization-lookup.registry.test.ts
    api: components/api-tests/src/registration/organization-lookup.test.ts
    status: written

  - id: reg.orglookup.happy.02
    level: backend
    kind: happy
    scenario: DaData вернула карточку потребительского кооператива
    expect: наименования, тип «потребительский кооператив», ОГРН, КПП, адрес с индексом, город, ФИО руководителя по частям и должность с заглавной буквы
    test: components/controller/tests/unit/extension/dadata-party-to-organization.test.ts
    api: components/api-tests/src/registration/organization-lookup.test.ts
    status: written

