feature: apps.catalog-access
title: Вход узла кооператива в каталог приложений — ключ catalog, токен для оркестратора, установка по подпискам

# Архитектура v5 каталога (23.10.2026, @ant, задача 487-34). Контракт apps
# выведен: подписки на приложения ведёт провайдер, каталог хранит их копию.
# Каталог узнаёт кооператив по подписи ключом разрешения <coop>@catalog в цепи
# его подсети. Ключ выпускает узел и хранит в хранилище ключей отдельным
# правом `catalog`; в окружении ключа нет (раньше — CATALOG_SIGNING_KEY,
# открытым текстом в файлах поставки; владелец отметил, что ключи узел нигде
# открыто не хранит, и этот случай — нарушение правила). Разрешение не привязано
# ни к одному действию: транзакцию этим ключом не подписать.
#
# Оркестратору ключ не отдаётся: ядро выпускает tenant JWT каталога и само
# передаёт его оркестратору (раз в минуту, токен живёт 30). Оркестратор
# опрашивает catalog-delivery: действующие подписки → установка/снятие,
# версии выпусков → обновление.
#
# Правка 26.10.2026 (487-34, решение владельца): подписку на приложение
# оформляет узел кооператива сам, на столе «Приложения» (расширение `apps`);
# оператор подписку только показывает. Витрина сводит каталог, провайдера
# (цена, пробный срок из публикации, подписка), оркестратор (фронт получен)
# и состояние узла (включено/выключено, таблица apps_catalog_apps). Подписки
# и кошелёк кооператива у оператора узел читает для показа: подписки — у
# провайдера, остаток — из цепи по области оператора.
#
# Правка 25.11.2026 (487-31): контейнерное приложение (@voskhod/exampleapp)
# впервые установлено и снято на стенде 4 целиком. Найдено и исправлено в оркестраторе:
# неудачная установка не повторялась (обработчик не бросал исключение);
# снятие подписки оставляло контейнер работать; перезапуск оркестратора
# пересоздавал контейнеры всех приложений; приложение, отписанное при
# выключенном оркестраторе, работало без срока; после перезапуска оркестратор
# ждал токен каталога до 10 минут (теперь ядро передаёт его раз в минуту).
#
# Правка 25.11.2026 (487-17): порты ядра для приложений в своих контейнерах.
# Приложение — чужой код на узле: секрет ядра и ключ кооператива ему не
# передаются. Установка заводит в ядре заявку пакета (порты и действия цепи из
# манифеста) и кладёт в контейнер токен приложения; вызов порта —
# POST /v1/internal/ports/:port/:method. Открыт белый список портов и методов;
# действия цепи подписывает ядро и только заявленные; пайщика по токену
# опознаёт ядро (порт accessToken) — завершённая сессия приложением не
# принимается. Проверено на стенде 4 пакетом @voskhod/exampleapp 0.2.0.
sources:
  backend:
    - components/controller/src/application/auth-v2/certificate/catalog-key.service.ts
    - components/controller/src/extensions/apps-catalog-proxy/infrastructure/apps-catalog-http.service.ts
    - components/orchestrator/src/watcher/**
    - components/orchestrator/src/orchestrator/**
    - components/orchestrator/src/gateway/supergraph-manager.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/app-port-grants.service.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/remote-ports.service.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/remote-ports.catalog.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/controllers/app-ports.controller.ts
    - components/controller/src/infrastructure/innercoop/access-token-innercoop.adapter.ts
    - components/controller/src/application/provider/dto/provider-app.dto.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/node-apps.service.ts
    - components/orchestrator/src/frontend-cache/registry-install-source.impl.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/catalog-apps-state.service.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/resolvers/apps.resolver.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/access/apps-rights.ts
    - components/controller/src/infrastructure/innercoop/provider-apps-innercoop.adapter.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/apps-publishers.service.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/access/developer-rights.ts
    - components/controller/src/extensions/apps-catalog-proxy/application/services/developer-live-feed.service.ts
  ui:
    - components/desktop/extensions/developer/**
    - components/desktop/src/widgets/CatalogApp/**
    - components/desktop/src/entities/CatalogApp/**
    - components/desktop/src/pages/ExtensionStore/**
    - components/desktop/src/processes/init-installed-extensions/**

cases:
  - id: apps.access.happy.01
    level: backend
    kind: happy
    scenario: узел с каталогом стартует без ключа входа в каталог
    expect: >
      ключ выпускается, ложится в хранилище правом catalog, открытая часть публикуется
      разрешением <coop>@catalog; при совпадении с цепью в цепь ничего не пишется
    test: components/controller/src/application/auth-v2/certificate/catalog-key.service.spec.ts
    status: written
    api: components/boot/src/tests/catalog-key.test.ts

  - id: apps.access.break.01
    level: backend
    kind: break
    scenario: два хука старта публикуют ключ одновременно; публикация отвергнута, ключа в цепи нет; узел без каталога
    expect: >
      одна updateauth; сбой публикации не роняет старт (предупреждение в журнале); узел без
      APPS_CATALOG_DELIVERY_URL ключ не выпускает и в цепь не пишет
    test: components/controller/src/application/auth-v2/certificate/catalog-key.service.spec.ts
    status: written
    external: unreachable
    external_reason: "гонку двух хуков старта и отказ цепи на updateauth через API стенда не создать"

  - id: apps.access.happy.02
    level: backend
    kind: happy
    scenario: оркестратор получил tenant JWT от ядра и опрашивает catalog-delivery
    expect: >
      первая выборка — активация каждой действующей подписки; новая подписка — активация;
      пропавшая или истёкшая — снятие; новая версия выпуска — обновление; версии нет — отзыв
    test: components/orchestrator/src/watcher/catalog-delivery-event-stream.impl.spec.ts
    status: written
    external: unreachable
    external_reason: "опрос каталога ведёт оркестратор по таймеру; у стенда API нет точки, через которую эту смену событий вызвать и наблюдать — проверено прогоном на mono-ai-5 (случай e2e.01)"

  - id: apps.access.break.02
    level: backend
    kind: break
    scenario: продление подписки; каталог ответил ошибкой; установка при активации упала
    expect: >
      продление пакет не переустанавливает; ошибка каталога не превращается в снятие
      подписок; неудавшаяся активация повторяется следующим опросом
    test: components/orchestrator/src/watcher/catalog-delivery-event-stream.impl.spec.ts
    status: written
    external: unreachable
    external_reason: "ошибку каталога и сбой docker pull через API стенда не создать"

  - id: apps.access.side.01
    level: backend
    kind: side
    scenario: оркестратор ещё не получил tenant JWT от ядра (только что перезапущен)
    expect: в каталог не ходит — ни за спецификацией установки, ни за токеном пакета
    test: components/orchestrator/src/watcher/catalog-delivery-release-metadata.impl.spec.ts
    status: written
    external: unreachable
    external_reason: "окно между перезапуском оркестратора и первой передачей токена — доли секунды, снаружи его не поймать"

  - id: apps.access.e2e.01
    level: backend
    kind: happy
    scenario: >
      подписка оформлена у провайдера → копия в каталоге → ядро передало токен →
      оркестратор установил пакет; подписка отменена → пакет снят
    expect: >
      проверено на mono-ai-5 23.10.2026: @voskhod/demoapp 0.1.2 попал в кэш фронт-частей
      оркестратора, sha256 сверен по манифесту через tenant JWT; снятие — не проверено
    test: null
    status: missing

  - id: apps.access.happy.03
    level: backend
    kind: happy
    scenario: председатель узла оператора оформляет подписку на приложение (subscribePackage)
    expect: >
      подписка оформлена у провайдера на кооператив узла и входит в общий счёт; ответ activated
      с датами; при действующей подписке — alreadyActive без новой строки счёта
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет провайдера; проверено вручную на mono-ai-5 23.10.2026 (activated, alreadyActive, failed)"

  - id: apps.access.break.03
    level: backend
    kind: break
    scenario: пакет не предлагается каталогом; узел без провайдера (узел партнёра)
    expect: >
      failed с причиной от провайдера; на узле без провайдера — unavailable с подсказкой оформить
      подписку на столе подключения у оператора, в каталог узел не идёт
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет провайдера и узла партнёра"

  - id: apps.access.happy.04
    level: backend
    kind: happy
    scenario: >
      Кооператив-партнёр на столе подключения оператора видит приложения каталога
      (getProviderApps), подключает (subscribeProviderApp) и отключает (cancelProviderApp)
    expect: >
      цена — от провайдера; подключённое приложение — строка общего счёта кооператива, копия
      попадает в каталог, оркестратор узла partner1 ставит приложение; после оплаты хабом срок
      продлён на месяц; после отключения приложение снято с узла
    test: components/boot/src/tests/catalog-apps-two-coop.test.ts
    status: written

  - id: apps.access.side.02
    level: backend
    kind: side
    scenario: >-
      витрина приложений, когда провайдер не ответил или не подключён; пакет, который
      провайдер кооперативу не предлагает
    expect: >-
      цена не выдумывается и никуда не отсылает: витрина отдаёт ошибку «провайдер не
      ответил»; непредложенный пакет в витрину не попадает; описание без имени издателя
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет провайдера и каталога"

  - id: apps.access.side.03
    level: backend
    kind: side
    scenario: >-
      каталог сменил ключ подписи JWT или отозвал токены кооператива — запрос с выпущенным
      раньше токеном получает 401
    expect: >-
      ядро сбрасывает кэш токена, выпускает новый подписью ключа coop@catalog и повторяет
      запрос один раз; повторный 401 — отказ без цикла; оркестратор получает свежий токен
      на ближайшем такте
    test: components/controller/tests/unit/apps-catalog-proxy/tenant-token-refresh.test.ts
    status: written
    external: unreachable
    external_reason: "у стенда внешнего слоя нет каталога приложений"

  - id: apps.access.happy.05
    level: backend
    kind: happy
    scenario: >
      Витрина узла: пакет каталога с ценой и пробным сроком у провайдера, подписка кооператива
      (платная или пробная), фронт в кэше оркестратора, переключатель узла.
    expect: >
      Строка витрины несёт цену месяца, trialDays, подписку с isTrial/trialEndsAt/nextPaymentDue,
      installed по кэшу оркестратора и enabled по таблице узла; выключенное приложение и пакет
      без фронта помечены так; провайдер не ответил — витрина не отдаётся
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    api: components/boot/src/tests/catalog-apps-two-coop.test.ts

  - id: apps.access.happy.06
    level: backend
    kind: happy
    scenario: >
      Председатель отменяет подписку, выключает и включает приложение на узле.
    expect: >
      Отмена идёт провайдеру (cancelled / notSubscribed / unavailable); переключатель пишется в
      состояние узла и подписку не трогает; выключенный пакет не попадает в installed-frontends
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    api: components/boot/src/tests/catalog-apps-two-coop.test.ts

  - id: apps.access.happy.07
    level: backend
    kind: happy
    scenario: >
      Совет открывает «Подписки» на узле кооператива.
    expect: >
      Подписки у провайдера без отменённых, итог в месяц, долг по позициям с наступившим сроком,
      ближайшее списание; оператор — родительский аккаунт из реестра сети, кошелёк членских
      взносов — строка userwallets по области оператора, AXON — остаток счёта; цепь не ответила —
      подписки есть, кошелька нет; узел без провайдера — available=false
    test: components/controller/tests/unit/apps-catalog-proxy/node-apps.test.ts
    status: written
    api: components/boot/src/tests/catalog-apps-two-coop.test.ts

  # ── 25.11.2026 (487-31): жизненный цикл контейнера приложения ───────────
  - id: apps.access.break.10
    level: backend
    kind: break
    scenario: >
      Установка приложения по подписке не удалась (docker pull, проверка здоровья).
    expect: >
      обработчик события бросает исключение с причиной; поток событий не считает
      подписку установленной и повторяет установку
    test: components/orchestrator/src/watcher/on-chain-watcher.service.spec.ts
    status: written
    external: unreachable
    external_reason: "отказ docker pull и проверки здоровья внешний слой стенда не вызывает: образ и сеть на стенде исправны"

  - id: apps.access.side.10
    level: backend
    kind: side
    scenario: >
      Установка одного пакета падает несколько раз подряд.
    expect: >
      первая неудача повторяется следующим опросом, дальше пауза удваивается до 10 минут;
      после удачи счётчик сброшен; отложенная подписка при отмене не даёт события снятия
    test: components/orchestrator/src/watcher/catalog-delivery-event-stream.impl.spec.ts
    status: written
    external: unreachable
    external_reason: "серию отказов установки подряд внешний слой стенда не вызывает: образ и сеть на стенде исправны"

  - id: apps.access.break.11
    level: backend
    kind: break
    scenario: >
      Оркестратор перезапущен, контейнер приложения работает на образе действующего выпуска.
    expect: >
      docker run не вызывается, контейнер остаётся прежним; проверяются здоровье и запись реестра;
      другой образ или остановленный контейнер — контейнер заменяется
    test: components/orchestrator/src/orchestrator/install-orchestrator.service.spec.ts
    status: written
    external: unreachable
    external_reason: "перезапуск оркестратора — действие над контейнером стенда, внешний слой работает только через API"

  - id: apps.access.happy.10
    level: backend
    kind: happy
    scenario: >
      Подписка на приложение отменена или истекла.
    expect: >
      запись реестра выключена, контейнер приложения остановлен и удалён, фронт убран из кэша;
      имя контейнера при снятии то же, что при установке
    test: components/orchestrator/src/orchestrator/install-orchestrator.service.spec.ts
    status: written
    external: unreachable
    external_reason: "сценарий двух кооперативов ставит пакет без серверной части (demoapp): контейнера, который снимается, в нём нет"

  - id: apps.access.happy.11
    level: backend
    kind: happy
    scenario: >
      Подписку отменили, пока оркестратор был выключен; он запускается.
    expect: >
      первый опрос сверяет контейнеры с меткой coop.extension.package с действующими
      подписками и снимает приложение без подписки; приложение с подпиской не снимается;
      список установленного читается только первым опросом
    test: components/orchestrator/src/watcher/catalog-delivery-event-stream.impl.spec.ts
    status: written
    external: unreachable
    external_reason: "остановка оркестратора на время отмены подписки — действие над контейнером стенда, внешний слой работает только через API"

  # ── 25.11.2026 (487-17): порты ядра для приложений в контейнерах ────────
  - id: apps.access.happy.12
    level: backend
    kind: happy
    scenario: >
      Установка заводит заявку пакета и получает токен приложения; приложение вызывает заявленный порт.
    expect: >
      в базе лежит только хэш токена; вызов доходит до реализации порта с теми же аргументами; undefined отдаётся как null
    test: components/controller/tests/unit/apps-catalog-proxy/app-ports.test.ts
    status: written
    external: unreachable
    external_reason: "вход портов принимает только токен установленного контейнерного приложения; сценарий двух кооперативов ставит пакет без серверной части"

  - id: apps.access.break.12
    level: backend
    kind: break
    scenario: >
      Приложение вызывает порт без токена, с неизвестным токеном, незаявленный порт, метод вне белого списка, chain.initialize.
    expect: >
      отказы APPS_CATALOG_PROXY_APP_PORT_TOKEN_INVALID, APPS_CATALOG_PROXY_APP_PORT_NOT_GRANTED, APPS_CATALOG_PROXY_APP_PORT_UNKNOWN; реализация порта не вызывается; неизвестные порты манифеста в заявку не попадают
    test: components/controller/tests/unit/apps-catalog-proxy/app-ports.test.ts
    status: written
    external: unreachable
    external_reason: "вход портов принимает только токен установленного контейнерного приложения; сценарий двух кооперативов ставит пакет без серверной части"

  - id: apps.access.break.13
    level: backend
    kind: break
    scenario: >
      Приложение просит провести действие цепи: заявленное, незаявленное, пачку с одним незаявленным, пустой список; ключа в хранилище нет.
    expect: >
      заявленное подписывает ядро ключом узла, подписантом ставит кооператив вместо присланного; незаявленное — APPS_CATALOG_PROXY_APP_CHAIN_ACTION_NOT_GRANTED, ключ не достаётся, пачка отклоняется целиком; broadcast=false доходит до цепи
    test: components/controller/tests/unit/apps-catalog-proxy/app-ports.test.ts
    status: written
    external: unreachable
    external_reason: "вход портов принимает только токен установленного контейнерного приложения; сценарий двух кооперативов ставит пакет без серверной части"

  - id: apps.access.break.14
    level: backend
    kind: break
    scenario: >
      Заявку заводят без секрета узла, с чужим секретом, при незаданном секрете; приложение снято.
    expect: >
      отказ APPS_CATALOG_PROXY_APP_GRANT_SERVICE_ONLY; после снятия или повторной выдачи прежний токен не принимается
    test: components/controller/tests/unit/apps-catalog-proxy/app-ports.test.ts
    status: written
    external: unreachable
    external_reason: "вход портов принимает только токен установленного контейнерного приложения; сценарий двух кооперативов ставит пакет без серверной части"

  - id: apps.access.happy.13
    level: backend
    kind: happy
    scenario: >
