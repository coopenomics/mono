feature: edubridge.desktop-gating
title: Образовательный мост — столы, права и шлюзы онбординга

# Каркас приложения (E1, задача 7DD-2 проекта «Платформа образования»).
# Три стола: «Обучение» (edubridge), «Моё обучение» (edubridge-member),
# «Преподавание» (edubridge-teacher). Видимость — канон грантов:
# EdubridgeDesktopGrantsProvider выдаёт права, фронт сверяет `meta.requires`.
# Особенность приложения: каталог открыт гостю — право `EduCatalog:read`
# получает даже неавторизованный посетитель.

sources:
  backend:
    - components/controller/src/extensions/edubridge/application/desktop/**
    - components/controller/src/extensions/edubridge/application/access/**
    - components/controller/src/extensions/edubridge/application/membership/**
    - components/controller/src/extensions/edubridge/application/policies/**
    - components/controller/src/extensions/edubridge/application/config/**
  ui:
    - components/desktop/extensions/edubridge/install.ts

cases:
  - id: edu.gating.happy.01
    level: backend
    kind: happy
    scenario: Гость (без username) запрашивает стол; ЦПП подключена.
    expect: Гранты edubridge = ['EduCatalog:read']; столы member/teacher скрыты. До подключения ЦПП у гостя грантов нет вовсе.
    test: components/controller/tests/unit/edubridge/desktop-grants.provider.test.ts
    status: passing
  - id: edu.gating.happy.02
    level: backend
    kind: happy
    scenario: Председатель активного кооператива, ЦПП ещё не принята советом.
    expect: Гранты = только 'Extension:configure' — ни каталога, ни рабочих прав; рядовой пайщик до подключения не получает ничего.
    test: components/controller/tests/unit/edubridge/desktop-grants.provider.test.ts
    status: passing
  - id: edu.gating.happy.03
    level: backend
    kind: happy
    scenario: ЦПП принята; пайщик без подписанных оферт.
    expect: Гранты содержат 'Onboarding:learner' и 'Onboarding:teacher', рабочих прав learner/teacher нет.
    test: components/controller/tests/unit/edubridge/desktop-grants.provider.test.ts
    status: passing
  - id: edu.gating.side.02
    level: backend
    kind: side
    scenario: Оферта преподавателя подписана, договор УХД преподавателем ещё не подписан (или отклонён председателем).
    expect: Роли teacher нет, права стола преподавания не выданы, маркер 'Onboarding:teacher' остаётся — шлюз ведёт ко второму шагу (договор). Договор ждёт председателя или действует → роль teacher и стол.
    test: components/controller/tests/unit/edubridge/desktop-grants.provider.test.ts
    status: written
  - id: edu.gating.side.01
    level: backend
    kind: side
    scenario: Пайщик со статусом, отличным от active.
    expect: Только гостевые гранты.
    test: components/controller/tests/unit/edubridge/desktop-grants.provider.test.ts
    status: passing
  - id: edu.gating.happy.04
    level: ui
    kind: happy
    scenario: Имена workspace в install.ts совпадают с AppRegistry.desktops.
    expect: Все три стола получают маршруты, предупреждений «стол не объявлен» нет.
    test: ~
    status: missing
  - id: edu.gating.happy.05
    level: backend
    kind: happy
    scenario: Связка с Благоростом включена; рядовой пайщик, преподаватель, совет, гость.
    expect: Столы capital — преподавателю и совету; рядовому и гостю — нет; оферты/программы capital при вступлении скрыты; при выключенной связке ничего не сужается.
    test: components/controller/tests/unit/edubridge/capital-narrowing.policy.test.ts
    status: passing
  - id: edu.gating.happy.06
    level: backend
    kind: happy
    scenario: Матрица доступа — гость, владелец, администратор; разворот :all → :own.
    expect: Гость только EduCatalog:read; контакты и площадки только у владельца; список действий — хотя бы одно.
    test: components/controller/tests/unit/edubridge/edubridge-access.test.ts
    status: passing
