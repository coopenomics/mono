# CoopID Story 1.5: парольная политика (zxcvbn ≥3, ≥12 символов, русское
# сообщение) + аудит отказов в coop_domain_db через webhook к controller'у.
#
# Полиси переопределяется по identifiers дефолтного blueprint'а (upsert) —
# весь flow password-change не форкаем, при апгрейдах authentik дрейфа меньше.
# execution_logging: true — единственный источник событий policy_execution
# в этой инсталляции (дефолтные полиси его не включают), поэтому controller
# фильтрует только result.passing=false.
version: 1
metadata:
  name: CoopID - password policy & weak-password audit
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - identifiers:
      name: default-password-change-password-policy
    model: authentik_policies_password.passwordpolicy
    attrs:
      check_static_rules: true
      check_have_i_been_pwned: false # HIBP — Growth (FR21)
      check_zxcvbn: true
      zxcvbn_score_threshold: 3
      length_min: 12
      password_field: password
      error_message: Пароль слишком слабый. Попробуйте длиннее или с большей вариативностью
      execution_logging: true

  - identifiers:
      name: coopid-event-matcher-policy-execution
    id: coopid-event-matcher
    model: authentik_policies_event_matcher.eventmatcherpolicy
    attrs:
      action: policy_execution

  - identifiers:
      name: coopid-webhook-body
    id: coopid-webhook-body
    model: authentik_events.notificationwebhookmapping
    attrs:
      expression: |
        event = notification.event
        ctx = (event.context or {}) if event else {}
        return {
            "severity": notification.severity,
            "event_action": event.action if event else None,
            "event_user": ((event.user or {}).get("username")) if event else None,
            "passing": ((ctx.get("result") or {}).get("passing")),
            "messages": ((ctx.get("result") or {}).get("messages")),
            "created": event.created.isoformat() if event else None,
        }

  - identifiers:
      name: coopid-webhook-headers
    id: coopid-webhook-headers
    model: authentik_events.notificationwebhookmapping
    attrs:
      # Токен подставляется при применении blueprint'а из env контейнера
      # (COOPID_WEBHOOK_TOKEN); сверяется controller'ом constant-time.
      expression: !Format [
        "return {'X-Authentik-Webhook-Token': '%s'}",
        !Env COOPID_WEBHOOK_TOKEN,
      ]

  - identifiers:
      name: coopid-webhook-transport
    id: coopid-webhook-transport
    model: authentik_events.notificationtransport
    attrs:
      mode: webhook
      # Адрес контроллера параметризован: в dev это сервис `coopback` из компоуза,
      # а на проде контейнер зовётся <coopname>-coopback-blue|green и меняется при
      # каждой сине-зелёной раскатке — постоянного имени, на которое можно сослаться,
      # там просто нет. Прод-плейбук подставляет публичный адрес бэкенда
      # (https://<домен>/backend/...), он всегда указывает на активную версию.
      webhook_url: !Env [
        COOPID_WEBHOOK_URL,
        "http://coopback:2998/coop/internal/authentik-events",
      ]
      webhook_mapping_body: !KeyOf coopid-webhook-body
      webhook_mapping_headers: !KeyOf coopid-webhook-headers
      send_once: true

  - identifiers:
      name: coopid-weak-password-rule
    id: coopid-weak-password-rule
    model: authentik_events.notificationrule
    attrs:
      severity: notice
      transports:
        - !KeyOf coopid-webhook-transport
      destination_group: !Find [authentik_core.group, [name, authentik Admins]]

  - identifiers:
      policy: !KeyOf coopid-event-matcher
      target: !KeyOf coopid-weak-password-rule
      order: 0
    model: authentik_policies.policybinding
    attrs:
      enabled: true
