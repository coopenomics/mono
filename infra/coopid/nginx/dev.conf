# Схема для authentik и coopback. Стенд может стоять за внешним TLS-прокси (хостовый
# nginx с публичным именем, как voskhod-dev-4.coopenomics.world): тогда сюда приходит
# http, а наружу отвечает https, и подставлять $scheme значило бы собирать issuer и
# redirect'ы со схемой http — card.coop такой токен не примет. Берём схему, которую
# сообщил внешний прокси, а без него — свою.
map $http_x_forwarded_proto $coopid_forwarded_proto {
    default $scheme;
    https   https;
}

# Единый вход dev-контура (замена Caddy, 2026-08-09).
#
# Зачем именно nginx, а не Caddy: на проде трафик кооператива уже проходит три
# уровня — L7-nginx с кэшем статики, receiver-nginx на узле и внутренний
# nginx-контейнер, который и раскладывает по путям. Caddy дублировал бы третий
# уровень и стал четвёртым. Раз в прод поедет nginx, отлаживать вход надо на нём
# же: для OIDC всё висит на заголовке Host, куках и адресе возврата, и повторять
# эту отладку второй раз уже на проде мы не хотим.
#
# Прод-двойник: playbooks → mono/templates/nginx/internal.containers.conf.
# Блок authentik ниже должен совпадать с ним слово в слово. Правишь здесь —
# правь и там, иначе dev и прод разъедутся ровно в том месте, где это дороже
# всего заметить.
#
# Все upstream'ы заданы ЧЕРЕЗ ПЕРЕМЕННЫЕ (set $host_x ...), а не литеральным
# именем в proxy_pass. Это не стиль: с литеральным именем nginx резолвит его при
# загрузке конфига и НЕ СТАРТУЕТ, если контейнер ещё не поднялся. Через переменную
# имя разрешается на каждый запрос через docker-резолвер — стенд поднимается при
# любом порядке старта, а упавший сервис даёт 502 вместо мёртвого прокси.
#
# ВАЖНО: `set` обязан стоять ДО `rewrite ... break`. Обе директивы работают в фазе
# rewrite, а `break` эту фазу обрывает — объявление после него не выполнится, и
# запрос уйдёт в «no host in upstream :порт» с 500. Ровно та же пометка стоит в
# прод-конфиге, и наступить на это второй раз обидно.
#
# Чего здесь сознательно НЕТ (и не нужно в dev): blue/green upstream, кэш
# собранной статики, TLS. В dev всё по http на localhost — браузер считает
# localhost безопасным адресом, поэтому куки authentik ставятся нормально.

server {
    listen 80;
    server_name _;
    charset utf-8;

    # Резолвер докера: имена сервисов компоуза разрешаются в рантайме.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include mime.types;

    # Наружу не отдаём секреты проекта. Сборщик десктопа в режиме разработки
    # раздаёт по HTTP любой файл проекта, а стенды доступны снаружи через
    # внешний прокси: запрос `/.env` ронял сборщик в 500 и засорял лог, а
    # `/.env?raw` отдавал файл целиком — вместе с ключами интеграций.
    #
    # Блокируем ровно две вещи, а не «всё точечное»: служебные каталоги
    # целиком и точечные файлы в последнем сегменте пути (в том числе
    # запрошенные через `/@fs/`). Прежняя формулировка резала любой путь
    # с точечным сегментом — под неё попадали виртуальные каталоги самого
    # сборщика (`/.quasar/dev-spa/client-entry.js`, `/.vite/deps/…`,
    # рантайм из pnpm-стора `/@fs/…/.pnpm/vite@…/dist/client/env.mjs`),
    # и фронт не грузился вовсе. `/.well-known` (выпуск сертификатов)
    # проходит сам: его файлы точечными не являются.
    location ~ (?:^|/)\.(?:git|ssh|aws|docker|gnupg|npmrc)(?:/|$) {
        return 404;
    }

    location ~ /\.[^/]*$ {
        return 404;
    }

    types {
        application/manifest+json webmanifest;
    }

    # Как на проде: покрывает base64-загрузку изображений в GraphQL-мутациях.
    client_max_body_size 160M;

    # ── Канонический адрес стенда (только dev) ───────────────────────────────
    #
    # http://127.0.0.1:8108 и http://localhost:8108 ведут в один и тот же стенд,
    # но для браузера это РАЗНЫЕ источники. Весь вход CoopID построен на том, что
    # рабочий стол и authentik лежат на одном источнике: форма входа гонит пароль
    # в flow-API authentik обычным fetch'ем с куками и эхом CSRF-куки в заголовке.
    # Открыв стенд по 127.0.0.1, а issuer имея на localhost, пайщик получает
    # кросс-доменный запрос: authentik отвечает 200, но без CORS-заголовков —
    # браузер бракует ответ, и вход падает с невнятным «Failed to fetch». То же
    # ждало бы и адрес возврата: он собирается от источника страницы и перестал
    # бы совпадать с разрешённым в authentik.
    #
    # Поэтому уводим на канонический адрес сразу, до приложения. Порт сохраняем —
    # стенд слушают на разных портах (NGINX_HOST_PORT у каждого экземпляра свой).
    #
    # В прод-двойник (playbooks → templates/nginx/internal.containers.conf) этот
    # блок НЕ едет: там адрес один — домен кооператива, и подменять нечего.
    if ($http_host ~* "^(?:127\.0\.0\.1|\[::1\])(:[0-9]+)?$") {
        return 302 http://localhost$1$request_uri;
    }

    # ── authentik ────────────────────────────────────────────────────────────
    #
    # Встроенная форма входа отправляет почту и пароль в интерактивный flow-API
    # authentik по адресу /api/v3/flows/executor. А /api уже занят — он уводит на
    # блокчейн-ноду. Без более точного правила запрос с паролём ушёл бы в блокчейн,
    # и вход молча не работал бы.
    #
    # Порядок в файле роли НЕ играет: nginx выбирает самый длинный подходящий
    # префикс, поэтому /api/v3/ выигрывает у /api в любом месте конфига.
    # А вот `^~` обязателен — без него запрос мог бы утечь в regex-локейшены ниже.
    location ^~ /api/v3/ {
        set $authentik_host authentik-server;
        proxy_pass http://$authentik_host:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto;
        proxy_http_version 1.1;
    }

    # Интерфейс authentik, страницы флоу и согласия, его статика, аутпосты.
    #
    # Host передаём как $http_host, а НЕ $host: $host отбрасывает порт, и authentik
    # собирает адрес выдающего без него (http://localhost/... вместо
    # http://localhost:8108/...). Клиент такой адрес отвергнет — он обязан совпадать
    # с тем, что видит браузер, один в один. На проде разницы нет: там Host — домен
    # без порта, и обе переменные равны, поэтому строки остаются общими с прод-конфигом.
    location ^~ /application/o/ { set $authentik_host authentik-server; proxy_pass http://$authentik_host:9000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; }
    # Экраны потоков рисует стол (105-30): родной адрес потока возвращается на страницу стола,
    # строка запроса (next, токены писем) сохраняется. Остальное под /if/ (админка) — authentik.
    location ~ ^/if/flow/(?<coopid_flow_slug>[^/]+)/?$ {
        return 302 /flow/$coopid_flow_slug$is_args$args;
    }
    location ^~ /if/            { set $authentik_host authentik-server; proxy_pass http://$authentik_host:9000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; }
    location ^~ /flows/         { set $authentik_host authentik-server; proxy_pass http://$authentik_host:9000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; }
    location ^~ /static/        { set $authentik_host authentik-server; proxy_pass http://$authentik_host:9000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto; proxy_http_version 1.1; }
    location ^~ /outpost.goauthentik.io/ { set $authentik_host authentik-server; proxy_pass http://$authentik_host:9000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto; proxy_http_version 1.1; }

    # Стандартный корневой OIDC-discovery. Внешние сервисы ждут его в корне,
    # authentik отдаёт по своему пути — переписываем, Host сохраняем.
    location = /.well-known/openid-configuration {
        set $authentik_host authentik-server;
        rewrite ^ /application/o/coopid/.well-known/openid-configuration break;
        proxy_pass http://$authentik_host:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto;
        proxy_http_version 1.1;
    }
    location = /.well-known/jwks.json {
        set $authentik_host authentik-server;
        rewrite ^ /application/o/coopid/jwks/ break;
        proxy_pass http://$authentik_host:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto;
        proxy_http_version 1.1;
    }

    # ── Блокчейн-нода ────────────────────────────────────────────────────────
    location /api {
        access_log off;
        set $node_host node;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$node_host:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto;
        proxy_http_version 1.1;
    }

    # ── Бэкенд кооператива ───────────────────────────────────────────────────
    # Ровно /backend без пути — не проксируем (rewrite не сработает), как на проде.
    location = /backend {
        return 404;
    }

    location ^~ /backend {
        set $coopback_host coopback;
        rewrite ^/backend/(.*) /$1 break;
        proxy_pass http://$coopback_host:2998;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Рабочий стол ─────────────────────────────────────────────────────────
    # Upgrade-заголовки обязательны: quasar dev держит горячую перезагрузку
    # по вебсокету, без них фронт в разработке отвалится.
    location / {
        set $desktop_host desktop;
        proxy_pass http://$desktop_host:2999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coopid_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
