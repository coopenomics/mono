# Вход портов ядра для контейнеров приложений каталога (487-37).
#
# Контейнеры приложений стоят в отдельной сети и ядра не видят. Этот вход —
# отдельный контейнер core-ports, единственный адрес стенда в сети приложений.
# Он передаёт ядру один маршрут — вызов порта ядра по ключу приложения.
# Остальные адреса ядра, в том числе служебные под секретом узла, и главный
# nginx стенда из сети приложений недоступны.
#
# Прод-двойник: playbooks → mono/templates/apps/core-ports.conf.j2.
server {
    listen 8090;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /v1/internal/ports/ {
        set $ports_upstream coopback;
        proxy_pass http://$ports_upstream:2998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        return 404;
    }
}
