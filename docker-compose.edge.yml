# Overlay CoopID edge: caddy (внешний TLS 1.3) + crowdsec.
# Применяется ТОЛЬКО вместе с docker-compose.authentik.yml (caddy проксирует
# на authentik-server). Внутри docker-сети трафик plain HTTP, внешний TLS
# терминирует caddy. В Story 1.1 crowdsec только разбирает access-логи caddy;
# активный bouncer (блокировки) — Story 9.2.

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    environment:
      # localhost → self-signed (внутренний CA caddy); реальный домен → Let's Encrypt.
      COOPID_DOMAIN: ${COOPID_DOMAIN:-localhost}
    ports:
      # Прод с реальным доменом: CADDY_BIND=0.0.0.0, порты 80/443 — иначе ACME
      # HTTP-01 challenge недостижим снаружи и Let's Encrypt не выдаст сертификат.
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-8088}:80"
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/coopid/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - authentik-server
      - coopback

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/caddy crowdsecurity/http-cve"
    volumes:
      - ./infra/coopid/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec_db:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - caddy_logs:/var/log/caddy:ro
    depends_on:
      - caddy

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  crowdsec_db:
  crowdsec_config:
