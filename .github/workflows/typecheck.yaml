name: Typecheck

# Валидация TypeScript-типов для desktop (Vue 3 + Quasar) и controller (NestJS).
#
# Зачем это отдельный workflow:
#  1. `quasar build --mode ssr` в release.yaml использует Vite/esbuild и
#     vue-tsc отключён через vite-plugin-checker (см. quasar.config.cjs):
#     TS-ошибки в .vue/.ts НЕ ловятся при docker build образа desktop.
#  2. У `@coopenomics/controller` нет build-скрипта вовсе — `lerna run build`
#     его молча пропускает; в проде `ts-node` стартует и валится на типах
#     только в рантайме при загрузке модуля. Кейс PR #392 (rename 1080→1020
#     в cooptypes) проскочил именно так.
#
# История триггеров:
#  - до 2026-08-05 висел на одном `pull_request` и не запускался НИ РАЗУ:
#    PR'ы с 19.05.2026 создаются в Gitea, а на GitHub, где работают Actions,
#    приходит только зеркало пушей. `gh run list` возвращал пустой список.
#    За это время накопилось 56 ошибок vue-tsc.
#  - 2026-08-05 переведён на push в dev — долг вскрылся и был вычищен.
#  - 2026-08-06 сужен до релизных веток: на каждый коммит прогон слишком
#    дорог по лимитам раннеров.
#  - 2026-08-21 dev возвращён. Экономия обернулась дороже прогонов: релиз
#    32501986352 упал на сборке controller'а, потому что до testnet типы
#    никто не проверял, и красным стал уже релизный прогон. Ветка dev —
#    место, где ошибка стоит правки, а не отката релиза.
#  - 2026-09-08 dev снят по решению владельца: у прогона появилось своё место.
#    Рабочая ветка проверяется в ci/tests ДО слияния, поэтому прогон на каждый
#    коммит в dev — это второй прогон того же кода (тот же коммит шёл дважды,
#    #243 после зелёного #108). Дыра 2026-08-21 закрыта не dev-триггером, а
#    дисциплиной: без зелёного полигона ветка не сливается, а testnet остаётся
#    последним рубежом перед main.
#
# pull_request не нужен: PR живут в Gitea, на GitHub-зеркале их нет —
# триггер не срабатывал ни разу.
on:
  push:
    # ci/tests — ветка-полигон: рабочая ветка пушится сюда, чтобы получить
    # вердикт по типам до слияния. Локальные прогоны tsc/vue-tsc запрещены —
    # они вешают машину разработчика, — поэтому других точек контроля нет.
    branches: [testnet, main, ci/tests]
  workflow_call:
  workflow_dispatch:

# Прогоны не отменяют друг друга: полигоны ci/tests и ci/blackbox общие для
# нескольких агентов, и отмена прежнего прогона новым пушем обрывала чужую
# проверку. Каждый пуш доводится до исхода.

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Полный lerna build по всему workspace — как в корневом Dockerfile.
      # Не --scope, потому что workspace-пакеты unbuild-типа (sdk, inter,
      # notifications, factory, cooptypes, …) экспортируют типы только из
      # сгенерированного dist/. Без dist/ tsc/vue-tsc валятся на TS2307
      # «Cannot find module». Локально это маскируется ts-node-ом, но в
      # CI пути резолвятся через package.json → types → dist/.
      # См. Graphiti / run #148 root cause 2026-05-23.
      - name: Build all workspace packages
        run: pnpm lerna run build

      # quasar prepare генерирует .quasar/* (auto-imports d.ts, типы для
      # quasar плагинов). Без него vue-tsc ругается на отсутствующие
      # глобальные компоненты QBtn/QCard/etc.
      - name: Quasar prepare
        run: pnpm --filter @coopenomics/desktop run prepare

      # vue-tsc проверяет и .ts, и <script lang="ts"> в .vue.
      # --skipLibCheck — иначе валится на типах из транзитивных deps
      # (Quasar/Vue/Vite сами по себе чистые, но в графе есть legacy).
      # Из памяти: на dev-сервере висло ~час из-за конкуренции с quasar dev;
      # на чистом ubuntu-latest без живого стека ожидаемо в разы быстрее.
      # Если упрётся в OOM/таймаут — fallback на `pnpm typecheck`
      # (tsc --noEmit --skipLibCheck без vue-tsc, без SFC шаблонов).
      - name: vue-tsc (desktop)
        run: pnpm --filter @coopenomics/desktop exec vue-tsc --noEmit --skipLibCheck

  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Полный lerna build по всему workspace — controller импортирует
      # @coopenomics/sdk, @coopenomics/innercoop, @coopenomics/notifications
      # помимо cooptypes/factory; их dist/ генерируется unbuild и без
      # этого шага tsc валится на 37 TS2307. См. root cause выше.
      - name: Build all workspace packages
        run: pnpm lerna run build

      - name: tsc --noEmit (controller)
        run: pnpm --filter @coopenomics/controller run typecheck

      # Пакеты workspace проверяются здесь же, а не отдельной job: дорогая
      # часть — `lerna run build` выше, сами прогоны стоят секунды. До
      # 07.09.2026 их не проверял никто: сборка unbuild/esbuild типы срезает,
      # а workflow знал только desktop и controller. Через эту дыру на стенд
      # уехали две ошибки компилятора — в factory (документ собирался без
      # обязательного поля модели) и в sdk (селектор спрашивал у схемы
      # несуществующее поле).
      - name: tsc --noEmit (cooptypes)
        run: pnpm --filter cooptypes run typecheck

      - name: tsc --noEmit (factory)
        run: pnpm --filter @coopenomics/factory run typecheck

      - name: tsc --noEmit (sdk)
        run: pnpm --filter @coopenomics/sdk run typecheck

      - name: tsc --noEmit (boot)
        run: pnpm --filter @coopenomics/boot run typecheck

      - name: tsc --noEmit (api-tests)
        run: pnpm --filter @coopenomics/api-tests run typecheck

      - name: tsc --noEmit (i18n)
        run: pnpm --filter @coopenomics/i18n run typecheck

      # Каркас и контракты расширений. До 23.09.2026 их не проверял никто:
      # при переносе проверки валюты в extension-kit осталась ссылка на `config`
      # контроллера, пакет собрался без единого предупреждения, и сверка суммы
      # подписанного заявления падала на стенде «config is not defined».
      - name: tsc --noEmit (extension-kit)
        run: pnpm --filter @coopenomics/extension-kit run typecheck

      - name: tsc --noEmit (innercoop)
        run: pnpm --filter @coopenomics/innercoop run typecheck
