name: Tests

# Автотесты на PR в dev. До этого workflow тесты в CI не гонялись вообще —
# был только typecheck, а `pnpm test` никто не вызывал.
#
# Разделение на два job'а намеренное:
#  - unit  — ничему внешнему не нужен, быстрая обратная связь;
#  - component — нужен PostgreSQL, поэтому отдельно: падение сервиса не должно
#    выглядеть как падение unit-тестов.
#
# test:integration (sdk + boot) сюда НЕ входит: ему нужен поднятый стек —
# нода блокчейна, парсер и controller. Это отдельная задача.
#
# Почему всюду `pnpm lerna run build` перед тестами — та же причина, что в
# typecheck.yaml: workspace-пакеты (cooptypes, sdk, inter, notifications,
# factory) экспортируют типы и рантайм только из сгенерированного dist/.
# Без него ts-jest и vitest валятся на резолве `cooptypes`.

# Триггеры не включают pull_request: PR живут в Gitea, на GitHub-зеркале их
# нет — такой триггер не срабатывает вовсе. Роль «проверки до релиза»
# выполняет push в dev.
#
# Тесты выполняют роль релизного гейта: release.yaml вызывает этот workflow
# через workflow_call, и job `release` объявлен `needs: tests`. Релиз не
# состоится, если тесты красные.
#
# push в dev добавлен 2026-08-21: релиз 32504270957 упал на 13 юнит-тестах,
# отставших от кода после мержа двух больших PR. Красный релиз — слишком
# поздняя и слишком дорогая форма обратной связи; ветка dev даёт её там, где
# правка стоит один коммит.
#
# Ветка-полигон `ci/tests` оставлена: она нужна, чтобы прогнать релизный
# набор, не выпуская релиз, когда сам файл workflow правится (workflow_dispatch
# для этого не годится — GitHub отдаёт 404, пока файл не появится на дефолтной
# ветке main, а тесты приезжают туда только вместе с релизом).
#
# workflow_dispatch оставлен, чтобы прогнать набор вручную в любой момент,
# не дожидаясь релиза.
on:
  push:
    # Только полигон: рабочая ветка пушится в ci/tests и там получает вердикт
    # до слияния. Прогон на каждый коммит в dev дублировал бы тот же код
    # (снято 2026-09-08 по решению владельца).
    branches: [ci/tests, 'ci/tests-*']
  workflow_call:
  workflow_dispatch:

# ci/tests-<имя> — личный полигон агента: параллельные починки не перетирают
# чужую проверку в общем ci/tests.
# Прогоны не отменяют друг друга: полигоны ci/tests и ci/blackbox общие для
# нескольких агентов, и отмена прежнего прогона новым пушем обрывала чужую
# проверку. Каждый пуш доводится до исхода.

jobs:
  unit:
    runs-on: ubuntu-latest

    # Postgres — для гейта схемы: база собирается одними миграциями и
    # сверяется с сущностями (scripts/schema-check.ts). Как и у component ниже,
    # сервис доступен по проброшенному порту на 127.0.0.1.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm lerna run build

      # cooptypes + notifications + controller.
      # Юнит-тесты controller гоняются через `jest -i` (runInBand) — так же,
      # как требует CLAUDE.md для локального запуска.
      #
      # Через скрипт, а не `pnpm run test:unit`: цепочка `&&` обрывалась на
      # первом красном пакете, а в Job Summary попадал отчёт последнего
      # отработавшего раннера — на вкладке результатов было «1 файл, 7 тестов»
      # при тысяче с лишним реальных. Скрипт гоняет все пакеты и сводит их в
      # одну таблицу с поимённым списком падений.
      - name: Unit-тесты
        run: node scripts/run-unit-tests.mjs

      # Схему меняют только миграции (C28-79). Пустая база, все миграции ядра и
      # расширений, затем TypeORM не должен видеть ни одного отличия от
      # сущностей: колонка, добавленная в класс без миграции, роняет шаг —
      # иначе на узлах кооперативов её бы просто не было.
      - name: Схема базы — только миграциями
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DATABASE: postgres
        # Конфиг контроллера требует ключи VAPID (веб-уведомления); для сверки
        # схемы годится одноразовая пара — генерируем её здесь, а не храним.
        run: |
          cp components/controller/.env-example components/controller/.env
          cd components/controller
          eval "$(node -e "const k=require('web-push').generateVAPIDKeys(); console.log('export VAPID_PUBLIC_KEY=' + k.publicKey + ' VAPID_PRIVATE_KEY=' + k.privateKey)")"
          pnpm run schema:check
          # Типы таблиц для Kysely собираются из тех же миграций (C28-81): миграция
          # без пересборки типов оставила бы запросы проверенными по старой схеме.
          pnpm run schema:types --verify
