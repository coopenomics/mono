  Председатель по результатам очного осмотра отказывает в гарантийном возврате — заказчик забирает имущество обратно, движений по средствам нет.
  """
  marketplaceRejectReturnAtVisit(data: MarketplaceRejectReturnAtVisitInput!): MarketplaceReturnClaimResult!

  """
  Председатель отказывает в гарантийном возврате удалённо с указанием причины — финальное решение, движений по средствам нет.
  """
  marketplaceRejectReturnRemote(data: MarketplaceRejectReturnRemoteInput!): MarketplaceReturnClaimResult!

  """
  Удалить категории из доступных для кооператива (включая все их типы)
  
  Требуемые роли: chairman. 
  """
  marketplaceRemoveAvailableCategories(input: RemoveAvailableCategoriesInput!): Boolean!

  """
  Удалить конкретные типы товаров из доступных для кооператива
  
  Требуемые роли: chairman. 
  """
  marketplaceRemoveAvailableCategoryTypes(input: RemoveAvailableCategoryTypesInput!): Boolean!

  """Удалить пайщика из whitelist (admin); auto-coop запись неудаляема"""
  marketplaceRemoveFromWhitelist(input: MarketplaceRemoveFromWhitelistInput!): Boolean!

  """
  Заменить все доступные категории и типы новым списком
  
  Требуемые роли: chairman. 
  """
  marketplaceReplaceAvailableItems(input: ReplaceAvailableItemsInput!): [MarketplaceAvailableCategory!]!

  """
  Поставщик возвращает снятый Offer на публикацию (статус → PENDING_MODERATION)
  """
  marketplaceRepublishOffer(input: MarketplaceRepublishOfferInput!): MarketplaceOffer!

  """
  Повторно запускает геокодинг адреса ПВЗ.
  
  Требуемые роли: chairman. 
  """
  marketplaceRetryKUGeocode(coopname: String!, coreBraname: String!): MarketplaceKUDetails!

  """
  Активирует или деактивирует ПВЗ Стола заказов.
  
  Требуемые роли: chairman. 
  """
  marketplaceSetKUStatus(data: MarketplaceSetKUStatusInput!): MarketplaceKUDetails!

  """
  Председатель КУ ставит закрывающую подпись на акте приёмки — имущество переходит на баланс кооператива.
  """
  marketplaceSignAplReceptionAsChairman(data: MarketplaceSignAplReceptionInput!): MarketplaceAplReceptionResult!

  """
  Поставщик ставит первую подпись на акте приёмки (лично — Вариант А; асинхронно через push — Вариант Б).
  """
  marketplaceSignAplReceptionAsSupplier(data: MarketplaceSignAplReceptionInput!): MarketplaceAplReceptionResult!

  """
  L3-подпись оферты ЦПП «Стол заказов» пайщиком после gate-диалога: on-chain wallet::signagree + ответ в виде обновлённого состояния онбординга
  """
  marketplaceSignOnboardingOffer(input: MarketplaceSignOnboardingOfferInput!): MarketplaceOnboardingState!

  """
  Отправить черновик в совет. Принимает подписанное председателем Заявление 1106. После успешного приёма выполняются propwroff и soviet::createagenda(mktwroff).
  """
  marketplaceSubmitWriteoffDraft(data: MarketplaceSubmitWriteoffDraftInput!): MarketplaceWriteoffProposal!

  """
  Поставщик запускает поставку по предложению с открытой подпиской: формируется сводная заявка, заказы в её пуле принимаются.
  """
  marketplaceTriggerOpenSubscription(input: MarketplaceTriggerOpenSubscriptionInput!): MarketplaceConsolidatedRequest!

  """Поставщик правит свой Offer — статус сбрасывается в PENDING_MODERATION"""
  marketplaceUpdateOffer(input: MarketplaceUpdateOfferInput!): MarketplaceOffer!

  """Изменить состав черновика — добавить, удалить или поправить позиции."""
  marketplaceUpdateWriteoffDraft(data: MarketplaceUpdateWriteoffDraftInput!): MarketplaceWriteoffProposal!

  """Поставщик снимает свой Offer (статус → WITHDRAWN)"""
  marketplaceWithdrawOffer(input: MarketplaceWithdrawOfferInput!): MarketplaceOffer!

  """
  Уведомление о проведении общего собрания пайщиков
  
  Требуемые роли: chairman, member. 
  """
  notifyOnAnnualGeneralMeet(data: NotifyOnAnnualGeneralMeetInput!): MeetAggregate!

  """
  Обрабатывает подписанное заявление на конвертацию и выполняет блокчейн-транзакцию
  
  Требуемые роли: member, chairman. 
  """
  processConvertToAxonStatement(data: ProcessConvertToAxonStatementInput!): Boolean!

  """
  Опубликовать карточку
  
  Требуемые роли: chairman, member, user. 
  """
  publishProductCard(id: String!): Boolean!

  """
  Опубликовать предложенную повестку и проект решения для дальнейшего голосования совета по нему
  
  Требуемые роли: chairman, member. 
  """
  publishProjectOfFreeDecision(data: PublishProjectFreeDecisionInput!): Boolean!

  """Обновить токен доступа аккаунта"""
  refresh(data: RefreshInput!): RegisteredAccount!

  """Зарегистрировать аккаунт пользователя в системе"""
  registerAccount(data: RegisterAccountInput!): RegisteredAccount!

  """
  Зарегистрировать заявление и подписанные положения, подготовив пакет документов к отправке в совет на голосование после поступления оплаты.
  
  Требуемые роли: chairman, member. 
  """
  registerParticipant(data: RegisterParticipantInput!): Account!

  """Заменить приватный ключ аккаунта"""
  resetKey(data: ResetKeyInput!): Boolean!

  """
  Перезапуск общего собрания пайщиков
  
  Требуемые роли: chairman. 
  """
  restartAnnualGeneralMeet(data: RestartAnnualGeneralMeetInput!): MeetAggregate!

  """
  Сохранить/обновить черновик формы отчёта (upsert по owner+type+year+period)
  
  Требуемые роли: chairman. 
  """
  saveReportDraft(input: SaveReportDraftInput!): ReportDraft!

  """
  Выбрать кооперативный участок
  
  Требуемые роли: chairman, member, user. 
  """
  selectBranch(data: SelectBranchInput!): Boolean!

  """Отправить соглашение"""
  sendAgreement(data: SendAgreementInput!): Transaction!

  """
  Управление статусом платежа осущствляется мутацией setPaymentStatus. При переходе платежа в статус PAID вызывается эффект в блокчейне, который завершает операцию автоматическим переводом платежа в статус COMPLETED. При установке статуса REFUNDED запускается процесс отмены платежа в блокчейне. Остальные статусы не приводят к эффектам в блокчейне.
  
  Требуемые роли: chairman, member. 
  """
  setPaymentStatus(data: SetPaymentStatusInput!): GatewayPayment!

  """Сохранить приватный ключ в зашифрованном серверном хранилище"""
  setWif(data: SetWifInput!): Boolean!

  """
  Подписание решения председателем на общем собрании пайщиков
  
  Требуемые роли: chairman, member. 
  """
  signByPresiderOnAnnualGeneralMeet(data: SignByPresiderOnAnnualGeneralMeetInput!): MeetAggregate!

  """
  Подписание решения секретарём на общем собрании пайщиков
  
  Требуемые роли: chairman, member. 
  """
  signBySecretaryOnAnnualGeneralMeet(data: SignBySecretaryOnAnnualGeneralMeetInput!): MeetAggregate!

  """
  Начать процесс установки кооператива, установить ключ и получить код установки
  """
  startInstall(data: StartInstallInput!): StartInstallResult!

  """
  Выслать токен для замены приватного ключа аккаунта на электронную почту
  """
  startResetKey(data: StartResetKeyInput!): Boolean!

  """
  Запустить воркфлоу уведомлений (только для председателя или server-secret)
  
  Требуемые роли: chairman. 
  """
  triggerNotificationWorkflow(data: TriggerNotificationWorkflowInput!): Boolean!

  """
  Удалить расширение
  
  Требуемые роли: chairman. 
  """
  uninstallExtension(data: UninstallExtensionInput!): Boolean!

  """
  Обновить аккаунт в системе провайдера. Обновление аккаунта пользователя производится по username. Мутация позволяет изменить приватные данные пользователя, а также, адрес электронной почты в MONO. Использовать мутацию может только председатель совета.
  
  Требуемые роли: chairman. 
  """
  updateAccount(data: UpdateAccountInput!): Account!

  """Обновить банковский счёт"""
  updateBankAccount(data: UpdateBankAccountInput!): PaymentMethod!

  """
  Обновить расширение
  
  Требуемые роли: chairman. 
  """
  updateExtension(data: ExtensionInput!): Extension!

  """
  Обновить ручные реквизиты кооператива. ИНН/КПП/ОГРН игнорируются — это ончейн
  
  Требуемые роли: chairman. 
  """
  updateReportRequisites(input: UpdateReportRequisitesInput!): ReportRequisitesView!

  """
  Обновить настройки системы (рабочие столы и маршруты по умолчанию)
  
  Требуемые роли: chairman. 
  """
  updateSettings(data: UpdateSettingsInput!): Settings!

  """
  Обновить параметры системы
  
  Требуемые роли: chairman. 
  """
  updateSystem(data: Update!): SystemInfo!

  """Подтвердить email адрес пользователя"""
  verifyEmail(data: VerifyEmailInputDTO!): Boolean!

  """
  Голосование на общем собрании пайщиков
  
  Требуемые роли: member. 
  """
  voteOnAnnualGeneralMeet(data: VoteOnAnnualGeneralMeetInput!): MeetAggregate!

  """
  Перевод между кошельками одного бух.счёта (operation o.adj.walmove). Только председатель. Backend проверяет связь wallet→account до подписания.
  
  Требуемые роли: chairman. 
  """
  walmoveWallets(input: WalmoveInput!): Ledger2AdjustmentResult!
}

