"""Способ накопления заказов перед поставкой."""
enum MarketplaceOrderCycleType {
  """Каждый заказ обрабатывается отдельно, без накопления."""
  INDIVIDUAL

  """Поставщик запускает поставку вручную."""
  OPEN_SUBSCRIPTION

  """Поставка по истечении периода; собирается всё, что успело прийти."""
  TIME_BASED

  """Поставка стартует, когда набран целевой объём."""
  VOLUME_BASED
}

"""
Сверка фактической выдачи с заказом: equal — совпало, less — выдано меньше, more — выдано больше с доплатой.
"""
enum MarketplaceOrderIssuanceFactDiffState {
  EQUAL
  LESS
  MORE
}

"""Фактическая выдача имущества пайщику на ПВЗ."""
type MarketplaceOrderIssuanceFactSnapshot {
  """Фактически выданное количество единиц."""
  actual_quantity: Int!

  """Сверка фактической выдачи с заказом."""
  diff_state: MarketplaceOrderIssuanceFactDiffState!

  """Фактическая стоимость выдачи (actual_quantity × цена за единицу)."""
  fact_cost: String!
}

