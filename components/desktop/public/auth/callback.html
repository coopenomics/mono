<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход</title>
</head>
<body>
<script>
  // Страница возврата контура CoopID. Живёт в скрытом кадре и пользователю не
  // показывается: её единственная задача — передать адрес возврата родительскому
  // окну, дальше библиотека входа разбирает его сама.
  //
  // Почему СТАТИЧЕСКАЯ страница, а не маршрут приложения. Раньше здесь был
  // обычный экран Vue, и в скрытый кадр грузилось всё приложение целиком: это
  // занимало больше десяти секунд, библиотека не дожидалась и валила вход с
  // «iframe timeout». Статическая страница отвечает мгновенно и от загрузки
  // приложения не зависит вовсе.
  //
  // Формат сообщения задаёт oidc-client-ts: source обязан быть ровно
  // 'oidc-client', иначе родитель его проигнорирует и снова словит таймаут.
  try {
    window.parent.postMessage(
      { source: 'oidc-client', url: window.location.href, keepOpen: false },
      window.location.origin
    );
  } catch (e) {
    // Показывать сообщение некому — страница невидима; оставляем след в консоли.
    console.error('[coopid] не удалось передать результат входа родительскому окну', e);
  }
</script>
</body>
</html>
