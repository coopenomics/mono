# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.mkt.inv
    human_name: Трансляция паевого взноса в договор участия в хозяйственной деятельности
    wallet_op: TRANSFER
    debit: null                    # оба кошелька — паевой фонд, проводки нет
    credit: null
    wallet_from: w.wal.share
    wallet_to: w.mkt.invest
    l3:
      - user_wallet: w.wal.share
        user_ref: investor.username
        available_delta: -amount
      - user_wallet: w.mkt.invest
        user_ref: investor.username
        available_delta: +amount
    amount_ref: amount
    triggered_by: marketplace::investmoney
    description: >
      Паевой взнос инициатора переходит с главного паевого кошелька на
      кошелёк вложения в участок. Паевой фонд не меняется.

  - ledger_code: o.mkt.iprop
    human_name: Приём имущества паевым взносом в кооперативный участок
    wallet_op: ISSUE
    debit: 10
    credit: 80
    wallet_from: null
    wallet_to: w.mkt.invest
    user_wallet: w.mkt.invest
    user_ref: invprop.username
    available_delta: +invprop.amount
    blocked_delta: null
    amount_ref: invprop.amount
    triggered_by: marketplace::act2iprop
    description: >
      Имущество принято на баланс по цене, которую назвал инициатор; цена
      учтена в паевом фонде и зачислена инициатору на кошелёк вложения.

  - ledger_code: o.mkt.ipool
    human_name: Выделение средств инициаторов под расход кооперативного участка
    wallet_op: ISSUE
    debit: null
    credit: null
    wallet_from: null
    wallet_to: w.mkt.ipool
    amount_ref: сумма служебной записки или заявления на материальную помощь
    triggered_by: marketplace::fundipool
    description: >
      Общего кошелька участка не хватает на расход — под него выделяются
      средства инициаторов. Деньги уже на расчётном счёте с их паевых
      взносов; оплата расхода проводится со счёта вложений.

  - ledger_code: o.mkt.iunpl
    human_name: Возврат невыделенных средств инициаторов из пула
    wallet_op: BURN
    debit: null
    credit: null
    wallet_from: w.mkt.ipool
    wallet_to: null
    amount_ref: неизрасходованный остаток
    triggered_by: marketplace::unfundipool
    description: >
      Расход отклонён или закрыт на меньшую сумму: неизрасходованное снова
      свободно для следующих расходов участка.

  - ledger_code: o.mkt.iback
    human_name: Трансляция возвращённого вложения в главный паевой кошелёк
    wallet_op: TRANSFER
    debit: null
    credit: null
    wallet_from: w.mkt.invest
    wallet_to: w.wal.share
    l3:
      - user_wallet: w.mkt.invest
        user_ref: investor.username
        available_delta: -сумма заявления
      - user_wallet: w.wal.share
        user_ref: investor.username
        available_delta: +сумма заявления
    amount_ref: сумма, рассчитанная кооперативом
    triggered_by: marketplace::claiminv
    description: >
      Возвращённое и неиспользованное вложение переходит на главный паевой
      кошелёк инициатора; деньгами он получает его обычным возвратом
      паевого взноса.

  - ledger_code: o.mkt.iexit
    human_name: Перенос вложения инициатора на главный паевой при выходе из кооператива
    wallet_op: TRANSFER
    debit: null
    credit: null
    wallet_from: w.mkt.invest
    wallet_to: w.wal.share
    l3:
      - user_wallet: w.mkt.invest
        user_ref: exit.username
        available_delta: -остаток
      - user_wallet: w.wal.share
        user_ref: exit.username
        available_delta: +остаток
    amount_ref: остаток кошелька вложения
    triggered_by: registrator::confirmexit
    description: >
      Выход одобрен советом: вложение целиком переходит на главный паевой и
      возвращается вместе с паевым взносом; возвраты из экономии участка ему
      больше не начисляются.

# ── Связи с другими процессами ──────────────────────────────────────────
related:
  - process_type: sov.authpkg
    relation: consumes
    note: >
      Вопрос о приёме имущества выносится в повестку совета: голосование и
      решение идут по типовому порядку решений совета.
  - process_type: p.reg.exit
    relation: provides
    note: >
      Выход пайщика из кооператива снимает его с вложений в участки, а
      вложение переносится на главный паевой.
