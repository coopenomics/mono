# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Списание обеспечительной части по итогу периода участка» —
# коэффициент экономического участия Стола заказов (задачи 99D-21, 99D-22,
# 99D-33; документ модели компонента 68, разделы 8–9).
#
# При заказе пайщик сверх стоимости имущества вносит обеспечительную часть
# паевого взноса. На выдаче она ставится к списанию и записывается в счётчики
# этого процесса: строку пайщика и строку участка за период, в котором
# кончается гарантийный срок. По окончании периода кооператив считает итог
# участка и списывает строки пайщиков по его ставкам: участку на расходы, в
# фонды накопления, инициаторам участка, остаток — пайщику обратно. Суммы для
# расчёта и списания контракт берёт только из своих счётчиков: учётная
# система кооператива называет участок, пайщика и период и передаёт факты о
# расходах, которых в цепи нет.
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.mkt.due
id: public_marketplace_due_process
title: Списание обеспечительной части по итогу периода участка
slug: due
status: proposed
contract: marketplace
purpose: >
  Обеспечительная часть паевого взноса, поставленная к списанию при выдаче
  имущества или удержанная при отказе от получения, становится членским
  взносом кооперативного участка по окончании периода, в котором кончился
  гарантийный срок заказа. Кооператив считает итог участка за период: из
  собранной обеспечительной части участок получает свои расходы, из остатка
  идут отчисления в фонды накопления, остальное — экономия, которую делят
  инициаторы участка и пайщики. Строка пайщика за период списывается одной
  транзакцией по ставкам итога; остаток возвращается пайщику на свободный
  паевой Стола заказов. Суммы контракт берёт из своих счётчиков, учётная
  система кооператива сумм не называет.
roles:
  - backend
  - admin

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: marketplace::issueact2
    human: Поставить к списанию при выдаче
    actor: Председатель участка
    role: opener
    purpose: >
      Закрывающая подпись акта выдачи ставит обеспечительную часть выданного
      имущества к списанию и записывает стоимость выданного и эту сумму в
      счётчики пайщика и участка за период конца гарантийного срока. Сама
      выдача описана в процессе поставки имущества.
    links:
      - process_type: p.mkt.supply
        label: Поставка имущества пайщику

  - name: marketplace::cancelorder
    human: Записать удержание при отказе
    actor: Заказчик
    role: opener
    purpose: >
      Отказ от получения после акцепта поставщиком удерживает половину
      стоимости и половину обеспечительной части; удержанное записывается в
      счётчик текущего периода и по его окончании целиком достаётся участку.
    links:
      - process_type: p.mkt.supply
        label: Поставка имущества пайщику

  - name: marketplace::closeperiod
    human: Рассчитать итог периода участка
    actor: backend
    role: progress
    purpose: >
      По окончании периода учётная система кооператива передаёт факты о
      тратах участка за период из его денег — оплаченные плановые расходы,
      служебные записки сверх плана, материальную помощь — и цель плановых
      расходов: неоплаченные расходы со сроком до конца следующего периода.
      Траты из средств инициаторов в расходы не входят: их возмещает
      компенсация инициаторам. Стоимость выданных заказов и собранную
      обеспечительную часть контракт берёт из счётчика участка. Расходы
      собираются вперёд: к тратам периода контракт добавляет резерв на
      следующий период — цель плановых расходов и накопленное право
      получателей материальной помощи — и вычитает то, что собрал прошлый
      итог. Из собранного участок получает расходы, но не больше собранного:
      сначала траты периода, резерв последним, несобранное переходит в
      следующий период. Из остатка — отчисления в фонды накопления по их
      процентам; остальное — экономия, которая делится между инициаторами и
      пайщиками. Период без выданных заказов тоже получает итог: собранного
      нет, расходы становятся дефицитом. Итог записывается один раз, счётчик
      участка стирается.

  - name: marketplace::chargeperiod
    human: Списать строку пайщика по итогу периода
    actor: backend
    role: closer
    purpose: >
      Учётная система называет пайщика, участок и период. Контракт берёт из
      строки счётчика стоимость выданных заказов, обеспечительную часть к
      списанию и удержания при отказе и делит по ставкам итога: участку на
      расходы, в фонды накопления, инициаторам участка; удержания — участку
      целиком; остаток возвращается пайщику на свободный паевой Стола заказов.
      Строка без стоимости (одни удержания) итога не требует. Пока период
      идёт или по заказу этой строки открыто заявление на гарантийный
      возврат, списание отклоняется; заявление по заказу другого участка или
      другого периода строку не держит. Строка стирается — повторить списание нечем.

  - name: marketplace::exitdue
    human: Списать остаток при выходе пайщика
    actor: backend
    role: closer
    purpose: >
      Когда выход пайщика из кооператива состоялся, остаток его
      обеспечительной части к списанию немедленно становится членским
      взносом участка, к которому он прикреплён, а его строки счётчиков
      стираются. Вызывает процесс выхода из кооператива.
    links:
      - process_type: p.reg.exit
        label: Выход пайщика из кооператива

  - name: marketplace::delperiod
    human: Стереть прошедший итог периода
    actor: backend
    role: aux
    purpose: >
      У участка хранятся итоги только текущего и прошлого периода: прошлый
      нужен ради собранной части резерва. Позапрошлый итог кооператив
      стирает, когда по нему не осталось несписанных строк пайщиков; история
      итогов хранится в учётной системе кооператива.

  - name: marketplace::setshares
    human: Задать долю инициатора в экономии
    actor: admin
    role: aux
    purpose: >
      Администратор задаёт, какая часть экономии периода участка достаётся
      инициаторам участка; остальное возвращается пайщикам. По умолчанию
      61,8 % инициаторам и 38,2 % пайщикам. Доля применяется при расчёте
      итога; прошедшие периоды не пересчитываются.

  - name: marketplace::setinitiator
    human: Назначить инициатора участка
    actor: admin
    role: aux
    purpose: >
      Инициатор участка — пайщик, внёсший средства в участок по договору
      участия в хозяйственной деятельности; ему достаётся доля экономии
      периода, пока у участка нет учёта паевых взносов инициаторов. Пока
      инициатор не назначен, им считается председатель участка. Пустое имя
      снимает назначение.

  - name: marketplace::migratedue
    human: Перенести учёт прежних заказов в счётчики
    actor: backend
    role: aux
    purpose: >
      Переходное действие одного выпуска: заказы, выданные до появления
      счётчиков, учётная система переносит в счётчики при первом запуске
      после обновления. Контракт пропускает перенос только в пределах
      остатка кошелька пайщика к списанию.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: строка счётчика пайщика за период (таблица kudues, scope=coopname).
# Поля статуса нет: строка живёт от первой записи до списания.
entity: marketplace::kudue
entity_human: Обеспечительная часть пайщика к списанию за период
entity_source: cpp/marketplace/src/p.mkt.due/

states:
  - name: accruing
    human: Копится
    description: >
      Статус — существование строки. Строка заведена первой выдачей или
      удержанием пайщика на участке за период и пополняется каждой следующей
      выдачей того же периода; гарантийный возврат уменьшает её. Период ещё
      идёт — списание отклоняется.
    kind: initial
  - name: ripe
    human: Ждёт списания
    description: >
      Период закончился: по времени цепи наступил следующий период. Поле в
      строке не меняется — созревание считается по времени. Строка со
      стоимостью ждёт итога участка за свой период и списывается по его
      ставкам; строка из одних удержаний списывается без итога.
    kind: normal

transitions:
  - from: "∅"
    to: accruing
    action: marketplace::issueact2
    actor: Председатель участка
    guards:
      - Обеспечительная часть по факту выдачи больше нуля.
    human: >
      Закрывающая подпись акта выдачи записывает стоимость выданного и
      обеспечительную часть в строку пайщика и строку участка за период конца
      гарантийного срока.

  - from: "∅"
    to: accruing
    action: marketplace::cancelorder
    actor: Заказчик
    guards:
      - Заказ акцептован поставщиком и ещё не выдан.
    human: >
      Удержанные половины стоимости и обеспечительной части записываются в
      строку текущего периода как удержание.

  - from: accruing
    to: accruing
    action: marketplace::onmktrtauth
    actor: Совет
    guards:
      - Строка пайщика за период заказа ещё не списана.
      - Обеспечительная часть за возвращённое не больше учтённой в строке.
    human: >
      Решение совета о гарантийном возврате снимает со строки пайщика и со
      счётчика участка стоимость возвращённого и его обеспечительную часть.
      Если строка уже списана, решение не исполняется.

  - from: accruing
    to: ripe
    action: marketplace::closeperiod
    actor: backend
    guards:
      - Период закончился.
      - Итог за этот период ещё не рассчитан; период без выданных заказов тоже получает итог.
      - Факты о расходах не отрицательны и в валюте кооператива.
      - Сумма процентов фондов накопления не выше 100 %.
    human: >
      Итог участка за период записан, счётчик участка стёрт. Строки пайщиков
      периода ждут списания по его ставкам.

  - from: ripe
    to: "∅"
    action: marketplace::chargeperiod
    actor: backend
    ledger_code: p.mkt.due
    operations:
      - o.mkt.charge
      - o.brn.common
      - o.fnd.indiv
      - o.fnd.resrv
      - o.fnd.devel
      - o.mkt.repay
      - o.mkt.icover
      - o.mkt.rpsurp
      - o.mkt.iuncov
      - o.mkt.retdue
    guards:
      - Период закончился.
      - У пайщика нет открытого заявления на гарантийный возврат.
      - У строки со стоимостью есть итог участка за период.
      - Остаток кошелька пайщика к списанию не меньше суммы строки.
    human: >
      Строка списывается одной транзакцией: участку на расходы и удержания,
      в фонды накопления, инициаторам участка, остаток — пайщику на свободный
      паевой Стола заказов. Строка стёрта.

  - from: accruing | ripe
    to: "∅"
    action: marketplace::exitdue
    actor: backend
    ledger_code: p.mkt.due
    operations:
      - o.mkt.exfee
      - o.brn.common
    guards:
      - Выход пайщика из кооператива состоялся.
    human: >
      Остаток кошелька пайщика к списанию целиком становится членским взносом
      участка, к которому он прикреплён; все строки пайщика стёрты, открытые
      счётчики участков уменьшены на его суммы.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Выдача имущества
      actor: Председатель участка
      action: marketplace::issueact2
      description: >
        При закрытии выдачи обеспечительная часть по факту переходит на
        кошелёк пайщика к списанию и записывается в счётчики пайщика и
        участка за период конца гарантийного срока.
    - step: 2
      title: Окончание периода
      actor: backend
      action: marketplace::closeperiod
      description: >
        Учётная система кооператива видит, что период участка закончился,
        собирает факты о тратах из денег участка — оплаченный план,
        служебные записки, материальную помощь — и цель плановых расходов на
        следующий период и просит контракт рассчитать итог. Стоимость заказов
        и собранное контракт берёт из своего счётчика. Итог получает и
        период без выданных заказов, если участку есть что нести: резерв
        помощи, плановые расходы или собранное прошлым итогом.
    - step: 3
      title: Списание строк пайщиков
      actor: backend
      action: marketplace::chargeperiod
      description: >
        По каждой строке пайщика за период учётная система называет пайщика,
        участок и период. Контракт делит строку по ставкам итога и возвращает
        остаток пайщику; пайщик получает письмо о списанном и возвращённом.
    - step: 4
      title: Уборка итогов
      actor: backend
      action: marketplace::delperiod
      description: >
        Когда по позапрошлому итогу не осталось несписанных строк, учётная
        система стирает его из цепи; история итогов — в её базе.

  alternatives:
    - branch: Удержание при отказе от получения
      at_step: 1
      action: marketplace::cancelorder
      actor: Заказчик
      description: >
        Удержанные половины записываются в строку текущего периода и по его
        окончании списываются участку целиком, без итога.
    - branch: Гарантийный возврат
      at_step: 2
      action: marketplace::onmktrtauth
      actor: Совет
      description: >
        Пока строка не списана, решение совета о возврате снимает с неё
        стоимость возвращённого и его обеспечительную часть; пока заявление
        на возврат открыто, строка пайщика не списывается.
    - branch: Выход пайщика
      at_step: 3
      action: marketplace::exitdue
      actor: backend
      description: >
        Остаток к списанию становится членским взносом участка пайщика
        немедленно, строки стираются.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# Процесс без документов: расчёт и списание идут по условиям программы без
# подписи пайщика; решение совета о гарантийном возврате — в процессе возврата.
documents: []

# ── Секция 6. Операции (ledger2) ───────────────────────────────────────────
operations:
  - ledger_code: o.mkt.charge
    human_name: Списание обеспечительной части в членский взнос по условиям программы
    wallet_op: TRANSFER
    # L1 — без проводки: транзит; проводку Дт 80 / Кт 86 делает зачисление участку
    debit: null
    credit: null
    wallet_from: w.mkt.due         # Обеспечительная часть к списанию
    wallet_to: w.mkt.fee           # Пул обеспечительной части (транзит к кошельку участка)
    user_wallet: w.mkt.due
    user_ref: kudue.username
    available_delta: -(участку + фонды + инициаторам)
    blocked_delta: null
    amount_ref: стоимость заказов строки × ставки итога + удержания
    triggered_by: marketplace::chargeperiod
    description: >
      По окончании периода кооператив без подписи пайщика списывает в членский
      взнос ту часть обеспечительной части строки, которая по ставкам итога
      достаётся участку, фондам и инициаторам, и удержания при отказе. Сумму
      контракт берёт из своей строки счётчика. Той же транзакцией сумма
      зачисляется участку, в фонды накопления и инициаторам.

  - ledger_code: o.brn.common
    human_name: Зачисление членского взноса в общий кошелёк кооперативного участка
    wallet_op: TRANSFER
    debit: 80                      # Паевой фонд
    credit: 86                     # Целевое финансирование
    wallet_from: w.mkt.fee         # Пул обеспечительной части «Стола заказов»
    wallet_to: w.brn.common        # Общий кошелёк кооперативного участка
    user_wallet: w.brn.common
    user_ref: kudue.braname
    available_delta: +участку
    blocked_delta: null
    amount_ref: стоимость заказов строки × ставка участка + удержания
    triggered_by: marketplace::chargeperiod, marketplace::exitdue
    description: >
      Обеспечительная часть паевого взноса становится членским взносом и
      зачисляется в общий кошелёк кооперативного участка выдачи — участок
      распоряжается им сам: сперва расходы участка, затем распределение
      доверенным. Это единственная операция процесса, которая переводит
      паевое в членское. Происходит при списании строки пайщика по итогу
      периода, а при выходе пайщика из кооператива — немедленно.

  - ledger_code: o.mkt.repay
    human_name: Возмещение паевых взносов инициаторов из экономии периода участка
    wallet_op: TRANSFER
    debit: 80                      # Паевой фонд — обеспечительная часть становится членским взносом
    credit: 86                     # Целевые поступления
    wallet_from: w.mkt.fee         # Пул обеспечительной части (транзит)
    wallet_to: w.mkt.repay         # Возмещение паевых взносов инициаторов участка
    user_wallet: w.mkt.repay
    user_ref: kudue.braname
    available_delta: +доля инициаторов
    blocked_delta: null
    amount_ref: стоимость заказов строки × ставка инициаторов, не больше невозвращённого
    triggered_by: marketplace::chargeperiod
    description: >
      Пока паевые взносы инициаторов в участок не возвращены, их доля в
      экономии периода становится членским взносом участка на отдельном
      кошельке возмещения и возмещает паевые взносы пропорционально каждому.
      Сверх невозмещённого и у участка без паевых взносов инициаторов доля
      направляется на общий кошелёк участка. Инициаторы транслируют
      возмещённое своим заявлением.

  - ledger_code: o.mkt.rpsurp
    human_name: Перевод переплаты возмещения паевых взносов на общий кошелёк участка
    wallet_op: TRANSFER
    debit: null                    # оба кошелька — целевые поступления участка
    credit: null
    wallet_from: w.mkt.repay
    wallet_to: w.brn.common
    l3:
      - user_wallet: w.mkt.repay
        user_ref: kudue.braname
        available_delta: -переплата
      - user_wallet: w.brn.common
        user_ref: kudue.braname
        available_delta: +переплата
    amount_ref: переплата инициатору, чей возврат завершился в этом списании
    triggered_by: marketplace::chargeperiod
    description: >
      Инициатор получил всё использованное; начисленное ему сверх этого
      переходит участку.

  - ledger_code: o.mkt.icover
    human_name: Погашение расходов участка из средств инициаторов членскими взносами
    wallet_op: NONE
    debit: 86                      # Целевые поступления — членские взносы участка
    credit: 26                     # Общехозяйственные расходы — оплаченное деньгами инициаторов
    wallet_from: null
    wallet_to: null
    amount_ref: возмещение × доля использованных денег в базе возврата участка
    triggered_by: marketplace::chargeperiod
    description: >
      Участок в профиците: членские взносы, которые возмещают инициаторам
      израсходованные деньги, гасят расходы и материальную помощь,
      проведённые по счёту 26. Когда все участки возместили деньги
      инициаторов, счёт 26 закрыт в ноль. Имущество инициаторов лежит на
      счёте 10 и этой проводкой не гасится — по нему движутся только кошельки.

  - ledger_code: o.mkt.iuncov
    human_name: Сторно погашения расходов участка на переплату возмещения, переведённую участку
    wallet_op: NONE
    debit: 26
    credit: 86
    wallet_from: null
    wallet_to: null
    amount_ref: денежная доля переплаты инициаторов, чей возврат завершился в этом списании
    triggered_by: marketplace::chargeperiod
    description: >
      Переплата возмещения переходит участку, а не инициатору, поэтому её
      денежная доля расходы на счёте 26 не гасит — погашение сторнируется.

  - ledger_code: o.mkt.retdue
    human_name: Возврат части обеспечительной части паевого взноса по итогу периода участка
    wallet_op: TRANSFER
    debit: null
    credit: null
    wallet_from: w.mkt.due         # Обеспечительная часть к списанию
    wallet_to: w.mkt.share         # Свободный паевой Стола заказов
    l3:
      - user_wallet: w.mkt.due
        user_ref: kudue.username
        available_delta: -возврат
        blocked_delta: null
      - user_wallet: w.mkt.share
        user_ref: kudue.username
        available_delta: +возврат
        blocked_delta: null
    amount_ref: обеспечительная часть строки за вычетом частей участку, фондам и инициаторам
    triggered_by: marketplace::chargeperiod
    description: >
      То, что из обеспечительной части строки не понадобилось участку, фондам
      и инициаторам по ставкам периода, возвращается пайщику на свободный
      паевой Стола заказов и идёт на следующие заказы. Средства остаются
      паевыми; остатки округления достаются пайщику.

  - ledger_code: o.mkt.exfee
    human_name: Списание обеспечительной части в членский взнос при выходе пайщика из кооператива
    wallet_op: TRANSFER
    # L1 — без проводки: оба кошелька на счёте 80; проводку делает зачисление участку
    debit: null
    credit: null
    wallet_from: w.mkt.due         # Обеспечительная часть к списанию
    wallet_to: w.mkt.fee           # Пул обеспечительной части (транзит к кошельку участка)
    user_wallet: w.mkt.due
    user_ref: username
    available_delta: -остаток кошелька
    blocked_delta: null
    amount_ref: весь остаток кошелька пайщика к списанию
    triggered_by: marketplace::exitdue
    description: >
      При выходе из кооператива обеспечительная часть, ожидающая списания,
      по условиям программы списывается в членский взнос немедленно: той же
      транзакцией она зачисляется в общий кошелёк кооперативного участка, к
      которому прикреплён пайщик; если пайщик ни к какому участку не
      прикреплён, остаток остаётся в пуле (решение владельца 31.10.2026).
      Списание происходит, когда выход состоялся: при отклонении выплаты
      кассиром остаток остаётся у пайщика.

# ── Связи с другими процессами ──────────────────────────────────────────
# Только по межконтрактным вызовам: consumes — процесс вызывает другой,
# provides — другой процесс вызывает этот.
related:
  - process_type: p.fnd.accum
    relation: consumes
    note: >
      При списании строки пайщика по итогу периода отчисляет часть членского
      взноса участка в фонды накопления кооператива по их процентам.
  - process_type: p.brn.fees
    relation: consumes
    note: >
      Зачисляет членский взнос кооперативному участку выдачи, а при выходе
      пайщика — участку, к которому он прикреплён.
  - process_type: p.reg.exit
    relation: provides
    note: >
      Выход пайщика из кооператива списывает остаток его обеспечительной
      части к списанию в членский взнос участка и стирает его строки
      счётчиков.
