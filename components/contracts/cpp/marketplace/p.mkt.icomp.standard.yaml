# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Возмещение паевого взноса инициатору кооперативного участка».
#
# Отдельный процесс по слову владельца 10.11.2026: внесение паевого взноса в
# участок (p.mkt.invest) и его возмещение — разные процессы, и заявление о
# трансляции средств на главный паевой показывает бухгалтеру своё содержание.
# Возмещение начисляется по итогу периода участка (p.mkt.due, o.mkt.repay и
# погашение 26); здесь инициатор забирает начисленное заявлением.
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.mkt.icomp
id: public_marketplace_invest_compensation_process
title: Возмещение паевого взноса инициатору кооперативного участка
slug: icomp
status: proposed
contract: marketplace
purpose: >
  Инициатор кооперативного участка вносил в участок деньги или имущество, и
  участок их использовал. Когда участок выходит в плюс, доля инициаторов в
  экономии каждого месяца возмещает им использованное пропорционально
  внесённому, без выгоды. Возмещённое и, после полного возмещения,
  неиспользованные деньги инициатор переводит заявлением с кошелька договора
  участия на главный паевой кошелёк; деньгами он получает их обычным
  возвратом паевого взноса.
roles:
  - initiator

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: marketplace::claiminv
    human: Получить возмещение
    actor: Инициатор
    role: opener
    purpose: >
      Инициатор подписывает заявление о трансляции средств с кошелька
      договора участия на главный паевой кошелёк. Сумму считает кооператив
      сам: возмещённое из экономии участка и, когда использованное
      возмещено целиком, неиспользованные деньги. Когда инициатор забрал
      всё, он остаётся инициатором участка с нулевым остатком: его итоги и
      история видны, новый паевой взнос снова включает его в возмещение.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Процесс без сущности: заявление исполняется одним действием и записи со
# статусом не оставляет. История — операция учёта по хэшу заявления и
# документ в реестре.
entity: null
states: []
transitions: []

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Заявление на возмещение
      actor: Инициатор
      action: marketplace::claiminv
      description: >
        Инициатор видит на странице «Инициаторы участка», сколько ему
        возмещено и сколько можно перевести сейчас, и подписывает заявление.
        Кооператив пересчитывает сумму и переводит её с кошелька договора
        участия на главный паевой кошелёк инициатора.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - action: marketplace::claiminv
    title: Заявление о трансляции средств с кошелька договора участия на главный паевой
    registry_id: 1123
    signed_by: [Инициатор]
    stored_in: реестр документов, пакет — хэш заявления

# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.mkt.iback
    human_name: Трансляция паевого взноса из договора участия в главный паевой кошелёк
    wallet_op: TRANSFER
    debit: null                    # оба кошелька — паевой фонд (80)
    credit: null
    wallet_from: w.mkt.invest
    wallet_to: w.wal.share
    l3:
      - user_wallet: w.mkt.invest
        user_ref: investor.username
        available_delta: -сумма заявления
      - user_wallet: w.wal.share
        user_ref: investor.username
        available_delta: +сумма заявления
    amount_ref: сумма, рассчитанная кооперативом
    triggered_by: marketplace::claiminv
    description: >
      Возмещённый и неиспользованный паевой взнос переходит на главный паевой
      кошелёк инициатора; проводки нет — паевой взнос остаётся паевым.
      Расходы участка из денег инициаторов на счёте 26 погашены раньше, при
      начислении возмещения по итогу периода.
