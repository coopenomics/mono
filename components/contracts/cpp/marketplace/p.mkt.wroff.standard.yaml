# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Утилизация скоропорта» — кооперативный процесс периодического
# списания имущества со склада КУ, не выданного первичному заказчику и
# подлежащего безвозвратному изъятию из кооператива (просроченный скоропорт,
# малооценочные позиции и т.п.).
#
# Процесс инициируется кроном на стороне Backend (раз в месяц по умолчанию,
# точная дата согласовывается с бухгалтером), формирует проект решения
# совета, совет принимает или отклоняет проект, при принятии срабатывает
# контрактное действие списания. Списание идёт **через транзит счёта 91
# «Прочие доходы и расходы»** — это фиксирует, что имущество безвозвратно
# исчезло из кооператива (а не передано пайщику).
#
# **Модель кошельков (упрощённая, refinement 2026-05-04):** процесс не
# двигает кошельки — это чисто бухгалтерское событие через проводки
# счёта 10 (учёт имущества), 91 (транзит) и 86 (ЦФ программы).
# Имущество отслеживается аналитикой по счёту 10 (per-КУ субсчета),
# без отдельного кошелька.
#
# Идентификация кошельков (для будущих расширений процесса) — eosio::name
# с префиксом w.<contract>.<waltype> (рефакторинг 2026-04-27 на ветке
# reports). Sentinel '' (пустая строка) — «кошелёк вне системы» для
# операций ACCOUNT_ONLY.
#
# В процессе участвуют 2 ledger2-операции (композитная проводка через
# транзит счёта 91 разбита на пару, срабатывают в одной транзакции execwroff):
#   • o.mkt.wroff   — часть 1: NONE Дт 91 / Кт 10 (выбытие со склада на «прочие»)
#   • o.mkt.wroff2  — часть 2: NONE Дт 86 / Кт 91 (закрытие транзита на ЦФ программы)
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# Источники правды в коде:
#   • cpp/marketplace/marketplace.hpp                 — actions (status: proposed)
#   • cpp/marketplace/src/writeoff/                   — реализация (предстоит)
#   • cpp/lib/core/ledger2/operations.hpp             — OPERATION_REGISTRY
#                                                       расширение o.mkt.wroff
#   • cpp/lib/core/ledger2/processes.hpp              — processes::marketplace::WRITEOFF
#   • cpp/lib/core/ledger2/accounts.hpp               — Целевое финансирование (86),
#                                                       Материалы (10),
#                                                       Прочие доходы и расходы (91 — NEW)
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.mkt.wroff
id: public_marketplace_writeoff_process
title: Утилизация скоропорта
slug: writeoff
status: proposed
contract: marketplace
purpose: >
  Штатный путь корректно отразить в учёте имущество, которое физически
  пропало или стало непригодным к выдаче. Применяется, когда товар на
  складе участка просрочился, испортился или иначе не может быть
  передан заказчику. Без этого процесса такие позиции висели бы на
  складе бесконечно — здесь кооператив честно фиксирует свои потери
  через решение совета.

  Процесс состоит из двух шагов. На первом шаге кооператив по расписанию
  (по умолчанию раз в месяц; точную дату согласовывает бухгалтер)
  собирает со складов участков позиции, удовлетворяющие критериям
  списания, формирует проект решения и выносит его на повестку совета.
  На втором шаге совет рассматривает проект и принимает решение:
  при положительном решении позиции списываются со складов как
  безвозвратные потери; при отрицательном — проект отклоняется или
  откладывается, а позиции остаются на складах. По кошелькам заказчиков
  движений не происходит — это чисто кооперативный учётный расход.
roles:
  - backend         # Backend Marketplace (крон-триггер, формирование проекта)
  - chairman        # председатель кооператива (вносит проект на повестку совета)
  - council         # совет кооператива (принимает решение по протоколу)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Имена actions ≤12 символов eosio::name.
actions:
  - name: marketplace::propwroff
    human: Внести проект списания
    actor: backend
    role: opener
    purpose: >
      Кооператив по расписанию (по умолчанию раз в месяц) собирает на
      складах участков позиции, которые невозможно выдать заказчику —
      просроченные и не востребованные, повреждённые, малооценные — и
      формирует проект решения о списании. Проект выносится на повестку
      совета.

  - name: marketplace::execwroff
    human: Исполнить списание
    actor: council
    role: closer
    purpose: >
      Совет принял положительное решение по проекту. Кооператив
      списывает позиции со складов участков — имущество уходит из учёта
      как безвозвратные потери. По кошелькам заказчиков движений нет.

  - name: marketplace::declwroff
    human: Отклонить проект списания
    actor: council
    role: reject
    purpose: >
      Совет отклонил проект списания либо отложил его рассмотрение.
      Позиции остаются на складах участков и попадут в следующий цикл
      списания.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: marketplace::writeoff_proposal (таблица writeoff_proposals,
# scope=coopname). Запись агрегирует список позиций, попавших в один цикл
# утилизации, и проходит свой жизненный цикл (draft → executed | rejected).
entity: marketplace::writeoff_proposal
entity_human: Проект списания скоропорта
entity_source: cpp/marketplace/src/writeoff/

states:
  - name: draft
    human: Проект сформирован
    description: >
      Кооператив сформировал список позиций к списанию и вынес проект
      решения на повестку совета. Ждёт рассмотрения советом.
    kind: normal

  - name: executed
    human: Списание исполнено
    description: >
      Совет принял положительное решение, кооператив списал позиции со
      складов участков. Имущество ушло из учёта как безвозвратные
      потери. По кошелькам заказчиков движений не было.
    kind: final

  - name: rejected
    human: Проект отклонён
    description: >
      Совет отклонил проект списания либо отложил его рассмотрение.
      Позиции остаются на складах участков и попадут в следующий цикл
      списания.
    kind: final

transitions:
  - from: "∅"
    to: draft
    action: marketplace::propwroff
    actor: backend
    guards:
      - Наступил регламентный срок очередного цикла списания.
      - На складах участков найдены позиции, удовлетворяющие критериям списания (просроченные, не выданные первичному заказчику, повреждённые, малооценные).

  - from: draft
    to: executed
    action: marketplace::execwroff
    actor: council
    ledger_code: p.mkt.wroff
    operations:
      - o.mkt.wroff
      - o.mkt.wroff2
    guards:
      - Совет принял положительное решение по проекту и оформил его протоколом.

  - from: draft
    to: rejected
    action: marketplace::declwroff
    actor: council
    guards:
      - Совет принял отрицательное решение по проекту либо не принял решение в установленный регламентом срок.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Формирование проекта списания
      actor: backend
      action: marketplace::propwroff
      description: >
        Кооператив по расписанию (по умолчанию раз в месяц, точная дата
        согласовывается с бухгалтером) опрашивает склады участков и
        собирает позиции, которые невозможно выдать заказчику:
        просроченные и не востребованные, повреждённые, малооценные.
        Сформированный список становится проектом решения и выносится
        на повестку совета.
      pre:
        - Наступил регламентный срок очередного цикла списания.
        - На складах участков найдены позиции, удовлетворяющие критериям списания.
      post:
        - Проект списания сформирован.
        - Проект вынесен на повестку совета.

    - step: 2
      title: Рассмотрение проекта советом
      actor: council
      action: marketplace::execwroff
      description: >
        Совет рассматривает проект — на очном заседании или в форме
        заочного голосования — и принимает решение, оформленное
        протоколом. При положительном решении кооператив списывает
        перечисленные в проекте позиции со складов участков. Имущество
        уходит из учёта как безвозвратные потери. По кошелькам
        заказчиков движений не происходит.
      pre:
        - Проект внесён на рассмотрение совета.
        - Совет принял положительное решение по проекту и оформил его протоколом.
      post:
        - Списание исполнено.
        - Списанные позиции ушли со складов участков.

  alternatives:
    - branch: Совет отклонил проект
      at_step: 2
      action: marketplace::declwroff
      actor: council
      description: >
        Совет отклонил проект списания (например, требуется
        дополнительная экспертиза) либо отложил его рассмотрение.
        Позиции остаются на складах участков и попадут в следующий цикл
        списания.

    - branch: Альтернатива — переуступка имущества по сниженной цене
      at_step: 1
      action: null
      actor: backend
      description: >
        Альтернативный путь для имущества, ещё пригодного к выдаче
        (например, накануне истечения срока годности): кооператив сам
        выступает поставщиком в новом предложении по сниженной цене и
        ставит имущество на следующий цикл отсечки заявок. В MVP только
        помечен; реализуется отдельным процессом в более поздней фазе.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# В процессе подписывается протокол решения совета (authorization), который
# является типовым документом совета и обслуживается через процесс
# sov.decision (повестка → голосование → протокол). Этот процесс
# напрямую не оформляет своих документов — только пункт повестки.
documents:
  - action: marketplace::execwroff
    title: Протокол решения совета о списании скоропорта
    registry_id: 0
    signed_by: [council_members]
    stored_in: "(authorization — параметр действия execwroff, обслуживается через sov.decision)"
    note: "TODO: использовать существующий шаблон протокола совета (sov.decision-протокол) с прикреплённым перечнем позиций; либо создать специализированный шаблон в cooptypes/cooperative/registry/<id>.MarketplaceWriteoffProtocol при необходимости отдельной формы."

# ── Секция 6. Операции (Ledger2) ────────────────────────────────────────────
# Одна ledger2-операция со СОСТАВНОЙ проводкой: транзит через счёт 91.
# В журнале это одна именованная операция; в бухгалтерии — две проводки
# (или одна составная). Реализация: в .cpp execwroff вызывает ledger2::apply
# дважды с одинаковым operation_id (или один раз с composite-record), так
# чтобы транзит через 91 был атомарным и не нарушал инвариантов
# Дт/Кт-баланса по 91. WalletOp ACCOUNT_ONLY — proposed расширение enum'а
# ledger2 для операций без движения по кошелькам.
operations:
  - ledger_code: o.mkt.wroff
    human_name: Утилизация скоропорта — выбытие со склада
    wallet_op: NONE                # NONE = только бухпроводка без движения по кошелькам
    # L1 — часть 1 композитной проводки: Дт 91 / Кт 10 (выбытие имущества
    # со склада на «прочие»). Закрытие транзита выполняется отдельной
    # операцией o.mkt.wroff2 (Дт 86 / Кт 91), атомарно с o.mkt.wroff
    # в той же транзакции execwroff (контракт вызывает обе последовательно).
    debit: 91                      # Прочие доходы и расходы (NEW)
    credit: 10                     # Материалы (NEW в LEDGER2_ACCOUNT_REGISTRY)
    # L2 — без перевода между кошельками кооператива
    wallet_from: null
    wallet_to: null
    # L3 — без движения по кошелькам пайщиков (чисто кооперативный расход)
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: writeoff_item.cost
    triggered_by: marketplace::execwroff
    description: >
      Списание имущества со склада КУ — часть 1 композитной бухгалтерской
      проводки через транзит счёта 91 «Прочие доходы и расходы». NONE —
      только бухпроводка Дт 91 / Кт 10, кошельки не двигаются. Сразу
      после этой операции в той же транзакции execwroff контракт вызывает
      o.mkt.wroff2 (Дт 86 / Кт 91, NONE) — закрытие транзита на счёт ЦФ
      программы. Применяется по каждой позиции из списка writeoff_proposal —
      может быть несколько последовательных пар в одной транзакции
      execwroff. Согласовано с Ангелиной 2026-04-27.

  - ledger_code: o.mkt.wroff2
    human_name: Утилизация скоропорта — закрытие транзита
    wallet_op: NONE
    # L1 — часть 2 композитной проводки: Дт 86 / Кт 91 (закрытие «прочих»
    # на счёт ЦФ программы).
    debit: 86                      # Целевое финансирование
    credit: 91                     # Прочие доходы и расходы (NEW)
    # L2 / L3 — без движения по кошелькам
    wallet_from: null
    wallet_to: null
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: writeoff_item.cost
    triggered_by: marketplace::execwroff
    description: >
      Закрытие транзита счёта 91 после выбытия имущества со склада. NONE —
      только бухпроводка Дт 86 / Кт 91, кошельки не двигаются. Срабатывает
      атомарно с o.mkt.wroff в той же транзакции execwroff. По итогу пары
      operations нетто-эффект — Дт 86 / Кт 10 (закрытие ЦФ программы +
      выбытие имущества со склада), 91 проходит нулевым транзитом.

