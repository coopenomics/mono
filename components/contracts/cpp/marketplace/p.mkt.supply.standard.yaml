# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Прямая поставка-приобретение имущества» — кооперативный процесс,
# при котором поставщик-пайщик передаёт имущество кооперативу, а заказчик-
# пайщик получает его в счёт членского взноса по ЦПП «Стол заказов».
#
# Это базовый процесс контракта Marketplace в режиме членских взносов
# (закупка имущества кооперативом + потребление пайщиком). Содержит
# атомарную серию операций по программному кошельку при создании заказа,
# цикл отсечки заявок поставщика, двухвариантную модель передачи партии
# на участок (самовывоз или через экспедитора), двойные подписи на двух
# актах приёма-передачи — приёмки кооперативом от поставщика и выдачи
# заказчику от кооператива.
#
# **Модель кошельков (refinement 2026-05-04, трёхуровневая серия):**
# Членский взнос пайщика проходит через два кошелька:
#   • w.wal.member  (контракт wallet, USER_SHARED) — универсальный членский
#                   кошелёк пайщика. Сюда стекаются возвраты из всех
#                   программ (Стол заказов / Благорост / и т.п.); пайщик
#                   тратит как «баллы» — может направить на следующий заказ
#                   в любой программе либо вывести обратно на паевой через
#                   операцию контракта wallet.
#   • w.mkt.member  (контракт marketplace, USER_SHARED) — членский в
#                   программе Marketplace. На нём лежит «свободный» остаток
#                   программы; средства под конкретный Order переводятся
#                   на отдельный кошелёк-резерв w.mkt.order.
#   • w.mkt.order   (контракт marketplace, USER_SHARED) — резерв средств
#                   пайщика под конкретный Order. Сюда уходят средства
#                   при создании заказа (createorder) и отсюда возвращаются
#                   обратно на w.mkt.member при отмене/истечении заказа,
#                   либо сжигаются при выдаче имущества (signiss2).
# Платформенные кошельки w.wal.share (Цифровой Кошелёк, паевые деньгами) и
# w.mkt.payout (Выплаты поставщикам) — без изменений. Имущество
# отслеживается бухгалтерской аналитикой по счёту 10 (per-КУ субсчета),
# без отдельного кошелька.
#
# Идентификация кошельков — eosio::name с префиксом w.<contract>.<waltype>
# (рефакторинг 2026-04-27 на ветке reports). null для незатронутых уровней;
# sentinel '' — legacy-допуск (рендерится как ∅).
#
# В процессе участвуют 9 ledger2-операций (часть — из контракта wallet):
#   • o.wal.conv   — конвертация цифрового рубля → общий членский пайщика
#                     (TRANSFER, w.wal.share → w.wal.member,
#                      Дт 80 / Кт 86) — conditional, только если на
#                     w.wal.member.available заказчика не хватает
#   • o.mkt.assign   — целевое назначение членского взноса в программу
#                     (TRANSFER, w.wal.member → w.mkt.member, без проводки —
#                      Дт=Кт по 86 смарт-контракт игнорирует) — conditional,
#                     только если на w.mkt.member.available не хватает
#   • o.mkt.block  — резервирование средств под Order
#                     (TRANSFER, w.mkt.member → w.mkt.order, без проводки —
#                      оба на 86)
#   • o.mkt.unblk  — снятие резерва при отмене Order'а
#                     (TRANSFER, w.mkt.order → w.mkt.member, без проводки;
#                      средства возвращаются на w.mkt.member.available
#                      и могут быть потрачены на следующий заказ)
#   • o.mkt.recall  — вывод из программы в общий членский кошелёк пайщика
#                     (TRANSFER, w.mkt.member → w.wal.member, без проводки) —
#                     ОТДЕЛЬНОЕ явное действие пайщика, не часть авто-flow
#                     отмены/возврата
#   • o.mkt.purch   — приёмка имущества кооперативом по АПП приёмки
#                     (ACCOUNT_ONLY, только проводка, Дт 10 / Кт 86)
#   • o.mkt.payout  — оплата поставщику с расчётного счёта
#                     (TRANSFER, ∅ → w.mkt.payout, Дт 86 / Кт 51)
#   • o.mkt.consum  — выдача имущества пайщику по АПП выдачи, часть 1
#                     (BURN с w.mkt.order — сжигание резерва, Дт 91 / Кт 10 —
#                      выбытие имущества со склада на «прочие»)
#   • o.mkt.consum2  — выдача имущества пайщику, часть 2 — закрытие транзита
#                     (NONE, Дт 86 / Кт 91; кошельки не двигаются).
#                     Атомарно с o.mkt.consum в signiss2 — обе операции
#                     вызываются последовательно в одной транзакции Antelope.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# Источники правды в коде:
#   • cpp/marketplace/marketplace.hpp                 — actions (status: proposed)
#   • cpp/marketplace/src/                            — реализация (предстоит)
#   • cpp/lib/core/ledger2/operations.hpp             — OPERATION_REGISTRY (расширение)
#   • cpp/lib/core/ledger2/processes.hpp              — processes::marketplace::SUPPLY
#   • cpp/lib/core/ledger2/wallets.hpp                — w.wal.member (universal member, contract wallet),
#                                                       w.mkt.member (programmatic per-user),
#                                                       w.mkt.order  (программный резерв под Order),
#                                                       w.wal.share (платформенный),
#                                                       w.mkt.payout (платформенный)
#   • cpp/lib/core/ledger2/accounts.hpp               — Расчётный (51),
#                                                       Паевой фонд (80),
#                                                       Целевое финансирование (86),
#                                                       Материалы (10 — NEW),
#                                                       Прочие доходы и расходы (91 — NEW,
#                                                       транзит при выдаче o.mkt.consum)
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.mkt.supply
id: public_marketplace_supply_process
title: Прямая поставка-приобретение имущества
slug: supply
status: proposed
contract: marketplace
purpose: >
  Базовый процесс «Стола заказов»: пайщик-заказчик выбирает у пайщика-
  поставщика имущество, направляет на этот заказ свой членский взнос,
  кооператив принимает имущество на склад участка и затем выдаёт его
  заказчику. Процесс описывает весь путь — от размещения заказа до
  передачи имущества на руки заказчику.

  Как это устроено по шагам.

  Поставщик-пайщик публикует предложение поставить имущество — в нём
  он указывает товар, цену, минимальное количество, при котором ему
  выгодно собрать партию, и срок, до которого собирает заказы. Это
  предложение и есть исходная точка процесса.

  Пока предложение открыто, заказчики-пайщики добавляют к нему свои
  заказы. Этот период называется циклом отсечки заявок — окно, в
  течение которого кооператив принимает заказы под одно предложение
  поставщика. При создании заказа кооператив резервирует средства
  заказчика на программном членском кошельке Стола заказов — до конца
  цикла они не могут быть использованы.

  Когда цикл завершается, кооператив смотрит, набрался ли минимальный
  порог поставки — заданное поставщиком количество заказов, при
  котором партию имеет смысл везти. Если порог набрался — все заказы
  цикла объединяются в одну консолидированную заявку, и она уходит
  поставщику на акцепт. Если не набрался — все заказы цикла
  отменяются, резерв со средств заказчиков снимается.

  Поставщик соглашается выполнить консолидированную заявку, готовит
  партию и передаёт её на кооперативный участок. Приёмка оформляется
  актом приёма-передачи с двойной подписью: первой — поставщик
  подтверждает передачу, второй — председатель участка подтверждает
  приёмку. С этого момента кооператив юридически принял имущество,
  поставщику уходит оплата.

  Дальше председатель открывает выдачу, заказчик приходит на пункт
  выдачи участка. Выдача оформляется отдельным актом приёма-передачи
  также с двойной подписью: первой — председатель подтверждает
  передачу имущества заказчику, финальной — заказчик подтверждает
  приёмку. Заказ закрыт, начинается гарантийное окно.
roles:
  - orderer        # пайщик-заказчик
  - offerer        # пайщик-поставщик
  - chairman        # председатель кооперативного участка (КУ-приёмщик/КУ-выдающий)
  - backend         # Backend Marketplace (внеблокчейн-логика)
  - gateway         # Контракт процессинга платежей (источник callback'ов о выплате; не человек, а контракт-инициатор)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Имена actions ≤12 символов eosio::name. Контракт описан в целевом виде —
# реализация в .cpp предстоит после согласования стандарта.
actions:
  - name: marketplace::createorder
    human: Создать заказ
    actor: orderer
    role: opener
    purpose: >
      Заказчик размещает заказ на товар из каталога: указывает количество
      и кооперативный участок, на котором заберёт товар. Кооператив
      резервирует средства заказчика под этот заказ — до окончания цикла
      поставки они не могут быть использованы. Заказ становится частью
      консолидированной заявки поставщику.

  - name: marketplace::cancelorder
    human: Отменить заказ
    actor: orderer
    role: progress
    purpose: >
      Заказчик отменяет заказ до того, как поставщик принял
      консолидированную заявку в работу. Кооператив снимает резерв со
      средств — заказчик снова свободно ими распоряжается в рамках
      программы.

  - name: marketplace::expirecycle
    human: Закрыть цикл отсечки заявок
    actor: backend
    role: progress
    purpose: >
      Цикл отсечки заявок поставщика завершается. Кооператив сверяет
      количество заказов с минимальным порогом поставки, заданным
      поставщиком. Если порог набрался — заказы объединяются в
      консолидированную заявку и направляются поставщику для акцепта.
      Если порог не набрался — все заказы цикла отменяются, резерв со
      средств заказчиков снимается.

  - name: marketplace::acceptbatch
    human: Акцептовать консолидированную заявку
    actor: offerer
    role: progress
    purpose: >
      Поставщик соглашается выполнить консолидированную заявку и берёт
      на себя обязательство собрать и передать партию кооперативу.
      Заказы переходят от ожидания к подготовке отгрузки.

  - name: marketplace::declinebatch
    human: Отказаться от консолидированной заявки
    actor: offerer
    role: reject
    purpose: >
      Поставщик отказывается выполнить консолидированную заявку. Все
      заказы партии отменяются, резерв со средств заказчиков снимается.
      Договорные санкции при отказе — вне этого процесса, по регламенту
      кооператива.

  - name: marketplace::prepship
    human: Собрать партию к отгрузке
    actor: offerer
    role: progress
    purpose: >
      Поставщик собирает партию: распределяет заказы по кооперативным
      участкам и выбирает способ доставки — везёт сам или передаёт через
      экспедитора. Состав партии должен в точности соответствовать тому,
      что поставщик акцептовал: заменять или подменять позиции запрещено
      (жёсткий акцепт).

  - name: marketplace::signsupp
    human: Поставщик передал партию
    actor: offerer
    role: progress
    purpose: >
      Поставщик первой подписью на акте приёма-передачи подтверждает,
      что передал партию кооперативу. Имущество физически на складе
      участка, но юридически ещё не оприходовано — выдача заказчикам
      открывается только после второй подписи председателя.

  - name: marketplace::signchair
    human: Председатель принял поставку
    actor: chairman
    role: progress
    purpose: >
      Председатель участка ставит вторую — завершающую — подпись на
      акте приёма-передачи. С этого момента партия юридически принята
      кооперативом, имущество приходуется на склад участка и становится
      доступным к выдаче заказчикам, а у кооператива возникает обязательство
      выплатить поставщику. Сама выплата — отдельным шагом по факту
      подтверждения кассиром банковского перевода.

  - name: marketplace::payout
    human: Инициировать выплату поставщику
    actor: backend
    role: progress
    purpose: >
      Кооператив регистрирует исходящий платёж поставщику в системе
      процессинга (контракт gateway). По этому запросу кассир увидит у
      себя в столе задачу — провести банковский перевод. Бухгалтерия
      по выплате на этом шаге ещё не двигается: обязательство перед
      поставщиком остаётся открытым до подтверждения кассиром.

  - name: marketplace::payconfirm
    human: Выплата поставщику подтверждена
    actor: gateway
    role: progress
    purpose: >
      Кассир подтвердил факт реального банковского перевода поставщику
      (через свой стол в gateway). Контракт процессинга вызывает callback
      сюда — обязательство перед поставщиком закрывается, расход целевых
      средств с расчётного счёта отражается в бухгалтерии. Статус заказа
      не меняется — выплата шла параллельно шагам выдачи.

  - name: marketplace::paydecline
    human: Выплата поставщику отклонена
    actor: gateway
    role: reject
    purpose: >
      Кассир отметил в столе процессинга, что банковский перевод
      поставщику не состоялся — нет реквизитов, ошибка ввода, банк
      отклонил. Контракт процессинга вызывает callback сюда — обязательство
      перед поставщиком остаётся открытым, причина сохраняется. Кооператив
      может повторно инициировать выплату после исправления реквизитов.

  - name: marketplace::signiss1
    human: Председатель открыл выдачу
    actor: chairman
    role: progress
    purpose: >
      Председатель открывает выдачу: подтверждает, что готов передать
      имущество заказчику. Заказ становится готов к получению на пункте
      выдачи участка.

  - name: marketplace::signiss2
    human: Заказчик получил имущество
    actor: orderer
    role: closer
    purpose: >
      Заказчик пришёл на пункт выдачи и финальной подписью на акте
      выдачи забрал свой заказ. Если фактически выданное расходится с
      заказом — сумма заранее корректируется до фактического: при
      меньшем количестве остаток возвращается на программный членский
      кошелёк, при большем — недостающая сумма берётся с паевого
      заказчика. Заказ закрыт, открывается гарантийное окно.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: marketplace::order (таблица orders, scope=coopname).
# Граф спрямлён: статус pending_offerer_sign модели B описан в сценарии,
# в графе сворачивается в supply_prepared с разными путями входа.
entity: marketplace::order
entity_human: Заказ на поставку
entity_source: cpp/marketplace/src/

states:
  - name: active
    human: Заказ размещён
    description: >
      Заказ создан и ждёт завершения цикла отсечки заявок и акцепта
      поставщика. Средства заказчика зарезервированы под этот заказ на
      программном членском кошельке Стола заказов.
    kind: normal

  - name: cancelled
    human: Заказ отменён
    description: >
      Заказ отменён по одному из трёх оснований: заказчиком до акцепта,
      кооперативом по итогам закрытия цикла без достижения минимального
      порога поставки, поставщиком при отказе от консолидированной
      заявки. Во всех трёх случаях резерв со средств заказчика снимается,
      и заказчик снова свободно ими распоряжается в рамках программы.
    kind: final

  - name: accepted
    human: Заявка акцептована
    description: >
      Поставщик согласился выполнить консолидированную заявку. Средства
      заказчика по-прежнему зарезервированы; поставщик готовит партию к
      отгрузке.
    kind: normal

  - name: ship_ready
    human: Партия собрана к отгрузке
    description: >
      Поставщик собрал партию точно по составу акцептованной заявки и
      выбрал способ доставки на участок — самовывоз или через
      экспедитора. Имущество ещё не передано кооперативу.
    kind: normal

  - name: supply_prepared
    human: Имущество поставлено
    description: >
      Поставщик передал партию на участок и подтвердил это первой
      подписью на акте приёма-передачи. Имущество физически на складе
      участка, но юридически ещё не оприходовано — выдача заказчикам
      откроется только после второй подписи председателя.
    kind: normal

  - name: accepted_to_coop
    human: Поставка принята кооперативом
    description: >
      Председатель участка завершил приёмку второй подписью. Партия
      юридически принята кооперативом, имущество числится на складе
      участка и ждёт открытия выдачи. Обязательство выплаты поставщику
      открыто и закрывается отдельным действием `marketplace::payout` по
      факту подтверждения кассиром банковского перевода (Locked Decision L12).
    kind: normal

  - name: ready_to_receive
    human: Заказ готов к выдаче
    description: >
      Председатель открыл выдачу. Имущество готово к передаче заказчику
      на пункте выдачи участка.
    kind: normal

  - name: received
    human: Имущество выдано
    description: >
      Заказчик получил имущество, заказ закрыт. Открыто гарантийное
      окно — в его пределах заказчик может подать заявление на возврат,
      если товар окажется некондиционным.
    kind: final

transitions:
  - from: "∅"
    to: active
    action: marketplace::createorder
    actor: orderer
    ledger_code: p.mkt.supply
    operations:
      - o.wal.conv
      - o.mkt.assign
      - o.mkt.block
    guards:
      - Заказчик — активный пайщик кооператива.
      - Заказчик подписал Соглашение ЦПП «Стол заказов».
      - Стоимость заказа не превышает упрощённый порог приёма имущества (100 000 ₽).
      - Совокупных средств заказчика — на паевом и членских кошельках — достаточно для полной стоимости заказа.
      - Указанный пункт выдачи принадлежит тому же кооперативу.

  - from: active
    to: cancelled
    action: marketplace::cancelorder
    actor: orderer
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.unblk
    guards:
      - Заказ ещё не вошёл в акцептованную поставщиком консолидированную заявку.

  - from: active
    to: cancelled
    action: marketplace::expirecycle
    actor: backend
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.unblk
    guards:
      - Цикл отсечки заявок поставщика завершился.
      - Минимальный порог поставки по количеству заказов не достигнут.

  - from: active
    to: accepted
    action: marketplace::acceptbatch
    actor: offerer
    guards:
      - Минимальный порог поставки достигнут к концу цикла отсечки.
      - Действие выполняет тот поставщик, чьё предложение лежит в основе консолидированной заявки.

  - from: active
    to: cancelled
    action: marketplace::declinebatch
    actor: offerer
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.unblk
    guards:
      - Поставщик ещё не акцептовал консолидированную заявку.

  - from: accepted
    to: ship_ready
    action: marketplace::prepship
    actor: offerer
    guards:
      - Состав отгрузки в точности равен составу акцептованной заявки (жёсткий акцепт; замены номенклатуры запрещены).
      - Поставщик выбрал способ доставки на участок — самовывоз или через экспедитора.

  - from: ship_ready
    to: supply_prepared
    action: marketplace::signsupp
    actor: offerer
    guards:
      - На участок передана партия точно в составе акцептованной заявки — самовывозом поставщика или через экспедитора.
      - При самовывозе поставщик ставит первую подпись на акте приёма-передачи лично на участке.
      - При доставке через экспедитора председатель и экспедитор очно сверяют партию, и поставщик ставит первую подпись дистанционно в установленный кооперативом срок.

  - from: supply_prepared
    to: accepted_to_coop
    action: marketplace::signchair
    actor: chairman
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.purch
    guards:
      - На акте приёма-передачи имеется первая подпись поставщика.
      - Действие выполняет председатель того участка, который принимает поставку.

  # Lazy выплата поставщику через контракт gateway (Locked Decision L12;
  # E11 техдолг 598-16). Триплет: инициация → callback подтверждения /
  # callback отказа. Графа состояний Order'а сама по себе не меняется —
  # выплата идёт параллельно шагам выдачи; всё описано на под-графе
  # `order.payout_status` (none → pending → completed | declined → pending).
  - from: accepted_to_coop
    to: accepted_to_coop
    action: marketplace::payout
    actor: backend
    guards:
      - Приёмка поставки кооперативом завершена (signchair выполнен).
      - Выплата по этому заказу не находится в процессе и не закрыта (`order.payout_status ∈ { none, declined }`).

  - from: accepted_to_coop
    to: accepted_to_coop
    action: marketplace::payconfirm
    actor: gateway
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.payout
    guards:
      - Callback инициирован контрактом gateway (`require_auth(_gateway)`).
      - Order находится в ожидании подтверждения выплаты (`order.payout_status == pending`).

  - from: accepted_to_coop
    to: accepted_to_coop
    action: marketplace::paydecline
    actor: gateway
    guards:
      - Callback инициирован контрактом gateway (`require_auth(_gateway)`).
      - Order находится в ожидании подтверждения выплаты (`order.payout_status == pending`).

  - from: accepted_to_coop
    to: ready_to_receive
    action: marketplace::signiss1
    actor: chairman
    guards:
      - Партия принята кооперативом и числится на складе участка.

  - from: ready_to_receive
    to: received
    action: marketplace::signiss2
    actor: orderer
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.consum
      - o.mkt.consum2
    guards:
      - Заказчик лично присутствует на пункте выдачи участка.
      - Председатель сверил фактически выдаваемое имущество с составом заказа.
      - При расхождении факта с заказом сумма заказа предварительно скорректирована до фактической в пределах допустимого регламентом отклонения.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Создание заказа
      actor: orderer
      action: marketplace::createorder
      description: >
        Заказчик выбирает позицию из каталога своего кооператива,
        указывает количество и пункт выдачи на участке, на котором
        заберёт товар. Кооператив проверяет, что стоимость заказа не
        превышает упрощённый порог приёма имущества, и резервирует под
        этот заказ необходимую сумму со средств заказчика. Заказ
        присоединяется к текущему циклу отсечки заявок поставщика.
      pre:
        - Заказчик — активный пайщик кооператива.
        - Заказчик подписал Соглашение ЦПП «Стол заказов».
        - Совокупных средств заказчика — на паевом и членских кошельках — достаточно.
        - Стоимость заказа не превышает упрощённый порог приёма имущества.
      post:
        - Заказ размещён и активен.
        - Средства заказчика зарезервированы под заказ.

    - step: 2
      title: Закрытие цикла отсечки заявок
      actor: backend
      action: marketplace::expirecycle
      description: >
        Цикл отсечки заявок завершается. Кооператив сверяет количество
        собранных заказов с минимальным порогом поставки, заданным
        поставщиком. Если порог набрался — заказы объединяются в
        консолидированную заявку и направляются поставщику для акцепта.
        Если порог не набрался — все заказы цикла отменяются, резерв со
        средств заказчиков снимается.
      pre:
        - Цикл отсечки заявок поставщика завершился.
      post:
        - При достижении порога — заказы активны, поставщику направлена консолидированная заявка.
        - При недостижении порога — заказы отменены, резерв со средств снят.

    - step: 3
      title: Акцепт консолидированной заявки
      actor: offerer
      action: marketplace::acceptbatch
      description: >
        Поставщик видит консолидированную заявку и подтверждает её к
        исполнению. С этого момента он принимает на себя обязательство
        собрать и передать партию кооперативу.
      pre:
        - Минимальный порог поставки достигнут.
        - Действие выполняет тот поставщик, чьё предложение лежит в основе консолидированной заявки.
      post:
        - Заказы партии перешли к подготовке отгрузки.

    - step: 4
      title: Подготовка партии к отгрузке
      actor: offerer
      action: marketplace::prepship
      description: >
        Поставщик собирает партию по составу акцептованной заявки —
        точно в той же номенклатуре, без замен — и выбирает способ
        доставки на участок: самовывоз или через экспедитора.
      pre:
        - Заявка акцептована поставщиком.
        - Состав партии в точности соответствует составу акцепта.
      post:
        - Партия собрана к отгрузке.
        - Способ доставки выбран.

    - step: 5
      title: Передача партии на участок
      actor: offerer
      action: marketplace::signsupp
      description: >
        Поставщик передаёт партию кооперативу. При самовывозе он лично
        сдаёт партию председателю и очно ставит первую подпись на акте
        приёмки-передачи. При доставке через экспедитора председатель и
        экспедитор очно сверяют груз с составом партии, и по итогам этой
        сверки поставщик ставит первую подпись дистанционно в
        установленный кооперативом срок. В обоих случаях имущество уже
        физически на складе участка, но юридически ещё не оприходовано —
        выдача заказчикам пока не открыта.
      pre:
        - Партия собрана к отгрузке.
        - Состав акта приёма-передачи в точности соответствует составу акцептованной заявки.
      post:
        - Имущество поставлено, первая подпись на акте приёма-передачи поставлена.
        - Выдача заказчикам не открыта до второй подписи председателя.

    - step: 6
      title: Приёмка поставки председателем
      actor: chairman
      action: marketplace::signchair
      description: >
        Председатель участка ставит вторую — завершающую — подпись на
        акте приёма-передачи. С этого момента партия юридически принята
        кооперативом, имущество приходуется на склад участка, у кооператива
        возникает обязательство выплатить поставщику. Сама выплата —
        отдельным шагом по факту подтверждения кассиром банковского
        перевода (Locked Decision L12).
      pre:
        - На акте приёма-передачи имеется первая подпись поставщика.
        - Действие выполняет председатель того участка, который принимает поставку.
      post:
        - Поставка принята кооперативом.
        - Обязательство выплаты поставщику открыто и ждёт фактического банковского перевода.

    - step: 6a
      title: Инициация выплаты поставщику
      actor: backend
      action: marketplace::payout
      description: >
        Кооператив через свой backend регистрирует исходящий платёж
        поставщику в контракте gateway. У кассира появляется задача в
        столе процессинга. Бухгалтерия по выплате на этом шаге не
        двигается — обязательство перед поставщиком остаётся открытым
        вплоть до подтверждения банковского перевода кассиром.
      pre:
        - Поставка принята кооперативом (приёмка завершена).
        - Выплата по этому заказу не в процессе и не завершена.
      post:
        - В контракте gateway появилась запись об исходящем платеже со статусом pending.
        - Заказ помечен как «выплата ожидает подтверждения».

    - step: 6b
      title: Подтверждение выплаты поставщику
      actor: gateway
      action: marketplace::payconfirm
      description: >
        Кассир провёл реальный банковский перевод поставщику и
        подтвердил это в столе процессинга. Контракт gateway вызывает
        callback в контракт marketplace, и кооператив фиксирует
        выплату — обязательство перед поставщиком закрывается, расход
        целевых средств с расчётного счёта отражается в бухгалтерии.
      pre:
        - В контракте gateway зарегистрирован исходящий платёж в статусе pending.
        - Кассир подтвердил фактический банковский перевод поставщику.
      post:
        - Обязательство выплаты поставщику закрыто.
        - Заказ помечен как «выплата проведена».

    - step: 7
      title: Открытие выдачи
      actor: chairman
      action: marketplace::signiss1
      description: >
        Председатель открывает выдачу первой подписью на акте
        приёма-передачи. Заказ становится готов к получению на пункте
        выдачи участка.
      pre:
        - Поставка принята кооперативом.
        - Имущество числится на складе участка.
      post:
        - Заказ готов к выдаче.

    - step: 8
      title: Выдача заказа
      actor: orderer
      action: marketplace::signiss2
      description: >
        Заказчик приходит на пункт выдачи участка. Председатель сверяет
        фактически выдаваемое имущество с составом заказа. Если факт
        совпадает с заказом — выдача проходит без корректировок. При
        расхождении (например, развесной товар: фактический вес меньше
        заказанного) сумма заказа предварительно корректируется до
        фактической: при меньшем количестве остаток возвращается на
        программный членский кошелёк заказчика, при большем — недостающая
        сумма берётся с паевого заказчика. Заказчик ставит финальную
        подпись на акте приёма-передачи и забирает заказ.
      pre:
        - Заказ готов к выдаче.
        - Заказчик лично присутствует на пункте выдачи.
      post:
        - Имущество выдано заказчику.
        - Заказ закрыт.
        - Гарантийное окно открыто — в его пределах заказчик может подать заявление на возврат.

  alternatives:
    - branch: Отмена заказчиком до акцепта
      at_step: 2
      action: marketplace::cancelorder
      actor: orderer
      description: >
        Заказчик отменяет заказ до того, как поставщик принял
        консолидированную заявку. Кооператив снимает резерв со средств,
        и заказчик снова свободно ими распоряжается в рамках программы.

    - branch: Цикл закрыт без достижения порога
      at_step: 2
      action: marketplace::expirecycle
      actor: backend
      description: >
        Цикл отсечки заявок завершился, но минимальный порог поставки
        по количеству заказов не достигнут. Все заказы цикла отменяются,
        резерв со средств заказчиков снимается.

    - branch: Отказ поставщика от консолидированной заявки
      at_step: 3
      action: marketplace::declinebatch
      actor: offerer
      description: >
        Поставщик отказывается выполнить консолидированную заявку до её
        акцепта. Все заказы партии отменяются, резерв со средств
        заказчиков снимается. Договорные санкции при отказе — вне этого
        процесса, по регламенту кооператива.

    - branch: Кассир отклонил банковский перевод поставщику
      at_step: 6b
      action: marketplace::paydecline
      actor: gateway
      description: >
        Кассир в столе процессинга отметил, что банковский перевод
        поставщику не состоялся — нет реквизитов, ошибка ввода, банк
        отклонил. Контракт gateway callback'ом дёргает контракт
        marketplace. Бухгалтерия не двигается — обязательство перед
        поставщиком остаётся открытым с сохранением причины отказа.
        Backend может повторно инициировать выплату после исправления
        реквизитов (`marketplace::payout` ещё раз).

    - branch: Передача партии через экспедитора
      at_step: 5
      action: marketplace::signsupp
      actor: offerer
      description: >
        Партия доставлена на участок через экспедитора. Председатель и
        экспедитор очно сверяют груз с составом партии. При расхождении
        председатель фиксирует фактический состав, экспедитор
        подтверждает это своей подписью на сопроводительных документах.
        По итогам очной сверки поставщик дистанционно ставит первую
        подпись на акте приёма-передачи в установленный кооперативом
        срок. Дальнейшие шаги — как при самовывозе.

    - branch: Поставщик не подписал акт приёма-передачи в срок
      at_step: 5
      action: null
      actor: offerer
      description: >
        Поставщик не поставил дистанционную первую подпись на акте
        приёмки-передачи в установленный срок. Выдача заказчикам не
        открывается; дальнейшее решение — по регламенту кооператива
        (досверка, перепоставка, претензия).

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# В процессе подписываются два юридически значимых документа: АПП приёмки
# (двойная подпись поставщик → председатель) и АПП выдачи (двойная подпись
# председатель → заказчик). Дополнительно в модели B печатается и подписывается
# бумажная ТТН (вне блокчейна) с фотофиксацией для целей дистанционной ЭЦП
# поставщика. Соглашение ЦПП «Стол заказов» подписывается ОДНОКРАТНО при
# первом входе пайщика и относится к процессу подключения к ЦПП (не входит
# в этот процесс).
documents:
  - action: marketplace::signsupp
    title: АПП приёмки имущества кооперативом (первая подпись поставщика)
    registry_id: 702
    signed_by: [offerer]
    stored_in: orders.acceptance_act
    note: "Используется существующий шаблон 702.AssetContributionAct из cooptypes/cooperative/registry/. Оригинально создан под клиринговую модель donor'а; форма акта приёма имущества кооперативом структурно подходит и для членской модели. При необходимости методолог может создать специализированный шаблон в новой серии (1100+) — тогда registry_id обновится."

  - action: marketplace::signchair
    title: АПП приёмки имущества кооперативом (финальная подпись председателя)
    registry_id: 702
    signed_by: [chairman]
    stored_in: orders.acceptance_act
    note: "Тот же шаблон что у signsupp (registry_id 702). Контракт verify_document_or_fail дополняет вторую подпись на тот же АПП."

  - action: marketplace::signiss1
    title: АПП выдачи имущества пайщику (первая подпись председателя)
    registry_id: 802
    signed_by: [chairman]
    stored_in: orders.issue_act
    note: "Используется существующий шаблон 802.ReturnByAssetAct из cooptypes/cooperative/registry/. Оригинально создан под клиринговую модель «возврат паевого взноса имуществом»; форма акта передачи имущества от кооператива пайщику структурно подходит и для членской модели выдачи. При необходимости методолог может создать специализированный шаблон."

  - action: marketplace::signiss2
    title: АПП выдачи имущества пайщику (финальная подпись заказчика)
    registry_id: 802
    signed_by: [orderer]
    stored_in: orders.issue_act
    note: "Тот же шаблон что у signiss1 (registry_id 802)."

  - action: marketplace::prepship
    title: Товарно-транспортная накладная (при доставке через экспедитора)
    registry_id: 0
    signed_by: [offerer, chairman, expediter]
    stored_in: shipments.ttn_pdf
    note: "TODO: создать шаблон ТТН в registry. При самовывозе не используется. Подписи проставляются вне блокчейна (на бумажном носителе); фотофиксация председателя по результатам очной сверки сохраняется как основание для дистанционной подписи поставщика."

# ── Секция 6. Операции (Ledger2) ────────────────────────────────────────────
# Восемь ledger2-операций для процесса прямой поставки-приобретения. Имена
# ≤12 символов eosio::name. Кошельки идентифицируются eosio::name-строками
# с префиксом w.<contract>.<waltype> (рефакторинг 2026-04-27, ветка reports):
#   • w.wal.member  — Универсальный членский кошелёк пайщика (контракт wallet,
#                     USER_SHARED). Сюда стекаются возвраты из всех программ;
#                     пайщик расходует «как баллы» в любую программу.
#   • w.mkt.member  — ЦПП «Стол Заказов» — членский в программе (USER_SHARED).
#                     Хранит свободный остаток членского пайщика в программе.
#   • w.mkt.order   — ЦПП «Стол Заказов» — резерв средств пайщика под
#                     конкретный Order (USER_SHARED). Сюда переводятся
#                     средства на createorder; обратно — на cancel/expire/
#                     decline; сжигаются BURN'ом на signiss2.
#   • w.wal.share   — ЦПП «Цифровой Кошелёк» — паевые взносы деньгами
#                     [платформенный]
#   • w.mkt.payout  — Выплаты поставщикам
#                     [платформенный]
# null — для незатронутого уровня; sentinel '' — legacy-допуск (∅ в UI).
operations:
  - ledger_code: o.wal.conv
    human_name: Конвертация паевого в членский взнос пайщика
    wallet_op: TRANSFER
    # L1 — двойная запись (паевой → целевой)
    debit: 80                      # Паевой фонд
    credit: 86                     # Целевое финансирование (общий членский пайщика)
    # L2 — кошельки кооператива (агрегаты)
    wallet_from: w.wal.share       # ЦПП «Цифровой Кошелёк» — паевые взносы деньгами
    wallet_to: w.wal.member        # Универсальный членский — общий членский кошелёк пайщика
    # L3 — две стороны движения у одного и того же пайщика
    l3:
      - user_wallet: w.wal.share
        user_ref: order.orderer
        available_delta: -order.total_cost
        blocked_delta: null
      - user_wallet: w.wal.member
        user_ref: order.orderer
        available_delta: +order.total_cost
        blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::createorder
    description: >
      Шаг 1 из 3 серии createorder (conditional — выполняется только если на
      w.wal.member.available заказчика не хватает суммы заказа). Конвертация
      цифрового рубля заказчика из ЦПП «Цифровой Кошелёк» в общий членский
      кошелёк пайщика — универсальную точку накопления членских взносов
      между программами. Сумма берётся ровно как недостача — если на
      w.wal.member уже есть available (например, из прошлого возврата),
      конвертируется только разница. Двойная запись Дт 80 / Кт 86 — переход
      из складочного капитала в целевое финансирование. (TBD-Standardization:
      проводка фиксируется как baseline.)

  - ledger_code: o.mkt.assign
    human_name: Целевое назначение членского взноса в программу Marketplace
    wallet_op: TRANSFER
    # L1 — нет проводки. По плану счетов оба кошелька висят на 86, и Дт 86 /
    # Кт 86 даёт нетто-нулевое изменение по счёту — смарт-контракт такие
    # «фиктивные» проводки игнорирует. Аналитика «по программе» фиксируется
    # на L2 (через имена агрегатных кошельков) — этого достаточно.
    debit: null
    credit: null
    # L2 — реальный перевод между двумя именованными агрегатами кооператива
    wallet_from: w.wal.member      # Общий членский — пайщик расходует
    wallet_to: w.mkt.member        # ЦПП «Стол Заказов» — целевое назначение в программу
    # L3 — две стороны движения у одного и того же пайщика
    l3:
      - user_wallet: w.wal.member
        user_ref: order.orderer
        available_delta: -order.total_cost
        blocked_delta: null
      - user_wallet: w.mkt.member
        user_ref: order.orderer
        available_delta: +order.total_cost
        blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::createorder
    description: >
      Шаг 2 из 3 серии createorder (conditional — выполняется только если на
      w.mkt.member.available заказчика не хватает суммы заказа). Перенос
      членского взноса пайщика из универсального кошелька (w.wal.member)
      в программу Marketplace (w.mkt.member). Сумма берётся ровно как
      недостача. По бухгалтерии — без проводки (Дт=Кт по 86 нетто-нулевое
      изменение, смарт-контракт такие фиктивные проводки игнорирует);
      аналитика «по программе» фиксируется на L2/L3.

  - ledger_code: o.mkt.block
    human_name: Резервирование членского взноса под заказ
    wallet_op: TRANSFER
    # L1 — без проводки (оба кошелька на 86, Дт=Кт нетто-нулевое; смарт-контракт игнорирует)
    debit: null
    credit: null
    # L2 — реальный перевод между двумя программными кошельками
    wallet_from: w.mkt.member       # ЦПП «Стол Заказов» — свободные средства программы
    wallet_to: w.mkt.order          # ЦПП «Стол Заказов» — резерв под Order
    # L3 — две стороны движения у одного и того же пайщика
    l3:
      - user_wallet: w.mkt.member
        user_ref: order.orderer
        available_delta: -order.total_cost
        blocked_delta: null
      - user_wallet: w.mkt.order
        user_ref: order.orderer
        available_delta: +order.total_cost
        blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::createorder
    description: >
      Атомарная серия — шаг 3 из 3. Резервирование суммы order.total_cost
      под конкретный Order: средства переводятся со «свободного» программного
      членского кошелька (w.mkt.member) на отдельный кошелёк-резерв
      (w.mkt.order). Бухгалтерских проводок нет (оба кошелька на счёте 86 —
      перевод внутри одной аналитики, фиктивная Дт=Кт игнорируется).
      Резерв снимается либо при выдаче (o.mkt.consum — сжигание резерва BURN'ом
      при подписании АПП выдачи), либо при отмене (o.mkt.unblk — обратный
      TRANSFER w.mkt.order → w.mkt.member).

  - ledger_code: o.mkt.unblk
    human_name: Снятие резерва членского взноса при отмене
    wallet_op: TRANSFER
    # L1 — без проводки (оба кошелька на 86, зеркало o.mkt.block)
    debit: null
    credit: null
    # L2 — обратный перевод из резерва в свободные средства программы
    wallet_from: w.mkt.order        # ЦПП «Стол Заказов» — резерв под Order
    wallet_to: w.mkt.member         # ЦПП «Стол Заказов» — свободные средства программы
    # L3 — две стороны движения у одного и того же пайщика
    l3:
      - user_wallet: w.mkt.order
        user_ref: order.orderer
        available_delta: -order.total_cost
        blocked_delta: null
      - user_wallet: w.mkt.member
        user_ref: order.orderer
        available_delta: +order.total_cost
        blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::cancelorder | marketplace::expirecycle | marketplace::declinebatch
    description: >
      Зеркало o.mkt.block. Снятие резерва при отмене Order'а (заказчик
      отменяет до акцепта; цикл истёк без достижения порога; поставщик
      отказался от партии). Средства возвращаются с кошелька-резерва
      (w.mkt.order) на «свободный» программный членский (w.mkt.member.available)
      заказчика — могут быть потрачены на следующий заказ в Столе заказов.
      Вывод в общий членский кошелёк (w.wal.member) — отдельное явное
      действие пайщика через o.mkt.recall, не часть авто-flow отмены.

  - ledger_code: o.mkt.recall
    human_name: Вывод членского взноса в общий членский кошелёк
    wallet_op: TRANSFER
    # L1 — нет проводки (Дт=Кт по 86 нетто-нулевое; смарт-контракт игнорирует).
    debit: null
    credit: null
    # L2 — реальный перевод между двумя именованными агрегатами кооператива
    wallet_from: w.mkt.member      # ЦПП «Стол Заказов» — программный членский
    wallet_to: w.wal.member        # Универсальный членский — общий членский пайщика
    # L3 — две стороны движения у одного и того же пайщика
    l3:
      - user_wallet: w.mkt.member
        user_ref: order.orderer
        available_delta: -order.total_cost
        blocked_delta: null
      - user_wallet: w.wal.member
        user_ref: order.orderer
        available_delta: +order.total_cost
        blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: TBD
    description: >
      Зеркало o.mkt.assign. Явное действие пайщика — вывести членский взнос
      из программы Marketplace в общий членский кошелёк (где средства
      универсальны между программами и могут быть направлены, например, на
      Благорост или обратно на цифровой паевой через отдельную операцию
      контракта wallet). НЕ часть авто-flow отмены/возврата — на cancel/
      expire/decline средства остаются на w.mkt.member.available, и
      инициатива вывода — у пайщика.

  - ledger_code: o.mkt.purch
    human_name: Приёмка имущества кооперативом
    wallet_op: ACCOUNT_ONLY
    # L1 — двойная запись приёмки имущества
    debit: 10                      # Материалы (NEW в LEDGER2_ACCOUNT_REGISTRY)
    credit: 86                     # Целевое финансирование
    # L2 — без движения по кошелькам кооператива (имущество — не кошелёк)
    wallet_from: null
    wallet_to: null
    # L3 — без движения по кошелькам пайщиков
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::signchair
    description: >
      Имущество принято на склад КУ-приёмщика по АПП приёмки (финальная
      подпись председателя). Двойная запись Дт 10 / Кт 86 — приобретение
      имущества за счёт целевых средств кооператива. Имущество отслеживается
      бухгалтерской аналитикой по счёту 10 (per-КУ субсчета), без отдельного
      кошелька. Срабатывает атомарно с o.mkt.payout. WalletOp ACCOUNT_ONLY —
      proposed расширение enum'а ledger2 для операций, выполняющих только
      бухгалтерскую проводку без движения по кошелькам. (TBD-Standardization:
      проводка Дт 10 / Кт 86 — baseline; финальное решение — при формализации
      стандарта; ACCOUNT_ONLY — proposed.)

  - ledger_code: o.mkt.payout
    human_name: Оплата поставщику с расчётного счёта
    wallet_op: TRANSFER
    # L1
    debit: 86                      # Целевое финансирование (TBD-Standardization)
    credit: 51                     # Расчётный счёт
    # L2 — эмиссия суммы в платформенный кошелёк выплат поставщикам
    wallet_from: null              # ISSUE-подобная семантика: источника нет
    wallet_to: w.mkt.payout        # Выплаты поставщикам (платформенный)
    # L3 — w.mkt.payout агрегатный (не USER_SHARED), L3 не заполняется
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::payconfirm
    description: >
      Оплата поставщику с расчётного счёта кооператива по факту реального
      банковского перевода (Locked Decision L12 — lazy payout, E11 техдолг
      598-16). Двойная запись Дт 86 / Кт 51 — расход целевых средств на
      оплату поставки (упрощённая модель без счёта 60 «Расчёты с
      поставщиками»). Сумма приземляется на платформенный кошелёк
      w.mkt.payout. Не атомарно с o.mkt.purch — выплата проходит через
      контракт gateway тремя шагами: backend инициирует исходящий платёж
      (`marketplace::payout` → inline `gateway::createoutpay`); кассир
      проводит перевод банком и подтверждает в столе процессинга
      (`gateway::outcomplete`); контракт gateway callback'ом дёргает
      `marketplace::payconfirm` — и только здесь применяется эта ledger2-
      операция. До этого момента обязательство перед поставщиком висит
      на счёте 86 как открытое; защита от двойного запроса — на уровне
      `order.payout_status` (none/declined → pending → completed/declined).
      (TBD-Standardization: проводка фиксируется как baseline;
      альтернативные варианты — Дт 76 / Кт 51 через прочих кредиторов;
      финальное решение — при формализации стандарта совместно с Ангелиной.)

  - ledger_code: o.mkt.consum
    human_name: Выдача имущества пайщику — выбытие со склада
    wallet_op: BURN
    # L1 — часть 1 композитной проводки через транзит счёта 91:
    # Дт 91 / Кт 10 — выбытие имущества со склада на «прочие». Закрытие
    # транзита выполняется отдельной операцией o.mkt.consum2 (Дт 86 / Кт 91),
    # атомарно с o.mkt.consum в той же транзакции Antelope (вызывается
    # сразу после в действии signiss2). Согласовано с Ангелиной 2026-05-11.
    debit: 91                      # Прочие доходы и расходы (NEW)
    credit: 10                     # Материалы (NEW)
    # L2 — BURN на кошельке-резерве (резерв сжигается, средства уходят из системы)
    wallet_from: w.mkt.order        # ЦПП «Стол Заказов» — резерв под Order
    wallet_to: null                 # BURN — без получателя
    # L3 — резерв заказчика обнуляется (целевое расходование членского взноса)
    user_wallet: w.mkt.order
    user_ref: order.orderer
    available_delta: -order.fact_cost
    blocked_delta: null
    amount_ref: order.fact_cost
    triggered_by: marketplace::signiss2
    description: >
      Выдача имущества заказчику-пайщику по АПП выдачи (финальная подпись
      заказчика), часть 1 композитной бухгалтерской проводки через транзит
      счёта 91 «Прочие доходы и расходы». BURN на кошельке-резерве
      (w.mkt.order) — зарезервированная сумма сжигается без получателя
      (целевое расходование членского взноса). Проводка Дт 91 / Кт 10 —
      выбытие имущества со склада на «прочие». Сразу после этой операции
      в той же транзакции signiss2 контракт вызывает o.mkt.consum2
      (Дт 86 / Кт 91, NONE) — закрытие транзита 91 на счёт ЦФ программы.
      Транзит через 91 отделяет момент выбытия имущества от момента
      признания целевого расхода — согласовано с Ангелиной 2026-05-11.
      При расхождении факт vs заказ предшествуют корректирующие операции
      (o.mkt.unblk на остаток если факт меньше; o.wal.conv + o.mkt.assign +
      o.mkt.block на разницу если факт больше — первые две conditional).

  - ledger_code: o.mkt.consum2
    human_name: Выдача имущества пайщику — закрытие транзита
    wallet_op: NONE
    # L1 — часть 2 композитной проводки: Дт 86 / Кт 91 (закрытие «прочих»
    # на счёт ЦФ программы). Зеркало 91-стороны от o.mkt.consum.
    debit: 86                      # Целевое финансирование
    credit: 91                     # Прочие доходы и расходы (NEW)
    # L2 / L3 — без движения по кошелькам
    wallet_from: null
    wallet_to: null
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: order.fact_cost
    triggered_by: marketplace::signiss2
    description: >
      Закрытие транзита счёта 91 после выдачи имущества пайщику. NONE —
      только бухпроводка Дт 86 / Кт 91, кошельки не двигаются. Срабатывает
      атомарно с o.mkt.consum в той же транзакции signiss2 (контракт
      выполняет обе операции последовательно). По итогу пары operations
      нетто-эффект — Дт 86 / Кт 10 (закрытие обязательства по целевой
      программе + выбытие имущества со склада), 91 проходит нулевым
      транзитом.

