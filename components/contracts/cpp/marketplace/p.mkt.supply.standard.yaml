# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Прямая поставка-приобретение имущества» — кооперативный процесс,
# при котором поставщик-пайщик передаёт имущество кооперативу, а заказчик-
# пайщик получает его в счёт членского взноса по ЦПП «Стол заказов».
#
# Это базовый процесс контракта Marketplace в режиме членских взносов
# (закупка имущества кооперативом + потребление пайщиком). Содержит
# атомарную серию операций по программному кошельку при создании Order'а,
# цикл консолидации заявок Backend'ом, двухвариантную модель приёмки
# (А — самовывоз / Б — экспедитор + бумажная ТТН + дистанционная ЭЦП),
# двойные подписи на АПП приёмки и АПП выдачи.
#
# **Модель кошельков (refinement 2026-05-04, трёхуровневая серия):**
# Членский взнос пайщика проходит через два кошелька:
#   • w.wal.member  (контракт wallet, USER_SHARED) — универсальный членский
#                   кошелёк пайщика. Сюда стекаются возвраты из всех
#                   программ (Стол заказов / Благорост / и т.п.); пайщик
#                   тратит как «баллы» — может направить на следующий заказ
#                   в любой программе либо вывести обратно на паевой через
#                   операцию контракта wallet.
#   • w.mkt.member  (контракт marketplace, USER_SHARED) — членский в
#                   программе Marketplace. На нём идут BLOCK/UNBLOCK/REVOKE
#                   под конкретный Order.
# Платформенные кошельки w.wal.share (Цифровой Кошелёк, паевые деньгами) и
# w.mkt.payout (Выплаты поставщикам) — без изменений. Имущество
# отслеживается бухгалтерской аналитикой по счёту 10 (per-КУ субсчета),
# без отдельного кошелька.
#
# Идентификация кошельков — eosio::name с префиксом w.<contract>.<waltype>
# (рефакторинг 2026-04-27 на ветке reports). null для незатронутых уровней;
# sentinel '' — legacy-допуск (рендерится как ∅).
#
# В процессе участвуют 8 ledger2-операций (часть — из контракта wallet):
#   • o.wal.fconv   — конвертация цифрового рубля → общий членский пайщика
#                     (TRANSFER, w.wal.share → w.wal.member,
#                      Дт 80 / Кт 86) — conditional, только если на
#                     w.wal.member.available заказчика не хватает
#   • o.mkt.ftarg   — целевое назначение членского взноса в программу
#                     (TRANSFER, w.wal.member → w.mkt.member, без проводки —
#                      Дт=Кт по 86 смарт-контракт игнорирует) — conditional,
#                     только если на w.mkt.member.available не хватает
#   • o.mkt.fblock  — блокировка средств под Order на программном кошельке
#                     (BLOCK)
#   • o.mkt.funblk  — разблокировка при отмене Order'а
#                     (UNBLOCK; средства остаются на w.mkt.member.available
#                      и могут быть потрачены на следующий заказ)
#   • o.mkt.fefund  — вывод из программы в общий членский кошелёк пайщика
#                     (TRANSFER, w.mkt.member → w.wal.member, без проводки) —
#                     ОТДЕЛЬНОЕ явное действие пайщика, не часть авто-flow
#                     отмены/возврата
#   • o.mkt.purch   — приёмка имущества кооперативом по АПП приёмки
#                     (ACCOUNT_ONLY, только проводка, Дт 10 / Кт 86)
#   • o.mkt.payspl  — оплата поставщику с расчётного счёта
#                     (TRANSFER, ∅ → w.mkt.payout, Дт 86 / Кт 51)
#   • o.mkt.consum  — выдача имущества пайщику по АПП выдачи
#                     (REVOKE, w.mkt.member .blocked → 0,
#                      Дт 86 / Кт 10)
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# Источники правды в коде:
#   • cpp/marketplace/marketplace.hpp                 — actions (status: proposed)
#   • cpp/marketplace/src/                            — реализация (предстоит)
#   • cpp/lib/core/ledger2/operations.hpp             — OPERATION_REGISTRY (расширение)
#   • cpp/lib/core/ledger2/processes.hpp              — processes::marketplace::SUPPLY
#   • cpp/lib/core/ledger2/wallets.hpp                — w.wal.member (universal member, contract wallet),
#                                                       w.mkt.member (programmatic per-user),
#                                                       w.wal.share (платформенный),
#                                                       w.mkt.payout (платформенный)
#   • cpp/lib/core/ledger2/accounts.hpp               — Расчётный (51),
#                                                       Паевой фонд (80),
#                                                       Целевое финансирование (86),
#                                                       Материалы (10 — NEW)
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.mkt.supply
id: public_marketplace_supply_process
title: Прямая поставка-приобретение имущества
slug: supply
status: proposed
contract: marketplace
summary: >
  Кооператив закупает товары у пайщиков-поставщиков и выдаёт их
  пайщикам-заказчикам в счёт целевого членского взноса.
purpose: >
  Базовый процесс «Стола заказов»: пайщик-заказчик находит у пайщика-
  поставщика нужный товар, оплачивает его членским взносом, кооператив
  принимает товар на склад и затем выдаёт заказчику. Используется, когда
  пайщики хотят провести сделку через кооператив, а не через обычный
  маркетплейс — кооператив выступает доверенным звеном и оформляет
  понятный документооборот по каждой сделке. Это позволяет пайщикам
  совместно приобретать товары на условиях кооператива без посреднических
  наценок.
roles:
  - orderer        # пайщик-заказчик
  - offerer        # пайщик-поставщик
  - chairman        # председатель кооперативного участка (КУ-приёмщик/КУ-выдающий)
  - backend         # Backend Marketplace (внеблокчейн-логика)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Имена actions ≤12 символов eosio::name. Контракт описан в целевом виде —
# реализация в .cpp предстоит после согласования стандарта.
actions:
  - name: marketplace::createorder
    human: Создать заказ
    actor: orderer
    role: opener
    purpose: >
      Заказчик-пайщик создаёт Order на товар из каталога с указанием
      количества и КУ получения. Контракт атомарно выполняет трёхступенчатую
      серию: o.wal.fconv (paevoy → общий членский пайщика w.wal.member,
      Дт 80 / Кт 86) → o.mkt.ftarg (общий членский → программный членский
      w.mkt.member по программе Marketplace) → o.mkt.fblock (блокировка
      суммы под Order на программном кошельке, available → blocked). Первые
      две операции — conditional: вызываются только если на соответствующем
      кошельке заказчика не хватает available; третья (BLOCK) — всегда.
      Backend валидирует лимит стоимости корзины (100 000 ₽ — упрощённый
      налоговый порог ТМЦ) до вызова контракта.

  - name: marketplace::cancelorder
    human: Отменить заказ
    actor: orderer
    role: progress
    purpose: >
      Заказчик отменяет Order до момента акцепта поставщиком. Контракт
      выполняет o.mkt.funblk (разблокировка) — сумма становится доступной
      на программном кошельке заказчика w.mkt.member.available и может
      быть потрачена на следующий заказ в Столе заказов. Если пайщик хочет
      вывести её в общий членский кошелёк (w.wal.member) для использования
      в других программах — это отдельное явное действие через o.mkt.fefund,
      не часть авто-flow отмены. Order переходит в статус cancelled.

  - name: marketplace::expirecycle
    human: Закрыть по истечении цикла
    actor: backend
    role: progress
    purpose: >
      Backend по расписанию (по окончании окна Offer'а) проверяет, достигнут
      ли минимальный порог поставки. Если порог не достигнут — для каждого
      Order'а в этом окне контракт выполняет o.mkt.funblk (средства остаются
      на w.mkt.member.available заказчика — могут быть потрачены на новый
      заказ или выведены отдельно), заявки переходят в статус cancelled.
      Если порог достигнут — формируется консолидированная заявка поставщику
      (off-chain) и Order'ы остаются в статусе active до акцепта.

  - name: marketplace::acceptbatch
    human: Акцептовать партию
    actor: offerer
    role: progress
    purpose: >
      Поставщик через стол поставщика акцептует консолидированную заявку
      Backend'а (один или несколько Order'ов под один Offer). Контракт
      публикует пару Order+Offer on-chain, статус каждого Order'а из партии
      переходит в accepted. Операций по кошелькам не производится (средства
      уже заблокированы при создании Order'а).

  - name: marketplace::declinebatch
    human: Отказаться от партии
    actor: offerer
    role: reject
    purpose: >
      Поставщик отказывается от консолидированной заявки до её публикации
      on-chain. Контракт для каждого Order'а из партии выполняет o.mkt.funblk
      (средства остаются на w.mkt.member.available заказчика), заявки
      переходят в cancelled. Без штрафных санкций на стороне контракта
      (договорная ответственность вне MVP).

  - name: marketplace::prepship
    human: Подготовить отгрузку
    actor: offerer
    role: progress
    purpose: >
      Поставщик в pre-shipment-режиме группирует акцептованные Order'ы по КУ
      и выбирает модель приёмки: A (самовывоз) или B (через экспедитора).
      В модели B контракт фиксирует факт формирования ТТН и сохраняет ссылку
      на документ; экспедитор работает по бумаге. Контракт выполняет жёсткий
      акцепт: проверяет, что состав Shipment'а равен составу акцептованной
      партии (замены номенклатуры запрещены). Без операций по кошелькам.

  - name: marketplace::signsupp
    human: Поставщик подписал приёмку
    actor: offerer
    role: progress
    purpose: >
      Поставщик ставит первую подпись на АПП приёмки. Триггерится из push-
      takeover поставщика после либо непосредственного скана штрих-кода
      председателем КУ (модель A), либо после фотофиксации скорректированной
      ТТН председателем (модель B, дистанционно). Order переходит в статус
      supply_prepared. На этом этапе смарт-контракт **блокирует выдачу** —
      пока нет финальной подписи председателя, имущество физически на складе,
      но юридически не оприходовано. Без операций по кошелькам.

  - name: marketplace::signchair
    human: Председатель закрыл приёмку
    actor: chairman
    role: progress
    purpose: >
      Председатель КУ ставит вторую (финальную) подпись на АПП приёмки.
      Это закрывающее действие фазы приёмки: контракт атомарно применяет
      две ledger2-операции — o.mkt.purch (Дт 10 / Кт 86 — имущество принято
      на склад КУ-приёмщика, ACCOUNT_ONLY: только проводка, без кошельковых
      движений — имущество учитывается аналитикой по счёту 10) и o.mkt.payspl
      (Дт 86 / Кт 51 — оплата поставщику с расчётного счёта в w.mkt.payout).
      Order переходит в статус accepted_to_coop, выдача пайщику разблокирована.

  - name: marketplace::signiss1
    human: Председатель открыл выдачу
    actor: chairman
    role: progress
    purpose: >
      Председатель КУ ставит первую подпись на АПП выдачи (готов передать
      имущество заказчику). Order переходит в статус ready_to_receive,
      Backend отправляет multi-channel push заказчику «заказ готов на ПВЗ».
      Без операций по кошелькам.

  - name: marketplace::signiss2
    human: Заказчик закрыл выдачу
    actor: orderer
    role: closer
    purpose: >
      Заказчик ставит вторую (финальную) подпись на АПП выдачи на устройстве
      оператора КУ. Это закрывающее действие всего процесса: контракт
      применяет ledger2-операцию o.mkt.consum (Дт 86 / Кт 10, REVOKE —
      w.mkt.member пайщика .blocked → 0, имущество выбывает со
      склада через проводку обратную к o.mkt.purch). При расхождении «факт
      vs заказ» контракт предварительно выполняет корректировку: факт меньше
      → o.mkt.funblk на разницу (остаётся available на w.mkt.member заказчика);
      факт больше → доконвертация трёхступенчатой серией (o.wal.fconv +
      o.mkt.ftarg + o.mkt.fblock на разницу — первые две conditional, как
      в createorder). Order переходит в финальный статус received.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: marketplace::order (таблица orders, scope=coopname).
# Граф спрямлён: статус pending_offerer_sign модели B описан в сценарии,
# в графе сворачивается в supply_prepared с разными путями входа.
entity: marketplace::order
entity_human: Заказ на поставку
entity_source: cpp/marketplace/src/

states:
  - name: active
    human: Заявка размещена
    description: >
      Order создан, средства заказчика прошли трёхступенчатую серию
      o.wal.fconv → o.mkt.ftarg → o.mkt.fblock и заблокированы на программном
      кошельке w.mkt.member. Заявка ждёт окончания цикла отсечки и акцепта
      поставщика.
    kind: normal

  - name: cancelled
    human: Отменено
    description: >
      Order аннулирован — либо заказчиком до акцепта (cancelorder), либо
      Backend'ом по истечении цикла без достижения порога (expirecycle),
      либо поставщиком при отказе от партии (declinebatch). Применена
      o.mkt.funblk — сумма разблокирована на w.mkt.member пайщика и стала
      доступной (.available). Пайщик может потратить её на следующий заказ
      в Столе заказов либо вывести в общий членский кошелёк через отдельное
      явное действие (o.mkt.fefund). Запись Order'а либо удаляется, либо
      помечается финальным статусом (зависит от реализации).
    kind: final

  - name: accepted
    human: Поставщик акцептовал
    description: >
      Поставщик акцептовал консолидированную заявку, пара Order+Offer
      опубликована on-chain. Средства заказчика по-прежнему заблокированы
      на w.mkt.member; имущество ещё не передано. Поставщик
      готовит отгрузку.
    kind: normal

  - name: ship_ready
    human: Отгрузка собрана
    description: >
      Поставщик собрал партию по составу акцептованной заявки и выбрал
      режим передачи (A — самовывоз / B — экспедитор + ТТН). Имущество
      готово к подписанию АПП приёмки, но фактически ещё не передано КУ
      и юридически не оприходовано.
    kind: normal

  - name: supply_prepared
    human: Поставщик подписал
    description: >
      Поставщик поставил первую подпись на АПП приёмки. Имущество физически
      на КУ, но юридически не оприходовано. Смарт-контракт блокирует выдачу
      пайщикам. Ждёт финальную подпись председателя.
    kind: normal

  - name: accepted_to_coop
    human: Принято кооперативом
    description: >
      Председатель закрыл АПП приёмки. Применены o.mkt.purch (имущество
      на склад через проводку Дт 10 / Кт 86) и o.mkt.payspl (оплата
      поставщику в w.mkt.payout, Дт 86 / Кт 51). Имущество легально
      на складе КУ. Ждёт отметки готовности к выдаче от оператора КУ.
    kind: normal

  - name: ready_to_receive
    human: Готово к выдаче
    description: >
      Председатель открыл АПП выдачи. Заказчику отправлен push «заказ готов
      на ПВЗ». Заявка ждёт визита заказчика и его подписи на устройстве
      оператора.
    kind: normal

  - name: received
    human: Имущество выдано
    description: >
      Заказчик закрыл АПП выдачи. Применена o.mkt.consum (REVOKE на
      w.mkt.member пайщика .blocked → 0; проводка Дт 86 / Кт 10 —
      целевое использование членского взноса с одновременным выбытием
      имущества со склада). Процесс поставки-приобретения полностью завершён.
      Имущество на руках у пайщика, средства учтены. Гарантийное окно
      открыто (старт процесса p.mkt.return при появлении заявления).
    kind: final

transitions:
  - from: "∅"
    to: active
    action: marketplace::createorder
    actor: orderer
    ledger_code: p.mkt.supply
    operations:
      - o.wal.fconv
      - o.mkt.ftarg
      - o.mkt.fblock
    guards:
      - Заказчик — активный пайщик кооператива.
      - Заказчик подписал Соглашение ЦПП «Стол заказов» (программный кошелёк w.mkt.member открыт).
      - Стоимость корзины не превышает 100 000 ₽ (валидируется Backend'ом до вызова контракта).
      - Совокупных средств заказчика по цепочке w.wal.share → w.wal.member → w.mkt.member достаточно для полной стоимости заказа (частичная конвертация на каждом шаге — берётся ровно недостача).
      - Указанный КУ принадлежит этому же кооперативу.

  - from: active
    to: cancelled
    action: marketplace::cancelorder
    actor: orderer
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.funblk
    guards:
      - Order ещё не акцептован поставщиком.

  - from: active
    to: cancelled
    action: marketplace::expirecycle
    actor: backend
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.funblk
    guards:
      - Окно цикла отсечки Offer'а истекло.
      - Минимальный порог поставки не достигнут.

  - from: active
    to: accepted
    action: marketplace::acceptbatch
    actor: offerer
    guards:
      - Минимальный порог достигнут к концу цикла.
      - Поставщик владеет связанным Offer'ом.

  - from: active
    to: cancelled
    action: marketplace::declinebatch
    actor: offerer
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.funblk
    guards:
      - Поставщик отказывается от консолидированной партии до её публикации on-chain.

  - from: accepted
    to: ship_ready
    action: marketplace::prepship
    actor: offerer
    guards:
      - Состав Shipment'а равен составу акцептованной партии (жёсткий акцепт; замены номенклатуры запрещены).
      - Поставщик выбрал режим: A (самовывоз) или B (экспедитор + ТТН).

  - from: ship_ready
    to: supply_prepared
    action: marketplace::signsupp
    actor: offerer
    guards:
      - Состав АПП соответствует составу акцептованной партии.
      - В модели A — председатель отсканировал штрих-код поставщика, скорректировал quantity/price (если нужно), нажал «Подтверждаю»; поставщик получил push-takeover и нажал «Передал».
      - В модели B — председатель и экспедитор сверили груз очно и подписали бумажную ТТН с печатью КУ; председатель сделал фотофиксацию скорректированной ТТН; поставщик получил push-takeover (дистанционно) и подписал в течение 8 часов с момента ухода экспедитора.

  - from: supply_prepared
    to: accepted_to_coop
    action: marketplace::signchair
    actor: chairman
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.purch
      - o.mkt.payspl
    guards:
      - АПП приёмки имеет первую подпись поставщика.
      - Председатель имеет роль оператора КУ-получателя.

  - from: accepted_to_coop
    to: ready_to_receive
    action: marketplace::signiss1
    actor: chairman
    guards:
      - Имущество промаркировано штрих-кодом / QR на складе КУ.

  - from: ready_to_receive
    to: received
    action: marketplace::signiss2
    actor: orderer
    ledger_code: p.mkt.supply
    operations:
      - o.mkt.consum
    guards:
      - Заказчик присутствует на КУ; оператор сверил факт vs заказ.
      - При расхождении факт vs заказ сначала выполнены корректирующие операции (o.mkt.funblk на остаток если факт меньше; o.wal.fconv + o.mkt.ftarg + o.mkt.fblock на разницу если факт больше — первые две conditional; в пределах допустимого отрицательного баланса паевого ≤5%).

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Создание заказа и блокировка средств
      actor: orderer
      action: marketplace::createorder
      description: >
        Заказчик-пайщик в столе заказчика выбирает позицию из каталога Offer'ов
        своего кооператива, указывает количество и КУ получения. Backend
        валидирует, что суммарная стоимость не превышает 100 000 ₽ (упрощённый
        налоговый порог ТМЦ). Контракт createorder атомарно выполняет
        трёхступенчатую серию: (1) o.wal.fconv — paevoy → общий членский
        пайщика (w.wal.share → w.wal.member, Дт 80 / Кт 86), conditional —
        вызывается только если на w.wal.member.available заказчика не
        хватает; (2) o.mkt.ftarg — целевое назначение членского взноса
        в программу Marketplace (w.wal.member → w.mkt.member), тоже
        conditional; (3) o.mkt.fblock — блокировка суммы order.total_cost
        под Order на программном кошельке (available -= total_cost,
        blocked += total_cost), всегда. Order переходит в статус active.
      pre:
        - Пайщик имеет статус active.
        - Подписано Соглашение ЦПП «Стол заказов» (программный кошелёк w.mkt.member открыт).
        - Совокупных средств заказчика по цепочке w.wal.share → w.wal.member → w.mkt.member достаточно.
        - Стоимость корзины ≤ 100 000 ₽.
      post:
        - Order создан со статусом active.
        - На w.mkt.member пайщика заблокирована сумма order.total_cost.
        - В журнале опубликованы операции серии (от 1 до 3 — в зависимости от того, какие conditional шаги отработали).

    - step: 2
      title: Цикл отсечки и консолидация заявок
      actor: backend
      action: marketplace::expirecycle
      description: >
        Backend Marketplace по истечении окна Offer'а собирает все Order'ы
        в этом цикле и проверяет минимальный порог поставки. Если порог
        достигнут — формируется консолидированная заявка поставщику
        (off-chain) и заявки остаются в статусе active. Если порог не
        достигнут — для каждого Order'а контракт выполняет o.mkt.funblk:
        сумма разблокируется на w.mkt.member заказчика (.available),
        остаётся в программе и может быть потрачена на следующий заказ.
        Если пайщик хочет вывести её в общий членский — отдельное явное
        действие (o.mkt.fefund). Order'ы переходят в статус cancelled,
        заказчики получают push-уведомление об отмене.
      pre:
        - Окно цикла отсечки истекло.
      post:
        - Если порог достигнут — Order'ы остаются active, поставщику отправлено уведомление о консолидированной заявке.
        - Если порог не достигнут — все Order'ы переведены в cancelled, средства разблокированы на w.mkt.member.available каждого заказчика.

    - step: 3
      title: Акцепт поставщика
      actor: offerer
      action: marketplace::acceptbatch
      description: >
        Поставщик-пайщик в столе поставщика видит консолидированную заявку
        и нажимает «Акцептовать». Контракт публикует пару Order+Offer
        on-chain — это служит юридическим подтверждением, что поставщик
        обязан произвести поставку. Все Order'ы из партии переходят в
        статус accepted. Без операций по кошелькам.
      pre:
        - Минимальный порог достигнут.
        - Поставщик владеет Offer'ом, на основе которого сформирована партия.
      post:
        - Order'ы переведены в accepted.
        - Пара Order+Offer опубликована on-chain.

    - step: 4
      title: Pre-shipment — подготовка отгрузки
      actor: offerer
      action: marketplace::prepship
      description: >
        Поставщик в кабинете на вкладке «К отгрузке» видит акцептованные
        Order'ы, сгруппированные по КУ-получателям. Выбирает режим: A
        (самовывоз — поставщик сам привезёт груз на КУ) или B (через
        экспедитора с бумажной ТТН). В модели B группирует Order'ы по
        машинам/экспедиторам, на каждый КУ формируется отдельная ТТН;
        контракт фиксирует факт формирования ТТН и сохраняет ссылку
        на документ. Жёсткий акцепт: контракт проверяет, что состав
        Shipment'а равен составу акцептованной партии (замены номенклатуры
        запрещены).
      pre:
        - Order'ы в статусе accepted.
        - Состав Shipment'а соответствует акцепту.
      post:
        - Shipment подготовлен в выбранной модели A или B.
        - В модели B сформирована и распечатана ТТН на принтере поставщика.

    - step: 5
      title: Доставка и приёмка — модель A (самовывоз)
      actor: chairman
      action: marketplace::signsupp
      description: >
        Поставщик прибыл на КУ. Председатель сканирует штрих-код поставщика
        — открывается карточка Shipment'а с ожидаемыми параметрами.
        Председатель корректирует quantity и/или price при необходимости и
        нажимает «Подтверждаю» (без ЭЦП). На устройство поставщика
        отправляется push-takeover в режиме full-screen с кнопкой «Передал».
        Поставщик нажимает «Передал» — это первая подпись АПП приёмки.
        Order переходит в статус supply_prepared. Без операций по кошелькам.
      pre:
        - Shipment'у соответствует Order в статусе accepted.
        - Поставщик и председатель физически на КУ.
      post:
        - АПП приёмки имеет первую подпись поставщика.
        - Order в статусе supply_prepared (выдача пайщикам ЗАБЛОКИРОВАНА).

    - step: 6
      title: Закрытие приёмки председателем — финальная подпись
      actor: chairman
      action: marketplace::signchair
      description: >
        Председатель нажимает «Закрыть» — ставит вторую (финальную) подпись
        АПП приёмки. Это закрывающее действие фазы приёмки: контракт
        атомарно применяет две ledger2-операции — o.mkt.purch (Дт 10 /
        Кт 86, ACCOUNT_ONLY — только проводка: имущество принято на склад
        КУ-приёмщика, отслеживается бухгалтерской аналитикой по счёту 10
        per-КУ) и o.mkt.payspl (Дт 86 / Кт 51, TRANSFER ∅ → w.mkt.payout
        — оплата поставщику с расчётного счёта). Order переходит в
        accepted_to_coop, выдача пайщикам разблокирована. Заказчик ещё
        не уведомлён — выдача активируется отдельным шагом.
      pre:
        - АПП приёмки имеет первую подпись поставщика.
        - Председатель имеет роль оператора КУ-получателя.
      post:
        - Order в статусе accepted_to_coop.
        - В бухгалтерии — Дт 10 / Кт 86 на сумму order.total_cost (КУ-приёмщик в аналитике).
        - Поставщик получил оплату на w.mkt.payout.
        - В журнале опубликованы o.mkt.purch и o.mkt.payspl.

    - step: 7
      title: Маркировка имущества и открытие выдачи
      actor: chairman
      action: marketplace::signiss1
      description: >
        Оператор КУ маркирует принятое имущество внутренним штрих-кодом /
        QR-кодом для учёта на складе участка (печатает на принтере КУ).
        Затем открывает АПП выдачи — ставит первую подпись (готовность
        передать имущество). Order переходит в статус ready_to_receive,
        Backend отправляет multi-channel push заказчику «заказ готов
        на ПВЗ». Без операций по кошелькам.
      pre:
        - Order в статусе accepted_to_coop.
        - Имущество физически на складе КУ.
      post:
        - Имущество промаркировано.
        - Order в статусе ready_to_receive.
        - Заказчик уведомлён о готовности.

    - step: 8
      title: Выдача и финальная подпись заказчика
      actor: orderer
      action: marketplace::signiss2
      description: >
        Заказчик приходит на КУ, показывает QR-код заявки оператору.
        Оператор сверяет факт vs заказ и фиксирует один из трёх вариантов:
        (а) факт = заказ — без корректировок; (б) факт меньше заказа
        (например, развесной товар: 90 г вместо 100 г) — контракт
        предварительно выполняет o.mkt.funblk на разницу (остаётся
        available на w.mkt.member заказчика, расходуется в следующих
        заказах в программе); (в) факт больше заказа — контракт выполняет
        доконвертацию трёхступенчатой серией o.wal.fconv + o.mkt.ftarg +
        o.mkt.fblock на разницу (первые две conditional, как в createorder);
        при пустом цифровом паевом допускается отрицательный баланс ≤5%
        либо пайщик пополняет паевой через кассира. Заказчик подписывает
        АПП выдачи на устройстве оператора — это финальная (вторая) подпись.
        Контракт применяет o.mkt.consum (REVOKE — w.mkt.member пайщика
        .blocked → 0; проводка Дт 86 / Кт 10 — расход целевых средств на
        расход имущества). Order переходит в финальный статус received.
      pre:
        - Order в статусе ready_to_receive.
        - Заказчик присутствует на КУ.
      post:
        - Имущество выдано пайщику.
        - Order в финальном статусе received.
        - Сумма order.total_cost (или fact_cost при коррекции) списана с w.mkt.member пайщика.
        - В бухгалтерии — Дт 86 / Кт 10 на сумму fact_cost.
        - В журнале опубликована o.mkt.consum (с предшествующими корректировками при необходимости).
        - Гарантийное окно открыто (запуск p.mkt.return по заявлению пайщика возможен до конца окна).

  alternatives:
    - branch: Доставка и приёмка — модель B (экспедитор + ТТН)
      at_step: 5
      action: marketplace::signsupp
      actor: chairman
      description: >
        Бумажная ступень: председатель и экспедитор очно сверяют состав
        груза по ТТН. При расхождении вычёркивают позиции прямо в ТТН
        ручкой, экспедитор расписывается под корректировкой, председатель
        ставит подпись + дату + печать КУ. Экспедитор забирает экземпляр
        ТТН + забракованное обратно и уезжает. Цифровая ступень
        (дистанционно с поставщиком, не срочно): председатель в приложении
        открывает «Приёмка по ТТН» → фотофиксирует исправленную ТТН и/или
        вручную переносит корректировки → формируется скорректированный
        АПП приёмки → push-takeover поставщику с full-screen-окном →
        поставщик подписывает первой подписью (signsupp). Допустимый
        интервал между уходом экспедитора и подписанием поставщика —
        не более 8 часов с момента ухода экспедитора. После превышения
        Order остаётся в supply_prepared, выдача пайщикам по-прежнему
        заблокирована, претензионная процедура запускается по регламенту
        кооператива.
      pre:
        - Shipment в модели B (экспедитор + ТТН).
        - Бумажная ТТН подписана председателем + экспедитором + печатью КУ.
      post:
        - АПП приёмки на основе фотофиксации ТТН подписан поставщиком (первая подпись).
        - Order в статусе supply_prepared (выдача пайщикам ЗАБЛОКИРОВАНА).
        - Дальнейшие шаги — те же, что в модели A: signchair → signiss1 → signiss2.

    - branch: Отказ поставщика от корректировки (модель B)
      at_step: 5
      action: null
      actor: offerer
      description: >
        Если поставщик дистанционно отказывается подписать скорректированный
        по ТТН АПП («Отказ от корректировки» в push-takeover), формируется
        претензионная транзакция со ссылкой на оригинальный акцепт vs
        скорректированный АПП. Дальнейшее решение — ручная договорная
        процедура по регламенту кооператива (штрафные санкции, возврат,
        перепоставка). Системные формы санкций в MVP не реализуются.
        Order остаётся в статусе supply_prepared, выдача пайщикам
        не разблокирована. По истечении регламентного срока возможна
        отдельная процедура отмены поставки.

    - branch: Отмена заказчиком до акцепта
      at_step: 2
      action: marketplace::cancelorder
      actor: orderer
      description: >
        Заказчик в столе заказчика отменяет Order до момента, как
        поставщик акцептует консолидированную заявку. Контракт выполняет
        o.mkt.funblk: сумма разблокируется на w.mkt.member пайщика
        (.available), остаётся в программе для следующего заказа. Если
        пайщик хочет вывести в общий членский — отдельное явное действие
        (o.mkt.fefund). Order переходит в cancelled.

    - branch: Отказ поставщика от партии
      at_step: 3
      action: marketplace::declinebatch
      actor: offerer
      description: >
        Поставщик в столе поставщика отказывается от консолидированной
        заявки до её публикации on-chain (acceptbatch). Контракт для каждого
        Order'а выполняет o.mkt.funblk, заявки переходят в cancelled,
        средства разблокированы на w.mkt.member.available каждого заказчика.
        Заказчики получают push-уведомление об отмене.

    - branch: Цикл истёк без достижения порога
      at_step: 2
      action: marketplace::expirecycle
      actor: backend
      description: >
        Backend по расписанию обнаруживает, что окно Offer'а истекло без
        достижения минимального порога поставки. Для каждого Order'а
        в этом окне контракт выполняет o.mkt.funblk, заявки переходят
        в cancelled, средства разблокированы на w.mkt.member.available.
        Заказчики получают push.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# В процессе подписываются два юридически значимых документа: АПП приёмки
# (двойная подпись поставщик → председатель) и АПП выдачи (двойная подпись
# председатель → заказчик). Дополнительно в модели B печатается и подписывается
# бумажная ТТН (вне блокчейна) с фотофиксацией для целей дистанционной ЭЦП
# поставщика. Соглашение ЦПП «Стол заказов» подписывается ОДНОКРАТНО при
# первом входе пайщика и относится к процессу подключения к ЦПП (не входит
# в этот процесс).
documents:
  - action: marketplace::signsupp
    title: АПП приёмки имущества кооперативом (первая подпись поставщика)
    registry_id: 702
    signed_by: [offerer]
    stored_in: orders.acceptance_act
    note: "Используется существующий шаблон 702.AssetContributionAct из cooptypes/cooperative/registry/. Оригинально создан под клиринговую модель donor'а; форма акта приёма имущества кооперативом структурно подходит и для членской модели. При необходимости методолог может создать специализированный шаблон в новой серии (1100+) — тогда registry_id обновится."

  - action: marketplace::signchair
    title: АПП приёмки имущества кооперативом (финальная подпись председателя)
    registry_id: 702
    signed_by: [chairman]
    stored_in: orders.acceptance_act
    note: "Тот же шаблон что у signsupp (registry_id 702). Контракт verify_document_or_fail дополняет вторую подпись на тот же АПП."

  - action: marketplace::signiss1
    title: АПП выдачи имущества пайщику (первая подпись председателя)
    registry_id: 802
    signed_by: [chairman]
    stored_in: orders.issue_act
    note: "Используется существующий шаблон 802.ReturnByAssetAct из cooptypes/cooperative/registry/. Оригинально создан под клиринговую модель «возврат паевого взноса имуществом»; форма акта передачи имущества от кооператива пайщику структурно подходит и для членской модели выдачи. При необходимости методолог может создать специализированный шаблон."

  - action: marketplace::signiss2
    title: АПП выдачи имущества пайщику (финальная подпись заказчика)
    registry_id: 802
    signed_by: [orderer]
    stored_in: orders.issue_act
    note: "Тот же шаблон что у signiss1 (registry_id 802)."

  - action: marketplace::prepship
    title: Товарно-транспортная накладная (модель B, бумажная)
    registry_id: 0
    signed_by: [offerer, chairman, expediter]
    stored_in: shipments.ttn_pdf
    note: "TODO: создать шаблон ТТН в registry. В модели A не используется. Подписи проставляются вне блокчейна (бумажно), фотофиксация председателя сохраняется для дистанционной ЭЦП поставщика."

# ── Секция 6. Операции (Ledger2) ────────────────────────────────────────────
# Восемь ledger2-операций для процесса прямой поставки-приобретения. Имена
# ≤12 символов eosio::name. Кошельки идентифицируются eosio::name-строками
# с префиксом w.<contract>.<waltype> (рефакторинг 2026-04-27, ветка reports):
#   • w.wal.member  — Универсальный членский кошелёк пайщика (контракт wallet,
#                     USER_SHARED). Сюда стекаются возвраты из всех программ;
#                     пайщик расходует «как баллы» в любую программу.
#   • w.mkt.member  — ЦПП «Стол Заказов» — членский в программе (USER_SHARED).
#                     На нём идут BLOCK/UNBLOCK/REVOKE под Order.
#   • w.wal.share   — ЦПП «Цифровой Кошелёк» — паевые взносы деньгами
#                     [платформенный]
#   • w.mkt.payout  — Выплаты поставщикам
#                     [платформенный]
# null — для незатронутого уровня; sentinel '' — legacy-допуск (∅ в UI).
operations:
  - ledger_code: o.wal.fconv
    human_name: Конвертация паевого в членский взнос пайщика
    wallet_op: TRANSFER
    # L1 — двойная запись (паевой → целевой)
    debit: 80                      # Паевой фонд
    credit: 86                     # Целевое финансирование (общий членский пайщика)
    # L2 — кошельки кооператива (агрегаты)
    wallet_from: w.wal.share       # ЦПП «Цифровой Кошелёк» — паевые взносы деньгами
    wallet_to: w.wal.member        # Универсальный членский — общий членский кошелёк пайщика
    # L3 — пополнение available на w.wal.member заказчика
    user_wallet: w.wal.member
    user_ref: order.orderer
    available_delta: +order.total_cost
    blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::createorder
    description: >
      Шаг 1 из 3 серии createorder (conditional — выполняется только если на
      w.wal.member.available заказчика не хватает суммы заказа). Конвертация
      цифрового рубля заказчика из ЦПП «Цифровой Кошелёк» в общий членский
      кошелёк пайщика — универсальную точку накопления членских взносов
      между программами. Сумма берётся ровно как недостача — если на
      w.wal.member уже есть available (например, из прошлого возврата),
      конвертируется только разница. Двойная запись Дт 80 / Кт 86 — переход
      из складочного капитала в целевое финансирование. (TBD-Standardization:
      проводка фиксируется как baseline.)

  - ledger_code: o.mkt.ftarg
    human_name: Целевое назначение членского взноса в программу Marketplace
    wallet_op: TRANSFER
    # L1 — нет проводки. По плану счетов оба кошелька висят на 86, и Дт 86 /
    # Кт 86 даёт нетто-нулевое изменение по счёту — смарт-контракт такие
    # «фиктивные» проводки игнорирует. Аналитика «по программе» фиксируется
    # на L2 (через имена агрегатных кошельков) — этого достаточно.
    debit: null
    credit: null
    # L2 — реальный перевод между двумя именованными агрегатами кооператива
    wallet_from: w.wal.member      # Общий членский — пайщик расходует
    wallet_to: w.mkt.member        # ЦПП «Стол Заказов» — целевое назначение в программу
    # L3 — две стороны движения у одного и того же пайщика
    l3:
      - user_wallet: w.wal.member
        user_ref: order.orderer
        available_delta: -order.total_cost
        blocked_delta: null
      - user_wallet: w.mkt.member
        user_ref: order.orderer
        available_delta: +order.total_cost
        blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::createorder
    description: >
      Шаг 2 из 3 серии createorder (conditional — выполняется только если на
      w.mkt.member.available заказчика не хватает суммы заказа). Перенос
      членского взноса пайщика из универсального кошелька (w.wal.member)
      в программу Marketplace (w.mkt.member). Сумма берётся ровно как
      недостача. По бухгалтерии — без проводки (Дт=Кт по 86 нетто-нулевое
      изменение, смарт-контракт такие фиктивные проводки игнорирует);
      аналитика «по программе» фиксируется на L2/L3.

  - ledger_code: o.mkt.fblock
    human_name: Блокировка членского взноса под заказ
    wallet_op: BLOCK
    # L1 — операция чисто L3, бухгалтерия не двигается
    debit: null
    credit: null
    # L2 — без перевода между кошельками кооператива
    wallet_from: null
    wallet_to: null
    # L3 — split available → blocked на одном кошельке заказчика
    user_wallet: w.mkt.member       # ЦПП «Стол Заказов» — членские взносы заказчика
    user_ref: order.orderer
    available_delta: -order.total_cost
    blocked_delta: +order.total_cost
    amount_ref: order.total_cost
    triggered_by: marketplace::createorder
    description: >
      Атомарная серия — шаг 2 из 2. Блокировка суммы order.total_cost под
      конкретный Order на кошельке заказчика w.mkt.member. Это операция
      уровня 3 — split available → blocked на одном кошельке без перевода
      между кошельками кооператива и без бухгалтерских проводок.
      Блокировка снимается либо при выдаче (o.mkt.consum, REVOKE blocked → 0),
      либо при отмене (o.mkt.funblk + o.mkt.fefund — UNBLOCK + возврат).

  - ledger_code: o.mkt.funblk
    human_name: Разблокировка членского взноса при отмене
    wallet_op: UNBLOCK
    # L1 — без проводок
    debit: null
    credit: null
    # L2 — без перевода
    wallet_from: null
    wallet_to: null
    # L3 — обратное движение blocked → available
    user_wallet: w.mkt.member
    user_ref: order.orderer
    available_delta: +order.total_cost
    blocked_delta: -order.total_cost
    amount_ref: order.total_cost
    triggered_by: marketplace::cancelorder | marketplace::expirecycle | marketplace::declinebatch
    description: >
      Зеркало o.mkt.fblock. Снятие блокировки на кошельке заказчика
      w.mkt.member при отмене Order'а (заказчик отменяет до акцепта;
      цикл истёк без достижения порога; поставщик отказался от партии).
      На уровне 3 blocked → available. Без L1, без L2. Сумма остаётся
      на w.mkt.member.available заказчика — может быть потрачена на
      следующий заказ в Столе заказов. Вывод в общий членский кошелёк
      (w.wal.member) — отдельное явное действие пайщика через o.mkt.fefund,
      не часть авто-flow отмены.

  - ledger_code: o.mkt.fefund
    human_name: Вывод членского взноса в общий членский кошелёк
    wallet_op: TRANSFER
    # L1 — нет проводки (Дт=Кт по 86 нетто-нулевое; смарт-контракт игнорирует).
    debit: null
    credit: null
    # L2 — реальный перевод между двумя именованными агрегатами кооператива
    wallet_from: w.mkt.member      # ЦПП «Стол Заказов» — программный членский
    wallet_to: w.wal.member        # Универсальный членский — общий членский пайщика
    # L3 — две стороны движения у одного и того же пайщика
    l3:
      - user_wallet: w.mkt.member
        user_ref: order.orderer
        available_delta: -order.total_cost
        blocked_delta: null
      - user_wallet: w.wal.member
        user_ref: order.orderer
        available_delta: +order.total_cost
        blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: TBD
    description: >
      Зеркало o.mkt.ftarg. Явное действие пайщика — вывести членский взнос
      из программы Marketplace в общий членский кошелёк (где средства
      универсальны между программами и могут быть направлены, например, на
      Благорост или обратно на цифровой паевой через отдельную операцию
      контракта wallet). НЕ часть авто-flow отмены/возврата — на cancel/
      expire/decline средства остаются на w.mkt.member.available, и
      инициатива вывода — у пайщика.

  - ledger_code: o.mkt.purch
    human_name: Приёмка имущества кооперативом
    wallet_op: ACCOUNT_ONLY
    # L1 — двойная запись приёмки имущества
    debit: 10                      # Материалы (NEW в LEDGER2_ACCOUNT_REGISTRY)
    credit: 86                     # Целевое финансирование
    # L2 — без движения по кошелькам кооператива (имущество — не кошелёк)
    wallet_from: null
    wallet_to: null
    # L3 — без движения по кошелькам пайщиков
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::signchair
    description: >
      Имущество принято на склад КУ-приёмщика по АПП приёмки (финальная
      подпись председателя). Двойная запись Дт 10 / Кт 86 — приобретение
      имущества за счёт целевых средств кооператива. Имущество отслеживается
      бухгалтерской аналитикой по счёту 10 (per-КУ субсчета), без отдельного
      кошелька. Срабатывает атомарно с o.mkt.payspl. WalletOp ACCOUNT_ONLY —
      proposed расширение enum'а ledger2 для операций, выполняющих только
      бухгалтерскую проводку без движения по кошелькам. (TBD-Standardization:
      проводка Дт 10 / Кт 86 — baseline; финальное решение — при формализации
      стандарта; ACCOUNT_ONLY — proposed.)

  - ledger_code: o.mkt.payspl
    human_name: Оплата поставщику с расчётного счёта
    wallet_op: TRANSFER
    # L1
    debit: 86                      # Целевое финансирование (TBD-Standardization)
    credit: 51                     # Расчётный счёт
    # L2 — эмиссия суммы в платформенный кошелёк выплат поставщикам
    wallet_from: null              # ISSUE-подобная семантика: источника нет
    wallet_to: w.mkt.payout        # Выплаты поставщикам (платформенный)
    # L3 — w.mkt.payout агрегатный (не USER_SHARED), L3 не заполняется
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: order.total_cost
    triggered_by: marketplace::signchair
    description: >
      Оплата поставщику с расчётного счёта кооператива по факту приёмки
      имущества. Двойная запись Дт 86 / Кт 51 — расход целевых средств на
      оплату поставки (упрощённая модель без счёта 60 «Расчёты с поставщиками»).
      Сумма приземляется на платформенный кошелёк w.mkt.payout.
      Срабатывает атомарно с o.mkt.purch на финальной подписи председателя
      АПП приёмки. (TBD-Standardization: проводка фиксируется как baseline;
      альтернативные варианты — Дт 76 / Кт 51 через прочих кредиторов;
      финальное решение — при формализации стандарта совместно с Ангелиной.)

  - ledger_code: o.mkt.consum
    human_name: Выдача имущества пайщику
    wallet_op: REVOKE
    # L1 — выбытие имущества за счёт целевых средств
    debit: 86                      # Целевое финансирование
    credit: 10                     # Материалы
    # L2 — без перевода между кошельками кооператива (REVOKE списывает
    # blocked в пустоту, это L3-семантика)
    wallet_from: null
    wallet_to: null
    # L3 — blocked заказчика обнуляется (целевое расходование членского взноса)
    user_wallet: w.mkt.member
    user_ref: order.orderer
    available_delta: null
    blocked_delta: -order.fact_cost
    amount_ref: order.fact_cost
    triggered_by: marketplace::signiss2
    description: >
      Выдача имущества заказчику-пайщику по АПП выдачи (финальная подпись
      заказчика). REVOKE на программном кошельке пайщика — заблокированная
      сумма списывается без увеличения куда-либо (целевое расходование
      членского взноса). Двойная запись Дт 86 / Кт 10 — целевое использование
      средств с одновременным выбытием имущества со склада (обратная к
      o.mkt.purch). При расхождении факт vs заказ предшествуют корректирующие
      операции (o.mkt.funblk на остаток если факт меньше; o.wal.fconv +
      o.mkt.ftarg + o.mkt.fblock на разницу если факт больше — первые две
      conditional). (TBD-Standardization:
      проводка Дт 86 / Кт 10 фиксируется как baseline; Игорь предлагал
      альтернативу с участием 10-го счёта в иной роли — точная формулировка
      утеряна, восстанавливается при стандартизации.)

# ── Секция 7. Связи ─────────────────────────────────────────────────────────
related:
  - process_type: p.reg.accept
    id: public_registrator_accept_process
    relation: provides
    note: >
      Заказчик и поставщик должны быть active-пайщиками — статус выдаётся
      процессом «Приём пайщика» (p.reg.accept). Без активного членства
      ни создание Order'а, ни публикация Offer'а недоступны.

  - process_type: p.wal.depo
    id: public_wallet_deposit_process
    relation: provides
    note: >
      Заказчик пополняет цифровой паевой (w.wal.share) через процесс
      «Внесение паевого взноса» (p.wal.depo). Из паевого средства проходят
      двухступенчатую конвертацию при createorder: сначала в общий членский
      пайщика (o.wal.fconv → w.wal.member), затем в программный членский
      Marketplace (o.mkt.ftarg → w.mkt.member), и блокируются под Order
      (o.mkt.fblock).

  - process_type: p.mkt.return
    id: public_marketplace_return_process
    relation: triggers
    note: >
      Гарантийный возврат имущества (p.mkt.return) запускается заказчиком
      после получения имущества (статус Order'а received). Возможен только
      в пределах гарантийного срока, указанного поставщиком в Offer'е.
      Откат происходит через compensating forward o.mkt.return (без
      использования ledger2::revert).

  - process_type: p.mkt.wroff
    id: public_marketplace_writeoff_process
    relation: affects
    note: >
      Имущество, оставшееся на складе КУ после истечения срока годности
      и не выданное первичному заказчику (например, скоропорт), уходит
      в процесс «Утилизация скоропорта» (p.mkt.wroff) — списание со
      счёта 10 через транзит счёта 91 по решению совета.
