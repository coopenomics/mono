# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Гарантийный возврат имущества» — кооперативный процесс возврата
# имущества пайщиком на склад КУ в пределах гарантийного срока.
#
# Возврат реализован как **compensating forward** — отдельная именованная
# операция o.mkt.return с собственными проводками, семантически обратными
# исходной выдаче (o.mkt.consum). Откат через ledger2::revert НЕ
# используется (упрощение реализации MVP — реверты исключены из системы).
#
# **Модель кошельков (упрощённая, refinement 2026-05-04):** один программный
# кошелёк w.mkt.member (per-user) — членские взносы пайщика в программу.
# Возврат суммы при гарантии происходит на тот же программный кошелёк
# (.available восстанавливается); пайщик может потратить на следующий заказ
# или вывести в общий членский кошелёк (w.wal.member) через o.mkt.recall.
#
# Идентификация кошельков — eosio::name с префиксом w.<contract>.<waltype>
# (рефакторинг 2026-04-27 на ветке reports). Sentinel '' (пустая строка) —
# «кошелёк вне системы» для ISSUE/REVOKE/ACCOUNT_ONLY.
#
# Возврат поставщику и работа с поставщиком по претензиям — out of MVP;
# вернувшееся имущество остаётся на складе КУ как материальный остаток,
# его дальнейшая судьба вне этого процесса.
#
# В процессе участвуют 2 ledger2-операции (compensating-forward пара, зеркало
# выдачи на supply — через транзит счёта 91):
#   • o.mkt.return  — часть 1: ISSUE ∅ → w.mkt.member (восстановление
#                     .available заказчика в программе) + Дт 91 / Кт 86
#                     (восстановление «прочих» за счёт ЦФ)
#   • o.mkt.return2  — часть 2: NONE Дт 10 / Кт 91 (имущество назад на склад
#                     через закрытие транзита). Атомарно с o.mkt.return
#                     в той же транзакции accretrn.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# Источники правды в коде:
#   • cpp/marketplace/marketplace.hpp                 — actions (status: proposed)
#   • cpp/marketplace/src/return/                     — реализация (предстоит)
#   • cpp/lib/core/ledger2/operations.hpp             — OPERATION_REGISTRY
#                                                       расширение o.mkt.return
#   • cpp/lib/core/ledger2/processes.hpp              — processes::marketplace::RETURN
#   • cpp/lib/core/ledger2/wallets.hpp                — w.mkt.member (programmatic)
#   • cpp/lib/core/ledger2/accounts.hpp               — Целевое финансирование (86),
#                                                       Материалы (10),
#                                                       Прочие доходы и расходы (91 — NEW,
#                                                       транзит при возврате o.mkt.return)
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.mkt.return
id: public_marketplace_return_process
title: Гарантийный возврат имущества
slug: return
status: proposed
contract: marketplace
purpose: >
  Гарантийная защита заказчика по сделкам «Стола заказов». Если после
  получения товара заказчик обнаружил дефект, недокомплект или
  истечение срока годности в пределах гарантии, заданной поставщиком,
  он подаёт заявление на гарантийный возврат. Председатель участка
  сначала рассматривает заявление удалённо — по фото и описанию — и
  принимает одно из двух решений: одобрить очный визит или отказать
  удалённо. Если визит одобрен, заказчик приходит с продукцией на
  участок, председатель очно осматривает товар и выносит финальное
  решение — принять возврат или отказать на месте. При принятии
  возврата товар остаётся на складе участка, а сумма заказа
  возвращается заказчику на программный членский кошелёк Стола
  заказов: он может направить её на следующий заказ программы либо
  вывести в универсальный членский кошелёк отдельным действием.
  При отказе — на этом гарантийный возврат завершён, движений по
  имуществу и средствам не происходит. Дальнейшая судьба возвращённого
  имущества (возврат поставщику, перепоставка, списание) — вне этого
  процесса.
roles:
  - orderer        # пайщик-заказчик, инициатор возврата
  - chairman        # председатель кооперативного участка (КУ)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Имена actions ≤12 символов eosio::name. Контракт описан в целевом виде —
# реализация в .cpp предстоит после согласования стандарта.
actions:
  - name: marketplace::submretrn
    human: Подать заявление на гарантийный возврат
    actor: orderer
    role: opener
    purpose: >
      Заказчик подаёт заявление на гарантийный возврат имущества:
      указывает причину обращения (некондиция, истёк срок годности,
      иное) и прикладывает фотографии товара. Подать заявление можно
      только пока не истёк гарантийный срок, заданный поставщиком.

  - name: marketplace::aprretrem
    human: Одобрить очный визит
    actor: chairman
    role: progress
    purpose: >
      Председатель участка по результатам удалённого рассмотрения
      решает, что для разбора обращения нужен очный осмотр товара, и
      приглашает заказчика прийти на участок с продукцией.

  - name: marketplace::rejretrem
    human: Отказать удалённо
    actor: chairman
    role: reject
    purpose: >
      Председатель участка по результатам удалённого рассмотрения
      решает отказать в гарантийном возврате с указанием причины — без
      приглашения на очный осмотр. Решение финальное, движений по
      имуществу и средствам не происходит.

  - name: marketplace::accretrn
    human: Принять возврат
    actor: chairman
    role: closer
    purpose: >
      Председатель по результатам очного осмотра принимает гарантийный
      возврат: товар остаётся на складе участка, сумма заказа
      возвращается заказчику на программный членский кошелёк Стола
      заказов.

  - name: marketplace::rejretrn
    human: Отказать на месте
    actor: chairman
    role: reject
    purpose: >
      Председатель по результатам очного осмотра отказывает в
      гарантийном возврате с указанием причины. Заказчик забирает
      товар обратно. Решение финальное, движений по имуществу и
      средствам не происходит.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: marketplace::return_request (таблица return_requests, scope=coopname).
entity: marketplace::return_request
entity_human: Заявление на гарантийный возврат
entity_source: cpp/marketplace/src/return/

states:
  - name: pending_review
    human: Заявление на рассмотрении
    description: >
      Заявление подано заказчиком и ждёт решения председателя участка.
    kind: normal

  - name: approved_for_visit
    human: Очный визит одобрен
    description: >
      Председатель одобрил очное рассмотрение. Заказчику предстоит
      прийти на участок с продукцией для очного осмотра.
    kind: normal

  - name: return_accepted
    human: Возврат принят
    description: >
      Возврат принят кооперативом. Сумма заказа возвращена заказчику на
      программный членский кошелёк Стола заказов — он может направить её
      на следующий заказ программы либо вывести в универсальный членский
      кошелёк отдельным действием. Дальнейшая судьба возвращённого
      имущества (возврат поставщику, перепоставка, списание) — отдельная
      процедура по регламенту кооператива; в рамках этого процесса товар
      остаётся на складе участка.
    kind: final

  - name: rejected_remote
    human: Отказ удалённо
    description: >
      Председатель отказал по результатам удалённого рассмотрения.
      Гарантийный возврат завершён, движений по имуществу и средствам
      не происходит.
    kind: final

  - name: rejected_at_ku
    human: Отказ на месте
    description: >
      Председатель отказал по результатам очного осмотра. Заказчик
      забирает товар обратно. Гарантийный возврат завершён, движений
      по имуществу и средствам не происходит.
    kind: final

transitions:
  - from: "∅"
    to: pending_review
    action: marketplace::submretrn
    actor: orderer
    guards:
      - Заявитель — заказчик-пайщик исходного заказа, по которому имущество уже выдано.
      - Гарантийный срок, заданный поставщиком в предложении, ещё не истёк.
      - К заявлению приложены фотографии товара и указана причина возврата.

  - from: pending_review
    to: approved_for_visit
    action: marketplace::aprretrem
    actor: chairman
    guards:
      - Председатель решил пригласить заказчика на очный осмотр.

  - from: pending_review
    to: rejected_remote
    action: marketplace::rejretrem
    actor: chairman
    guards:
      - Председатель решил отказать в гарантийном возврате удалённо с указанием причины.

  - from: approved_for_visit
    to: return_accepted
    action: marketplace::accretrn
    actor: chairman
    ledger_code: p.mkt.return
    operations:
      - o.mkt.return
      - o.mkt.return2
    guards:
      - Заказчик прибыл на участок с продукцией.
      - Председатель очно осмотрел имущество и решил принять гарантийный возврат.
      - Гарантийный срок ещё не истёк.

  - from: approved_for_visit
    to: rejected_at_ku
    action: marketplace::rejretrn
    actor: chairman
    guards:
      - Председатель очно осмотрел имущество и решил отказать в гарантийном возврате с указанием причины.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления
      actor: orderer
      action: marketplace::submretrn
      description: >
        Заказчик подаёт заявление на гарантийный возврат имущества:
        указывает причину обращения, прикладывает фотографии товара,
        ссылается на акт приёма-передачи, по которому получал имущество.
        Подать заявление
        можно только пока не истёк гарантийный срок, заданный
        поставщиком.
      pre:
        - Заказ закрыт, имущество выдано заказчику.
        - Гарантийный срок ещё не истёк.
        - Приложены фотографии товара и указана причина обращения.
      post:
        - Заявление зарегистрировано и направлено председателю на рассмотрение.

    - step: 2
      title: Удалённое рассмотрение — приглашение на очный визит
      actor: chairman
      action: marketplace::aprretrem
      description: >
        Председатель участка изучает заявление и приложенные материалы
        и решает, что для разбора обращения нужен очный осмотр товара.
        Заказчику предстоит прийти на участок с продукцией.
      pre:
        - Заявление на рассмотрении.
      post:
        - Очный визит одобрен.

    - step: 3
      title: Очный осмотр — принятие возврата
      actor: chairman
      action: marketplace::accretrn
      description: >
        Заказчик приходит на участок с продукцией. Председатель очно
        осматривает товар и принимает гарантийный возврат: товар
        остаётся на складе участка, сумма заказа возвращается
        заказчику на программный членский кошелёк Стола заказов.
      pre:
        - Очный визит одобрен.
        - Заказчик прибыл на участок с продукцией.
      post:
        - Товар остаётся на складе участка.
        - Сумма заказа возвращена заказчику на программный членский кошелёк.

  alternatives:
    - branch: Гарантийный срок истёк
      at_step: 1
      action: null
      actor: orderer
      description: >
        Если гарантийный срок поставщика истёк, заявление на гарантийный
        возврат подать нельзя.

    - branch: Удалённое рассмотрение — отказ
      at_step: 2
      action: marketplace::rejretrem
      actor: chairman
      description: >
        Председатель отказывает в гарантийном возврате удалённо с
        указанием причины — например, обращение очевидно не подпадает
        под гарантию. Решение финальное, движений по имуществу и
        средствам не происходит.

    - branch: Очный осмотр — отказ
      at_step: 3
      action: marketplace::rejretrn
      actor: chairman
      description: >
        Председатель отказывает в гарантийном возврате по результатам
        очного осмотра с указанием причины — например, характер
        повреждений не покрывается гарантией. Заказчик забирает товар
        обратно. Решение финальное, движений по имуществу и средствам
        не происходит.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# В процессе подписывается заявление пайщика на возврат с приложениями
# (фото товара). Решение председателя — процедурное действие в системе,
# отдельным документом не оформляется в MVP (фиксируется в стейт-машине
# return_request с кем и когда принято решение). Если регулятор / устав
# потребуют документного оформления решения председателя — это будет
# отдельным шаблоном (TODO).
documents:
  - action: marketplace::submretrn
    title: Заявление пайщика на гарантийный возврат имущества
    registry_id: 800
    signed_by: [orderer]
    stored_in: return_requests.statement
    note: "Используется существующий шаблон 800.ReturnByAssetStatement из cooptypes/cooperative/registry/. Оригинально создан под клиринговую модель donor'а («Заявление на возврат паевого взноса имуществом»); форма заявления пайщика на возврат структурно подходит и для членской модели гарантийного возврата. При необходимости методолог может создать специализированный шаблон в новой серии (1100+) — тогда registry_id обновится."

  - action: marketplace::accretrn
    title: Решение председателя КУ о принятии гарантийного возврата
    registry_id: 0
    signed_by: [chairman]
    stored_in: return_requests.chairman_decision
    note: "TODO: в MVP решение принимается единолично председателем КУ, не советом — существующий шаблон 801.ReturnByAssetDecision не подходит (рассчитан на коллегиальное решение совета по новации). Создать специализированный шаблон в registry либо оформлять как in-system запись без отдельного документа."

# ── Секция 6. Операции (Ledger2) ────────────────────────────────────────────
# Одна ledger2-операция — compensating forward к o.mkt.consum (без
# использования ledger2::revert). Атомарно: восстановление .available
# на программном кошельке пайщика + проводка Дт 10 / Кт 86 (обратная
# к выдаче).
operations:
  - ledger_code: o.mkt.return
    human_name: Гарантийный возврат — восстановление средств в программе
    wallet_op: ISSUE
    # L1 — часть 1 композитной проводки через транзит счёта 91 (зеркало
    # выдачи): Дт 91 / Кт 86 — восстановление «прочих» за счёт ЦФ.
    # Закрытие транзита выполняется отдельной операцией o.mkt.return2
    # (Дт 10 / Кт 91), атомарно с o.mkt.return в той же транзакции
    # accretrn. Согласовано с Ангелиной 2026-05-11.
    debit: 91                      # Прочие доходы и расходы (NEW)
    credit: 86                     # Целевое финансирование
    # L2 — восстановление средств в программе
    wallet_from: null              # эмиссия — источника нет
    wallet_to: w.mkt.member        # ЦПП «Стол Заказов» — программный кошелёк
    # L3 — пайщику восстанавливается available на программном кошельке
    user_wallet: w.mkt.member
    user_ref: return_request.orderer
    available_delta: +order.fact_cost
    blocked_delta: null
    amount_ref: order.fact_cost
    triggered_by: marketplace::accretrn
    description: >
      Compensating forward к выдаче имущества (o.mkt.consum), часть 1
      композитной бухгалтерской проводки через транзит счёта 91. ISSUE на
      пайщикском w.mkt.member — .available +fact_cost (восстановление ранее
      списанной суммы); проводка Дт 91 / Кт 86 — восстановление «прочих»
      за счёт ЦФ (зеркало 91-стороны от o.mkt.consum). Сразу после этой
      операции в той же транзакции accretrn контракт вызывает
      o.mkt.return2 (Дт 10 / Кт 91, NONE) — имущество назад на склад через
      закрытие транзита. Транзит через 91 симметричен выбытию на выдаче —
      согласовано с Ангелиной 2026-05-11. Журнал содержит payload
      original_consume_op_id (ссылка на исходный o.mkt.consum для
      трассировки) — это **прикладное поле**, не часть инфраструктуры
      revert. Дальнейшая судьба возвращённого имущества — вне этого
      процесса.
      Пайщик может потратить возвращённую сумму на следующий заказ в Столе
      заказов либо вывести в общий членский кошелёк (w.wal.member) через
      отдельную операцию o.mkt.recall — там средства универсальны между
      программами.

  - ledger_code: o.mkt.return2
    human_name: Гарантийный возврат — закрытие транзита
    wallet_op: NONE
    # L1 — часть 2 композитной проводки: Дт 10 / Кт 91 (имущество назад
    # на склад через закрытие транзита). Зеркало 91-стороны от o.mkt.csmcls.
    debit: 10                      # Материалы (NEW) — имущество на складе
    credit: 91                     # Прочие доходы и расходы (NEW)
    # L2 / L3 — без движения по кошелькам (склад — аналитика по счёту 10)
    wallet_from: null
    wallet_to: null
    user_wallet: null
    user_ref: null
    available_delta: null
    blocked_delta: null
    amount_ref: order.fact_cost
    triggered_by: marketplace::accretrn
    description: >
      Закрытие транзита счёта 91 после восстановления членского взноса
      пайщика. NONE — только бухпроводка Дт 10 / Кт 91, кошельки не
      двигаются. Срабатывает атомарно с o.mkt.return в той же транзакции
      accretrn. По итогу пары operations нетто-эффект — Дт 10 / Кт 86
      (имущество возвращается на склад + восстановление обязательства
      по целевой программе), 91 проходит нулевым транзитом.

