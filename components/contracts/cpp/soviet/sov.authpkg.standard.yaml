# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Автоматизированное принятие решений советом».
#
# Любой процесс, которому нужно согласие совета, передаёт совету пакет
# документов. Члены совета голосуют. Если набрано большинство «за»,
# председатель подписывает протокол, и согласие совета автоматически
# возвращается в исходный процесс — приём пайщика продолжается, заём
# одобряется, расход утверждается и т. д. Если совет проголосовал «против»
# или не успел в срок — исходный процесс получает отказ.
#
# Документ повестки приходит из исходного процесса (у каждого процесса он
# свой — заявление о приёме, заявление на заём и т. д.). Документ согласия
# совета — протокол решения совета.
# ─────────────────────────────────────────────────────────────────────────────

process_type: sov.authpkg
id: public_soviet_auto_authorization_process
title: Автоматизированное принятие решений советом
slug: authpkg
status: proposed
contract: soviet
purpose: >
  «Автоматизированное принятие решений» — общий механизм, которым
  пользуются все остальные процессы, требующие согласия совета.
  Исходный процесс передаёт совету пакет документов, члены совета
  голосуют, председатель подписывает протокол, и согласие совета
  автоматически возвращается в исходный процесс — он продолжается
  дальше. Так работают приём пайщика, общие собрания, займы,
  расходы, инвестиции, маркетплейс.

roles:
  - contract_initiator   # Исходный процесс, передающий совету пакет документов
  - soviet_member        # Член совета — голосует
  - chairman             # Председатель — подписывает протокол

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: soviet::newpackage
    human: Подать пакет
    actor: Контракт-инициатор
    role: opener
    purpose: >
      Исходный процесс передаёт совету пакет документов.
      В пакете заранее указано, что произойдёт в исходном процессе при
      согласии совета и что — при отказе (например, при приёме пайщика —
      зачислить его в кооператив или отклонить заявление). Совет получает
      повестку на рассмотрение.

  - name: soviet::votefor
    human: Голос «за»
    actor: Член совета
    role: progress
    purpose: >
      Член совета голосует «за» по конкретному решению. При наборе
      кворума и большинства голосов «за» решение считается одобренным
      советом.

  - name: soviet::voteagainst
    human: Голос «против»
    actor: Член совета
    role: reject
    purpose: >
      Член совета голосует «против». При достижении консенсуса по отказу
      решение считается отклонённым, и исходный процесс получает отказ.

  - name: soviet::cancelvote
    human: Отозвать голос
    actor: Член совета
    role: progress
    purpose: >
      Член совета отзывает ранее поданный голос до перехода решения
      в финальный статус.

  - name: soviet::authorize
    human: Утвердить протокол
    actor: Председатель
    role: closer
    purpose: >
      Председатель подписывает документ-протокол авторизации решения и
      прикладывает его к записи. После этого решение готово к исполнению.

  - name: soviet::exec
    human: Исполнить решение
    actor: Любой пайщик
    role: closer
    purpose: >
      Любой пайщик запускает исполнение утверждённого решения. В
      зависимости от того, какой это был процесс (выплата, накопление,
      утверждение действия и т. д.), согласие совета применяется к
      исходному процессу — и он продолжается дальше.

  - name: soviet::cancelexprd
    human: Отменить просроченное
    actor: Председатель
    role: reject
    purpose: >
      Если решение не было утверждено в срок, оно отменяется как
      просроченное, и исходный процесс остаётся без согласия совета
      (продолжения не происходит).

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: soviet::decision
entity_human: Решение совета (автоматизированное)
entity_source: cpp/soviet/src/decision/

states:
  - name: pending
    human: Пакет получен
    description: >
      Пакет документов от исходного процесса получен советом, идёт
      голосование членов совета.
    kind: normal

  - name: approved
    human: Совет проголосовал «за»
    description: >
      Достигнут консенсус «за». Ожидается подпись протокола председателем.
    kind: normal

  - name: authorized
    human: Протокол утверждён
    description: >
      Председатель подписал протокол. Решение готово к исполнению —
      согласие совета вот-вот вернётся в исходный процесс.
    kind: normal

  - name: executed
    human: Решение исполнено
    description: >
      Согласие совета применено к исходному процессу (приём подтверждён,
      действие утверждено и т. п.). Исходный процесс получил согласие
      совета и продолжается дальше.
    kind: final

  - name: rejected
    human: Отклонено
    description: >
      Совет проголосовал «против» либо решение отменено как просроченное.
      Исходный процесс получает отказ (а при просрочке — просто остаётся
      без согласия совета).
    kind: virtual
    virtual: true

transitions:
  - from: "∅"
    to: pending
    action: soviet::newpackage
    actor: Контракт-инициатор
    guards:
      - Исходный процесс имеет право обращаться к совету (находится в списке разрешённых).
      - В пакете указаны пайщик, вид решения и документ повестки.

  - from: pending
    to: approved
    action: soviet::votefor
    actor: Член совета
    guards:
      - Достигнут кворум и большинство голосов «за».

  - from: pending
    to: rejected
    action: soviet::voteagainst
    actor: Член совета
    guards:
      - Большинство голосов «против».

  - from: pending
    to: rejected
    action: soviet::cancelexprd
    actor: Председатель
    guards:
      - Истёк срок принятия решения.

  - from: approved
    to: authorized
    action: soviet::authorize
    actor: Председатель
    guards:
      - Совет одобрил решение (набрано большинство «за»).
      - Протокол решения подписан председателем.

  - from: authorized
    to: executed
    action: soviet::exec
    actor: Любой пайщик
    guards:
      - Протокол утверждён председателем.
      - Решение ещё не исполнено.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Поступление пакета
      actor: Контракт-инициатор
      action: soviet::newpackage
      description: >
        Исходный процесс (приём пайщика, заём, расход, инвестиция, общее
        собрание и т. п.) передаёт совету пакет документов и заранее
        указывает, что произойдёт при согласии и при отказе совета.
      pre:
        - Исходный процесс имеет право обращаться к совету (находится в списке разрешённых).
      post:
        - Повестка поступила в совет, началось голосование.

    - step: 2
      title: Голосование совета
      actor: Член совета
      action: soviet::votefor
      description: >
        Члены совета голосуют «за» или «против» и могут отозвать свой
        голос до окончания. При наборе большинства «за» решение считается
        одобренным.
      pre:
        - Идёт голосование по решению.
      post:
        - Решение либо одобрено советом, либо отклонено, либо отменено как просроченное.

    - step: 3
      title: Подписание протокола
      actor: Председатель
      action: soviet::authorize
      description: >
        Председатель подписывает документ-протокол авторизации решения
        и прикладывает его к записи.
      pre:
        - Совет одобрил решение (набрано большинство «за»).
      post:
        - Протокол утверждён, решение готово к исполнению.

    - step: 4
      title: Исполнение
      actor: Любой пайщик
      action: soviet::exec
      description: >
        Согласие совета применяется к исходному процессу, и он
        продолжается дальше (например, приём пайщика подтверждается).
      pre:
        - Протокол утверждён председателем.
      post:
        - Исходный процесс получил результат голосования совета и продолжился (или получил отказ).

  alternatives:
    - branch: Отказ совета
      at_step: 2
      action: soviet::voteagainst
      actor: Член совета
      description: >
        Большинство «против» — исходный процесс получает отказ
        (например, заявление о приёме отклоняется).

    - branch: Просрочка
      at_step: 2
      action: soviet::cancelexprd
      actor: Председатель
      description: >
        Решение не принято в срок и отменяется; исходный процесс
        остаётся без согласия совета.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# Документ повестки приходит из исходного процесса — у каждого он свой
# (заявление о приёме, заявление на заём и т. д.).
# Здесь фиксируем только протокол решения совета.
documents:
  - action: soviet::authorize
    title: Протокол решения совета
    registry_id: 600
    signed_by: [ Председатель ]
    stored_in: decisions.authorization
    note: >
      В большинстве автоматизированных процессов документ согласия —
      «Протокол решения совета». В отдельных процессах может применяться
      особый шаблон (например, «Решение совета о приёме пайщика»);
      в этом случае конкретику задаёт родительский стандарт процесса.

# ── Секция 6. Операции ──────────────────────────────────────────────────────
# Сам процесс голосования не двигает средства по кошелькам и не создаёт
# бухгалтерских проводок. Все движения средств происходят уже внутри
# исходных процессов после получения согласия совета.
operations: []

