# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Расход кооператива из фонда обеспечения хозяйственной деятельности»
# — как кооператив оплачивает свои расходы, не относящиеся к отдельному
# участку или программе (задача 99D-25, решение владельца 03.11.2026).
#
# По Положению о фондах расходы кооператива идут из фонда обеспечения
# хозяйственной деятельности. У фонда свой кошелёк учётной книги на счёте
# целевого финансирования: кошелёк и есть субсчёт фонда, остаток фонда —
# средства, выделенные кооперативом на расходы, оборот — расходы по факту.
# Пополняется фонд переводом председателя совета внутри целевого
# финансирования и разовым переносом прежнего учёта.
#
# Расход оформляется по общему порядку расходов по служебной записке:
# председатель совета подаёт записку с кошельком-источником — кошельком фонда,
# совет принимает решение, кассир оплачивает позиции, получатели авансов
# отчитываются. Отличие от расходов участка и программы одно: деньги уже лежат
# на кошельке фонда, поэтому отдельного шага направления в фонд нет — выплата
# списывается с фонда сразу.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.sov.spend
id: public_soviet_spend_process
title: Расход кооператива из фонда обеспечения хозяйственной деятельности
slug: spend
status: proposed
contract: soviet
purpose: >
  Кооператив оплачивает расходы, которые не относятся к отдельному участку
  или программе, из фонда обеспечения хозяйственной деятельности. Председатель
  совета подаёт служебную записку с позициями расхода, совет принимает решение,
  кассир оплачивает позиции организациям по счёту или пайщикам авансом под
  отчёт, получатели авансов отчитываются и возвращают неизрасходованное.
  Каждая выплата списывается с кошелька фонда, поэтому бухгалтер видит по
  фонду все расходы кооператива по факту — так требует Положение о фондах.

roles:
  - Председатель совета
  - Совет
  - Кассир
  - Получатель аванса

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Собственных действий у процесса нет: записку, решение, оплату и отчёты ведёт
# общий порядок расходов по служебной записке (контракт Expense) с кошельком
# фонда как источником средств. Операции ниже возникают на его шагах.
actions: []

# ── Секция 3. Сущность и состояния ──────────────────────────────────────────
# Сущность процесса — служебная записка общего порядка расходов; своей записи
# у кооператива нет, в отличие от расхода участка или программы.
entity: null
entity_human: null
entity_source: cpp/expense/

states: []

transitions: []

# ── Секция 4. Документы ─────────────────────────────────────────────────────
# Служебная записка и протокол совета — документы общего порядка расходов.
documents: []

# ── Секция 5. Операции ledger2 ──────────────────────────────────────────────
operations:
  - ledger_code: o.sov.spend
    human_name: Прямая оплата расхода кооператива по реквизитам
    wallet_op: BURN
    # Дт 86 / Кт 51: целевое финансирование уменьшается, деньги списываются
    # с расчётного счёта кооператива.
    debit: 86
    credit: 51
    wallet_from: w.sov.expns       # Фонд обеспечения хозяйственной деятельности
    wallet_to: null
    amount_ref: сумма позиции расхода
    triggered_by: expense::payexp
    description: >
      Кассир подтвердил банковский перевод получателю-организации по
      реквизитам, указанным в расходе; деньги списаны с кошелька фонда.

  - ledger_code: o.sov.expadv
    human_name: Выдача аванса под отчёт по расходу кооператива
    wallet_op: TRANSFER
    debit: 86
    credit: 51
    wallet_from: w.sov.expns
    wallet_to: w.exp.adv           # Подотчётные средства пайщика
    l3:
      - user_wallet: w.exp.adv
        user_ref: получатель аванса
        available_delta: +amount
        blocked_delta: null
    amount_ref: сумма позиции расхода
    triggered_by: expense::payexp
    description: >
      Кассир выдал пайщику аванс под отчёт на его реквизиты с кошелька фонда.
      За пайщиком числится подотчётная сумма до того, как он отчитается
      документами.

  - ledger_code: o.sov.exprpt
    human_name: Закрытие подотчёта по расходу кооператива
    wallet_op: BURN
    # Проводка сделана при выдаче аванса — отчёт её не повторяет.
    debit: null
    credit: null
    wallet_from: w.exp.adv
    wallet_to: null
    l3:
      - user_wallet: w.exp.adv
        user_ref: получатель аванса
        available_delta: -amount
        blocked_delta: null
    amount_ref: фактически потраченная сумма
    triggered_by: expense::reportexp
    description: >
      Пайщик отчитался документами о потраченном — подотчётная сумма с него
      снимается.

  - ledger_code: o.sov.expret
    human_name: Возврат неиспользованного аванса по расходу кооператива
    wallet_op: TRANSFER
    debit: 51
    credit: 86
    wallet_from: w.exp.adv
    wallet_to: w.sov.expns
    l3:
      - user_wallet: w.exp.adv
        user_ref: получатель аванса
        available_delta: -amount
        blocked_delta: null
    amount_ref: неиспользованная часть аванса
    triggered_by: expense::returnexp
    description: >
      Пайщик вернул неиспользованную часть аванса — деньги пришли на
      расчётный счёт кооператива и вернулись на кошелёк фонда.

  - ledger_code: o.sov.expovr
    human_name: Доплата сверх аванса по расходу кооператива
    wallet_op: TRANSFER
    debit: 86
    credit: 51
    wallet_from: w.sov.expns
    wallet_to: w.exp.adv
    l3:
      - user_wallet: w.exp.adv
        user_ref: получатель аванса
        available_delta: +amount
        blocked_delta: null
    amount_ref: сумма перерасхода
    triggered_by: expense::overspendexp
    description: >
      Пайщик потратил больше выданного аванса — кооператив доплачивает
      разницу с кошелька фонда, после чего подотчёт закрывается на полную сумму.

# ── Связи с другими процессами ──────────────────────────────────────────
# Только по межконтрактным вызовам: consumes — процесс вызывает другой,
# provides — другой процесс вызывает этот.
related:
  - process_type: p.exp.expns
    relation: consumes
    note: >
      Расход кооператива оформляется в общем процессе «Расход по служебной
      записке»: там служебная записка и протокол совета, оплата позиций
      кассиром и отчёты получателей авансов; кошелёк-источник записки —
      кошелёк фонда обеспечения хозяйственной деятельности.
