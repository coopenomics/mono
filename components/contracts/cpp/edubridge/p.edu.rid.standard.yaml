# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Паевой взнос преподавателя результатом интеллектуальной
# деятельности» — кооперативный процесс приёма в паевой фонд результата
# работы преподавателя (методики, курса, учебных материалов) по целевой
# потребительской программе «Образование».
#
# Преподаватель — пайщик кооператива, участвующий в хозяйственной
# деятельности по договору. Выполнив работу по курсу, он подаёт Заявление о
# паевом взносе результатом интеллектуальной деятельности (РИД) с оценкой
# результата. Совет рассматривает заявление и принимает решение. При
# положительном решении преподаватель и председатель подписывают Акт
# приёма-передачи, и паевой фонд пополняется: результат принимается как
# нематериальный актив кооператива, а преподавателю зачисляется паевой
# взнос на его главный паевой кошелёк. При отказе совета движений нет.
#
# **Модель кошельков:** единственное движение средств — зачисление паевого
# взноса преподавателю (Дт 04 / Кт 80) на главный паевой кошелёк. Это право
# требования: возврат паевого взноса идёт штатным механизмом платформы по
# заявлению о возврате, отдельного пути возврата у процесса нет.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# Источники правды в коде:
#   • cpp/edubridge/edubridge.hpp                     — actions
#   • cpp/edubridge/src/p.edu.rid/                    — реализация
#   • cpp/lib/core/ledger2/operations.hpp             — OPERATION_REGISTRY
#                                                       расширение o.edu.rid
#   • cpp/lib/core/ledger2/processes.hpp              — processes::edubridge::RID
#   • cpp/lib/core/ledger2/wallets.hpp                — w.wal.share
#   • cpp/lib/core/ledger2/accounts.hpp               — Нематериальные активы (04),
#                                                       Паевой фонд (80)
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.edu.rid
id: public_edubridge_rid_process
title: Паевой взнос преподавателя результатом интеллектуальной деятельности
slug: rid
status: proposed
contract: edubridge
purpose: >
  Штатный путь, которым преподаватель вносит в кооператив результат своей
  работы по курсу — методику, программу, учебные материалы — как паевой
  взнос. Преподаватель подаёт Заявление о паевом взносе результатом
  интеллектуальной деятельности с оценкой результата и его видом. Совет
  рассматривает заявление и принимает решение, оформляемое протоколом.

  При положительном решении преподаватель и председатель подписывают Акт
  приёма-передачи: результат принимается кооперативом как нематериальный
  актив, а преподавателю зачисляется паевой взнос на его главный паевой
  кошелёк. Этот взнос — право требования: преподаватель может вернуть его
  штатным заявлением о возврате паевого взноса.

  При отказе совета заявление закрывается протоколом, движений по
  имуществу и средствам не происходит.
roles:
  - teacher         # пайщик-преподаватель, автор результата
  - council         # совет кооператива (принимает решение по заявлению)
  - chairman        # председатель кооператива (подписывает акт со стороны кооператива)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Имена actions ≤12 символов eosio::name. Документы подписывают участники,
# в кооперативную сеть их передаёт кооператив.
actions:
  - name: edubridge::submitrid
    human: Подать заявление о паевом взносе результатом работы
    actor: teacher
    role: opener
    purpose: >
      Преподаватель подаёт Заявление о паевом взносе результатом
      интеллектуальной деятельности: указывает задание, по которому выполнена
      работа, вид результата и его оценку в денежном выражении. Заявление
      публикуется в реестре документов и поступает на рассмотрение совета.
      Движений по средствам нет.

  - name: edubridge::acceptrid
    human: Принять результат в паевой фонд
    actor: chairman
    role: closer
    purpose: >
      По положительному решению совета (Протокол) и подписанному обеими
      сторонами Акту приёма-передачи результат принимается кооперативом как
      нематериальный актив, а преподавателю зачисляется паевой взнос на
      сумму оценки. Протокол и акт публикуются в реестре документов.

  - name: edubridge::declinerid
    human: Отказать в приёме результата
    actor: chairman
    role: reject
    purpose: >
      По отрицательному решению совета (Протокол) заявление закрывается.
      Протокол публикуется в реестре документов. Движений по имуществу и
      средствам нет; преподаватель может доработать результат и подать новое
      заявление.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: edubridge::edu_rid (таблица edurids, scope=coopname). Запись живёт
# только в ожидании решения совета; приём или отказ завершают жизненный цикл —
# запись удаляется, история — в реестре документов и журнале действий.
entity: edubridge::edu_rid
entity_human: Заявление о паевом взносе результатом интеллектуальной деятельности
entity_source: cpp/edubridge/src/p.edu.rid/

states:
  - name: submitted
    human: На рассмотрении совета
    description: >
      Заявление подано и опубликовано. Ожидается решение совета по типовому
      процессу решения совета.
    kind: normal

transitions:
  - from: "∅"
    to: submitted
    action: edubridge::submitrid
    actor: teacher
    guards:
      - Преподаватель — действующий член кооператива.
      - Заявление подписано преподавателем; оценка результата больше нуля.

  - from: submitted
    to: "∅"
    action: edubridge::acceptrid
    actor: chairman
    ledger_code: p.edu.rid
    operations:
      - o.edu.rid
    guards:
      - Совет принял положительное решение, Протокол подписан.
      - Акт приёма-передачи подписан преподавателем и председателем.
      - Результат принят как нематериальный актив, преподавателю зачислен
        паевой взнос на сумму оценки.

  - from: submitted
    to: "∅"
    action: edubridge::declinerid
    actor: chairman
    guards:
      - Совет принял отрицательное решение, Протокол подписан.
      - Движений по имуществу и средствам нет.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления преподавателем
      actor: teacher
      action: edubridge::submitrid
      description: >
        Преподаватель, завершив работу по курсу, подписывает Заявление о
        паевом взносе результатом интеллектуальной деятельности: указывает
        задание, вид результата (методика, курс, материалы) и его оценку.
        Заявление публикуется в реестре документов и поступает на
        рассмотрение совета.
      pre:
        - Преподаватель — действующий член кооператива, участвующий в
          хозяйственной деятельности по договору.
        - Работа по курсу выполнена.
      post:
        - Заявление опубликовано в реестре документов.
        - Заявление ожидает решения совета.

    - step: 2
      title: Рассмотрение заявления советом
      actor: council
      action: null
      description: >
        Совет рассматривает заявление по типовому процессу решения совета
        и принимает решение, оформляемое Протоколом. При положительном
        решении стороны переходят к подписанию акта; при отрицательном —
        заявление закрывается (см. альтернативу).
      pre:
        - Заявление ожидает решения совета.
      post:
        - Протокол совета подписан.

    - step: 3
      title: Подписание акта и приём результата в паевой фонд
      actor: chairman
      action: edubridge::acceptrid
      description: >
        Преподаватель и председатель подписывают Акт приёма-передачи
        паевого взноса. Результат принимается кооперативом как
        нематериальный актив, преподавателю зачисляется паевой взнос на
        сумму оценки на его главный паевой кошелёк. Протокол и акт
        публикуются в реестре документов.
      pre:
        - Совет принял положительное решение, Протокол подписан.
        - Акт подписан обеими сторонами.
      post:
        - Результат учтён как нематериальный актив кооператива (Дт 04 / Кт 80).
        - Преподавателю зачислен паевой взнос.

  alternatives:
    - branch: Совет отказал в приёме результата
      at_step: 2
      action: edubridge::declinerid
      actor: chairman
      description: >
        Совет принял отрицательное решение — например, оценка результата не
        обоснована или результат не соответствует заданию. Протокол
        публикуется в реестре документов, заявление закрывается. Движений
        по имуществу и средствам нет; преподаватель может доработать
        результат и подать новое заявление.

    - branch: Возврат паевого взноса преподавателю
      at_step: 3
      action: null
      actor: teacher
      description: >
        Зачисленный паевой взнос — право требования преподавателя к
        кооперативу. Возврат идёт штатным процессом возврата паевого взноса
        по заявлению пайщика; отдельного пути возврата у настоящего
        процесса нет.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# Договор участия и приложение по курсу подписываются до начала работы;
# заявление, протокол и акт — документы самого процесса.
documents:
  - action: null
    title: Оферта преподавателя
    registry_id: 3004
    signed_by: [teacher]
    stored_in: "реестр документов кооператива"
    note: "Подписывается преподавателем при вступлении в программу. Шаблон оферты (3003) принимает совет. Источник правды — components/cooptypes/src/cooperative/registry/3004.EducationTeacherOffer"

  - action: null
    title: Договор участия в хозяйственной деятельности
    registry_id: 3006
    signed_by: [teacher]
    stored_in: "реестр документов кооператива"
    note: "Подписывается преподавателем до начала работы по курсам. Шаблон договора (3005) принимает совет. Источник правды — components/cooptypes/src/cooperative/registry/3006.EducationParticipationContract"

  - action: null
    title: Приложение к договору участия по курсу
    registry_id: 3007
    signed_by: [teacher]
    stored_in: "реестр документов кооператива"
    note: "Подписывается преподавателем на каждый курс: название, расписание, ожидаемый результат, период. Источник правды — components/cooptypes/src/cooperative/registry/3007.EducationCourseAnnex"

  - action: edubridge::submitrid
    title: Заявление о паевом взносе результатом интеллектуальной деятельности
    registry_id: 3008
    signed_by: [teacher]
    stored_in: "реестр документов (package = rid_hash); hash — edurids.statement_hash"
    note: "Подписывается преподавателем при подаче. Содержит задание, вид и оценку результата, описание результата со ссылками. Источник правды — components/cooptypes/src/cooperative/registry/3008.EducationRidStatement"

  - action: edubridge::acceptrid
    title: Протокол совета о приёме паевого взноса РИД
    registry_id: 3009
    signed_by: [chairman]
    stored_in: "реестр документов (package = rid_hash)"
    note: "Протокол по типовому процессу решения совета; один и тот же документ оформляет и приём (acceptrid), и отказ (declinerid). Источник правды — components/cooptypes/src/cooperative/registry/3009.EducationRidDecision"

  - action: edubridge::acceptrid
    title: Акт приёма-передачи паевого взноса РИД
    registry_id: 3010
    signed_by: [teacher, chairman]
    stored_in: "реестр документов (package = rid_hash)"
    note: "Двухподписный акт: первым подписывает преподаватель, вторым — председатель по хэшу. Завершающий документ пути. Источник правды — components/cooptypes/src/cooperative/registry/3010.EducationRidAct"

# ── Секция 6. Операции (Ledger2) ────────────────────────────────────────────
# Одна операция — приём результата в паевой фонд с зачислением паевого взноса
# преподавателю. Срабатывает в транзакции приёма (acceptrid).
operations:
  - ledger_code: o.edu.rid
    human_name: Приём результата интеллектуальной деятельности преподавателя в паевой фонд
    wallet_op: ISSUE
    # L1 — двойная запись: результат принимается как нематериальный актив,
    # паевой фонд увеличивается.
    debit: 4                       # Нематериальные активы
    credit: 80                     # Паевой фонд
    # L2 — первичный вход средств на паевой кошелёк (источник вне системы)
    wallet_from: null
    wallet_to: w.wal.share         # Паевой взнос пайщика
    # L3 — движение по кошельку преподавателя
    user_wallet: w.wal.share
    user_ref: teacher
    available_delta: "+amount"
    blocked_delta: null
    amount_ref: edu_rid.amount
    triggered_by: edubridge::acceptrid
    description: >
      Приём результата интеллектуальной деятельности преподавателя в паевой
      фонд по решению совета и акту приёма-передачи. Двойная запись
      Дт 04 / Кт 80 — результат учитывается как нематериальный актив,
      паевой фонд растёт на сумму оценки. Преподавателю зачисляется паевой
      взнос на главный паевой кошелёк — право требования, возвращаемое
      штатным заявлением о возврате паевого взноса.
