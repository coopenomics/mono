# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Доступ к курсу» — кооперативный процесс оплаты обучения по целевой
# потребительской программе «Образование» (приложение «Образовательный мост»).
#
# Пайщик (родитель-слушатель) оплачивает доступ обучающегося к курсу
# членским взносом программы. Членский взнос вносится только конвертацией
# паевого взноса: пайщик подаёт Заявление о конвертации, и сумма с его
# паевого кошелька переходит в членский кошелёк программы «Образование».
# После внесения взноса кооператив открывает подписку на курс на оплаченный
# период (месяц либо весь курс разом); следующий период оплачивается новым заявлением и
# продлевает подписку. По истечении оплаченного срока подписка закрывается.
#
# **Удержание взноса.** Правило одно: удержано не меньше того, что участник
# может потребовать назад прямо сейчас. Взнос сразу после списания в фонд
# удерживается целиком и на расходы программы не идёт. Длительность
# гарантийного срока объявляет кооператив в курсе, а отсчёт у каждого ученика
# свой: от более поздней из двух дат — начала занятий и дня, когда он вписался
# в курс. Вписавшийся в идущий курс получает свои дни гарантии; продление срок
# заново не запускает. Пока срок идёт, удержан весь взнос. После него удержание тает
# вместе с возвратной суммой по Положению: кооператив освобождает то, что
# вернуть уже нельзя. Поэтому возврат всегда обеспечен деньгами, а в фонде
# лежит только свободное. Отмена и закрытие подписки возвращают удержанное в
# фонд сами.
#
# **Резерв выплат преподавателям.** Преподаватель получает за проведённые часы
# по плановой ставке курса, сколько бы учеников на них ни пришло. Поэтому
# резерв наполняется из освобождённых взносов до обязательства перед
# преподавателями за оплаченное учениками время курса — и не больше. Всё сверх
# него остаётся в фонде свободными средствами: на групповом курсе бюджет
# преподавателя закрывает первый взнос, остальные свободны целиком. Когда
# оплаченное время сокращается (участник ушёл), лишний резерв возвращается в
# фонд.
#
# **Модель кошельков:** восемь движений. Конвертация паевого в членский взнос
# (Дт 80 / Кт 86) и списание внесённого взноса в фонд программы — он переходит
# в распоряжение кооператива, который ведёт на эти средства обучение. Из фонда
# взнос сразу уходит на удержание и возвращается в фонд по мере того, как
# участник теряет право потребовать его назад. Из освобождённого кооператив
# добирает резерв выплат преподавателям, излишек резерва возвращает в фонд.
# При отмене подписки взнос возвращается из фонда на кошелёк программы
# участника и идёт на новые подписки. В паевой (Дт 86 / Кт 80) членский взнос
# программы возвращается только с прекращением участия в программе: при отмене
# курса по недобору, по заявлению пайщика об аннулировании соглашения о программе и при его выходе
# из кооператива. Сама подписка фиксирует, кто, на какой курс
# и до какой даты оплатил доступ, сколько по ней собрано, удержано и
# зарезервировано.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# Источники правды в коде:
#   • cpp/edubridge/edubridge.hpp                     — actions
#   • cpp/edubridge/src/p.edu.access/                 — реализация
#   • cpp/lib/core/ledger2/operations.hpp             — OPERATION_REGISTRY
#                                                       расширение o.edu.conv,
#                                                       o.edu.fee, o.edu.lock,
#                                                       o.edu.unlock, o.edu.allot,
#                                                       o.edu.free, o.edu.refund,
#                                                       o.edu.retshr
#   • cpp/lib/core/ledger2/processes.hpp              — processes::edubridge::ACCESS
#   • cpp/lib/core/ledger2/wallets.hpp                — w.edu.member, w.edu.fund,
#                                                       w.edu.escrow, w.edu.teach
#   • cpp/lib/core/ledger2/accounts.hpp               — Паевой фонд (80),
#                                                       Целевое финансирование (86)
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.edu.access
id: public_edubridge_access_process
title: Доступ к курсу
slug: access
status: proposed
contract: edubridge
purpose: >
  Штатный путь оплаты обучения по программе «Образование». Пайщик, чей
  ребёнок или он сам проходит курс, вносит членский взнос программы за
  оплачиваемый период — месяц либо весь курс разом. Взнос вносится конвертацией паевого
  взноса: пайщик подписывает Заявление о конвертации, и указанная сумма с
  его паевого кошелька переходит в членский кошелёк программы
  «Образование». По внесённому взносу кооператив открывает обучающемуся
  подписку на курс до конца оплаченного периода.

  Следующий период оплачивается так же — новым Заявлением о конвертации,
  после которого подписка продлевается. Когда оплаченный срок истёк и
  продления не было, кооператив закрывает подписку: доступ к курсу
  прекращается, история оплат сохраняется в реестре документов и журнале
  действий.

  Внесённый членский взнос переходит в фонд программы — в распоряжение
  кооператива, который ведёт на эти средства обучение. Паевой взнос пайщика
  при этом уменьшается ровно на сумму конвертации.

  Подписку можно отменить. До начала занятий взнос возвращается целиком;
  если кооператив не набрал группу и отменил курс — целиком и сразу в паевой
  взнос; при отказе в ходе обучения возвращается половина стоимости
  неиспользованных занятий. Возврат ложится на кошелёк программы участника и
  идёт на другие подписки. В паевой взнос членский взнос программы
  возвращается с прекращением участия в программе — по заявлению пайщика и
  согласованию кооперативом: подписки закрываются с возвратом по Положению, и
  весь остаток кошелька программы переходит в паевой.
roles:
  - member          # пайщик — родитель-слушатель, плательщик по курсу
  - cooperative     # кооператив (ведёт подписки по внесённым взносам)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Имена actions ≤12 символов eosio::name. Документ подписывает пайщик,
# в кооперативную сеть его передаёт кооператив.
actions:
  - name: edubridge::convert
    human: Внести членский взнос конвертацией паевого
    actor: member
    role: opener
    purpose: >
      Пайщик подаёт Заявление о конвертации паевого взноса в членский взнос
      по программе «Образование» на сумму оплачиваемого периода курса.
      Сумма переходит с паевого кошелька пайщика в членский кошелёк
      программы. Заявление публикуется в реестре документов кооператива.
      Требуется достаточный остаток паевого взноса.

  - name: edubridge::chargefee
    human: Списать взнос в фонд программы
    actor: cooperative
    role: progress
    purpose: >
      Внесённый членский взнос переходит с кошелька пайщика в фонд программы:
      кооператив принимает стоимость подписки в своё распоряжение и ведёт на
      неё обучение. Списывается ровно сумма оплаченного периода.

  - name: edubridge::lockfee
    human: Удержать взнос до конца гарантийного срока
    actor: cooperative
    role: progress
    purpose: >
      Списанный в фонд взнос кооператив сразу удерживает целиком: пока
      участник может потребовать его назад, на расходы программы он не идёт.
      Удерживается не больше собранного по подписке.

  - name: edubridge::unlockfee
    human: Разблокировать взнос по истечении гарантийного срока
    actor: cooperative
    role: progress
    purpose: >
      Кооператив освобождает ту часть удержанного, которую участник вернуть
      уже не может. Пока идёт гарантийный срок ученика, удержан весь взнос;
      после него удержанным остаётся сумма возврата по Положению на этот день,
      она уменьшается по мере прохождения курса. Освобождённое уходит в фонд,
      и в той же операции резерв выплат преподавателям добирается из него до
      обязательства по курсу (edubridge::allotfee). Разблокируется не больше
      удержанного по подписке.

  - name: edubridge::allotfee
    human: Выделить резерв выплат преподавателям
    actor: cooperative
    role: progress
    purpose: >
      Из освобождённых взносов кооператив добирает резерв выплат
      преподавателям до обязательства перед ними за оплаченное время курса —
      часы по плановой ставке. Сверх обязательства в резерв ничего не уходит,
      остальное остаётся в фонде свободными средствами. В резерв уходит не
      больше собранного по подписке.

  - name: edubridge::regstatement
    human: Опубликовать заявление о взносе с кошелька программы
    actor: member
    role: progress
    purpose: >
      Когда взнос за период целиком покрыт остатком кошелька программы
      участника, конвертации паевого взноса нет. Подписанное участником
      заявление публикуется в реестре документов отдельно — в той же операции,
      что открытие либо продление подписки.

  - name: edubridge::opensub
    human: Открыть подписку на курс
    actor: cooperative
    role: progress
    purpose: >
      По внесённому членскому взносу кооператив открывает обучающемуся
      подписку на курс: фиксируется плательщик, обучающийся, курс, период
      (месяц либо весь курс разом) и дата, до которой оплачен доступ. Подписка ссылается
      на Заявление о конвертации, которым оплачен первый период.

  - name: edubridge::extendsub
    human: Продлить подписку
    actor: cooperative
    role: progress
    purpose: >
      После внесения членского взноса за следующий период кооператив
      сдвигает дату окончания оплаченного доступа вперёд. Новая дата всегда
      позже прежней; подписка начинает ссылаться на Заявление о
      конвертации, которым оплачен новый период.

  - name: edubridge::cancelsub
    human: Отменить подписку с возвратом взноса
    actor: cooperative
    role: closer
    purpose: >
      Подписка отменяется по просьбе пайщика либо вместе с курсом, на который
      кооператив не набрал группу. Сумму возврата кооператив считает по
      Положению о программе: до начала занятий и при недоборе — взнос
      целиком, при отказе в ходе обучения — половина стоимости
      неиспользованных занятий. Возврат приходит из фонда программы на
      кошелёк программы участника; при недоборе — сразу в его паевой взнос.
      Доступ к курсу прекращается.

  - name: edubridge::freereserve
    human: Высвободить резерв выплат преподавателям
    actor: cooperative
    role: progress
    purpose: >
      Подписка отменена либо закрыта, и оплаченное время курса сократилось —
      часть резерва преподавателям больше не понадобится. Сразу после
      закрытия кооператив возвращает в фонд то, что лежит в резерве сверх
      обязательства по курсу.

  - name: edubridge::retshare
    human: Прекратить участие в программе
    actor: member
    role: closer
    purpose: >
      Пайщик подаёт заявление об аннулировании соглашения об участии в
      программе «Образование» — тот же бланк, что при выходе из кооператива,
      только без выхода и с одной этой программой в таблице.
      Положение о программе требует согласования такого заявления
      кооперативом. После согласования кооператив закрывает все подписки
      пайщика с возвратом по Положению, весь остаток кошелька программы
      переходит на его паевой кошелёк, соглашение об участии в программе
      аннулируется, заявление публикуется в реестре документов. Частичного
      перевода в паевой нет. Отклонённое заявление ничего не меняет — участие
      продолжается. Чтобы снова учиться, пайщик подписывает оферту программы
      заново.

  - name: edubridge::expiresub
    human: Закрыть подписку
    actor: cooperative
    role: closer
    purpose: >
      По истечении оплаченного срока без продления (или досрочно по решению
      кооператива, например при выходе пайщика) кооператив закрывает
      подписку — доступ к курсу прекращается. Взнос, ещё удержанный по
      подписке, возвращается в фонд: оплаченный срок кончился, и по подписке
      больше нечего возвращать. Других движений по средствам нет.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: edubridge::edu_subscription (таблица edusubs, scope=coopname).
# Запись живёт, пока подписка активна; закрытие стирает запись, история
# оплат — в реестре документов и журнале действий.
entity: edubridge::edu_subscription
entity_human: Подписка на курс
entity_source: cpp/edubridge/src/p.edu.access/

states:
  - name: active
    human: Подписка активна
    description: >
      Членский взнос за период внесён, обучающийся имеет доступ к курсу до
      даты окончания оплаченного периода. Подписка может быть продлена
      очередным взносом.
    kind: normal

transitions:
  - from: "∅"
    to: active
    action: edubridge::opensub
    actor: cooperative
    ledger_code: p.edu.access
    operations:
      - o.edu.conv
      - o.edu.fee
      - o.edu.lock
    guards:
      - Взнос удерживается целиком сразу после списания (o.edu.lock).
      - Пайщик — действующий член кооператива.
      - Пайщик подписал Заявление о конвертации на сумму периода, и сумма
        переведена с паевого в членский кошелёк программы (edubridge::convert).
      - Период — месяц либо весь курс разом (год — у прежних подписок); дата окончания оплаты в будущем.

  - from: active
    to: active
    action: edubridge::extendsub
    actor: cooperative
    ledger_code: p.edu.access
    operations:
      - o.edu.conv
      - o.edu.fee
      - o.edu.lock
    guards:
      - Взнос за новый период удерживается целиком.
      - Пайщик подписал новое Заявление о конвертации за следующий период,
        и сумма переведена в членский кошелёк программы (edubridge::convert).
      - Новая дата окончания оплаты позже прежней.

  - from: active
    to: "∅"
    action: edubridge::cancelsub
    actor: cooperative
    ledger_code: p.edu.access
    operations:
      - o.edu.unlock
      - o.edu.refund
      - o.edu.retshr
    guards:
      - Удержанный по подписке взнос возвращается в фонд целиком (o.edu.unlock),
        и возврат участнику идёт уже из фонда.
      - Сумма возврата не больше собранного по этой подписке.
      - Резерв выплат преподавателям сверх обязательства по курсу кооператив
        возвращает в фонд сразу после отмены (edubridge::freereserve).
      - Подписка принадлежит пайщику, по чьей просьбе она отменяется, либо
        отменяется вместе с курсом по недобору.
      - Сумма возврата посчитана по Положению о программе и не отрицательна;
        нулевой возврат допустим — подписка закрывается и без него.
      - В фонде программы достаточно средств на сумму возврата.
      - Перевод в паевой взнос (o.edu.retshr) выполняется только при отмене по
        недобору.

  - from: active
    to: active
    action: edubridge::unlockfee
    actor: cooperative
    ledger_code: p.edu.access
    operations:
      - o.edu.unlock
    guards:
      - Удержанным остаётся не меньше суммы, которую участник получит при
        отказе на этот день; пока идёт гарантийный срок ученика — весь взнос.
      - Разблокируется не больше удержанного по подписке.

  - from: active
    to: active
    action: edubridge::allotfee
    actor: cooperative
    ledger_code: p.edu.access
    operations:
      - o.edu.allot
    guards:
      - Выполняется в той же операции, что разблокировка, из освобождённой
        суммы.
      - Резерв выплат преподавателям добирается до обязательства по курсу и
        не больше; остальное остаётся в фонде свободными средствами.
      - В резерв по подписке уходит не больше собранного по ней.

  - from: active
    to: "∅"
    action: edubridge::expiresub
    actor: cooperative
    ledger_code: p.edu.access
    operations:
      - o.edu.unlock
    guards:
      - Взнос, ещё удержанный по подписке, возвращается в фонд — оплаченный
        срок кончился, возвращать по подписке больше нечего.
      - Оплаченный срок истёк и продления не было, либо кооператив закрывает
        подписку досрочно по своему решению.
      - Резерв выплат преподавателям сверх обязательства по курсу кооператив
        возвращает в фонд сразу после закрытия (edubridge::freereserve).

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Внесение членского взноса за период
      actor: member
      action: edubridge::convert
      description: >
        Пайщик выбирает курс и период оплаты (месяц либо весь курс разом) и подписывает
        Заявление о конвертации паевого взноса в членский взнос по программе
        «Образование» на сумму периода. Сумма переходит с его паевого
        кошелька в членский кошелёк программы. Заявление публикуется в
        реестре документов.
      pre:
        - Пайщик — действующий член кооператива.
        - На паевом кошельке пайщика достаточно средств.
      post:
        - Членский взнос за период внесён (Дт 80 / Кт 86).
        - Взнос списан в фонд программы — в распоряжение кооператива — и
          удержан целиком.
        - Заявление о конвертации опубликовано в реестре документов.

    - step: 2
      title: Открытие подписки
      actor: cooperative
      action: edubridge::opensub
      description: >
        По внесённому взносу кооператив открывает обучающемуся подписку на
        курс до конца оплаченного периода. Обучающийся получает доступ к
        материалам курса.
      pre:
        - Членский взнос за период внесён.
      post:
        - Подписка активна до даты окончания оплаченного периода.

    - step: 3
      title: Продление подписки
      actor: cooperative
      action: edubridge::extendsub
      description: >
        Перед окончанием оплаченного периода пайщик вносит членский взнос за
        следующий период новым Заявлением о конвертации (шаг 1), после чего
        кооператив продлевает подписку — дата окончания доступа сдвигается
        вперёд. Шаг повторяется столько раз, сколько периодов оплачивает
        пайщик.
      pre:
        - Подписка активна.
        - Внесён членский взнос за следующий период.
      post:
        - Дата окончания оплаченного доступа сдвинута вперёд.

    - step: 4
      title: Закрытие подписки
      actor: cooperative
      action: edubridge::expiresub
      description: >
        Оплаченный срок истёк, нового взноса не поступило — кооператив
        закрывает подписку, доступ к курсу прекращается. История оплат
        остаётся в реестре документов и журнале действий.
      pre:
        - Оплаченный срок истёк, продления не было.
      post:
        - Подписка закрыта, доступ к курсу прекращён.

  alternatives:
    - branch: Недостаточно паевых средств
      at_step: 1
      action: edubridge::convert
      actor: member
      description: >
        Остатка паевого взноса не хватает на сумму периода — конвертация не
        проходит. Пайщик пополняет паевой взнос штатным внесением средств
        и повторяет заявление.

    - branch: Досрочное закрытие подписки
      at_step: 3
      action: edubridge::expiresub
      actor: cooperative
      description: >
        Кооператив закрывает подписку до окончания оплаченного срока без
        возврата участнику — например, когда расчёт по ней уже сделан иначе.
        Удержанное по подписке возвращается в фонд. Когда участнику положен
        возврат (отказ от обучения, недобор группы, выход из кооператива),
        подписка закрывается отменой с возвратом.

    - branch: Конец гарантийного срока ученика
      at_step: 3
      action: edubridge::unlockfee
      actor: cooperative
      description: >
        Гарантийный срок ученика вышел: прошло объявленное число дней от
        начала занятий либо, если он вписался в идущий курс, от дня вступления. Кооператив освобождает из удержания всё
        сверх суммы, которую участник может потребовать назад по Положению, и
        тем же ходом добирает из освобождённого резерв выплат преподавателям
        до обязательства по курсу (edubridge::allotfee). Дальше удержание
        уменьшается по мере прохождения курса тем же порядком.

    - branch: Высвобождение излишка резерва
      at_step: 4
      action: edubridge::freereserve
      actor: cooperative
      description: >
        Подписка закрыта либо отменена, оплаченное время курса сократилось.
        Резерв выплат преподавателям сверх обязательства по курсу
        возвращается в фонд и становится свободными средствами программы.

    - branch: Отмена подписки участником
      at_step: 3
      action: edubridge::cancelsub
      actor: cooperative
      description: >
        Пайщик отказывается от подписки. До начала занятий взнос
        возвращается целиком, в ходе обучения — половина стоимости
        неиспользованных занятий. Возврат приходит на кошелёк программы
        участника, доступ к курсу прекращается.

    - branch: Отмена курса по недобору
      at_step: 2
      action: edubridge::cancelsub
      actor: cooperative
      description: >
        Кооператив не набрал группу и отменяет курс до первого занятия. Все
        подписки на него закрываются, взносы возвращаются целиком и сразу в
        паевой взнос участников — заявления от них не требуется.

    - branch: Прекращение участия в программе
      at_step: 4
      action: edubridge::retshare
      actor: member
      description: >
        Возвращённые средства лежат на кошельке программы участника и идут на
        другие подписки. Участник может подать заявление об аннулировании
        соглашения об участии в программе. После согласования кооперативом его подписки закрываются
        с возвратом по Положению (edubridge::cancelsub), весь остаток кошелька
        программы переходит в паевой взнос, соглашение о программе
        аннулируется.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
# Положение о программе и шаблон оферты принимает совет; оферту подписывает
# пайщик при вступлении в программу; Заявление о конвертации — при каждой
# оплате периода.
documents:
  - action: null
    title: Положение о ЦПП «Образование»
    registry_id: 3000
    signed_by: [council]
    stored_in: "реестр документов кооператива"
    note: "Принимается советом при открытии программы. Источник правды — components/cooptypes/src/cooperative/registry/3000.EducationProgramTemplate"

  - action: null
    title: Оферта родителя-слушателя
    registry_id: 3002
    signed_by: [member]
    stored_in: "реестр документов кооператива"
    note: "Подписывается пайщиком один раз при вступлении в программу; включает согласие на передачу почты обучающегося образовательной площадке. Редакцию оферты утверждает совет. Источник правды — components/cooptypes/src/cooperative/registry/3002.EducationParentOffer"

  - action: edubridge::convert
    title: Заявление о конвертации паевого взноса в членский взнос по ЦПП «Образование»
    registry_id: 3011
    signed_by: [member]
    stored_in: "реестр документов (package = hash заявления)"
    note: "Подписывается пайщиком при оплате каждого периода курса. Содержит сумму, название курса и период. Подписка хранит hash последнего заявления (edusubs.statement_hash). Источник правды — components/cooptypes/src/cooperative/registry/3011.EducationConvertStatement"

  - action: edubridge::retshare
    title: Заявление об аннулировании соглашений об участии в целевых потребительских программах
    registry_id: 190
    signed_by: [member]
    stored_in: "реестр документов (package = hash заявления)"
    note: "Тот же бланк, что подписывается при выходе из кооператива. При прекращении участия только в программе «Образование» подписывается без выхода, в таблице одна эта программа: остаток кошелька программы и возврат по действующим подпискам на день подписания. Точную сумму кооператив считает в день согласования (пп. 4.2.4, 4.2.5 Положения). В цепь уходит после согласования. При выходе из кооператива в таблице все программы пайщика, и заявление подписывается вместе с заявлением на выход. Источник правды — components/cooptypes/src/cooperative/registry/190.ProgramAgreementsAnnulmentStatement"

# ── Секция 6. Операции (Ledger2) ────────────────────────────────────────────
# Восемь операций: конвертация паевого в членский взнос, списание взноса в
# фонд программы, удержание до конца гарантийного срока и разблокировка,
# выделение резерва выплат преподавателям и его высвобождение,
# возврат из фонда при отмене и перевод остатка обратно в паевой. Открытие, продление и закрытие подписки сами средства не двигают.
operations:
  - ledger_code: o.edu.conv
    human_name: Конвертация паевого в членский взнос по ЦПП «Образование»
    wallet_op: TRANSFER
    # L1 — двойная запись: паевой фонд уменьшается, целевое финансирование
    # программы растёт.
    debit: 80                      # Паевой фонд
    credit: 86                     # Целевое финансирование
    # L2 — перевод между кошельками кооператива
    wallet_from: w.wal.share       # Паевой взнос пайщика
    wallet_to: w.edu.member        # Членский взнос ЦПП «Образование»
    # L3 — движение по кошелькам пайщика
    user_wallet: w.wal.share → w.edu.member
    user_ref: member
    available_delta: "-amount на w.wal.share; +amount на w.edu.member"
    blocked_delta: null
    amount_ref: convert.amount
    triggered_by: edubridge::convert
    description: >
      Конвертация паевого взноса пайщика в членский взнос программы
      «Образование» по подписанному Заявлению. Двойная запись Дт 80 / Кт 86
      — паевой фонд уменьшается, целевое финансирование программы растёт на
      ту же сумму. Паевой кошелёк пайщика уменьшается, членский кошелёк
      программы пополняется. Одна операция на одно заявление.

  - ledger_code: o.edu.fee
    human_name: Списание членского взноса в фонд программы
    wallet_op: TRANSFER
    debit: null                    # оба кошелька на счёте 86
    credit: null
    wallet_from: w.edu.member      # Членский взнос ЦПП «Образование»
    wallet_to: w.edu.fund          # Фонд ЦПП «Образование»
    user_wallet: w.edu.member
    user_ref: member
    available_delta: "-amount на w.edu.member"
    blocked_delta: null
    amount_ref: chargefee.amount
    triggered_by: edubridge::chargefee
    description: >
      Стоимость оплаченного периода переходит с кошелька программы участника
      в фонд программы — в распоряжение кооператива. Проводки нет: обе
      стороны на счёте целевого финансирования.

  - ledger_code: o.edu.lock
    human_name: Удержание взноса до конца гарантийного срока ученика
    wallet_op: TRANSFER
    debit: null                    # оба кошелька на счёте 86
    credit: null
    wallet_from: w.edu.fund        # Фонд ЦПП «Образование» — свободные средства
    wallet_to: w.edu.escrow        # Удержано до конца гарантийного срока
    amount_ref: lockfee.amount
    triggered_by: edubridge::lockfee
    description: >
      Пока идёт гарантийный срок ученика, взнос сразу после списания в фонд
      уходит на удержание целиком и на расходы программы не идёт.

  - ledger_code: o.edu.unlock
    human_name: Разблокировка удержанного взноса
    wallet_op: TRANSFER
    debit: null                    # оба кошелька на счёте 86
    credit: null
    wallet_from: w.edu.escrow
    wallet_to: w.edu.fund
    amount_ref: unlockfee.amount | удержанное по подписке
    triggered_by: edubridge::unlockfee, edubridge::cancelsub, edubridge::expiresub
    description: >
      Часть удержанного, которую участник уже не может потребовать назад,
      становится свободными средствами программы: после гарантийного срока
      курса — всё сверх суммы возврата по Положению на этот день. При отмене
      и закрытии подписки удержанное возвращается в фонд целиком тем же
      ходом, и возврат участнику идёт из фонда.

  - ledger_code: o.edu.allot
    human_name: Резерв выплат преподавателям из членского взноса
    wallet_op: TRANSFER
    debit: null                    # оба кошелька на счёте 86
    credit: null
    wallet_from: w.edu.fund        # Фонд ЦПП «Образование» — свободные средства
    wallet_to: w.edu.teach         # Резерв выплат преподавателям
    amount_ref: allotfee.amount
    triggered_by: edubridge::allotfee, edubridge::acceptrid
    description: >
      Из взноса, освобождённого из удержания, резерв выплат преподавателям
      добирается до обязательства по курсу — часов курса по плановой ставке
      за оплаченное учениками время за вычетом уже выплаченного. Той же
      операцией резерв пополняется при приёме результата преподавателя,
      когда зарезервированного не хватило.

  - ledger_code: o.edu.free
    human_name: Высвобождение резерва выплат преподавателям в фонд
    wallet_op: TRANSFER
    debit: null                    # оба кошелька на счёте 86
    credit: null
    wallet_from: w.edu.teach
    wallet_to: w.edu.fund
    amount_ref: freereserve.amount
    triggered_by: edubridge::freereserve
    description: >
      Подписка отменена либо закрыта, обязательство по курсу уменьшилось —
      резерв сверх него возвращается в фонд программы свободными средствами.

  - ledger_code: o.edu.refund
    human_name: Возврат членского взноса из фонда программы
    wallet_op: TRANSFER
    debit: null                    # оба кошелька на счёте 86
    credit: null
    wallet_from: w.edu.fund
    wallet_to: w.edu.member
    user_wallet: w.edu.member
    user_ref: member
    available_delta: "+refund на w.edu.member"
    blocked_delta: null
    amount_ref: cancelsub.refund
    triggered_by: edubridge::cancelsub
    description: >
      При отмене подписки сумма возврата, посчитанная по Положению о
      программе, переходит из фонда на кошелёк программы участника.

  - ledger_code: o.edu.retshr
    human_name: Возврат членского взноса программы в паевой взнос
    wallet_op: TRANSFER
    debit: 86                      # Целевое финансирование
    credit: 80                     # Паевой фонд
    wallet_from: w.edu.member
    wallet_to: w.wal.share
    user_wallet: w.edu.member → w.wal.share
    user_ref: member
    available_delta: "-amount на w.edu.member; +amount на w.wal.share"
    blocked_delta: null
    amount_ref: cancelsub.refund | retshare.amount (весь остаток w.edu.member)
    triggered_by: edubridge::cancelsub, edubridge::retshare
    description: >
      Обратная конвертация: членский взнос программы возвращается в паевой
      взнос участника только с прекращением участия в программе. При отмене
      курса по недобору — сразу; по заявлению об аннулировании соглашения и при
      выходе из кооператива — весь остаток кошелька программы целиком.

# ── Выход пайщика из кооператива ────────────────────────────────────────────
# Выход закрывает участие в программе целиком (процесс p.reg.exit, registrator):
#   • подписки обучающихся закрываются с расчётом возврата по Положению — тем же,
#     что при отказе участника; возврат ложится на кошелёк членских взносов
#     программы (w.edu.member) и входит в сумму выхода;
#   • остаток w.edu.member возвращается на главный паевой операцией o.edu.retshr —
#     так записано в таблице политики кошельков EXIT_WALLET_POLICY (п. 4.2.5
#     Положения ЦПП делает членский взнос программы возвратным);
#   • соглашения об участии в программах 5 «Обучение» и 6 «Преподавание»
#     аннулируются в финале выхода (wallet::revokeagree) по заявлению пайщика
#     registry 190;
#   • преподавателю выход закрыт, пока он ведёт курс либо не закрыт расчёт по
#     его занятиям — причины ядро спрашивает у расширения перед подачей заявления.
#
# Отказ совета или кассы подписки не восстанавливает: членство кончается с
# заявлением о выходе, а не с возвратом денег.
