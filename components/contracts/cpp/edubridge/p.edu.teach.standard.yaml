# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Участие преподавателя в хозяйственной деятельности» — договор
# преподавателя с кооперативом по целевой потребительской программе
# «Образование» и приложения к нему на конкретные курсы.
#
# Преподаватель — пайщик кооператива. Чтобы вести курсы и вносить в паевой
# фонд результаты своей работы, он заключает с кооперативом Договор участия в
# хозяйственной деятельности (УХД). Договор подписывают две стороны:
# преподаватель — первым, председатель совета от лица кооператива — вторым,
# со своего рабочего стола в разделе «Запросы одобрений». На каждый курс, к
# которому преподавателя допускают, оформляется Приложение к договору с
# расписанием, ожидаемым результатом и сроком сдачи — оно подписывается тем
# же порядком: преподаватель, затем председатель.
#
# Движений по средствам в процессе нет — это документный процесс. Паевой
# взнос результатом работы по подписанному приложению — отдельный процесс
# «Паевой взнос преподавателя результатом интеллектуальной деятельности».
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# Источники правды в коде:
#   • cpp/edubridge/edubridge.hpp                     — actions
#   • cpp/edubridge/src/p.edu.teach/                  — реализация
#   • cpp/lib/domain/table_edubridge_contracts.hpp    — договоры (анкер)
#   • cpp/lib/domain/table_edubridge_annexes.hpp      — приложения до второй подписи
#   • cpp/lib/core/ledger2/processes.hpp              — processes::edubridge::TEACH
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.edu.teach
id: public_edubridge_teach_process
title: Участие преподавателя в хозяйственной деятельности
slug: teach
status: proposed
contract: edubridge
purpose: >
  Штатный путь, которым преподаватель-пайщик заключает с кооперативом Договор
  участия в хозяйственной деятельности и получает допуск к ведению конкретных
  курсов. Договор подписывают обе стороны: сначала преподаватель, затем
  председатель совета от лица кооператива — со своего рабочего стола, где
  собраны все запросы на его подпись. Пока второй подписи нет, договор
  считается ожидающим; после неё — действующим.

  На каждый курс оформляется Приложение к договору: расписание, ожидаемый
  результат и срок сдачи. Приложение подписывается тем же порядком —
  преподаватель, затем председатель. Только по подписанному обеими сторонами
  приложению преподаватель ведёт курс и может внести результат своей работы
  как паевой взнос. Отказ председателя на любом шаге закрывает документ без
  последствий: преподаватель может подписать его заново.
roles:
  - teacher         # пайщик-преподаватель
  - chairman        # председатель совета (подписывает от лица кооператива)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
# Имена actions ≤12 символов eosio::name. Документы подписывают участники,
# в кооперативную сеть их передаёт кооператив; вторую подпись председателя
# принимает контракт совета и передаёт сюда.
actions:
  - name: edubridge::signcontract
    human: Подписать договор
    actor: teacher
    role: opener
    purpose: >
      Преподаватель подписывает Договор участия в хозяйственной деятельности.
      Договор регистрируется как ожидающий и поступает председателю совета
      на подпись со стороны кооператива. У преподавателя может быть только
      один договор.
    links:
      - process_type: p.edu.rid
        label: Паевой взнос результатом интеллектуальной деятельности

  - name: edubridge::apprvcontr
    human: Подписать договор от кооператива
    actor: chairman
    role: closer
    purpose: >
      Председатель совета ставит вторую подпись — договор становится
      действующим и публикуется в реестре документов уже с двумя подписями.
      С этого момента преподавателю можно оформлять приложения на курсы.

  - name: edubridge::dclinecontr
    human: Отказать в подписи договора
    actor: chairman
    role: reject
    purpose: >
      Председатель отказывает в подписи с указанием причины. Ожидающий
      договор закрывается; преподаватель может подписать договор заново.

  - name: edubridge::signannex
    human: Подписать приложение на курс
    actor: teacher
    role: opener
    purpose: >
      Преподаватель подписывает Приложение к договору на конкретный курс —
      с расписанием, ожидаемым результатом и сроком сдачи. Нужен действующий
      договор. Приложение поступает председателю на подпись.

  - name: edubridge::apprvannex
    human: Подписать приложение от кооператива
    actor: chairman
    role: closer
    purpose: >
      Председатель ставит вторую подпись на приложении — оно публикуется в
      реестре документов с двумя подписями, преподаватель допущен к курсу.

  - name: edubridge::dclineannex
    human: Отказать в подписи приложения
    actor: chairman
    role: reject
    purpose: >
      Председатель отказывает в подписи приложения с указанием причины.
      Приложение закрывается; договор при этом остаётся действующим.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Сущность: edubridge::edu_contract (таблица educontracts, scope=coopname).
# Договор живёт, пока преподаватель участвует в хозяйственной деятельности.
# Приложения (eduannexes) — вспомогательные записи: они существуют только между
# подписью преподавателя и решением председателя, дальше их ведёт приложение
# кооператива по журналу действий.
entity: edubridge::edu_contract
entity_human: Договор участия в хозяйственной деятельности
entity_source: cpp/edubridge/src/p.edu.teach/

states:
  - name: pending
    human: Ожидает подписи председателя
    description: >
      Договор подписан преподавателем и лежит у председателя совета в
      запросах на подпись. Приложения на курсы пока оформлять нельзя.
    kind: normal

  - name: active
    human: Действует
    description: >
      Договор подписан обеими сторонами и опубликован в реестре документов.
      Преподаватель может подписывать приложения на курсы и, по подписанному
      приложению, вносить результат своей работы как паевой взнос.
    kind: final

transitions:
  - from: "∅"
    to: pending
    action: edubridge::signcontract
    actor: teacher
    guards:
      - Преподаватель — действующий член кооператива.
      - Договор подписан преподавателем.
      - У преподавателя ещё нет договора — ни действующего, ни ожидающего.

  - from: pending
    to: active
    action: edubridge::apprvcontr
    actor: chairman
    guards:
      - Председатель совета подписал договор со своего рабочего стола.

  - from: pending
    to: "∅"
    action: edubridge::dclinecontr
    actor: chairman
    guards:
      - Председатель отказал в подписи с указанием причины.

  - from: active
    to: active
    action: edubridge::signannex
    actor: teacher
    guards:
      - Договор действует.
      - Приложение подписано преподавателем.
      - Такого приложения ещё нет.

  - from: active
    to: active
    action: edubridge::apprvannex
    actor: chairman
    guards:
      - Председатель совета подписал приложение.
      - Приложение опубликовано в реестре документов с двумя подписями.

  - from: active
    to: active
    action: edubridge::dclineannex
    actor: chairman
    guards:
      - Председатель отказал в подписи приложения с указанием причины.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подпись договора преподавателем
      actor: teacher
      action: edubridge::signcontract
      description: >
        Преподаватель, вступивший в кооператив по оферте преподавателя,
        читает Договор участия в хозяйственной деятельности целиком на
        странице подключения к преподаванию (следующий шаг после оферты),
        соглашается и подписывает его. Договор регистрируется как ожидающий
        и поступает председателю совета на подпись; стол преподавания
        открывается сразу, с пометкой об ожидании второй подписи.
      pre:
        - Преподаватель — действующий член кооператива, подписавший оферту
          преподавателя по программе «Образование».
      post:
        - Договор ожидает подписи председателя.

    - step: 2
      title: Подпись договора председателем
      actor: chairman
      action: edubridge::apprvcontr
      description: >
        Председатель совета видит договор в запросах на подпись, знакомится
        с ним и ставит подпись от лица кооператива. Договор становится
        действующим и публикуется в реестре документов с двумя подписями.
      pre:
        - Договор ожидает подписи председателя.
      post:
        - Договор действует и опубликован.

    - step: 3
      title: Подпись приложения на курс преподавателем
      actor: teacher
      action: edubridge::signannex
      description: >
        Администратор программы назначает преподавателя на курс — с
        расписанием, ожидаемым результатом и сроком сдачи. Преподаватель
        подписывает Приложение к договору на этот курс; оно поступает
        председателю на подпись.
      pre:
        - Договор действует.
        - Преподаватель назначен на курс.
      post:
        - Приложение ожидает подписи председателя.

    - step: 4
      title: Подпись приложения председателем
      actor: chairman
      action: edubridge::apprvannex
      description: >
        Председатель ставит вторую подпись на приложении. Приложение
        публикуется в реестре документов с двумя подписями — преподаватель
        допущен к курсу и по завершении работы может внести её результат как
        паевой взнос (отдельный процесс).
      pre:
        - Приложение ожидает подписи председателя.
      post:
        - Приложение опубликовано с двумя подписями, назначение действует.

  alternatives:
    - branch: Председатель отказал в подписи договора
      at_step: 2
      action: edubridge::dclinecontr
      actor: chairman
      description: >
        Председатель отказывает в подписи с указанием причины — например,
        преподаватель не подтвердил квалификацию. Ожидающий договор
        закрывается; преподаватель может подписать договор заново.

    - branch: Председатель отказал в подписи приложения
      at_step: 4
      action: edubridge::dclineannex
      actor: chairman
      description: >
        Председатель отказывает в подписи приложения с указанием причины.
        Приложение закрывается, договор остаётся действующим; администратор
        может оформить новое назначение.

# ── Секция 5. Документы ─────────────────────────────────────────────────────
documents:
  - action: edubridge::signcontract
    title: Договор участия в хозяйственной деятельности (образование)
    registry_id: 3006
    signed_by: [ teacher ]
    stored_in: educontracts.contract_hash
    note: >
      Первая подпись. В реестр документов попадает после второй подписи
      председателя (apprvcontr) — уже с двумя подписями.

  - action: edubridge::apprvcontr
    title: Договор участия в хозяйственной деятельности (образование)
    registry_id: 3006
    signed_by: [ teacher, chairman ]
    stored_in: educontracts.contract_hash
    note: Тот же документ с присоединённой подписью председателя; публикуется в реестре.

  - action: edubridge::signannex
    title: Приложение к договору участия в хозяйственной деятельности на курс
    registry_id: 3007
    signed_by: [ teacher ]
    stored_in: eduannexes.annex_hash
    note: Первая подпись; в реестр — после подписи председателя.

  - action: edubridge::apprvannex
    title: Приложение к договору участия в хозяйственной деятельности на курс
    registry_id: 3007
    signed_by: [ teacher, chairman ]
    stored_in: eduannexes.annex_hash
    note: Тот же документ с подписью председателя; публикуется в реестре, запись ожидания стирается.

# ── Секция 6. Операции (Ledger2) ────────────────────────────────────────────
# Документный процесс: движений по кошелькам и проводок нет.
operations: []
