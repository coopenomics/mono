# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Материальная помощь доверенного кооперативного участка» —
# выплата доверенному (или председателю) участка денег с его персонального
# кошелька членских средств на его расчётный счёт.
#
# Персональный кошелёк пополняется распределением членских взносов с
# исполненных заказов участка (типовой процесс «Распределение членских
# взносов кооперативного участка»). Получатель сам решает, как
# распорядиться: заказать имущество через Стол заказов или получить
# деньги материальной помощью.
#
# НДФЛ с полученной суммы получатель платит самостоятельно — кооператив
# налог не удерживает и налоговым агентом не выступает; кооператив лишь
# подсказывает получателю, что и как оплатить (решение владельца
# 2026-06-10; удержание кооперативом — возможная отдельная процедура
# в будущем).
#
# **Движение средств:** заявление получателя → исходящий платёж →
# подтверждение кассиром фактического банковского перевода → списание с
# персонального кошелька (Дт 86 / Кт 51 — целевое финансирование
# уменьшается, деньги уходят с расчётного счёта). Если перевод не
# состоялся — средства остаются на персональном кошельке.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.brn.aid
id: public_branch_aid_process
title: Материальная помощь доверенного кооперативного участка
slug: aid
status: proposed
contract: branch
purpose: >
  Доверенный или председатель кооперативного участка получает деньги со
  своего персонального кошелька членских средств на свой расчётный счёт.

  Получатель сам подписывает заявление на материальную помощь — без
  решения совета: средства на персональном кошельке уже распределены ему
  по условиям, назначенным председателем участка. Кассир кооператива
  видит заявку, проводит банковский перевод с общего расчётного счёта
  кооператива и подтверждает его — в этот момент сумма списывается с
  персонального кошелька получателя. НДФЛ получатель оплачивает сам.
roles:
  - trusted    # доверенный/председатель участка — получатель помощи
  - cashier    # кассир кооператива — проводит и подтверждает банковский перевод
  - backend    # Автоматизированная служба кооператива
  - gateway    # Система процессинга платежей (подтверждает или отклоняет факт банковского перевода)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
actions:
  - name: branch::createaid
    human: Подать заявку на материальную помощь
    actor: trusted
    role: opener
    purpose: >
      Получатель подписывает заявление и подаёт заявку на выплату с
      собственного персонального кошелька. Регистрируется исходящий
      платёж — заявка ждёт действия кассира. Средства при подаче не
      блокируются: если к моменту подтверждения их уже не хватает
      (получатель параллельно перевёл их в Стол заказов), выплата не
      пройдёт.

  - name: branch::aidconfirm
    human: Кассир подтвердил банковский перевод
    actor: gateway
    role: closer
    purpose: >
      Кассир провёл банковский перевод получателю и подтвердил его. В
      этот момент — и только в этот — сумма списывается с персонального
      кошелька получателя и уходит с расчётного счёта кооператива.

  - name: branch::aiddecline
    human: Кассир отклонил банковский перевод
    actor: gateway
    role: closer
    purpose: >
      Перевод не состоялся (например, неверные реквизиты). Средства
      остаются на персональном кошельке получателя; заявка закрывается с
      причиной, получатель может подать новую.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: branch::aids
entity_human: Заявка на материальную помощь
entity_source: cpp/branch/src/

# Запись заявки живёт только пока ждёт решения кассира; решение (выплата
# или отказ) завершает жизненный цикл — запись удаляется, история заявки и
# причина отказа сохраняются в журнале действий.
states:
  - name: pending
    human: Ожидает выплаты
    description: >
      Заявление подписано, исходящий платёж зарегистрирован — ждёт
      действия кассира.

transitions:
  - from: "∅"
    to: pending
    action: branch::createaid
    actor: trusted
    guards:
      - Получатель — активный пайщик кооператива.
      - Заявление подписано самим получателем.
      - На персональном кошельке получателя достаточно средств на момент подачи.
      - Заявка с таким идентификатором ещё не создавалась.

  - from: pending
    to: "∅"
    action: branch::aidconfirm
    actor: gateway
    ledger_code: p.brn.aid
    operations:
      - o.brn.aid
    guards:
      - Кассир подтвердил фактический банковский перевод получателю.
      - На персональном кошельке получателя достаточно средств.

  - from: pending
    to: "∅"
    action: branch::aiddecline
    actor: gateway
    guards:
      - Кассир отметил, что банковский перевод не состоялся — средства
        остались на персональном кошельке, заявку можно подать заново.

# ── Секция 4. Операции ledger2 ──────────────────────────────────────────────
operations:
  - ledger_code: o.brn.aid
    human_name: Материальная помощь доверенному участка
    wallet_op: BURN
    # L1 — двойная запись (целевое финансирование → расчётный счёт)
    debit: 86                      # Целевое финансирование
    credit: 51                     # Расчётный счёт
    wallet_from: w.brn.person      # Персональный кошелёк доверенного участка
    wallet_to: null                # деньги уходят из системы банковским переводом
    l3:
      - user_wallet: w.brn.person
        user_ref: aids.username
        available_delta: -aids.amount
        blocked_delta: null
    amount_ref: aids.amount
    triggered_by: branch::aidconfirm
    description: >
      Выплата материальной помощи с расчётного счёта кооператива по
      заявлению получателя: персональный кошелёк уменьшается, деньги
      уходят из системы. Дт 86 / Кт 51 — использование целевого
      финансирования. НДФЛ получатель оплачивает самостоятельно.
