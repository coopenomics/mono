# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Распределение членских взносов кооперативного участка» —
# экономика участка: как доходная часть председателя и доверенных
# формируется из потока членских взносов через их участок.
#
# Когда заказ Стола заказов исполнен окончательно (заказчик получил
# имущество и поставил финальную подпись на акте выдачи), членский взнос
# по заказу принимается окончательно и немедленно расходится по кошелькам
# участка выдачи: часть, определённая отсечкой участка, — персонально
# между председателем и доверенными в пропорции назначенных весов,
# всё остальное — в общий кошелёк участка.
#
# Веса вместо процентов: доля участника = его вес / сумма весов. Добавление
# или удаление доверенного перебалансирует доли автоматически на следующих
# начислениях — ничего не блокируется и никуда не переносится; чтобы
# сохранить прежние условия, председатель меняет веса.
#
# Условия распределения универсальны: они задаются на участке для каждого
# контракта-источника отдельно (сегодня источник один — Стол заказов; другие
# потребительские программы смогут использовать ту же методику со своими
# условиями).
#
# Персональными средствами доверенный распоряжается сам: переводит их в
# членский кошелёк Стола заказов и заказывает имущество как обычный пайщик,
# либо получает материальную помощь (отдельный типовой процесс
# «Материальная помощь доверенного кооперативного участка»).
#
# Общий кошелёк участка — источник закупки впрок (заказ участка от имени
# кооператива для пополнения витрины-остатка) и, в будущем, списания
# хозяйственных расходов участка.
#
# **Движение средств:** членский взнос заказа лежит в кооперативном пуле
# резервов взносов с момента создания заказа; при финализации он расходится
# на персональные кошельки доверенных и общий кошелёк участка — все
# движения внутри целевого финансирования (счёт 86), без бухгалтерских
# проводок.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.brn.fees
id: public_branch_fees_process
title: Распределение членских взносов кооперативного участка
slug: fees
status: proposed
contract: branch
purpose: >
  Определяет, на что живут председатель и доверенные кооперативного
  участка: каждый исполненный заказ Стола заказов приносит участку
  членский взнос, и часть этого взноса немедленно распределяется
  персонально между ними, а остальное накапливается в общем кошельке
  участка.

  Председатель участка назначает веса участникам распределения — себе и
  доверенным. Человеку понятна простая модель: «я получаю свой процент от
  потока членских взносов через мой участок» — итоговый процент
  складывается из отсечки участка (какая доля взноса распределяется
  персонально) и веса участника среди остальных.

  Распределяются только взносы исполненных заказов: пока заказ не закрыт
  финальной подписью заказчика, его взнос лежит в резерве и в накопления
  участка не попадает. При отмене заказа взнос возвращается заказчику.

  Персональными средствами доверенный распоряжается сам — без решений
  совета: заказывает на них имущество через Стол заказов (переведя их в
  членский кошелёк программы) или получает материальную помощь выплатой
  на свой счёт.
roles:
  - chairman   # председатель кооперативного участка — назначает веса
  - trusted    # доверенный кооперативного участка — получатель распределения
  - backend    # Автоматизированная служба кооператива

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
actions:
  - name: branch::setweight
    human: Назначить вес участника распределения
    actor: chairman
    role: opener
    purpose: >
      Председатель участка назначает или меняет вес участника —
      себе или доверенному — в распределении членских взносов от
      выбранного контракта-источника. Доля участника равна его весу,
      делённому на сумму всех весов участка по этому источнику.

  - name: branch::delweight
    human: Исключить участника из распределения
    actor: chairman
    role: progress
    purpose: >
      Участник исключается из распределения: его вес удаляется, сумма
      весов уменьшается, доли остальных вырастают автоматически на
      следующих начислениях. Уже распределённые средства остаются на
      персональном кошельке исключённого. При удалении доверенного из
      участка его веса по всем источникам снимаются сами.

  - name: branch::distribute
    human: Разложить членский взнос по кошелькам участка
    actor: backend
    role: closer
    purpose: >
      При финализации заказа Стол заказов передаёт участку фактический
      членский взнос: персональная часть (по отсечке участка) делится
      между участниками пропорционально весам, всё остальное — включая
      копеечные остатки округления и случай, когда веса не настроены, —
      зачисляется в общий кошелёк участка.

  - name: branch::convert
    human: Перевести персональные средства в кошелёк Стола заказов
    actor: trusted
    role: progress
    purpose: >
      Доверенный (или председатель) переводит средства со своего
      персонального кошелька в членский кошелёк Стола заказов — и
      дальше заказывает на них имущество как обычный пайщик.

# ── Секция 3. Сущность и состояния ──────────────────────────────────────────
# Сущность: branch::weights (реестр весов, scope=coopname) + агрегат
# branch::weighttotals (сумма весов по участку и источнику). У записей веса
# нет жизненного цикла со статусами: запись либо есть (участник в
# распределении), либо отсутствует.
entity: branch::weights
entity_human: Вес участника распределения
entity_source: cpp/branch/src/

states:
  - name: present
    human: Участник в распределении
    description: >
      Вес назначен председателем; участник получает свою долю персональной
      части членских взносов при каждой финализации заказа на участке.

transitions:
  - from: "∅"
    to: present
    action: branch::setweight
    actor: chairman
    guards:
      - Участник — председатель или доверенный этого кооперативного участка.
      - Вес больше нуля.

  - from: present
    to: present
    action: branch::setweight
    actor: chairman
    guards:
      - Вес больше нуля; сумма весов участка пересчитывается.

  - from: present
    to: "∅"
    action: branch::delweight
    actor: chairman
    guards:
      - Участник найден в распределении этого участка по этому источнику.

  - from: present
    to: "∅"
    action: branch::deltrusted
    actor: chairman
    guards:
      - Удаление доверенного из участка автоматически снимает его веса по всем источникам.

# ── Секция 4. Операции ledger2 ──────────────────────────────────────────────
operations:
  - ledger_code: o.brn.person
    human_name: Распределение членского взноса доверенному участка
    wallet_op: TRANSFER
    # L1 — без проводки (оба кошелька на 86)
    debit: null
    credit: null
    wallet_from: w.mkt.fee         # Резерв членских взносов под заказы (кооперативный пул)
    wallet_to: w.brn.person        # Персональный кошелёк доверенного участка
    l3:
      - user_wallet: w.brn.person
        user_ref: weights.username
        available_delta: +доля
        blocked_delta: null
    amount_ref: членский взнос × отсечка участка × вес / Σ весов
    triggered_by: branch::distribute
    description: >
      Персональная доля члена команды участка с каждого исполненного
      заказа. Начисляется немедленно при финальной подписи акта выдачи.
      По бухгалтерии — без проводки (движение внутри целевого
      финансирования, счёт 86).

  - ledger_code: o.brn.common
    human_name: Членский взнос в общий кошелёк участка
    wallet_op: TRANSFER
    debit: null
    credit: null
    wallet_from: w.mkt.fee         # Резерв членских взносов под заказы
    wallet_to: w.brn.common        # Общий кошелёк членских взносов участка
    l3:
      - user_wallet: w.brn.common
        user_ref: braname          # разрез ведётся по участку, не по пайщику
        available_delta: +остаток
        blocked_delta: null
    amount_ref: членский взнос − персональная часть
    triggered_by: branch::distribute
    description: >
      Часть взноса вне персонального распределения накапливается в общем
      кошельке участка — это источник закупки впрок и будущего списания
      хозяйственных расходов участка. Сюда же уходят копеечные остатки
      округления и весь взнос, если веса распределения не настроены.

  - ledger_code: o.brn.conv
    human_name: Перевод персональных средств в членский кошелёк Стола заказов
    wallet_op: TRANSFER
    debit: null
    credit: null
    wallet_from: w.brn.person      # Персональный кошелёк доверенного
    wallet_to: w.mkt.member        # Членский кошелёк «Стола заказов» пайщика
    l3:
      - user_wallet: w.brn.person
        user_ref: username
        available_delta: -amount
        blocked_delta: null
      - user_wallet: w.mkt.member
        user_ref: username
        available_delta: +amount
        blocked_delta: null
    amount_ref: сумма перевода
    triggered_by: branch::convert
    description: >
      Доверенный направляет заработанное на заказы для себя: средства
      переходят в членский кошелёк Стола заказов, и дальше он действует
      как обычный пайщик программы. Требуется подписанное соглашение
      ЦПП «Стол заказов». По бухгалтерии — без проводки (оба кошелька
      на счёте 86).
