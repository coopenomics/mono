# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Оплата расхода кооперативного участка» — оплата расхода
# участка деньгами из его общего кошелька членских взносов.
#
# Общий кошелёк участка пополняется членскими взносами исполненных заказов
# (типовой процесс «Членские взносы кооперативного участка») и имеет
# приоритет расходов: плановые расходы участка оплачиваются в первую
# очередь, и только остаток сверх планового резерва ближайших 30 дней
# распределяется между председателем и доверенными или направляется на
# закупку впрок.
#
# Плановые расходы участка (что, когда, сколько и по каким реквизитам
# оплатить) ведутся в учётной системе кооператива, вне блокчейна: участок
# планирует расходы вперёд, автоматизированная служба считает резерв
# ближайших 30 дней и не пропускает использование общего кошелька, после
# которого резерв оказался бы непокрыт. Полный учётный контур расходов
# (сметы, подотчётные, отчёты) — отдельная общесистемная подсистема
# расходов кооператива; до её включения команда оплаты доступна только
# самой системе, в кабинетах кнопка оплаты отключена.
#
# **Движение средств:** команда оплаты → исходящий платёж → подтверждение
# кассиром фактического банковского перевода по реквизитам расхода →
# списание с общего кошелька участка (Дт 86 / Кт 51 — целевое
# финансирование уменьшается, деньги уходят с расчётного счёта). Если
# перевод не состоялся — средства остаются на общем кошельке.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.brn.spend
id: public_branch_spend_process
title: Оплата расхода кооперативного участка
slug: spend
status: proposed
contract: branch
purpose: >
  Кооперативный участок оплачивает свой расход — аренду, коммунальные
  услуги, хозяйственные нужды — из общего кошелька членских взносов
  участка.

  Расход заранее запланирован в учётной системе кооператива: указаны
  сумма, срок и реквизиты получателя. Команда оплаты регистрирует
  исходящий платёж; кассир кооператива проводит банковский перевод по
  реквизитам с общего расчётного счёта и подтверждает его — в этот момент
  сумма списывается с общего кошелька участка. Расходы имеют приоритет
  перед распределениями: их оплата разрешена всегда, тогда как
  распределение возможно только из средств сверх планового резерва
  ближайших 30 дней.
roles:
  - chairman   # председатель участка — планирует расходы участка
  - cashier    # кассир кооператива — проводит и подтверждает банковский перевод
  - backend    # Автоматизированная служба кооператива
  - gateway    # Система процессинга платежей (подтверждает или отклоняет факт банковского перевода)

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
actions:
  - name: branch::createspend
    human: Подать команду оплаты расхода участка
    actor: backend
    role: opener
    purpose: >
      По запланированному расходу участка регистрируется исходящий платёж
      из общего кошелька — он ждёт действия кассира. Средства при подаче
      не блокируются: если к моменту подтверждения их уже не хватает,
      выплата не пройдёт.

  - name: branch::spendconfirm
    human: Кассир подтвердил банковский перевод
    actor: gateway
    role: closer
    purpose: >
      Кассир провёл банковский перевод по реквизитам расхода и подтвердил
      его. В этот момент — и только в этот — сумма списывается с общего
      кошелька участка и уходит с расчётного счёта кооператива.

  - name: branch::spenddecline
    human: Кассир отклонил банковский перевод
    actor: gateway
    role: closer
    purpose: >
      Перевод не состоялся (например, неверные реквизиты). Средства
      остаются на общем кошельке участка; команда закрывается с причиной,
      оплату можно подать заново.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: branch::spends
entity_human: Команда оплаты расхода участка
entity_source: cpp/branch/src/

# Запись команды живёт только пока ждёт решения кассира; решение (оплата
# или отказ) завершает жизненный цикл — запись удаляется, история команды и
# причина отказа сохраняются в журнале действий.
states:
  - name: pending
    human: Ожидает оплаты
    description: >
      Исходящий платёж зарегистрирован — ждёт действия кассира.

transitions:
  - from: "∅"
    to: pending
    action: branch::createspend
    actor: backend
    guards:
      - Расход запланирован в учётной системе кооператива (сумма, срок, реквизиты).
      - На общем кошельке участка достаточно средств на момент подачи.
      - Команда с таким идентификатором ещё не создавалась.

  - from: pending
    to: "∅"
    action: branch::spendconfirm
    actor: gateway
    guards:
      - Подтверждение пришло от системы процессинга платежей.
      - На общем кошельке участка достаточно средств на момент подтверждения.

  - from: pending
    to: "∅"
    action: branch::spenddecline
    actor: gateway
    guards:
      - Отклонение пришло от системы процессинга платежей — средства
        остались на общем кошельке участка, оплату можно подать заново.

# ── Секция 4. Операции ledger2 ──────────────────────────────────────────────
operations:
  - ledger_code: o.brn.spend
    human_name: Оплата расхода участка из общего кошелька
    wallet_op: BURN
    # L1 — Дт 86 / Кт 51: целевое финансирование уменьшается,
    # деньги уходят с расчётного счёта кооператива.
    debit: 86
    credit: 51
    wallet_from: w.brn.common      # Общий кошелёк членских взносов участка
    wallet_to: null
    l3:
      - user_wallet: w.brn.common
        user_ref: braname          # разрез ведётся по участку
        available_delta: -amount
        blocked_delta: null
    amount_ref: сумма расхода
    triggered_by: branch::spendconfirm
    description: >
      Списание происходит только после подтверждения кассиром фактического
      банковского перевода по реквизитам расхода. Деньги уходят из системы;
      получателя на цепи нет — расчёт идёт по реквизитам, указанным в
      план-записи расхода в учётной системе кооператива.
