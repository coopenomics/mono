# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Документы председателя кооперативного участка».
#
# Решение владельца 18.11.2026: доверенность и договор о полной материальной
# ответственности председатель участка подписывает после решения совета об
# учреждении участка — доверенность ссылается на протокол совета, до решения
# протокола нет. Оба документа председатель совета подписывает встречно через
# одобрения. Доверенность выдаётся на год и продлевается тем же действием;
# номер, срок и состояние доверенности ведёт узел, цепь хранит только подписи.
#
# Источники в коде:
#   • cpp/branch/src/signauth.cpp — подпись доверенности председателем участка
#   • cpp/branch/src/signliab.cpp — подпись договора председателем участка
#   • cpp/branch/src/apprauth.cpp, apprliab.cpp — встречная подпись председателя совета
#   • cpp/branch/src/declauth.cpp, declliab.cpp — отказ председателя совета
# ─────────────────────────────────────────────────────────────────────────────

process_type: brn.trustee
id: public_branch_trustee_process
title: Документы председателя кооперативного участка
slug: trustee
status: proposed
contract: branch
purpose: >
  После решения совета об учреждении участка его председатель подписывает
  доверенность на год и договор о полной материальной ответственности. Оба
  документа поступают председателю совета на встречную подпись. Доверенность
  продлевается ежегодно: за тридцать дней до конца срока председатель участка
  получает напоминание и подписывает новую. С истёкшей доверенностью
  председатель участка не работает с пунктом выдачи.

roles:
  - trustee           # Председатель кооперативного участка
  - chairman          # Председатель совета

# ── Действия контракта ───────────────────────────────────────────────────────
actions:
  - name: branch::signauth
    human: Подписать доверенность
    actor: Председатель участка
    role: opener
    purpose: >
      Председатель участка подписывает доверенность на своём участке. В ней
      указаны номер и дата протокола совета об учреждении участка, номер
      доверенности и срок — один год. Продление — та же подпись новой
      доверенности. Доверенность поступает председателю совета на встречную
      подпись.

  - name: branch::signliab
    human: Подписать договор
    actor: Председатель участка
    role: opener
    purpose: >
      Председатель участка подписывает бессрочный договор о полной
      материальной ответственности. Договор поступает председателю совета на
      встречную подпись.

  - name: branch::apprauth
    human: Подписать доверенность встречно
    actor: Председатель совета
    role: closer
    purpose: >
      Председатель совета подписывает доверенность. Документ с двумя
      подписями помещается в реестр документов, доверенность действует до
      конца срока.

  - name: branch::apprliab
    human: Подписать договор встречно
    actor: Председатель совета
    role: closer
    purpose: >
      Председатель совета подписывает договор. Документ с двумя подписями
      помещается в реестр документов.

  - name: branch::declauth
    human: Отклонить доверенность
    actor: Председатель совета
    role: reject
    purpose: >
      Председатель совета отклоняет доверенность. Председатель участка
      подписывает новую.

  - name: branch::declliab
    human: Отклонить договор
    actor: Председатель совета
    role: reject
    purpose: >
      Председатель совета отклоняет договор. Председатель участка
      подписывает новый.

# ── Граф состояний ──────────────────────────────────────────────────────────
# Документ на встречной подписи — запрос одобрения совета (soviet::approvals):
# существование записи и есть статус «на подписи председателя совета».
# Встречная подпись и отказ удаляют запрос.
entity: soviet::approvals
entity_human: Документ председателя участка
entity_source: cpp/branch/src/

states:
  - name: pending
    human: На подписи председателя совета
    description: >
      Председатель участка подписал доверенность или договор, документ ждёт
      встречной подписи председателя совета.
    kind: initial

transitions:
  - from: "∅"
    to: pending
    action: branch::signauth | branch::signliab
    actor: Председатель участка
    guards:
      - Подписант — председатель этого участка.
      - Документ того типа, который требует действие.

  - from: pending
    to: "∅"
    action: branch::apprauth | branch::apprliab
    actor: Председатель совета
    guards:
      - Документ подписан председателем участка и председателем совета.

  - from: pending
    to: "∅"
    action: branch::declauth | branch::declliab
    actor: Председатель совета
    guards:
      - Запрос одобрения существует.

# ── Сценарий ────────────────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подпись доверенности
      actor: Председатель участка
      action: branch::signauth
      description: >
        Председатель участка открывает свой участок и подписывает доверенность
        со ссылкой на протокол совета.
      pre:
        - Совет учредил участок, пайщик — его председатель.
      post:
        - Доверенность на подписи председателя совета.

    - step: 2
      title: Встречная подпись доверенности
      actor: Председатель совета
      action: branch::apprauth
      description: >
        Председатель совета подписывает доверенность. Срок доверенности —
        один год со дня подписи председателем участка.
      post:
        - Доверенность действует.

    - step: 3
      title: Подпись договора
      actor: Председатель участка
      action: branch::signliab
      description: >
        Председатель участка подписывает договор о полной материальной
        ответственности.
      post:
        - Договор на подписи председателя совета.

    - step: 4
      title: Встречная подпись договора
      actor: Председатель совета
      action: branch::apprliab
      description: >
        Председатель совета подписывает договор. Договор действует без срока.
      post:
        - Договор подписан обеими сторонами.

  alternatives:
    - branch: Продление доверенности
      at_step: 1
      action: branch::signauth
      actor: Председатель участка
      description: >
        За тридцать дней до конца срока председатель участка получает
        напоминание и подписывает новую доверенность. Без новой доверенности
        после конца срока председатель участка не работает с пунктом выдачи.
    - branch: Председатель совета отклонил документ
      at_step: 2
      action: branch::declauth
      actor: Председатель совета
      description: >
        Документ не фиксируется. Председатель участка подписывает новый.

# ── Документы ───────────────────────────────────────────────────────────────
documents:
  - action: branch::signauth
    title: Доверенность председателю кооперативного участка
    registry_id: 329
    signed_by: [Председатель участка, Председатель совета]
    stored_in: реестр документов кооператива (после встречной подписи)
    note: Номер и дата протокола совета, номер доверенности и срок вписывает узел.

  - action: branch::signliab
    title: Договор о полной материальной ответственности председателя кооперативного участка
    registry_id: 328
    signed_by: [Председатель участка, Председатель совета]
    stored_in: реестр документов кооператива (после встречной подписи)

operations: []

# ── Связи с другими процессами ──────────────────────────────────────────
# Встречная подпись идёт через запросы одобрения совета — общий механизм
# совета без собственного стандарта; межконтрактных процессов нет.
related: []
