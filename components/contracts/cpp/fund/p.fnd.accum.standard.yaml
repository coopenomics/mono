# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Отчисления в фонды накопления кооператива» — как часть членского
# взноса кооперативного участка Стола заказов попадает в фонды кооператива.
#
# У каждого кооператива при старте заводятся три фонда накопления: неделимый
# (1 %), резервный (15 %) и фонд развития кооперации (5 %). Совет вправе
# завести дополнительные фонды со своими процентами. Процент фонда — доля
# членского взноса, которая отчисляется в этот фонд.
#
# Отчисление происходит в момент, когда Стол заказов списывает обеспечительную
# часть паевого взноса в членский взнос участка по итогу месяца: из суммы
# списания одна часть достаётся участку на расходы, вторая — фондам накопления
# по их процентам, третья — инициатору участка, остальное возвращается
# пайщику. Контракт фондов сам делит переданную ему сумму между фондами;
# остаток округления достаётся последнему фонду, чтобы сумма сходилась копейка
# в копейку.
#
# Остаток каждого фонда ведётся отдельно на кошельке фондов накопления (разрез
# по фонду). Прежний учёт фондов в собственных таблицах контракта остаётся
# зеркалом для экранов совета. Вывод средств из фондов — отдельный процесс,
# в этот стандарт не входит.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.fnd.accum
id: public_fund_accum_process
title: Отчисления в фонды накопления кооператива
slug: accum
status: proposed
contract: fund
purpose: >
  Определяет, как часть членского взноса кооперативного участка попадает в
  фонды накопления кооператива. Когда Стол заказов списывает обеспечительную
  часть паевого взноса в членский взнос по итогу месяца участка, сумма
  отчислений передаётся контракту фондов целиком, и он делит её между
  фондами накопления по их процентам: неделимый, резервный, фонд развития
  кооперации и дополнительные фонды совета. Остаток каждого фонда виден
  отдельно и накапливается от месяца к месяцу. Отчисление идёт в составе
  того же заказа, из которого пришли деньги, поэтому в истории заказа оно
  стоит рядом со списанием участку.

roles:
  - source     # Контракт-источник членского взноса — сегодня Стол заказов
  - backend    # Автоматизированная служба кооператива

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
actions:
  - name: fund::accrue
    human: Отчислить в фонды накопления
    actor: Стол заказов
    role: progress
    purpose: >
      Стол заказов при списании обеспечительной части передаёт контракту
      фондов сумму отчислений целиком. Контракт фондов читает список фондов
      накопления кооператива и их проценты, делит сумму пропорционально и
      зачисляет каждому фонду его долю. Остаток округления достаётся
      последнему фонду, поэтому сумма долей равна переданной сумме. Если у
      кооператива нет ни одного фонда накопления с процентом, отчисление
      отклоняется, и списание не проходит целиком.

# ── Секция 3. Сущность и состояния ──────────────────────────────────────────
# Собственной сущности с жизненным циклом у процесса нет: отчисление — одна
# команда контракта-источника внутри его процесса, а фонды накопления —
# настройки кооператива без статусов (запись фонда либо есть, либо нет).
entity: null
entity_human: null
entity_source: cpp/fund/src/

states: []

transitions: []

# ── Секция 4. Операции ledger2 ──────────────────────────────────────────────
operations:
  - ledger_code: o.fnd.accrue
    human_name: Отчисление в фонд накопления из членского взноса кооперативного участка
    wallet_op: TRANSFER
    debit: 80                      # Паевой фонд
    credit: 86                     # Целевое финансирование
    wallet_from: w.mkt.fee         # Пул обеспечительной части «Стола заказов» (счёт 80)
    wallet_to: w.fnd.accum         # Фонды накопления кооператива
    l3:
      - user_wallet: w.fnd.accum
        user_ref: fund.wallet_name # разрез ведётся по фонду, не по пайщику
        available_delta: +доля фонда
        blocked_delta: null
    amount_ref: доля фонда от суммы отчислений (процент фонда к сумме процентов)
    triggered_by: fund::accrue
    description: >
      Доля одного фонда накопления из суммы отчислений месяца участка.
      Паевое становится членским: двойная запись Дт 80 / Кт 86. По одной
      такой операции на каждый фонд в одной транзакции списания; все они
      идут в истории того заказа, обеспечительная часть которого списана.

# ── Связи с другими процессами ──────────────────────────────────────────
# Только по межконтрактным вызовам: consumes — процесс вызывает другой,
# provides — другой процесс вызывает этот.
related:
  - process_type: p.mkt.supply
    relation: provides
    note: >
      Принимает отчисления в фонды накопления из списанной обеспечительной
      части паевого взноса участка.
