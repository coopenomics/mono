# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Фонды кооператива на кошельках» — пять стандартных фондов по
# Положению о фондах, их настройки и отчисления в фонды накопления из
# членского взноса кооперативного участка Стола заказов.
#
# У каждого кооператива пять фондов: три фонда накопления — неделимый (1 %),
# резервный (15 %), фонд развития кооперации (5 %) — и два фонда списания —
# фонд обеспечения хозяйственной деятельности и фонд взаимного обеспечения.
# У каждого фонда свой кошелёк учётной книги на счёте целевого финансирования:
# кошелёк и есть субсчёт фонда, остаток и движения фонда живут только там.
# Контракт фондов хранит настройки: название, описание, процент отчислений,
# кошелёк. Проценты фондов накопления правит председатель совета; набор фондов
# фиксирован, новые фонды советом не заводятся (решение владельца 03.11.2026).
#
# Фонды накопления пополняются в момент, когда Стол заказов списывает
# обеспечительную часть паевого взноса в членский взнос участка по итогу
# месяца: из суммы списания одна часть достаётся участку на расходы, вторая —
# фондам накопления по их процентам, третья — инициатору участка, остальное
# возвращается пайщику. Контракт фондов сам делит переданную ему сумму между
# фондами; остаток округления достаётся последнему фонду, чтобы сумма сходилась
# копейка в копейку.
#
# Фонды списания — транзитные: любая выплата из кооператива, кроме возврата
# паевого взноса, проходит через кошелёк своего фонда перед выходом на
# расчётный счёт. Расходы кооператива, участков и программ — через фонд
# обеспечения хозяйственной деятельности (стандарты «Расход кооператива»,
# «Оплата расхода кооперативного участка», «Расход средств программы
# Образование»), материальная помощь — через фонд взаимного обеспечения
# (стандарт «Материальная помощь»). Оборот кошелька фонда показывает
# бухгалтеру, сколько через фонд потрачено по факту. Вывод средств из фондов
# накопления — отдельный процесс, в этот стандарт не входит.
#
# Канон формата:
#   coopenomics-docs/docs/standards/_spec/canon.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.fnd.accum
id: public_fund_accum_process
title: Фонды кооператива и отчисления в фонды накопления
slug: accum
status: proposed
contract: fund
purpose: >
  Определяет, как устроены фонды кооператива и как часть членского взноса
  кооперативного участка попадает в фонды накопления. У кооператива пять
  стандартных фондов, у каждого — свой кошелёк учётной книги: остаток и
  движения фонда видны по кошельку, настройки фонда (название, описание,
  процент отчислений) хранит контракт фондов, проценты правит председатель
  совета. Когда Стол заказов списывает обеспечительную часть паевого взноса в
  членский взнос по итогу месяца участка, сумма отчислений передаётся
  контракту фондов целиком, и он делит её между неделимым, резервным фондом
  и фондом развития кооперации по их процентам. Отчисление идёт в составе
  того же заказа, из которого пришли деньги, поэтому в истории заказа оно
  стоит рядом со списанием участку.

roles:
  - chairman   # Председатель совета — правит проценты и описания фондов
  - source     # Контракт-источник членского взноса — сегодня Стол заказов
  - backend    # Автоматизированная служба кооператива

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
actions:
  - name: fund::init
    human: Завести фонды
    actor: Совет
    role: opener
    purpose: >
      При старте кооператива заводятся пять стандартных фондов с процентами по
      умолчанию: неделимый 1 %, резервный 15 %, фонд развития кооперации 5 %;
      у фондов списания процента нет. Повторный вызов ничего не меняет.

  - name: fund::editfund
    human: Изменить фонд
    actor: Председатель совета
    role: progress
    purpose: >
      Председатель совета меняет описание фонда и процент отчислений фонда
      накопления. Название стандартного фонда не меняется. Сумма процентов
      фондов накопления не превышает 100 %: иначе итог месяца участка нельзя
      разделить, и правка отклоняется. Приложение проверяет это правило до
      обращения в цепь.

  - name: fund::accrue
    human: Отчислить в фонды накопления
    actor: Стол заказов
    role: progress
    purpose: >
      Стол заказов при списании обеспечительной части передаёт контракту
      фондов сумму отчислений целиком. Контракт фондов читает проценты фондов
      накопления, делит сумму пропорционально и зачисляет каждому фонду его
      долю на кошелёк фонда. Остаток округления достаётся последнему фонду,
      поэтому сумма долей равна переданной сумме. Если у кооператива нет ни
      одного фонда накопления с процентом, отчисление отклоняется, и списание
      не проходит целиком.

# ── Секция 3. Сущность и состояния ──────────────────────────────────────────
# Собственной сущности с жизненным циклом у процесса нет: фонд — настройка
# кооператива без статусов (строка реестра есть у каждого кооператива всегда),
# а отчисление — одна команда контракта-источника внутри его процесса.
entity: null
entity_human: null
entity_source: cpp/fund/src/

states: []

transitions: []

# ── Секция 4. Документы ─────────────────────────────────────────────────────
documents: []

# ── Секция 5. Операции ledger2 ──────────────────────────────────────────────
operations:
  - ledger_code: o.fnd.indiv
    human_name: Отчисление в неделимый фонд из членского взноса кооперативного участка
    wallet_op: TRANSFER
    debit: 80                      # Паевой фонд
    credit: 86                     # Целевое финансирование
    wallet_from: w.mkt.fee         # Пул обеспечительной части «Стола заказов» (счёт 80)
    wallet_to: w.fnd.indiv         # Неделимый фонд
    amount_ref: доля фонда от суммы отчислений (процент фонда к сумме процентов)
    triggered_by: fund::accrue
    description: >
      Доля неделимого фонда из суммы отчислений месяца участка. Паевое
      становится членским: двойная запись Дт 80 / Кт 86. Кошелёк фонда и есть
      его субсчёт: остаток фонда растёт ровно на долю.

  - ledger_code: o.fnd.resrv
    human_name: Отчисление в резервный фонд из членского взноса кооперативного участка
    wallet_op: TRANSFER
    debit: 80
    credit: 86
    wallet_from: w.mkt.fee
    wallet_to: w.fnd.resrv         # Резервный фонд
    amount_ref: доля фонда от суммы отчислений
    triggered_by: fund::accrue
    description: >
      Доля резервного фонда из суммы отчислений месяца участка; идёт в той же
      транзакции, что и доли остальных фондов, в истории того заказа,
      обеспечительная часть которого списана.

  - ledger_code: o.fnd.devel
    human_name: Отчисление в фонд развития кооперации из членского взноса кооперативного участка
    wallet_op: TRANSFER
    debit: 80
    credit: 86
    wallet_from: w.mkt.fee
    wallet_to: w.fnd.devel         # Фонд развития кооперации
    amount_ref: доля фонда от суммы отчислений
    triggered_by: fund::accrue
    description: >
      Доля фонда развития кооперации из суммы отчислений месяца участка.
      Последний фонд по порядку получает остаток округления, поэтому сумма
      трёх долей равна переданной сумме копейка в копейку.

# ── Связи с другими процессами ──────────────────────────────────────────
# Только по межконтрактным вызовам: consumes — процесс вызывает другой,
# provides — другой процесс вызывает этот.
related:
  - process_type: p.mkt.due
    relation: provides
    note: >
      Принимает отчисления в фонды накопления из обеспечительной части паевого
      взноса, списанной по итогу периода участка.
