# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Приём пайщика» — корневой кооперативный процесс приёма в кооператив.
#
# Манифест в стиле «двухуровневое описание»: каждая описательная секция
# содержит короткий tagline и развёрнутый абзац — для тех, кто пробегает
# глазами, и для тех, кто читает вдумчиво.
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.reg.accept
id: public_registrator_accept_process
title: Приём пайщика
slug: accept
status: proposed
contract: registrator
purpose: >
  «Приём пайщика» — корневой кооперативный процесс. Им человек или
  организация вступают в кооператив и получают доступ ко всем остальным
  процессам кооператива. 
roles:
  - contributor        # будущий пайщик
  - chairman           # председатель кооператива — открывает заявку на приём от имени кооператива
  - gateway_operator   # кассир (роль человека, работающего с контрактом Gateway)
  - soviet             # совет кооператива

# ── Секция 2. Действия контракта (блокчейн-уровень) ─────────────────────────
actions:
  - name: registrator::reguser
    human: Подать заявление
    actor: candidate
    role: opener
    purpose: >
      Кандидат подписывает заявление о вступлении и выбирает свой
      кооперативный участок. Кооператив открывает заявку и выставляет
      кандидату счёт на регистрационный взнос (вступительный
      и минимальный паевой). Совет получает оповещение о новом кандидате.

  - name: registrator::confirmpay
    human: Подтвердить оплату
    actor: gateway_operator
    role: progress
    purpose: >
      Кассир сверяет поступление денег с выставленным счётом и
      подтверждает оплату. Заявка переходит к рассмотрению советом.
      Взносы пока никуда не зачислены — они встанут на учёт только
      после положительного решения совета.

  - name: registrator::declinepay
    human: Отклонить оплату
    actor: gateway_operator
    role: reject
    purpose: >
      Если деньги не пришли или платёж отозван, кассир отклоняет оплату.
      Заявка кандидата закрывается, кандидат может подать новую.

  - name: registrator::confirmreg
    human: Принять решение
    actor: soviet
    role: closer
    purpose: >
      Совет рассматривает кандидатуру и принимает положительное решение
      о приёме в кооператив. Кандидат становится активным пайщиком,
      получает доступ ко всем кооперативным процессам, а его взносы
      одновременно встают на учёт в книге кооператива.

  - name: registrator::declinereg
    human: Отклонить советом
    actor: soviet
    role: reject
    purpose: >
      Совет отказывает кандидату в приёме. Заявка закрывается, взносы
      на учёт не ставятся, возврат уплаченных денег оформляется
      отдельной процедурой.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
# Пока человек — кандидат, заявка проходит стадии «заявление подано» и «взносы оплачены».
# После одобрения советом он становится активным пайщиком — это финальная стадия процесса.
# Для BPMN-графа мы показываем единый жизненный цикл процесса.
entity: "registrator::candidate → registrator::account"
entity_human: "Кандидат → пайщик"
entity_source: cpp/registrator/src/user/

states:
  - name: created
    human: Заявление подано
    description: >
      Заявка кандидата открыта, заявление о вступлении подписано
      и сохранено. Кандидату выставлен счёт на сумму вступительного
      и минимального паевого взносов — ожидается оплата.
    kind: normal

  - name: payed
    human: Взносы оплачены
    description: >
      Деньги поступили и подтверждены кассиром. Заявка ждёт решения
      совета. Взносы пока числятся как оплаченные, но на учёт встанут
      только после одобрения советом.
    kind: normal

  - name: active
    human: Пайщик активен
    description: >
      Совет одобрил приём — кандидат стал пайщиком. Вступительный
      и минимальный паевой взносы поставлены на учёт, пайщик добавлен
      в список членов кооператива и может пользоваться всеми остальными
      кооперативными процессами: вносить и возвращать паевые взносы,
      инвестировать в программы, голосовать.
    kind: final

  - name: removed
    human: Отклонено
    description: >
      Заявка кандидата закрыта. Взносы на учёт не ставились. Если
      деньги уже поступили, их возврат оформляется отдельной процедурой.
    kind: virtual
    virtual: true

transitions:
  - from: "∅"
    to: created
    action: registrator::reguser
    actor: candidate
    guards:
      - Кандидат ещё не состоит в кооперативе и не имеет открытой заявки.
      - Тип пользователя — физическое лицо, индивидуальный предприниматель или организация.
      - Заявление подписано ЭЦП кандидата.

  - from: created
    to: payed
    action: registrator::confirmpay
    actor: gateway_operator
    guards:
      - Кассир подтвердил поступление полной суммы регистрационного взноса.

  - from: created
    to: removed
    action: registrator::declinepay
    actor: gateway_operator
    guards:
      - Оплата не поступила или отозвана.

  - from: payed
    to: active
    action: registrator::confirmreg
    actor: soviet
    ledger_code: p.reg.accept
    operations:
      - o.reg.payent
      - o.reg.putmin
    guards:
      - Совет принял положительное решение о приёме кандидата.

  - from: payed
    to: removed
    action: registrator::declinereg
    actor: soviet
    guards:
      - Совет отказал кандидату в приёме.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления
      actor: candidate
      action: registrator::reguser
      description: >
        Кандидат подписывает заявление и получает счёт на оплату.

        Будущий пайщик оформляет заявление о вступлении, указывает
        свой тип (физическое лицо, ИП или организация) и территориальный
        участок и подписывает заявление электронной подписью. Кооператив
        открывает заявку и выставляет счёт на сумму вступительного
        и минимального паевого взносов. Совет получает оповещение
        о новом кандидате.
      pre:
        - Кандидат ещё не состоит в кооперативе.
        - Тип пользователя выбран корректно.
      post:
        - Заявка кандидата открыта.
        - Кандидату выставлен счёт на оплату взносов.
        - Совет уведомлён о появлении нового кандидата.

    - step: 2
      title: Оплата взносов
      actor: gateway_operator
      action: registrator::confirmpay
      description: >
        Деньги пришли — заявка идёт на рассмотрение совета.

        Кандидат оплачивает выставленный счёт. Кассир сверяет
        поступление и подтверждает оплату. Заявка
        переходит на этап рассмотрения советом. Сами взносы пока
        не зачислены на учёт — это произойдёт только после положительного
        решения совета.
      pre:
        - Заявка кандидата открыта.
        - Поступила полная сумма регистрационного взноса.
      post:
        - Оплата подтверждена.
        - Совет рассматривает кандидатуру.

    - step: 3
      title: Принятие решения советом
      actor: soviet
      action: registrator::confirmreg
      description: >
        Совет принимает решение — кандидат становится пайщиком, взносы встают на учёт.

        Совет рассматривает кандидатуру и при положительном решении
        принимает кандидата в кооператив. С этого момента: кандидат
        получает статус активного пайщика, добавляется в список членов
        кооператива, а регистрационный взнос одновременно встаёт
        на учёт в книге кооператива.
      pre:
        - Оплата подтверждена.
        - Решение совета подписано.
      post:
        - Кандидат стал активным пайщиком кооператива.
        - Пайщик включён в список участников кооператива.
        - Вступительный и минимальный паевой взносы поставлены на учёт.

  alternatives:
    - branch: Отказ на этапе оплаты
      at_step: 2
      action: registrator::declinepay
      actor: gateway_operator
      description: >
        Платёж не прошёл или был отменён.

        Кассир отклоняет оплату. Заявка кандидата закрывается, взносы
        на учёт не ставятся. Кандидат может подать новое заявление.

    - branch: Отказ совета
      at_step: 3
      action: registrator::declinereg
      actor: soviet
      description: >
        Совет отказывает кандидату.

        Заявка закрывается, взносы на учёт не ставятся. Уплаченные
        деньги подлежат возврату — возврат оформляется отдельной
        процедурой вне этого процесса.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - action: registrator::reguser
    title: Заявление на вступление в кооператив
    registry_id: 100
    signed_by: [ Кандидат ]
    stored_in: candidates.statement

  - action: registrator::confirmreg
    title: Решение совета о приёме пайщика в кооператив
    registry_id: 501
    signed_by: [ Совет ]
    stored_in: "(authorization — в параметре действия, не хранится в candidates после удаления записи)"

# ── Секция 6. Операции ──────────────────────────────────────────────────────
# На шаге одобрения советом одновременно встают на учёт два взноса —
# вступительный и минимальный паевой.
operations:
  - ledger_code: o.reg.payent
    human_name: Вступительный взнос пайщика
    wallet_op: ISSUE
    wallet_from: ''
    wallet_to: w.reg.entry
    debit: 51
    credit: 86
    amount_ref: candidate.initial
    triggered_by: registrator::confirmreg
    description: >
      Вступительный взнос нового пайщика встаёт на учёт как целевое
      поступление в кооперативный фонд.

  - ledger_code: o.reg.putmin
    human_name: Минимальный паевой взнос при регистрации
    wallet_op: ISSUE
    wallet_from: ''
    wallet_to: w.reg.minshr
    debit: 51
    credit: 80
    amount_ref: candidate.minimum
    triggered_by: registrator::confirmreg
    description: >
      Минимальный паевой взнос нового пайщика встаёт на учёт в паевом
      фонде кооператива.

