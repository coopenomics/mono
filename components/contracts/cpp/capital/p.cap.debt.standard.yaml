# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Заём пайщику» — кооператив выдаёт беспроцентный целевой заём из
# паевого фонда и получает его обратно при сдаче проекта.
#
# Заём выдаётся в момент авторизации советом; возврат происходит при приёме
# результата работы (акт приёма-передачи).
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.cap.debt
id: public_capital_debt_process
title: Выдача займа пайщику
slug: debt
status: proposed
contract: capital
purpose: >
  «Заём пайщику» — кооператив выдаёт пайщику беспроцентный целевой заём
  из паевого фонда на срок проекта. Заявку последовательно одобряют
  председатель и совет, выплата уходит пайщику через кассира. Возврат
  происходит автоматически при сдаче акта приёма-передачи проекта —
  отдельная заявка на возврат не нужна.
roles:
  - contributor
  - chairman
  - soviet
  - gateway_operator

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: capital::createdebt
    human: Подать заявление
    actor: contributor
    role: opener
    purpose: >
      Пайщик создаёт заявку на беспроцентный целевой заём. Заявка на заём
      зарегистрирована. Под неё резервируется часть доступного пайщику лимита
      на сумму займа.
  - name: capital::approvedebt
    human: Одобрить решением председателя
    actor: chairman
    role: progress
    purpose: >
      Председатель добавляет к заявке документ-одобрение займа. Заявка переходит
      в состояние «Председатель одобрил» и ждёт авторизации советом.
  - name: capital::debtauthcnfr
    human: Разрешить выдачу
    actor: soviet
    role: progress
    purpose: >
      Совет разрешает выдачу займа, и кассир получает поручение на выплату.
      Заявка ждёт подтверждения платежа.
  - name: capital::debtpaycnfrm
    human: Подтвердить выплату
    actor: gateway_operator
    role: closer
    purpose: >
      Кассир подтверждает зачисление займа на банковский счёт пайщика. Заявка
      переходит в состояние «Заём выплачен».
      Это завершающее действие: запись о займе сохраняется до момента его
      возврата — возврат происходит автоматически при сдаче результата работы
      (акт приёма-передачи проекта).
  - name: capital::declinedebt
    human: Отклонить
    actor: chairman
    role: reject
    purpose: >
      Председатель или совет отклоняет заявку на заём. Зарезервированный под заём
      лимит пайщика возвращается, заявка удаляется, никаких денежных движений
      не происходит.
  - name: capital::debtpaydcln
    human: Сообщить, что платёж не прошёл
    actor: gateway_operator
    role: progress
    purpose: >
      Платёж по реквизитам не прошёл. Заявка не аннулируется и решение совета
      остаётся в силе: заявка возвращается в состояние «Совет разрешил выдачу»
      с указанием причины, и платёж можно отправить повторно.
  - name: capital::debtpayretry
    human: Отправить платёж повторно
    actor: chairman
    role: progress
    purpose: >
      Кооператив отправляет платёж по займу заново — тем же решением совета,
      без повторного заседания. Заявка снова ждёт подтверждения платежа.
  - name: capital::settledebt
    human: Вернуть заём деньгами
    actor: contributor
    role: closer
    purpose: >
      Пайщик возвращает заём деньгами. Сумма должна покрывать заём целиком —
      частичный возврат не предусмотрен. Заём считается возвращённым.
  - name: capital::markdebtoverd
    human: Отметить просрочку
    actor: chairman
    role: progress
    purpose: >
      Кооператив отмечает займы, срок возврата которых прошёл. Просрочка ничего
      не отнимает у пайщика: заём по-прежнему закрывается возвратом денег или
      сдачей результата, но кооператив видит такие займы отдельно.
  - name: capital::closedebt
    human: Закрыть невозврат
    actor: chairman
    role: closer
    purpose: >
      Срок возврата прошёл, а заём не вернули ни деньгами, ни результатом.
      Работа, которой пайщик обеспечивал заём, переходит кооперативу как
      нематериальный актив, а заём списывается. Санкций к пайщику нет,
      подпись пайщика не требуется.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: capital::debt
entity_human: Долг пайщика
entity_source: app/debt_managment/create_debt/

states:
  - name: created
    human: Заявление подано
    description: >
      Заявка на заём создана. Под неё зарезервирована часть доступного пайщику
      лимита на запрошенную сумму.
    kind: normal
  - name: approved
    human: Председатель одобрил
    description: >
      К заявке добавлен документ-одобрение председателя. Заявка ждёт авторизации
      советом.
    kind: normal
  - name: authorized
    human: Совет разрешил выдачу
    description: >
      Совет разрешил выдачу займа. Платёж ещё не отправлен либо вернулся
      с отказом по реквизитам — в этом случае в заявке хранится причина отказа
      и платёж можно отправить повторно тем же решением.
    kind: normal
  - name: paypending
    human: Платёж отправлен
    description: >
      Поручение на выплату передано кассиру. Заявка ждёт подтверждения
      зачисления либо сообщения о том, что платёж не прошёл.
    kind: normal
  - name: paid
    human: Заём выдан
    description: >
      Кассир подтвердил зачисление займа пайщику. Назначен срок возврата — год
      со дня выдачи. Заём числится за пайщиком до возврата.
    kind: normal
  - name: overdue
    human: Срок возврата прошёл
    description: >
      Срок возврата истёк. Заём закрывается так же, как и до просрочки —
      возвратом денег или сдачей результата.
    kind: normal
  - name: settled
    human: Заём возвращён
    description: >
      Пайщик вернул заём деньгами либо закрыл его сдачей результата по акту
      приёма-передачи.
    kind: final
  - name: writeoff
    human: Заём списан
    description: >
      Работа-обеспечение перешла кооперативу как нематериальный актив,
      обязательство пайщика списано.
    kind: final
  - name: removed
    human: Отклонено
    description: >
      Заявка отклонена на одном из этапов; запись удалена, никаких денежных
      движений по займу не было.
    kind: virtual
    virtual: true

transitions:
  - from: "∅"
    to: created
    action: capital::createdebt
    actor: contributor
    guards:
      - Пайщик имеет статус active и участвует в проекте.
      - Доступный пайщику лимит подтверждён и актуален.
      - Доступного пайщику лимита достаточно для запрошенной суммы займа.
      - Заявление подписано ЭЦП.

  - from: created
    to: approved
    action: capital::approvedebt
    actor: chairman
    guards:
      - Документ одобрения председателя подписан.

  - from: approved
    to: paypending
    action: capital::debtauthcnfr
    actor: soviet
    guards:
      - Документ решения совета подписан.

  - from: paypending
    to: paid
    action: capital::debtpaycnfrm
    actor: gateway_operator
    ledger_code: o.cap.lend
    operations:
      - o.cap.lend
    guards:
      - Кассир (платёжная система) подтвердил зачисление займа пайщику.

  - from: paypending
    to: authorized
    action: capital::debtpaydcln
    actor: gateway_operator
    guards:
      - Платёж не прошёл по реквизитам; причина отказа сохраняется в заявке.

  - from: authorized
    to: paypending
    action: capital::debtpayretry
    actor: chairman
    guards:
      - По заявке есть причина отказа от предыдущей отправки платежа.
      - Решение совета уже принято и заново не требуется.

  - from: paid
    to: overdue
    action: capital::markdebtoverd
    actor: chairman
    guards:
      - Срок возврата займа прошёл.

  - from: paid
    to: settled
    action: capital::settledebt
    actor: contributor
    ledger_code: o.cap.repay
    operations:
      - o.cap.repay
    guards:
      - Сумма возврата покрывает заём целиком.
      - Заявление пайщика о возврате подписано.

  - from: overdue
    to: settled
    action: capital::settledebt
    actor: contributor
    ledger_code: o.cap.repay
    operations:
      - o.cap.repay
    guards:
      - Сумма возврата покрывает заём целиком.
      - Заявление пайщика о возврате подписано.

  - from: overdue
    to: writeoff
    action: capital::closedebt
    actor: chairman
    ledger_code: o.cap.crtnma
    operations:
      - o.cap.crtnma
      - o.cap.dbtwrf
    guards:
      - Срок возврата займа прошёл, и заём не закрыт ни деньгами, ни результатом.

  - from: created
    to: removed
    action: capital::declinedebt
    actor: chairman
    guards:
      - Председатель или совет отклонили заявку.

  - from: approved
    to: removed
    action: capital::declinedebt
    actor: soviet
    guards:
      - Совет отклонил заявку.


# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления на заём
      actor: contributor
      action: capital::createdebt
      description: >
        Пайщик подаёт заявление на беспроцентный целевой заём.
        Заявка на заём регистрируется, под неё резервируется часть доступного
        пайщику лимита на запрошенную сумму.

    - step: 2
      title: Одобрение председателем
      actor: chairman
      action: capital::approvedebt
      description: >
        Председатель добавляет к заявке документ-одобрение. Заявка переходит
        в состояние «Председатель одобрил».

    - step: 3
      title: Решение совета и поручение на выплату
      actor: soviet
      action: capital::debtauthcnfr
      description: >
        Совет разрешает выдачу займа, кассир получает поручение на выплату.
        Заявка переходит в состояние «Платёж отправлен».

    - step: 4
      title: Подтверждение выплаты
      actor: gateway_operator
      action: capital::debtpaycnfrm
      description: >
        Кассир подтверждает зачисление средств пайщику. Заём считается выданным,
        ему назначается срок возврата — год со дня выдачи. Деньги уходят
        с расчётного счёта кооператива и учитываются как финансовое вложение.

    - step: 5
      title: Возврат займа
      actor: contributor
      action: capital::settledebt
      description: >
        Пайщик возвращает заём деньгами: сумма покрывает заём целиком, и заём
        считается возвращённым. Тот же результат даёт сдача работы по акту
        приёма-передачи: заём засчитывается результатом (см. процесс приёма
        результата работы).

  alternatives:
    - branch: Отказ председателя или совета
      at_step: 2
      action: capital::declinedebt
      actor: chairman
      description: >
        Заявка отклонена. Зарезервированный под заём лимит пайщика возвращается,
        заявка удаляется, денежных движений не происходит.
    - branch: Платёж не прошёл по реквизитам
      at_step: 4
      action: capital::debtpaydcln
      actor: gateway_operator
      description: >
        Платёж не прошёл. Заявка не аннулируется: решение совета остаётся
        в силе, причина отказа сохраняется, и кооператив отправляет платёж
        повторно тем же решением.
    - branch: Срок возврата прошёл
      at_step: 5
      action: capital::markdebtoverd
      actor: chairman
      description: >
        Заём отмечается просроченным. Пайщик по-прежнему возвращает его деньгами
        или сдачей результата — просрочка ничего не отнимает и не добавляет,
        она нужна кооперативу для учёта.
    - branch: Невозврат по истечении срока
      at_step: 5
      action: capital::closedebt
      actor: chairman
      description: >
        Срок прошёл, заём не вернули ни деньгами, ни результатом. Работа,
        которой пайщик обеспечивал заём, переходит кооперативу как
        нематериальный актив, а заём списывается. Санкций к пайщику нет.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - step: 1
    title: Заявление на получение займа
    registry_id: 1050
    signed_by: [contributor]
    stored_in: debts.statement

  - step: 2
    title: Решение совета о предоставлении займа (одобрение председателем)
    registry_id: 1051
    signed_by: [chairman]
    stored_in: debts.approved_statement

  - step: 3
    title: Решение совета о предоставлении займа (авторизация совета)
    registry_id: 1051
    signed_by: [soviet]
    stored_in: debts.authorization

  # Отдельный шаблон заявления о возврате займа пока не утверждён: при возврате
  # деньгами кооператив прикладывает подписанное пайщиком заявление, а проверка
  # ограничивается его подписью. Завести шаблон — отдельная задача.
  - step: 5
    title: Заявление пайщика о возврате займа
    registry_id: null
    signed_by: [contributor]
    stored_in: '' 

# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.cap.lend
    human_name: Выдача пайщику беспроцентного займа
    wallet_op: ISSUE
    wallet_from: ''
    wallet_to: w.cap.loan            # Выданные пайщикам беспроцентные займы
    debit: 58                  # Финансовые вложения
    credit: 51                 # Расчётный счёт
    amount_ref: debt.amount
    triggered_by: capital::debtpaycnfrm
    description: >
      Выдача беспроцентного займа пайщику. Деньги уходят с расчётного счёта
      кооператива (Кт 51) и появляются как финансовое вложение Дт 58.
      Кошелёк «Выданные пайщикам беспроцентные займы» фиксирует
      обязательство пайщика перед кооперативом.

  - ledger_code: o.cap.repay
    human_name: Возврат займа пайщиком
    wallet_op: TRANSFER
    wallet_from: w.cap.loan          # Выданные пайщикам беспроцентные займы
    wallet_to: w.wal.share           # Паевой взнос пайщика
    debit: 80                  # Паевой фонд
    credit: 58                 # Финансовые вложения
    amount_ref: debt.amount
    triggered_by: capital::settledebt
    description: >
      Пайщик вернул заём деньгами. Финансовое вложение кооператива закрывается,
      обязательство пайщика снимается.

  - ledger_code: o.cap.crtnma
    human_name: Работа-обеспечение перешла кооперативу как нематериальный актив
    wallet_op: TRANSFER
    wallet_from: w.cap.gen           # Работа по программе «Генератор»
    wallet_to: w.cap.nma             # Нематериальные активы кооператива
    debit: 4                   # Нематериальные активы
    credit: 8                  # Вложения во внеоборотные активы
    amount_ref: debt.amount
    triggered_by: capital::closedebt
    description: >
      Работа, которой пайщик обеспечивал заём, переходит кооперативу. Пара
      счетов та же, что при приёме результата, но взнос пайщику не
      начисляется — актив достаётся кооперативу.

  - ledger_code: o.cap.dbtwrf
    human_name: Списание невозвращённого займа
    wallet_op: BURN
    wallet_from: w.cap.loan          # Выданные пайщикам беспроцентные займы
    wallet_to: ''
    debit: 80                  # Паевой фонд
    credit: 58                 # Финансовые вложения
    amount_ref: debt.amount
    triggered_by: capital::closedebt
    description: >
      Обязательство пайщика закрыто имуществом, поэтому паевой взнос ему,
      в отличие от обычного возврата, не начисляется.

# Заём закрывается и сдачей работы: при подписании акта приёма-передачи
# возврат проводится той же операцией o.cap.repay — см. процесс приёма
# результата работы (p.cap.rid).

