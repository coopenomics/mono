# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Займ пайщику»
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.cap.debt
id: public_capital_debt_process
title: Выдача займа пайщику
slug: debt
status: proposed
contract: capital
purpose: >
  Пайщик получает из паевого фонда кооператива беспроцентный целевой заём
  сроком на один год. Решение о выдаче принимает совет кооператива. Заём
  возвращается автоматически при сдаче результата работ по проекту. Если же
  проект до сдачи не доведён и был отменён, долг закрывается за счёт
  имущества, которое пайщик ранее передал кооперативу в обеспечение по этому
  займу. Никаких санкций к пайщику в случае невозврата не применяется.
roles:
  - Пайщик
  - Председатель
  - Совет
  - Кассир

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: capital::createdebt
    human: Подать заявление
    actor: Пайщик
    purpose: >
      Пайщик подаёт заявление на беспроцентный целевой заём.
  - name: capital::approvedebt
    human: Одобрить
    actor: Председатель
    purpose: >
      Председатель одобряет заявление пайщика и выносит его на утверждение
      советом.
  - name: capital::debtauthcnfr
    human: Авторизовать выплату
    actor: Совет
    purpose: >
      Совет утверждает выдачу займа и поручает кассиру выполнить выплату.
  - name: capital::debtpaycnfrm
    human: Подтвердить выплату
    actor: Кассир
    purpose: >
      Кассир подтверждает зачисление денежных средств пайщику. С этого
      момента отсчитывается срок возврата — один год.
  - name: capital::declinedebt
    human: Отклонить
    actor: Председатель
    purpose: >
      Председатель или совет отклоняет заявление о выдаче займа.
  - name: capital::debtpaydcln
    human: Отклонить выплату
    actor: Кассир
    purpose: >
      Кассир сообщает, что выплата не прошла (технический сбой, возврат
      средств банком). Заявление снимается.
  - name: capital::closedebt
    human: Закрыть займ
    actor: Председатель совета
    purpose: >
      Если проект, под который был выдан заём, отменён до сдачи результата —
      долг закрывается за счёт имущества, ранее переданного пайщиком
      кооперативу в обеспечение по этому займу. Делается автоматически:
      без сбора совета и без подписи пайщика.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: capital::debt
entity_human: Долг пайщика

states:
  - name: created
    human: Заявление подано
    description: >
      Пайщик подал заявление на заём. Документ ждёт решения председателя.
    kind: normal
  - name: approved
    human: Одобрено председателем
    description: >
      Председатель одобрил заявление. Документ ушёл на утверждение совету.
    kind: normal
  - name: authorized
    human: Утверждено советом
    description: >
      Совет утвердил выдачу займа. Кассиру поручено выполнить выплату.
    kind: normal
  - name: paid
    human: Заём выплачен
    description: >
      Кассир подтвердил зачисление средств пайщику. С этого дня
      отсчитывается срок возврата — один год. Возврат произойдёт
      автоматически вместе со сдачей результата работ по проекту.
    kind: normal
  - name: writeoff
    human: Списано через имущество-обеспечение
    description: >
      Проект, под который был выдан заём, отменён до сдачи результата.
      Долг закрыт автоматически за счёт имущества, переданного пайщиком
      кооперативу в обеспечение по этому займу. Запись о займе остаётся
      в реестре с этой пометкой для последующего аудита; никаких претензий
      к пайщику не предъявляется.
    kind: normal
  - name: removed
    human: Заявление отклонено
    description: >
      Заявление снято на одном из этапов согласования — председателем,
      советом или кассиром.
    kind: virtual
    virtual: true

transitions:
  - from: "∅"
    to: created
    action: capital::createdebt
    actor: Пайщик
    guards:
      - Пайщик — активный участник кооператива.
      - Пайщик участвует в проекте, под который запрашивается заём.
      - На сегменте пайщика хватает доступной суммы для запроса.
      - Заявление подписано пайщиком.

  - from: created
    to: approved
    action: capital::approvedebt
    actor: Председатель
    guards:
      - Председатель подписал решение об одобрении.

  - from: approved
    to: authorized
    action: capital::debtauthcnfr
    actor: Совет
    guards:
      - Совет принял решение о выдаче займа.

  - from: authorized
    to: paid
    action: capital::debtpaycnfrm
    actor: Кассир
    guards:
      - Кассир подтвердил зачисление средств пайщику.

  - from: created
    to: removed
    action: capital::declinedebt
    actor: Председатель
    guards:
      - Председатель или совет отклонили заявление.

  - from: approved
    to: removed
    action: capital::declinedebt
    actor: Совет
    guards:
      - Совет отклонил заявление.

  - from: authorized
    to: removed
    action: capital::debtpaydcln
    actor: Кассир
    guards:
      - Платёж не прошёл — банк отклонил или вернул перевод.

  - from: paid
    to: writeoff
    action: capital::closedebt
    actor: Председатель совета
    guards:
      - Проект, под который был выдан заём, отменён.
      - У пайщика на сегменте есть имущество, переданное в обеспечение.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления
      actor: Пайщик
      action: capital::createdebt
      description: >
        Пайщик подаёт заявление на беспроцентный целевой заём.

    - step: 2
      title: Одобрение председателем
      actor: Председатель
      action: capital::approvedebt
      description: >
        Председатель рассматривает заявление и при согласии одобряет его,
        вынося на утверждение совету.

    - step: 3
      title: Утверждение советом и поручение на выплату
      actor: Совет
      action: capital::debtauthcnfr
      description: >
        Совет утверждает выдачу займа. Кассиру передаётся поручение на
        перечисление средств пайщику.

    - step: 4
      title: Подтверждение выплаты
      actor: Кассир
      action: capital::debtpaycnfrm
      description: >
        Кассир выполняет перевод и подтверждает зачисление средств пайщику.
        С этого дня отсчитывается срок возврата — один год.

  alternatives:
    - branch: Отказ председателя или совета
      at_step: 2
      action: capital::declinedebt
      actor: Председатель
      description: >
        Заявление отклонено на этапе согласования. Деньги пайщику не
        перечисляются.
    - branch: Не прошёл платёж
      at_step: 4
      action: capital::debtpaydcln
      actor: Кассир
      description: >
        Банк отклонил или вернул перевод. Заявление снимается; пайщик может
        подать его заново.
    - branch: Невозврат — закрытие через имущество-обеспечение
      at_step: 4
      action: capital::closedebt
      actor: Председатель совета
      description: >
        Если проект, под который был выдан заём, отменён до сдачи
        результата — долг закрывается автоматически за счёт имущества,
        переданного пайщиком кооперативу в обеспечение по этому займу.
        Сбора совета не требуется, подпись пайщика не требуется,
        претензий к пайщику не предъявляется.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - action: capital::createdebt
    title: Заявление на получение займа
    registry_id: 1050
    signed_by: [Пайщик]
    stored_in: debts.statement

  - action: capital::approvedebt
    title: Решение совета о предоставлении займа (одобрение председателем)
    registry_id: 1051
    signed_by: [Председатель]
    stored_in: debts.approved_statement

  - action: capital::debtauthcnfr
    title: Решение совета о предоставлении займа (утверждение советом)
    registry_id: 1051
    signed_by: [Совет]
    stored_in: debts.authorization

# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.cap.lend
    human_name: Выдача пайщику беспроцентного займа
    wallet_op: ISSUE
    debit: 58
    credit: 51
    wallet_from: null
    wallet_to: w.cap.loan
    amount_ref: debt.amount
    triggered_by: capital::debtauthcnfr
    description: >
      Кооператив перечисляет пайщику беспроцентный целевой заём. На стороне
      кооператива деньги уходят с расчётного счёта и фиксируются как
      финансовое вложение в пайщика-должника.

  - ledger_code: o.cap.repay
    human_name: Возврат беспроцентного займа пайщика при сдаче результата
    wallet_op: TRANSFER
    debit: 80
    credit: 58
    wallet_from: w.cap.loan
    wallet_to: w.wal.share
    user_wallet: w.wal.share
    user_ref: debt.username
    available_delta: +debt.amount
    blocked_delta: null
    amount_ref: debt.amount
    triggered_by: capital::debtpaycnfrm
    description: >
      Происходит в момент сдачи результата работ по проекту (вторая
      подпись на акте). Долг пайщика гасится, а сумма займа зачитывается
      ему как паевой взнос — появляется как свободный остаток на личном
      паевом кошельке пайщика.

  - ledger_code: o.cap.crtnma
    human_name: Создание имущества кооператива из обеспечения по займу
    wallet_op: TRANSFER
    debit: 4
    credit: 8
    wallet_from: w.cap.gen
    wallet_to: w.cap.nma
    amount_ref: debt.amount
    triggered_by: capital::closedebt
    description: >
      Срабатывает при невозврате: проект, под который был выдан заём,
      отменён до сдачи результата. Имущество, ранее переданное пайщиком
      кооперативу в обеспечение, переходит в собственность кооператива
      как нематериальный актив.

  - ledger_code: o.cap.dbtwrf
    human_name: Списание долга за счёт имущества-обеспечения
    wallet_op: BURN
    debit: 80
    credit: 58
    wallet_from: w.cap.loan
    wallet_to: null
    amount_ref: debt.amount
    triggered_by: capital::closedebt
    description: >
      Парная операция к созданию имущества из обеспечения: обязательство
      пайщика по займу закрывается. На паевой кошелёк пайщика ничего не
      зачисляется — долг закрыт имущественно, через переданное в
      обеспечение имущество.

# ── Секция 7. Связи ─────────────────────────────────────────────────────────
related:
  - process_type: p.cap.rid
    id: public_capital_rid_process
    relation: triggers
    note: >
      Возврат займа физически происходит при сдаче результата работ по
      проекту (вторая подпись на акте) — в процессе «Приём результата
      интеллектуальной деятельности».

  - process_type: p.reg.accept
    id: public_registrator_accept_process
    relation: provides
    note: >
      Заём может получить только активный пайщик кооператива.

  - process_type: p.cap.rid
    id: public_capital_rid_process
    relation: affects
    note: >
      Закрытие долга через имущество-обеспечение уменьшает на сегменте
      пайщика ту часть, которая раньше была передана в обеспечение и
      теперь стала собственностью кооператива.
