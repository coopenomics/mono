# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Займ пайщику» — выдача беспроцентного целевого займа из паевого
# фонда кооператива, его возврат через акт приёма-передачи проекта либо
# обращение взыскания на коммиты-обеспечение при невозврате.
#
# Многоактовый процесс с авторизацией советом. Четыре операции:
#   • o.cap.lend   — выдача займа на момент авторизации (ISSUE → w.cap.loan, Дт 58 / Кт 51)
#   • o.cap.repay  — возврат займа из акта-2 (TRANSFER w.cap.loan → w.wal.share, Дт 80 / Кт 58)
#   • o.cap.dflt   — обращение взыскания на коммиты-обеспечение при невозврате
#                    (TRANSFER w.cap.gen → w.cap.coopn, Дт 04 / Кт 08; решение 2026-05-19)
#   • o.cap.lnwoff — списание займа в счёт обращения взыскания
#                    (BURN w.cap.loan, Дт 80 / Кт 58; решение 2026-05-19)
#
# Срок займа: 1 год (фиксированный). Если родительский компонент явно перешёл
# в `cancelled/rejected` раньше — займ закрывается досрочно через `dfltdebt`
# без сбора совета и без подписи пайщика.
#
# Источники правды в коде:
#   • cpp/capital/capital.hpp                                       — actions
#   • cpp/capital/app/debt_managment/create_debt/{createdebt,approvedebt,debtauthcnfr,debtpaycnfrm,declinedebt,debtpaydcln,markdebtoverd,dfltdebt}.cpp
#   • cpp/capital/domain/entities/debts.hpp                         — DEFAULT_DEBT_TERM_SECONDS = 365 дней
#   • cpp/lib/core/ledger2/operations.hpp                           — o.cap.lend, o.cap.repay, o.cap.dflt, o.cap.lnwoff
#   • cpp/lib/core/ledger2/processes.hpp                            — processes::capital::DEBT
#   • cpp/lib/core/ledger2/wallets.hpp                              — w.cap.coopn (COOP_NMA, COOPERATIVE)
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.cap.debt
id: public_capital_debt_process
title: Выдача займа пайщику
slug: debt
status: proposed
contract: capital
summary: >
  Пайщик получает из паевого фонда кооператива беспроцентный целевой заём
  на год; возврат происходит при сдаче акта-2 проекта, либо — если проект
  не доведён до завершения — займ закрывается автоматически через коммиты
  пайщика, переданные в обеспечение.
purpose: >
  «Заём пайщику» — кооператив выдаёт пайщику беспроцентный целевой заём
  из паевого фонда на год. Заявку последовательно одобряют председатель
  и совет, выплата уходит пайщику через кассира. Возврат происходит
  автоматически при сдаче акта приёма-передачи проекта — отдельная заявка
  на возврат не нужна. Если родительский компонент проекта явно отменён
  или отклонён, займ закрывается автоматически без участия пайщика и без
  сбора совета: коммиты, ранее переданные пайщиком в обеспечение по
  договору ответственного хранения, переходят в имущество кооператива,
  а обязательство пайщика по займу списывается. Никаких санкций к пайщику
  не применяется.
roles:
  - contributor
  - chairman
  - soviet
  - gateway_operator

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: capital::createdebt
    human: Подать заявление
    actor: contributor
    role: opener
    purpose: >
      Пайщик создаёт заявку на беспроцентный целевой заём. Контракт фиксирует
      запись долга в статусе `created`, обновляет сегмент CRPS пайщика на
      сумму займа.
  - name: capital::approvedebt
    human: Одобрить решением председателя
    actor: chairman
    role: progress
    purpose: >
      Председатель добавляет к заявке документ-одобрение займа. Статус
      заявки → `approved`.
  - name: capital::debtauthcnfr
    human: Авторизовать выплату
    actor: soviet
    role: progress
    purpose: >
      Совет авторизует выплату займа. На этом этапе применяется ledger2-
      операция o.cap.lend и Gateway получает поручение на исходящий платёж.
      Статус → `authorized`.
  - name: capital::debtpaycnfrm
    human: Подтвердить выплату
    actor: gateway_operator
    role: closer
    purpose: >
      Gateway подтверждает зачисление займа на счёт пайщика. Статус → `paid`.
      Это закрывающее действие: запись долга сохраняется до возврата
      (операция o.cap.repay сработает уже на акте-2 в процессе РИД).
  - name: capital::declinedebt
    human: Отклонить
    actor: chairman
    role: reject
    purpose: >
      Председатель или совет отклоняет заявку на заём. Сегмент CRPS откатывается,
      запись долга удаляется, операции в ledger2 не создаются.
  - name: capital::debtpaydcln
    human: Отклонить выплату
    actor: gateway_operator
    role: reject
    purpose: >
      Gateway отклонил исходящий платёж по займу (тех. ошибка, возврат).
      Запись долга удаляется.

  - name: capital::dfltdebt
    human: Закрыть займ через обеспечение
    actor: coopname
    role: closer
    purpose: >
      Автоматическое закрытие займа при невозврате: родительский компонент
      явно перешёл в `cancelled/rejected`, проект до акта-2 не дойдёт.
      Применяются две ledger2-операции — o.cap.dflt (обращение взыскания на
      коммиты-обеспечение, Дт 04 / Кт 08, TRANSFER w.cap.gen → w.cap.coopn)
      и o.cap.lnwoff (списание займа, Дт 80 / Кт 58, BURN w.cap.loan).
      Запись долга удаляется, сегмент пайщика уменьшается на сумму обращения,
      счётчик `active_debts_count` декрементируется. Никаких санкций к
      пайщику, без сбора совета и без подписи пайщика (решение 2026-05-19).

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: capital::debt
entity_human: Долг пайщика
entity_source: cpp/capital/src/debt/

states:
  - name: created
    human: Заявление подано
    description: >
      Заявка на заём создана. Сегмент CRPS пайщика обновлён на запрошенную сумму.
    kind: normal
  - name: approved
    human: Председатель одобрил
    description: >
      К заявке добавлен документ-одобрение председателя. Заявка ждёт авторизации
      советом.
    kind: normal
  - name: authorized
    human: Совет авторизовал
    description: >
      Совет авторизовал заём, в ledger2 применена операция o.cap.lend
      (Дт 58 / Кт 51), Gateway получил поручение на исходящий платёж.
    kind: normal
  - name: paid
    human: Заём выплачен
    description: >
      Gateway подтвердил зачисление займа пайщику. Запись долга остаётся
      в реестре до момента возврата через акт приёма-передачи проекта.
      due_at = now + 1 год; если до этого срока компонент перешёл в
      `cancelled/rejected` — займ закрывается через обращение взыскания
      на обеспечение (см. defaulted).
    kind: normal
  - name: defaulted
    human: Закрыт через обеспечение
    description: >
      Займ закрыт автоматически через обращение взыскания на коммиты-
      обеспечение пайщика (родительский компонент в `cancelled/rejected`).
      В ledger2 применены o.cap.dflt (Дт 04 / Кт 08, TRANSFER w.cap.gen →
      w.cap.coopn) и o.cap.lnwoff (Дт 80 / Кт 58, BURN w.cap.loan).
      Запись долга удалена, коммиты-обеспечение перешли в имущество
      кооператива (НМА). Решение 2026-05-19.
    kind: virtual
    virtual: true
  - name: removed
    human: Отклонено
    description: >
      Заявка отклонена на одном из этапов; запись удалена, операции
      o.cap.lend / o.cap.repay / o.cap.dflt / o.cap.lnwoff не создавались.
    kind: virtual
    virtual: true

transitions:
  - from: "∅"
    to: created
    action: capital::createdebt
    actor: contributor
    guards:
      - Пайщик имеет статус active и участвует в проекте.
      - Сегмент CRPS пайщика актуален.
      - provisional_amount ≥ запрошенная сумма займа.
      - Заявление подписано ЭЦП.

  - from: created
    to: approved
    action: capital::approvedebt
    actor: chairman
    guards:
      - Документ одобрения председателя подписан.

  - from: approved
    to: authorized
    action: capital::debtauthcnfr
    actor: soviet
    ledger_code: o.cap.lend
    operations:
      - o.cap.lend
    guards:
      - Документ авторизации совета подписан.

  - from: authorized
    to: paid
    action: capital::debtpaycnfrm
    actor: gateway_operator
    guards:
      - Gateway подтвердил зачисление займа пайщику.

  - from: created
    to: removed
    action: capital::declinedebt
    actor: chairman
    guards:
      - Председатель или совет отклонили заявку.

  - from: approved
    to: removed
    action: capital::declinedebt
    actor: soviet
    guards:
      - Совет отклонил заявку.

  - from: authorized
    to: removed
    action: capital::debtpaydcln
    actor: gateway_operator
    guards:
      - Платёж не прошёл / отклонён Gateway.

  - from: paid
    to: defaulted
    action: capital::dfltdebt
    actor: coopname
    ledger_code: o.cap.dflt
    operations:
      - o.cap.dflt
      - o.cap.lnwoff
    guards:
      - Родительский компонент проекта явно в статусе `cancelled` или `rejected`.
      - У пайщика на сегменте есть коммиты, накопленные как обеспечение
        (w.cap.gen ≥ debt.amount).
      - Подпись пайщика не требуется, согласование советом не требуется
        (решение 2026-05-19).

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления на заём
      actor: contributor
      action: capital::createdebt
      description: >
        Пайщик подаёт заявление на беспроцентный целевой заём.
        Контракт создаёт запись долга со статусом `created` и обновляет
        сегмент CRPS на запрошенную сумму.

    - step: 2
      title: Одобрение председателем
      actor: chairman
      action: capital::approvedebt
      description: >
        Председатель добавляет к заявке документ-одобрение. Статус
        заявки → `approved`.

    - step: 3
      title: Авторизация советом и выдача займа
      actor: soviet
      action: capital::debtauthcnfr
      description: >
        Совет авторизует выплату. В ledger2 применяется операция o.cap.lend
        (ISSUE → w.cap.loan, Дт 58 / Кт 51), Gateway получает поручение на
        исходящий платёж. Статус → `authorized`.

    - step: 4
      title: Подтверждение выплаты
      actor: gateway_operator
      action: capital::debtpaycnfrm
      description: >
        Gateway подтверждает зачисление средств пайщику. Статус → `paid`.
        Запись долга остаётся в реестре до момента возврата через акт-2
        проекта (операция o.cap.repay сработает в процессе p.cap.rid).

  alternatives:
    - branch: Отказ председателя или совета
      at_step: 2
      action: capital::declinedebt
      actor: chairman
      description: >
        Заявка отклонена. Сегмент CRPS откатывается, запись долга удаляется,
        операции в ledger2 не создаются.
    - branch: Отказ Gateway
      at_step: 4
      action: capital::debtpaydcln
      actor: gateway_operator
      description: >
        Платёж не прошёл / отклонён. Запись долга удаляется.
    - branch: Невозврат — обращение взыскания на обеспечение
      at_step: 4
      action: capital::dfltdebt
      actor: coopname
      description: >
        Если родительский компонент проекта явно перешёл в `cancelled` или
        `rejected` (проект до акта-2 не дойдёт), займ закрывается автоматически
        через коммиты-обеспечение пайщика. Применяются две ledger2-операции:
        (1) o.cap.dflt — обращение взыскания на коммиты-обеспечение (Дт 04 /
            Кт 08, TRANSFER w.cap.gen → w.cap.coopn);
        (2) o.cap.lnwoff — списание займа (Дт 80 / Кт 58, BURN w.cap.loan).
        Запись долга удаляется, сегмент пайщика уменьшается на сумму
        обращения, никакие документы и подписи не требуются (решение 2026-05-19).

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - step: 1
    title: Заявление на получение займа
    registry_id: 1050
    signed_by: [contributor]
    stored_in: debts.statement

  - step: 2
    title: Решение совета о предоставлении займа (одобрение председателем)
    registry_id: 1051
    signed_by: [chairman]
    stored_in: debts.approved_statement

  - step: 3
    title: Решение совета о предоставлении займа (авторизация совета)
    registry_id: 1051
    signed_by: [soviet]
    stored_in: debts.authorization

# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.cap.lend
    human_name: Выдача пайщику беспроцентного займа
    wallet_op: ISSUE
    wallet_from: ''
    wallet_to: w.cap.loan            # Выданные пайщикам беспроцентные займы
    debit: 58                  # Финансовые вложения
    credit: 51                 # Расчётный счёт
    amount_ref: debt.amount
    triggered_by: capital::debtauthcnfr
    description: >
      Выдача беспроцентного займа пайщику. Деньги уходят с расчётного счёта
      кооператива (Кт 51) и появляются как финансовое вложение Дт 58.
      Кошелёк «Выданные пайщикам беспроцентные займы» (w.cap.loan) фиксирует
      обязательство пайщика перед кооперативом.

  - ledger_code: o.cap.repay
    human_name: Возврат беспроцентного займа пайщика по акту-2
    wallet_op: TRANSFER
    wallet_from: w.cap.loan          # Выданные пайщикам беспроцентные займы
    wallet_to: w.wal.share            # ЦПП «Цифровой Кошелёк» — паевые взносы деньгами
    debit: 80                  # Паевой фонд (складочный капитал)
    credit: 58                 # Финансовые вложения
    amount_ref: debt.amount
    triggered_by: capital::debtpaycnfrm
    description: >
      Возврат займа в момент сдачи акта-2 проекта (происходит как часть
      процесса «Приём РИД» — p.cap.rid). Финансовое вложение закрывается
      (Кт 58), сумма зачитывается в паевой фонд (Дт 80) и появляется как
      доступный остаток на SHARE_FUND_PAY пайщика.

  - ledger_code: o.cap.dflt
    human_name: Обращение взыскания на коммиты-обеспечение при невозврате займа
    wallet_op: TRANSFER
    wallet_from: w.cap.gen           # ЦПП «Генератор» — единый кошелёк программы у пайщика
    wallet_to: w.cap.coopn           # Имущество кооператива — НМА из коммитов-обеспечения
    debit: 4                   # Нематериальные активы
    credit: 8                  # Вложения во внеоборотные активы
    amount_ref: debt.amount
    triggered_by: capital::dfltdebt
    description: >
      Родительский компонент проекта явно перешёл в `cancelled/rejected`,
      проект до акта-2 не дойдёт. Коммиты-обеспечение пайщика, накопленные
      на «Генераторе» (w.cap.gen), переходят в имущество кооператива (НМА).
      Бухгалтерская запись зеркалит o.cap.accept: Дт 04 закрывает Кт 08 на
      сумму займа, но без участия пайщика — кошелёк COOP_NMA (w.cap.coopn)
      фиксирует НМА кооператива, полученные из обеспечения. Решение 2026-05-19.

  - ledger_code: o.cap.lnwoff
    human_name: Списание займа в счёт обращения взыскания на обеспечение
    wallet_op: BURN
    wallet_from: w.cap.loan          # Выданные пайщикам беспроцентные займы
    wallet_to: ''
    debit: 80                  # Паевой фонд (складочный капитал)
    credit: 58                 # Финансовые вложения
    amount_ref: debt.amount
    triggered_by: capital::dfltdebt
    description: >
      Парная к o.cap.dflt операция: закрывает обязательство пайщика по
      займу. Бухгалтерская запись зеркалит o.cap.repay (Дт 80 / Кт 58), но
      кошелёк w.cap.loan только сжимается (BURN) — на share пайщика ничего
      не зачисляется, потому что платёж сделан имущественно через
      коммиты-обеспечение. Решение 2026-05-19.

# ── Секция 7. Связи ─────────────────────────────────────────────────────────
related:
  - process_type: p.cap.rid
    id: public_capital_rid_process
    relation: triggers
    note: >
      Возврат займа (o.cap.repay) технически происходит в процессе
      «Приём РИД» при подписании акта-2 проекта.

  - process_type: p.reg.accept
    id: public_registrator_accept_process
    relation: provides
    note: >
      Заём может получить только активный пайщик кооператива.

  - process_type: p.cap.rid
    id: public_capital_rid_process
    relation: affects
    note: >
      Альтернативная ветка `defaulted` (o.cap.dflt) уменьшает доступную
      сумму коммитов на сегменте пайщика — те коммиты, что были обеспечением,
      переходят в имущество кооператива и более не участвуют в РИД-учёте
      пайщика.
