# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Приём имущественного паевого взноса» — оформление имущества
# (не РИД, не деньги) как паевого взноса в программу «Благорост».
#
# Процесс приёма имущества: заявление пайщика, одобрение председателя и
# решение совета, затем акт приёма-передачи двумя подписями. Вторую подпись
# председатель ставит в запросах одобрений; на ней имущество зачисляется
# пайщику в программу «Благорост» как паевой взнос.
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.cap.prop
id: public_capital_property_process
title: Приём имущественного паевого взноса
slug: property
status: proposed
contract: capital
purpose: >
  Пайщик передаёт кооперативу имущество — вещь, а не деньги и не результат
  интеллектуальной деятельности — как паевой взнос в программу «Благорост».
  Одно заявление описывает одну позицию имущества и её оценку. Председатель
  одобряет заявление, совет принимает решение, затем стороны подписывают акт
  приёма-передачи: сначала пайщик, потом председатель. После второй подписи
  оценка имущества зачисляется пайщику в программу «Благорост».
roles:
  - contributor
  - chairman
  - soviet

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: capital::createpgprp
    human: Подать заявление
    actor: Пайщик
    role: opener
    purpose: >
      Пайщик подаёт заявление о внесении имущества: что передаётся и во
      сколько оно оценено. Заявление направляется председателю в запросы
      одобрений.
  - name: capital::approvepgprp
    human: Одобрить заявление
    actor: Председатель
    role: progress
    purpose: >
      Председатель одобряет заявление в запросах одобрений. Вопрос о приёме
      имущества выносится в повестку совета.
    links:
      - process_type: sov.authpkg
        label: Принятие решения советом
  - name: capital::authpgprp
    human: Решение совета
    actor: Совет
    role: progress
    purpose: >
      Совет принял решение о приёме имущества. Протокол сохраняется в
      предложении, пайщик может подписать акт приёма-передачи.
  - name: capital::act1pgprp
    human: Подписать акт
    actor: Пайщик
    role: progress
    purpose: >
      Пайщик подписывает акт приёма-передачи имущества — первая подпись.
      Акт направляется председателю на вторую подпись в запросы одобрений.
      Движений по средствам на этом шаге нет.
  - name: capital::act2pgprp
    human: Принять имущество
    actor: Председатель
    role: closer
    purpose: >
      Председатель подписал акт вторым в запросах одобрений. Контракт
      проверяет обе подписи под актом и зачисляет оценку имущества пайщику в
      программу «Благорост»; акт сохраняется в документах процесса.
  - name: capital::declinepgprp
    human: Отклонить
    actor: Председатель или совет
    role: reject
    purpose: >
      Председатель отказал в одобрении заявления или в подписи акта, либо
      совет отклонил приём имущества. Предложение снимается, имущество
      паевым взносом не становится.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: capital::program_property
entity_human: Имущественный взнос
entity_source: cpp/capital/app/property_management/contribute_property_in_program/

states:
  - name: created
    human: Заявление подано
    description: >
      Пайщик подал заявление: описание имущества и его оценка. Заявление
      ждёт одобрения председателя.
    kind: initial
  - name: approved
    human: Председатель одобрил
    description: Заявление одобрено председателем и вынесено в повестку совета.
    kind: normal
  - name: authorized
    human: Совет принял решение
    description: >
      Совет решил принять имущество. Пайщик подписывает акт приёма-передачи.
    kind: normal
  - name: act1
    human: Акт подписан пайщиком
    description: >
      Пайщик подписал акт приёма-передачи. Акт ждёт второй подписи
      председателя в запросах одобрений.
    kind: normal
  - name: act2
    human: Имущество принято
    description: >
      Акт подписан обеими сторонами. Оценка имущества учтена как паевой
      взнос пайщика в программе «Благорост» и входит в его накопленную сумму
      взносов имуществом. Запись предложения удаляется, документы процесса
      остаются в реестре документов.
    kind: final
  - name: removed
    human: Отклонено
    description: >
      Предложение отклонено на одном из этапов, запись удалена; имущество
      паевым взносом не зачислялось.
    kind: virtual
    virtual: true

transitions:
  - from: "∅"
    to: created
    action: capital::createpgprp
    actor: Пайщик
    guards:
      - Договор участия в хозяйственной деятельности пайщика действует.
      - Заявление с таким идентификатором ещё не подавалось.
      - Оценка имущества больше нуля, описание имущества не пустое.
      - Заявление подписано самим пайщиком.

  - from: created
    to: approved
    action: capital::approvepgprp
    actor: Председатель
    guards:
      - Одобрение подписано председателем.

  - from: approved
    to: authorized
    action: capital::authpgprp
    actor: Совет
    guards:
      - Протокол решения совета подписан.

  - from: authorized
    to: act1
    action: capital::act1pgprp
    actor: Пайщик
    guards:
      - Совет принял решение о приёме имущества.
      - Акт подписан тем пайщиком, который подал заявление.

  - from: act1
    to: act2
    action: capital::act2pgprp
    actor: Председатель
    ledger_code: o.cap.actprp
    operations:
      - o.cap.actprp
    guards:
      - Акт подписан пайщиком и действующим председателем совета.

  - from: created | approved | act1
    to: removed
    action: capital::declinepgprp
    actor: Председатель или совет
    guards:
      - Председатель отказал в одобрении или в подписи акта, либо совет отклонил приём.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления
      actor: Пайщик
      action: capital::createpgprp
      description: >
        Пайщик описывает имущество, указывает оценку и подписывает заявление.

    - step: 2
      title: Одобрение председателем
      actor: Председатель
      action: capital::approvepgprp
      description: >
        Председатель одобряет заявление, вопрос выносится в повестку совета.

    - step: 3
      title: Решение совета
      actor: Совет
      action: capital::authpgprp
      description: Совет принимает решение о приёме имущества.

    - step: 4
      title: Подпись акта пайщиком
      actor: Пайщик
      action: capital::act1pgprp
      description: >
        Пайщик подписывает акт приёма-передачи, акт направляется председателю.

    - step: 5
      title: Подпись акта председателем
      actor: Председатель
      action: capital::act2pgprp
      description: >
        Председатель подписывает акт вторым, имущество принято в программу
        «Благорост».

  alternatives:
    - branch: Отказ председателя или совета
      at_step: 2
      action: capital::declinepgprp
      actor: Председатель или совет
      description: >
        Председатель не одобрил заявление или совет отклонил приём —
        предложение снимается.
    - branch: Отказ председателя в подписи акта
      at_step: 5
      action: capital::declinepgprp
      actor: Председатель
      description: >
        Председатель отказал в подписи акта — предложение снимается,
        имущество паевым взносом не становится.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - action: capital::createpgprp
    title: Заявление о паевом взносе имуществом в программу «Благорост»
    registry_id: 1070
    signed_by: [Пайщик]
    stored_in: pgproperties.statement

  - action: capital::approvepgprp
    title: Одобрение заявления председателем
    registry_id: 1070
    signed_by: [Председатель]
    stored_in: pgproperties.statement
    note: Одобрение — то же заявление с подписью председателя, оно заменяет заявление в записи.

  - action: capital::authpgprp
    title: Протокол решения совета о приёме имущества
    registry_id: 1071
    signed_by: [Совет]
    stored_in: pgproperties.authorization

  - action: capital::act1pgprp
    title: Акт приёма-передачи имущества (подпись пайщика)
    registry_id: 1072
    signed_by: [Пайщик]
    stored_in: pgproperties.act

  - action: capital::act2pgprp
    title: Акт приёма-передачи имущества (подписи пайщика и председателя)
    registry_id: 1072
    signed_by: [Пайщик, Председатель]
    stored_in: pgproperties.act
    note: Вторая подпись ложится на тот же акт; документ сохраняется в пакете процесса.

# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.cap.actprp
    human_name: Паевой взнос (имущественный) по программе «Благорост»
    wallet_op: ISSUE
    debit: 8                   # Вложения во внеоборотные активы
    credit: 80                 # Паевой фонд
    wallet_from: null
    wallet_to: w.cap.blago
    user_wallet: w.cap.blago
    user_ref: property.username
    available_delta: +property.property_amount
    blocked_delta: null
    amount_ref: property.property_amount
    triggered_by: capital::act2pgprp
    description: >
      Кооператив принял имущество по оценке: оно учтено во вложениях во
      внеоборотные активы и в паевом фонде, а пайщику зачислен паевой взнос
      в программу «Благорост».

# ── Связи с другими процессами ──────────────────────────────────────────
# Только по межконтрактным вызовам: consumes — процесс вызывает другой,
# provides — другой процесс вызывает этот.
related:
  - process_type: sov.authpkg
    relation: consumes
    note: >
      Вопрос выносится в повестку совета: голосование и решение идут по
      типовому порядку решений совета, итог возвращается в процесс.
