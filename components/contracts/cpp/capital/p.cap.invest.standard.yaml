# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Инвестиция в ЦПП «Благорост»» — перенос части ранее внесённых
# паевых средств пайщика в кошелёк программы-инвестиции «Благорост».
#
# Одноактовый процесс. При инвестировании средства переносятся между двумя
# кошельками одного пайщика без бухгалтерских проводок: бухгалтерский счёт
# не меняется, средства переходят из свободных паевых в кошелёк
# программы-инвестиции.
#
# Источники правды в коде:
#   • cpp/capital/capital.hpp                              — actions
#   • cpp/capital/src/invest/{createinvest,createpinv}.cpp — реализация
#   • cpp/lib/core/ledger2/operations.hpp                  — o.cap.invest
#   • cpp/lib/core/ledger2/processes.hpp                   — processes::capital::INVEST
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.cap.invest
id: public_capital_invest_process
title: Приём инвестиции в программу
slug: invest
status: proposed
contract: capital
purpose: >
  «Приём инвестиции в программу» — пайщик переводит часть своих ранее
  внесённых паевых средств в инвестицию в программу «Благорост».
  Бухгалтерских проводок нет: средства не меняют бухгалтерский счёт, а
  переносятся между кошельками пайщика — из свободных паевых в кошелёк
  программы «Благорост». После этого пайщик может участвовать в проектах
  программы как исполнитель.
roles:
  - contributor

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: capital::createpinv
    human: Создать инвестицию
    actor: contributor
    role: closer
    purpose: >
      Закрывающее одношаговое действие: пайщик подписывает заявление об
      инвестировании в программу, и его средства переносятся в кошелёк
      программы-инвестиции без бухгалтерской проводки — бухгалтерский счёт
      не меняется, средства из свободных паевых становятся инвестицией.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: capital::invest
entity_human: Инвестиция
entity_source: cpp/capital/src/invest/

states:
  - name: invested
    human: Инвестировано
    description: >
      Паевые средства пайщика перенесены в кошелёк программы-инвестиции.
      Бухгалтерских проводок нет: бухгалтерский счёт не изменился,
      средства переучтены в кошельке пайщика как инвестиция.
    kind: final

transitions:
  - from: "∅"
    to: invested
    action: capital::createpinv
    actor: contributor
    ledger_code: o.cap.invest
    operations:
      - o.cap.invest
    guards:
      - Пайщик имеет статус active.
      - Запрашиваемая сумма инвестиции не превышает доступный остаток паевых средств пайщика.
      - invest_hash уникален.
      - Заявление об инвестировании подписано пайщиком.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Создание инвестиции в «Благорост»
      actor: contributor
      action: capital::createpinv
      description: >
        Пайщик подписывает заявление об инвестировании и вызывает
        capital::createpinv. Контракт переносит указанную сумму из
        свободного паевого кошелька пайщика в кошелёк программы-инвестиции
        без бухгалтерской проводки. Запись в реестре фиксирует факт инвестиции.
      pre:
        - Пайщик активен в кооперативе.
        - Достаточный остаток паевых средств пайщика.
        - Заявление подписано ЭЦП.
      post:
        - Паевые средства пайщика перенесены в кошелёк программы-инвестиции, бухгалтерский счёт не изменился.
        - Инвестиция зарегистрирована в системе.
        - Создана запись инвестиции в таблице.

  alternatives: []

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - action: capital::createpinv
    title: Заявление об инвестировании денежных средств в Благорост
    registry_id: 1030
    signed_by: [ Участник ]
    stored_in: invests.statement

# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.cap.invest
    human_name: Инвестиция в ЦПП «Благорост» (перенос между кошельками)
    wallet_op: TRANSFER
    wallet_from: w.wal.share   # ЦК — паевая часть пайщика
    wallet_to: w.cap.blago     # ЦПП «Благорост» — единый кошелёк программы у пайщика
    debit: null
    credit: null
    amount_ref: invest.quantity
    triggered_by: capital::createpinv
    description: >
      Перенос средств между двумя кошельками одного пайщика. Бухгалтерских
      проводок нет — бухгалтерский счёт не меняется; средства переучтены как
      инвестиция в «Благорост», а не свободные паевые средства.
