# ─────────────────────────────────────────────────────────────────────────────
# Стандарт «Инвестирование средств кооператива в ЦПП оператора платформы».
#
# Кооператив-партнёр подключён к кооперативу-оператору платформы как
# пайщик-юрлицо. Совет кооператива-партнёра принимает решение об инвестировании
# собственных средств (с расчётного счёта) в целевую потребительскую программу
# оператора (например, «Благорост» ПК «ВОСХОД»). После решения совета кассир
# оплачивает счёт оператора банковским переводом и подтверждает оплату — в этот
# момент выполняется единственная учётная операция процесса: проводка
# Дт 58 «Финансовые вложения» / Кт 51 «Расчётный счёт» с зачислением на
# кошелёк «Финансовые вложения в ЦПП оператора».
#
# Резервирования на этапе заявки нет: источник средств — расчётный счёт (51),
# который не имеет кошелька-зеркала в книге учёта.
#
# Источники правды в коде:
#   • cpp/wallet/wallet.hpp                                  — actions
#   • cpp/wallet/src/invest/{createinv,authinv,completeinv,declineinv}.cpp
#   • cpp/lib/domain/table_wallet_investments.hpp            — entity investments
#   • cpp/lib/core/ledger2/operations.hpp                    — o.wal.invcpl
#   • cpp/lib/core/ledger2/processes.hpp                     — processes::wallet::INVEST
# ─────────────────────────────────────────────────────────────────────────────

# ── Секция 1. Паспорт ───────────────────────────────────────────────────────
process_type: p.wal.invest
id: public_wallet_invest_process
title: Инвестирование средств кооператива в ЦПП оператора
slug: invest
status: proposed
contract: wallet
summary: >
  Совет кооператива принимает решение об инвестировании средств кооператива
  в целевую потребительскую программу кооператива-оператора платформы.
  После решения кассир оплачивает счёт оператора и подтверждает оплату.
purpose: >
  «Инвестирование средств кооператива» — кооператив-партнёр размещает
  собственные средства в целевой потребительской программе оператора
  платформы, участником которой состоит как пайщик-юридическое лицо.
  Предложение вносит председатель, решение принимает совет, оплату
  по реквизитам оператора производит кассир.
roles:
  - chairman
  - soviet
  - gateway_operator

# ── Секция 2. Действия контракта ────────────────────────────────────────────
actions:
  - name: wallet::createinv
    human: Подать заявление
    actor: chairman
    role: opener
    purpose: >
      Председатель подаёт заявление об инвестировании средств кооператива
      в целевую потребительскую программу оператора. Контракт создаёт запись
      заявки и направляет в совет повестку с callback'ом авторизации.
      Средства не резервируются — источник находится на расчётном счёте.
  - name: wallet::authinv
    human: Авторизовать инвестирование
    actor: soviet
    role: progress
    purpose: >
      Совет авторизует инвестирование единым решением: контракт переводит
      заявку в статус `authorized` и отправляет в Gateway исходящий платёж
      с callback'ами completeinv / declineinv.
  - name: wallet::completeinv
    human: Подтвердить оплату
    actor: gateway_operator
    role: closer
    purpose: >
      Кассир подтвердил перечисление средств на реквизиты оператора. Это
      закрывающее действие: применяется операция o.wal.invcpl — зачисление
      на кошелёк «Финансовые вложения в ЦПП оператора» с проводкой
      Дт 58 / Кт 51. Запись заявки удаляется.
  - name: wallet::declineinv
    human: Отклонить
    actor: soviet
    role: reject
    purpose: >
      Отказ на любом из этапов до оплаты. Учётных операций нет —
      резервирование на этапе заявки не выполнялось. Запись заявки удаляется.

# ── Секция 3. Граф состояний ────────────────────────────────────────────────
entity: wallet::investment
entity_human: Заявка на инвестирование
entity_source: cpp/wallet/src/invest/

states:
  - name: pending
    human: Ожидает решения совета
    description: >
      Заявка создана, повестка отправлена в совет. Средства остаются на
      расчётном счёте кооператива.
    kind: normal
  - name: authorized
    human: Платёж отправлен кассиру
    description: >
      Совет авторизовал инвестирование, контракт инициировал исходящий
      платёж в Gateway, ожидается оплата кассиром по реквизитам оператора.
    kind: normal
  - name: completed
    human: Инвестиция размещена
    description: >
      Кассир подтвердил перечисление средств оператору. В книге учёта
      применена операция o.wal.invcpl: зачисление на кошелёк «Финансовые
      вложения в ЦПП оператора», проводка Дт 58 / Кт 51. Запись заявки
      удалена. Завершает размещение средств в программе председатель —
      в личном кабинете на платформе оператора.
    kind: final
  - name: removed
    human: Отклонено
    description: >
      Инвестирование не состоялось: совет отклонил предложение либо платёж
      не прошёл. Учётных операций нет, запись заявки удалена.
    kind: virtual
    virtual: true

transitions:
  - from: "∅"
    to: pending
    action: wallet::createinv
    actor: chairman
    guards:
      - Сумма инвестирования положительная, символ соответствует валюте кооператива.
      - invest_hash уникален.
      - Заявление подписано ЭЦП председателя.

  - from: pending
    to: authorized
    action: wallet::authinv
    actor: soviet
    guards:
      - Решение совета по повестке инвестирования подписано и авторизовано.

  - from: authorized
    to: completed
    action: wallet::completeinv
    actor: gateway_operator
    ledger_code: o.wal.invcpl
    operations:
      - o.wal.invcpl
    guards:
      - Кассир подтвердил перечисление средств на реквизиты оператора.

  - from: pending
    to: removed
    action: wallet::declineinv
    actor: soviet
    guards:
      - Совет отклонил инвестирование.

  - from: authorized
    to: removed
    action: wallet::declineinv
    actor: gateway_operator
    guards:
      - Платёж не прошёл / отклонён кассиром.

# ── Секция 4. Сценарий ──────────────────────────────────────────────────────
scenario:
  steps:
    - step: 1
      title: Подача заявления об инвестировании
      actor: chairman
      action: wallet::createinv
      description: >
        Председатель оформляет и подписывает заявление об инвестировании
        средств кооператива в целевую потребительскую программу оператора.
        В заявление подставляются сведения об операторе и его реквизиты.
        Контракт создаёт запись в таблице investments со статусом `pending`
        и направляет в совет повестку с callback'ом авторизации.
      pre:
        - Кооператив подключён к оператору платформы как пайщик-юридическое лицо.
        - На расчётном счёте кооператива достаточно средств.
      post:
        - В таблице investments создана запись со статусом `pending`.
        - Совет получил повестку об инвестировании.

    - step: 2
      title: Авторизация инвестирования советом
      actor: soviet
      action: wallet::authinv
      description: >
        Совет принимает положительное решение по повестке и авторизует
        инвестирование единым шагом. Контракт инициирует исходящий платёж
        в Gateway с callback'ами completeinv / declineinv. Статус заявки →
        `authorized`. Кассир получает к оплате счёт оператора с реквизитами
        и назначением платежа (паевой взнос организации на платформе
        оператора).
      pre:
        - Заявка в статусе `pending`.
        - Решение совета подписано и авторизовано председателем.
      post:
        - Статус заявки `authorized`.
        - В Gateway создан исходящий платёж с callback'ами.

    - step: 3
      title: Оплата и подтверждение кассиром
      actor: gateway_operator
      action: wallet::completeinv
      description: >
        Кассир перечисляет средства банковским переводом на реквизиты
        оператора и подтверждает оплату. Контракт применяет операцию
        o.wal.invcpl: зачисление на кошелёк «Финансовые вложения в ЦПП
        оператора» с проводкой Дт 58 / Кт 51, запись заявки удаляется.
        На стороне оператора средства поступают как паевой взнос
        организации; размещение их в программе завершает председатель
        в личном кабинете на платформе оператора.
      pre:
        - Заявка в статусе `authorized`.
        - Перевод на реквизиты оператора выполнен.
      post:
        - В книге учёта применена операция o.wal.invcpl (Дт 58 / Кт 51).
        - Баланс кошелька «Финансовые вложения в ЦПП оператора» увеличен.
        - Запись заявки удалена.

  alternatives:
    - branch: Отказ совета или кассира
      at_step: 2
      action: wallet::declineinv
      actor: soviet
      description: >
        Совет принял отрицательное решение либо платёж отклонён кассиром.
        Учётных операций нет — средства не покидали расчётный счёт.
        Запись заявки удалена.

# ── Секция 5. Документы и подписи ───────────────────────────────────────────
documents:
  - step: 1
    title: Заявление об инвестировании средств кооператива в ЦПП оператора
    registry_id: 1200
    signed_by: [chairman]
    stored_in: investments.statement

  - step: 2
    title: Решение совета об инвестировании средств кооператива в ЦПП оператора
    registry_id: 1201
    signed_by: [soviet]
    stored_in: "(authorization — параметр действия)"

# ── Секция 6. Операции ──────────────────────────────────────────────────────
operations:
  - ledger_code: o.wal.invcpl
    human_name: Инвестирование средств кооператива в ЦПП оператора платформы
    wallet_op: ISSUE
    wallet_from: ~                     # первичный вход — источник на расчётном счёте, без кошелька-зеркала
    wallet_to: w.wal.invest            # финансовые вложения в ЦПП оператора
    debit: 58                  # Финансовые вложения
    credit: 51                 # Расчётный счёт
    amount_ref: investment.quantity
    triggered_by: wallet::completeinv
    description: >
      Единственная учётная операция процесса. Деньги ушли с расчётного счёта
      банковским переводом оператору, в учёте появилось финансовое вложение:
      проводка Дт 58 / Кт 51 и зачисление на кошелёк «Финансовые вложения
      в ЦПП оператора». Аналогичная пара проводок используется при выдаче
      беспроцентного займа пайщику (o.cap.lend).

# ── Секция 7. Связи ─────────────────────────────────────────────────────────
related:
  - process_type: p.wal.depo
    id: public_wallet_deposit_process
    relation: affects
    note: >
      На стороне оператора перечисленные средства поступают как паевой
      взнос организации-пайщика — там выполняется процесс «Внесение
      паевого взноса» (p.wal.depo) кооператива-оператора.

  - process_type: p.cap.invest
    id: public_capital_invest_process
    relation: affects
    note: >
      После пополнения главного кошелька на платформе оператора председатель
      размещает средства в программе «Благорост» оператора — это процесс
      «Инвестиция в ЦПП Благорост» (p.cap.invest), выполняемый на стороне
      оператора вручную.
