# Ведомый кооператив связки двух локальных стендов (487-34).
#
# Связка: ведущий стенд — кооператив-оператор (voskhod) со своей цепью,
# провайдером и каталогом приложений; ведомый — узел подключённого кооператива
# (partner1) на ДРУГОМ чекауте, без своей цепи. Так на одной машине работает
# пара «хаб + подключённый кооператив», и полный путь (подписка у провайдера →
# общий счёт → оплата → установка приложения на узле) проверяется без аренды
# сервера в Hostkey.
#
# Файл накладывается поверх docker-compose.yaml (COMPOSE_FILE ставит
# components/boot/scripts/two_coop_slave.sh) и меняет только то, чем ведомый
# отличается.
#
# Вместо цепи у ведомого — ретранслятор `node` (nginx stream). Он единственный
# из сервисов ведомого подключён к чужим docker-сетям — ведущего, каталога и
# провайдера — и ходит в них по именам контейнеров:
#   :8888 / :8070 — цепь ведущего (HTTP и история): контроллер, индексер и
#                   nginx ведомого ходят на node:8888 и ws://node:8070 как всегда;
#   :3001 / :3002 — catalog-delivery и catalog-operator;
#   :8080         — nginx самого ведомого: провайдер видит узел как
#                   http://<кооператив>-node:8080 и вызывает initSystem;
#   :3005         — провайдер (provider-backend:3000): как и на боевом контуре,
#                   узел кооператива сам видит цены приложений и оформляет
#                   подписку у провайдера.
# Остальные сервисы ведомого живут только в своей сети: одинаковые имена
# (postgres, coopback) двух стендов в общей сети перепутались бы. Порты хоста
# не используются — межсетевой экран хоста пропускает из контейнеров не всё.
#
# Значения ${…} готовит скрипт ведомого.

services:
  node:
    image: nginx:alpine
    command: !reset null
    volumes: !override
      - ./.two-coop/node-relay.conf:/etc/nginx/nginx.conf:ro
    networks:
      default: {}
      master: {}
      catalog: {}
      provider:
        aliases:
          - ${COOPNAME}-node

  coopback:
    environment:
      COOPNAME: ${COOPNAME}
      CHAIN_ID: ${CHAIN_ID}
      # Провайдер вызывает initSystem узла своим секретом — как после поставки;
      # тем же секретом узел оформляет у провайдера подписки на приложения.
      SERVER_SECRET: ${SLAVE_SERVER_SECRET}
      # Канал к провайдеру — как у любого узла боевого контура (плейбук mono
      # задаёт PROVIDER_BASE_URL всем кооперативам): цена приложения на витрине
      # и подписка с узла. Платит за всех хаб — у ведомого он выключен.
      PROVIDER_BASE_URL: http://node:3005
      PROVIDER_BEARER_TOKEN: ${SLAVE_PROVIDER_BEARER:-}
      BILLING_HUB_MODE: "false"
      APPS_CATALOG_OPERATOR_URL: http://node:3002
      APPS_CATALOG_DELIVERY_URL: http://node:3001
      APPS_CATALOG_OPERATOR_API_KEY: ${APPS_CATALOG_OPERATOR_API_KEY}
      # Оркестратор своего стенда: ядро передаёт ему токен каталога, он ставит
      # приложения на узел. В .env контроллера ведомого этой строки может не быть.
      ORCHESTRATOR_URL: http://orchestrator:4000

  desktop:
    environment:
      CHAIN_ID: ${CHAIN_ID}

networks:
  master:
    external: true
    name: ${MASTER_NETWORK}
  catalog:
    external: true
    name: ${CATALOG_NETWORK:-apps-catalog-net}
  provider:
    external: true
    name: ${PROVIDER_NETWORK:-provider-dev}
